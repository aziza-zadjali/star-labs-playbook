                                <h2 className="display text-3xl font-black uppercase tracking-tight">ESG & Regulatory</h2>
                                <p className="text-sm text-gray-500 mt-1">Environmental, social, governance alignment — mandatory dimension for Gulf markets.</p>
                            </div>

                            <div className="card p-4 flex items-center gap-3" style={{ borderColor: 'rgba(52,211,153,0.15)' }}>
                                <Icon name="leaf" size={14} style={{ color: '#34d399' }} />
                                <p className="text-xs text-gray-400">ESG alignment is increasingly a gate condition for sovereign capital in GCC and global institutional mandates.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="Environmental Impact" name="environmentalImpact" value={form.environmentalImpact} onChange={hi} description="Positive environmental contribution — net zero alignment" accent="#34d399" />
                                <Slider label="Social Impact" name="socialImpact" value={form.socialImpact} onChange={hi} description="Job creation, community benefit, inclusivity" accent="#60a5fa" />
                                <Slider label="Governance Readiness" name="governanceReadiness" value={form.governanceReadiness} onChange={hi} description="Board quality, transparency, accountability structures" />
                                <Slider label="Regulatory Compliance" name="regulatoryCompliance" value={form.regulatoryCompliance} onChange={hi} description="Current compliance posture and audit readiness" />
                            </div>

                            {/* SDG Alignment */}
                            <div className="card p-5 space-y-4">
                                <div className="flex justify-between items-center">
                                    <p className="mono text-xs text-gray-500 uppercase tracking-wider font-bold">UN SDG Alignment Score</p>
                                    <span className="display text-2xl font-black gold-text">{form.sdgAlignment}/10</span>
                                </div>
                                <input type="range" name="sdgAlignment" min="1" max="10" value={form.sdgAlignment} onChange={hi} />
                                <div className="pbar"><div className="pfill" style={{ width: `${form.sdgAlignment * 10}%` }}></div></div>
                                <div className="grid grid-cols-4 gap-2 text-center">
                                    {[['SDG 9','Innovation'],['SDG 13','Climate'],['SDG 8','Growth'],['SDG 17','Partnerships']].map(([g, l]) => (
                                        <div key={g} className="matrix-cell p-2 space-y-0.5">
                                            <div className="mono text-xs" style={{ color: '#c9a84c' }}>{g}</div>
                                            <div className="text-xs text-gray-600">{l}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">ESG Notes & Certifications</label>
                                <textarea name="esgNotes" value={form.esgNotes} onChange={hi} className="field h-20 resize-none" placeholder="ISO certifications, ESG frameworks adopted, impact reporting..." />
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('esg', `ESG and regulatory assessment (max 160 words, plain prose, no bullets):\nEnvironmental: ${form.environmentalImpact}/10\nSocial: ${form.socialImpact}/10\nGovernance: ${form.governanceReadiness}/10\nRegulatory Compliance: ${form.regulatoryCompliance}/10\nSDG Alignment: ${form.sdgAlignment}/10\nNotes: ${form.esgNotes}\n\nHow strong is this venture's ESG posture? What does it need to achieve institutional-grade compliance for GCC sovereign mandates?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'esg' ? 'Analyzing...' : 'AI ESG Read'}
                                </button>
                            </div>
                            {(sectionAI.esg || streamingSection === 'esg') && (
                                <AIBlock text={sectionAI.esg} streaming={streamingSection === 'esg'} label="ESG Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 6: TEAM ══════════════ */}
                    {step === 6 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Execution DNA</h2>
                                <p className="text-sm text-gray-500 mt-1">Team depth, burn efficiency, validation speed, and network capital.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="Founder Domain Depth" name="teamExpertise" value={form.teamExpertise} onChange={hi} description="Technical and domain expertise of leadership team" accent="#f0c84a" />
                                <Slider label="Advisory Strength" name="advisoryStrength" value={form.advisoryStrength} onChange={hi} description="Quality and commitment of advisors and board" />
                                <Slider label="Validation Velocity" name="validationVelocity" value={form.validationVelocity} onChange={hi} description="Feedback loop speed and iteration cadence" />
                                <Slider label="Scenario Resilience" name="scenarioResilience" value={form.scenarioResilience} onChange={hi} description="Antifragility against macro shocks and pivots" />
                                <Slider label="Partnership Network" name="partnershipNetwork" value={form.partnershipNetwork} onChange={hi} description="Strategic partner depth and commercial pipeline" />
                                <div className="matrix-cell p-5 space-y-3" style={{ border: '1px solid rgba(245,158,11,0.25)' }}>
                                    <div className="flex justify-between items-center">
                                        <span className="mono text-xs font-bold text-amber-500 uppercase tracking-wider">Execution Expert Adj</span>
                                        <span className="mono font-bold text-amber-400">{form.executionExpertAdj > 0 ? '+' : ''}{form.executionExpertAdj}</span>
                                    </div>
                                    <input type="range" name="executionExpertAdj" min="-3" max="3" step="0.5" value={form.executionExpertAdj} onChange={hi} />
                                    <p className="text-xs text-gray-600">Expert correction for qualitative team assessment</p>
                                </div>
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('team', `Team and execution assessment (max 160 words, plain prose):\nFounder Depth: ${form.teamExpertise}/10\nAdvisory Strength: ${form.advisoryStrength}/10\nValidation Velocity: ${form.validationVelocity}/10\nScenario Resilience: ${form.scenarioResilience}/10\nPartnership Network: ${form.partnershipNetwork}/10\n\nWhat does this execution profile imply? What's the highest priority capability gap to address before spinout?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'team' ? 'Analyzing...' : 'AI Team Read'}
                                </button>
                            </div>
                            {(sectionAI.team || streamingSection === 'team') && (
                                <AIBlock text={sectionAI.team} streaming={streamingSection === 'team'} label="Team Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 7: AI ENGINE ══════════════ */}
                    {step === 7 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">AI Diligence Engine</h2>
                                <p className="text-sm text-gray-500 mt-1">Full institutional-grade 6-dimension venture analysis — powered by Gemini.</p>
                            </div>

                            {/* Score preview grid */}
                            <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                                {[
                                    { label: 'Tech', value: scores.tech, icon: 'cpu' },
                                    { label: 'Market', value: scores.market, icon: 'trending-up' },
                                    { label: 'Financial', value: scores.financial, icon: 'bar-chart-2' },
                                    { label: 'Risk', value: scores.risk, icon: 'shield-alert' },
                                    { label: 'ESG', value: scores.esg, icon: 'leaf' },
                                    { label: 'Team', value: scores.team, icon: 'users' },
                                ].map(({ label, value, icon }) => (
                                    <div key={label} className="card p-3 text-center space-y-1.5">
                                        <Icon name={icon} size={12} className="mx-auto" style={{ color: scoreColor(parseFloat(value)) }} />
                                        <p className="mono text-xs text-gray-600 uppercase">{label}</p>
                                        <p className="display text-xl font-black" style={{ color: scoreColor(parseFloat(value)) }}>{value}</p>
                                    </div>
                                ))}
                            </div>

                            {/* Radar */}
                            <div className="card p-6">
                                <p className="mono text-xs text-gray-500 uppercase tracking-wider mb-3 font-bold">6-Dimension Venture Radar</p>
                                <RadarChart data={radarData} size={300} />
                            </div>

                            {/* Run button */}
                            <button onClick={runFullAnalysis} disabled={isStreaming}
                                className="w-full py-5 rounded-2xl font-black text-sm uppercase tracking-widest display transition-all flex items-center justify-center gap-3 pulse-gold"
                                style={{
                                    background: isStreaming ? 'rgba(201,168,76,0.08)' : 'var(--gold)',
                                    color: isStreaming ? 'var(--gold)' : '#05060a',
                                    border: '1px solid var(--gold-border)'
                                }}>
                                <Icon name={isStreaming ? 'loader' : 'sparkles'} size={16} className={isStreaming ? 'spin' : ''} />
                                {isStreaming ? 'Diligence Engine Running...' : 'Run Full AI Diligence Report'}
                            </button>

                            {(aiText || isStreaming) && (
                                <AIBlock text={aiText} streaming={isStreaming} label="Chief Diligence Officer — Star Labs AI Engine" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 8: VERDICT ══════════════ */}
                    {step === 8 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Gate Verdict</h2>
                                <p className="text-sm text-gray-500 mt-1">VRP gate decision — {form.techName || 'Unnamed Asset'}</p>
                            </div>

                            {/* Main verdict card */}
                            <div className="card-gold p-7 space-y-7">
                                <div className="flex flex-col md:flex-row items-center gap-8">
                                    <ScoreRing score={parseFloat(scores.composite)} />
                                    <div className="space-y-4 flex-1">
                                        <div className="display text-5xl font-black" style={{ color: scores.verdict.color }}>{scores.verdict.status}</div>
                                        <p className="text-sm text-gray-400 italic leading-relaxed">{scores.verdict.label}</p>
                                        {scores.fatalFlaw && (
                                            <div className="flex items-center gap-2">
                                                <span className="tag" style={{ background: 'rgba(248,113,113,0.1)', color: '#f87171', border: '1px solid rgba(248,113,113,0.3)' }}>
                                                    <Icon name="alert-triangle" size={10} /> FATAL FLAW
                                                </span>
                                                <span className="text-xs text-red-400">{scores.fatalFlaw}</span>
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { label: 'Asset', value: form.techName || '—' },
                                                { label: 'Stage', value: form.stage },
                                                { label: 'Category', value: form.category },
                                                { label: 'Date', value: form.assessorDate || new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) },
                                            ].map(({ label, value }) => (
                                                <div key={label}>
                                                    <span className="mono text-xs text-gray-600 uppercase">{label}: </span>
                                                    <span className="mono text-xs text-gray-300">{value}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* 6-dimension breakdown */}
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {[
                                        { label: 'Technology', value: scores.tech, icon: 'cpu', w: 0.22 },
                                        { label: 'Market', value: scores.market, icon: 'trending-up', w: 0.28 },
                                        { label: 'Financial', value: scores.financial, icon: 'bar-chart-2', w: 0.15 },
                                        { label: 'Risk Mgmt', value: scores.risk, icon: 'shield-alert', w: 0.12 },
                                        { label: 'ESG', value: scores.esg, icon: 'leaf', w: 0.08 },
                                        { label: 'Team', value: scores.team, icon: 'users', w: 0.15 },
                                    ].map(({ label, value, icon, w }) => (
                                        <div key={label} className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="mono text-xs text-gray-500 uppercase flex items-center gap-1">
                                                    <Icon name={icon} size={10} /> {label}
                                                </span>
                                                <span className="mono text-xs font-bold" style={{ color: scoreColor(parseFloat(value)) }}>{value}</span>
                                            </div>
                                            <div className="pbar">
                                                <div className="pfill" style={{ width: `${parseFloat(value) * 10}%`, background: scoreColor(parseFloat(value)) }}></div>
                                            </div>
                                            <p className="mono text-xs text-gray-700">Weight: {Math.round(w * 100)}%</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Radar */}
                            <div className="card p-6">
                                <p className="mono text-xs text-gray-500 uppercase tracking-wider mb-3 font-bold">Final 6-Dimension Radar</p>
                                <RadarChart data={radarData} size={300} />
                            </div>

                            {/* Section insights */}
                            {Object.keys(sectionAI).length > 0 && (
                                <div className="card p-5 space-y-4">
                                    <p className="mono text-xs text-gray-500 uppercase tracking-wider font-bold">Section Insights Summary</p>
                                    <div className="space-y-3">
                                        {Object.entries(sectionAI).filter(([_, v]) => v).map(([k, v]) => (
                                            <div key={k} className="space-y-1">
                                                <p className="mono text-xs text-yellow-500 uppercase font-bold">{k} dimension</p>
                                                <p className="text-xs text-gray-400 leading-relaxed">{v.substring(0, 200)}{v.length > 200 ? '...' : ''}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Full AI verdict */}
                            {aiText ? (
                                <AIBlock text={aiText} streaming={false} label="Full AI Diligence Verdict" />
                            ) : (
                                <div className="ai-block text-center py-8 space-y-3">
                                    <Icon name="sparkles" size={24} style={{ color: '#555b6a', margin: '0 auto' }} />
                                    <p className="text-sm text-gray-600">Run the AI Diligence Engine (Step 8) for a full institutional verdict.</p>
                                    <button onClick={() => setStep(7)} className="px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider display"
                                        style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                        Go to AI Engine →
                                    </button>
                                </div>
                            )}

                            {/* Expert sign-off */}
                            <div className="space-y-3">
                                <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Expert Sign-off & Gate Conditions</label>
                                <textarea name="expertNote" value={form.expertNote} onChange={hi}
                                    className="field h-28 resize-none"
                                    placeholder="Senior analyst recommendation, conditions precedent, next milestones, escalation path..." />
                            </div>

                            {/* Footer metadata */}
                            <div className="border-t pt-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-2" style={{ borderColor: 'rgba(255,255,255,0.05)' }}>
                                <div className="space-y-0.5">
                                    <p className="mono text-xs text-gray-700">SL-VRP-2026 // CONFIDENTIAL</p>
                                    <p className="mono text-xs text-gray-700">6-Dimension Institutional Assessment Framework</p>
                                </div>
                                <div className="space-y-0.5 text-right">
                                    {form.partnerName && <p className="mono text-xs text-gray-600">{form.partnerName}</p>}
                                    <p className="mono text-xs text-gray-700">Star Labs Global Intelligence</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Navigation */}
                    <div className="mt-10 flex justify-between items-center no-print">
                        <button onClick={prev} disabled={step === 0}
                            className="flex items-center gap-2 text-xs font-bold text-gray-600 hover:text-white uppercase tracking-wider disabled:opacity-0 transition-colors display">
                            <Icon name="arrow-left" size={12} /> Back
                        </button>
                        {step < STEPS.length - 1 && (
                            <button onClick={next}
                                className="flex items-center gap-2 px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest display transition-all"
                                style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                Next <Icon name="arrow-right" size={12} />
                            </button>
                        )}
                    </div>
                </main>
            </div>

            {/* Footer */}
            <footer className="border-t mt-8 px-6 py-5 flex justify-between items-center no-print" style={{ borderColor: 'rgba(255,255,255,0.04)' }}>
                <p className="mono text-xs text-gray-700 uppercase tracking-wider">Star Labs Global Intelligence // VRP Pro 2.0</p>
                <div className="flex items-center gap-4">
                    <span className="mono text-xs text-gray-700">6 Dimensions · AI-Powered · Institutional Grade</span>
                    <div className="flex items-center gap-1.5">
                        <div className="w-1.5 h-1.5 rounded-full" style={{ background: '#34d399', boxShadow: '0 0 5px #34d399', animation: 'pulse 2s infinite' }}></div>
                        <span className="mono text-xs text-gray-700">Engine Online</span>
                    </div>
                </div>
            </footer>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
