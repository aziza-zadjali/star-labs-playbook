<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Alpha-2 Strategic Decision Intelligence</title>
    <!-- Modern Tech Stack CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #020408;
            --surface: rgba(13, 17, 23, 0.7);
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep); 
            color: #f1f5f9; 
            margin: 0; 
            overflow-x: hidden; 
        }

        /* Glassmorphism & Depth */
        .glass-panel { 
            background: var(--surface); 
            backdrop-filter: blur(30px) saturate(200%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.6);
        }

        .command-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        }

        /* Modern Range Sliders */
        input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 10px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            margin-top: -8px; 
            background: #fff; 
            height: 22px; 
            width: 22px; 
            border-radius: 50%; 
            border: 5px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.8);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

        /* Ambient Glow Effects */
        .glow-sphere {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.05) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-ui { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body>
    <div class="glow-sphere" style="top: -300px; right: -300px;"></div>
    <div class="glow-sphere" style="bottom: -300px; left: -300px;"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ size = "w-40 h-40" }) => {
            const [imgError, setImgError] = useState(false);
            if (imgError) return <span className="font-black text-white italic tracking-tighter text-3xl">STAR LABS</span>;
            return <img src="logo.png" alt="Star Labs" className={`${size} object-contain block`} onError={() => setImgError(true)} />;
        };

        const DirectiveBanner = ({ text }) => (
            <div className="flex items-start gap-4 p-5 rounded-2xl bg-cyan-900/10 border border-cyan-500/20 w-fit max-w-4xl shadow-[0_0_20px_rgba(34,211,238,0.05)] mb-10">
                <Icon name="info" className="text-cyan-400 mt-0.5 shrink-0" size={16} />
                <p className="text-[11px] text-cyan-100/80 uppercase tracking-[0.2em] leading-relaxed">
                    <span className="font-black text-cyan-400 mr-2">DIRECTIVE //</span> 
                    {text}
                </p>
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', earlyAdopters: '',
                uvp: '', unfairAdvantage: '', whyNow: '', revenueStreams: '', costStructure: '',
                trl: 4, mrl: 3, ipDefensibility: 6, regulatoryTailwinds: 5, teamExpertise: 7,
                marketSize: 6, capitalIntensity: 4, customerUrgency: 6,
                scenarioResilience: 5, validationVelocity: 5
            });

            const steps = [
                { id: 'intake', title: 'Intake', icon: 'binary' },
                { id: 'market', title: 'Market Vector', icon: 'zap' },
                { id: 'canvas', title: 'Lean Canvas', icon: 'layout-template' },
                { id: 'readiness', title: 'Readiness Matrix', icon: 'layers' },
                { id: 'radar', title: 'Scenario Radar', icon: 'radar' },
                { id: 'spinout', title: 'Spinout Velocity', icon: 'rocket' },
                { id: 'report', title: 'Verdict', icon: 'shield-check' }
            ];

            const analysis = useMemo(() => {
                // CORE EXECUTION LOGIC: Go/Kill Assessment
                const techScore = (formData.trl * 0.5) + (formData.ipDefensibility * 0.5);
                const marketScore = (formData.mrl * 0.3) + (formData.customerUrgency * 0.3) + (formData.marketSize * 0.4); // High weight on TAM
                const executionRisk = ((10 - formData.capitalIntensity) * 0.4) + (formData.scenarioResilience * 0.3) + (formData.validationVelocity * 0.3);
                
                let score = ((techScore * 0.3) + (marketScore * 0.4) + (executionRisk * 0.3)).toFixed(1);
                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + ((10 - formData.capitalIntensity) * 0.3)).toFixed(1);

                // FATAL FLAW DETECTOR (Validating Star Labs primary failure vectors)
                let fatalFlaw = "";
                if (formData.marketSize <= 3) fatalFlaw = "TAM MISCALCULATION: Market size is too small to justify venture-scale returns.";
                else if (formData.teamExpertise <= 3) fatalFlaw = "TEAM INCAPABILITY: Founder-technology fit is critically misaligned for this pivot.";
                else if (formData.capitalIntensity >= 8) fatalFlaw = "FUND MISALLOCATION RISK: Initial capital burn requirement is unsustainable.";
                else if (formData.mrl <= 3 && formData.trl >= 8) fatalFlaw = "PREMATURE SCALING: Technology is over-developed for a completely unverified market.";
                else if (formData.ipDefensibility <= 3) fatalFlaw = "LACK OF DEFENSIBILITY: Insufficient IP Moat ensures rapid displacement by incumbents.";

                // Override Score if Fatal Flaw is detected
                if (fatalFlaw !== "") {
                    score = Math.min(score, 5.4).toFixed(1);
                }

                let verdict = { status: 'INCUBATE', color: 'text-cyan-400', border: 'border-cyan-500/30', glow: 'shadow-cyan-500/20', advice: "Strong internal R&D potential. Maintain as stealth asset until TRL 6 is achieved and capital model is optimized." };
                if (score >= 8.2) verdict = { status: 'SPINOUT READY', color: 'text-emerald-400', border: 'border-emerald-500/30', glow: 'shadow-emerald-500/20', advice: "Exceptional market-timing and operational efficiency. Authorize immediate corporate spinout and Seed A round preparation." };
                else if (score < 5.5) verdict = { status: 'TERMINATE', color: 'text-rose-400', border: 'border-rose-500/30', glow: 'shadow-rose-500/20', advice: fatalFlaw !== "" ? `FATAL FLAW DETECTED: ${fatalFlaw} Archive project immediately.` : "High assumption risk coupled with low urgency. Project flagged for archive to preserve Star Labs capital." };

                return { score, spinoutIndex, ...verdict };
            }, [formData]);

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'range' ? parseInt(value) : value }));
            };

            const unlock = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("AUTH_ERROR: SECURE ACCESS DENIED");
            };

            if (isLocked) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="max-w-md w-full glass-panel p-14 rounded-[3.5rem] text-center border-white/5">
                        <div className="flex justify-center mb-8">
                            <Logo size="w-48 h-48" />
                        </div>
                        <h1 className="text-2xl font-extrabold text-white tracking-tighter uppercase italic mb-1">Terminal Auth</h1>
                        <p className="text-[10px] font-bold text-slate-500 tracking-[0.5em] mb-12">STAR LABS // CLASSIFIED ACCESS</p>
                        <form onSubmit={unlock} className="space-y-5">
                            <input 
                                type="password" 
                                placeholder="ACCESS KEY" 
                                value={accessKey}
                                onChange={(e) => setAccessKey(e.target.value)}
                                className="w-full command-input rounded-2xl px-6 py-5 text-center text-cyan-400 tracking-[0.8em] font-mono outline-none text-lg"
                            />
                            <button className="w-full py-5 bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold uppercase tracking-widest rounded-2xl transition-all active:scale-95 shadow-xl shadow-cyan-900/20">Decrypt Terminal</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto py-12 px-6 md:px-10">
                    {/* Branded Executive Header */}
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between mb-20 gap-10 pb-12 border-b border-white/10">
                        <div className="flex items-center gap-10">
                            <div className="w-32 h-32 flex items-center justify-center">
                                <Logo size="w-full h-full" />
                            </div>
                            <div className="h-16 w-px bg-white/10 hidden lg:block"></div>
                            <div>
                                <h1 className="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">Alpha-2 <span className="text-cyan-400">Intelligence</span></h1>
                                <p className="text-slate-500 text-[10px] font-bold tracking-[0.6em] uppercase mt-3 italic">Advanced Decision Intelligence Terminal</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-10 no-print">
                            <div className="text-right hidden sm:block">
                                <div className="flex items-center gap-2 justify-end">
                                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Core Active</span>
                                </div>
                                <p className="text-[10px] font-bold text-cyan-500 tracking-widest mt-1 uppercase italic">Investor Preview Mode</p>
                            </div>
                            <button onClick={() => window.print()} className="px-7 py-4 bg-white/5 border border-white/10 rounded-2xl hover:bg-white/10 transition-all text-[11px] font-bold uppercase tracking-widest flex items-center gap-3">
                                <Icon name="file-text" size={16} /> Export Intel
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-16">
                        {/* High-Fi Navigation Surface */}
                        <aside className="lg:col-span-3 space-y-4 no-print">
                            {steps.map((s, i) => (
                                <button 
                                    key={s.id} 
                                    onClick={() => setStep(i)}
                                    className={`w-full flex items-center gap-5 px-8 py-6 rounded-[2.5rem] text-[11px] font-extrabold uppercase tracking-widest transition-all border ${step === i ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-xl shadow-cyan-500/5 translate-x-2' : 'bg-transparent border-transparent text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}
                                >
                                    <Icon name={s.icon} size={18} className={step === i ? "text-cyan-400" : "text-slate-600"} />
                                    {s.title}
                                </button>
                            ))}
                        </aside>

                        {/* Main Interaction Surface */}
                        <main className="lg:col-span-9 glass-panel rounded-[4.5rem] p-12 md:p-20 min-h-[700px] transition-all duration-700 relative overflow-hidden animate-ui">
                            
                            {step === 0 && (
                                <div className="space-y-12">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic mb-4">Project Intake</h2>
                                        <DirectiveBanner text="Without precise problem-solution alignment, downstream algorithmic metrics lose predictive validity." />
                                    </div>
                                    <div className="space-y-12">
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-end">
                                                <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Proprietary Technology Identifier</label>
                                            </div>
                                            <p className="text-[10px] text-slate-400/80 mb-2">The official internal or external designation for this asset.</p>
                                            <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full command-input rounded-3xl px-8 py-6 text-white text-lg outline-none" placeholder="Project Name / ID Code..." />
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-12">
                                            <div className="space-y-4">
                                                <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Observed Market Friction</label>
                                                <p className="text-[10px] text-slate-400/80 mb-2">Detail the specific inefficiency or pain point in the target sector.</p>
                                                <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-7 h-48 outline-none resize-none leading-relaxed" placeholder="What core pain exists?"></textarea>
                                            </div>
                                            <div className="space-y-4">
                                                <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Technical Intervention</label>
                                                <p className="text-[10px] text-slate-400/80 mb-2">Describe the technological mechanism that resolves the friction.</p>
                                                <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-7 h-48 outline-none resize-none leading-relaxed" placeholder="The Star Labs response..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-12">
                                    <div>
                                        <div className="flex items-center gap-6 mb-4"><Icon name="zap" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Market Vector</h2></div>
                                        <DirectiveBanner text="Being technologically early is financially indistinguishable from being wrong. Assesses macro timing and market volume." />
                                    </div>
                                    <div className="space-y-12">
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Timing Thesis (Why Now?)</label>
                                            <p className="text-[10px] text-slate-400/80 mb-2">Identify macro events, regulatory shifts, or technological breakthroughs enabling this today.</p>
                                            <textarea name="whyNow" value={formData.whyNow} onChange={handleInput} className="w-full command-input rounded-[3.5rem] p-10 h-40 outline-none text-base leading-relaxed" placeholder="Convergent trends and immediate growth drivers..."></textarea>
                                        </div>
                                        <div className="grid md:grid-cols-3 gap-10 p-10 bg-white/5 rounded-[3rem] border border-white/5">
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">TAM Scalability</span><span className="text-cyan-400 font-black text-xl tracking-tighter">{formData.marketSize}</span></div>
                                                <p className="text-[9px] text-slate-500 uppercase tracking-widest mt-[-10px]">1 = Niche, 10 = Global</p>
                                                <input type="range" name="marketSize" min="1" max="10" value={formData.marketSize} onChange={handleInput} />
                                            </div>
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">Customer Urgency</span><span className="text-cyan-400 font-black text-xl tracking-tighter">{formData.customerUrgency}</span></div>
                                                <p className="text-[9px] text-slate-500 uppercase tracking-widest mt-[-10px]">1 = Nice to have, 10 = Existential</p>
                                                <input type="range" name="customerUrgency" min="1" max="10" value={formData.customerUrgency} onChange={handleInput} />
                                            </div>
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">Regulatory Ease</span><span className="text-cyan-400 font-black text-xl tracking-tighter">{formData.regulatoryTailwinds}</span></div>
                                                <p className="text-[9px] text-slate-500 uppercase tracking-widest mt-[-10px]">1 = Red tape, 10 = Subsidized</p>
                                                <input type="range" name="regulatoryTailwinds" min="1" max="10" value={formData.regulatoryTailwinds} onChange={handleInput} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-12">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic mb-4">Lean High-Fi Canvas</h2>
                                        <DirectiveBanner text="Exceptional technical readiness cannot rescue a fundamentally flawed revenue or operational cost model." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-10">
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Unique Value Prop</label>
                                            <p className="text-[10px] text-slate-400/80 mb-1">The single, clear message that states why this is worth buying.</p>
                                            <textarea name="uvp" value={formData.uvp} onChange={handleInput} className="w-full command-input rounded-3xl p-7 h-32 outline-none text-sm leading-relaxed" />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Defensible Moat</label>
                                            <p className="text-[10px] text-slate-400/80 mb-1">What cannot be easily copied or bought by competitors.</p>
                                            <textarea name="unfairAdvantage" value={formData.unfairAdvantage} onChange={handleInput} className="w-full command-input rounded-3xl p-7 h-32 outline-none text-sm leading-relaxed" />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Revenue Architecture</label>
                                            <p className="text-[10px] text-slate-400/80 mb-1">Direct and indirect monetization pathways.</p>
                                            <textarea name="revenueStreams" value={formData.revenueStreams} onChange={handleInput} className="w-full command-input rounded-3xl p-7 h-32 outline-none text-sm leading-relaxed" />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">Resource Model</label>
                                            <p className="text-[10px] text-slate-400/80 mb-1">Primary burn drivers (compute, manufacturing, talent).</p>
                                            <textarea name="costStructure" value={formData.costStructure} onChange={handleInput} className="w-full command-input rounded-3xl p-7 h-32 outline-none text-sm leading-relaxed" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-12">
                                    <div>
                                        <div className="flex justify-between items-end border-b border-white/10 pb-6 mb-6"><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Readiness matrix</h2><span className="px-6 py-2 bg-slate-900 rounded-full text-[10px] font-black text-cyan-400 uppercase tracking-widest border border-cyan-500/30">Star Labs TRL Standard</span></div>
                                        <DirectiveBanner text="Aligning Technical Readiness (TRL) with Market Readiness (MRL) detects and prevents premature scaling—a primary cause of capital drain." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-14">
                                        <div className="bg-black/30 p-14 rounded-[4rem] border border-white/5 space-y-10 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-cyan-400 tracking-widest flex items-center gap-4"><Icon name="cpu" size={20}/> Tech Maturity</h3><span className="text-7xl font-black text-white italic">{formData.trl}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px] leading-relaxed max-w-[200px]">Evaluate physical/software maturity against TRL standards.</p>
                                            <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                            <div className="flex justify-between text-[10px] font-black text-slate-600 uppercase tracking-widest"><span>Basic R&D</span><span>Validation</span><span>Deployment Ready</span></div>
                                        </div>
                                        <div className="bg-black/30 p-14 rounded-[4rem] border border-white/5 space-y-10 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-blue-500 tracking-widest flex items-center gap-4"><Icon name="globe" size={20}/> Market Maturity</h3><span className="text-7xl font-black text-white italic">{formData.mrl}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px] leading-relaxed max-w-[200px]">Evaluate customer awareness and acquisition readiness.</p>
                                            <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                            <div className="flex justify-between text-[10px] font-black text-slate-600 uppercase tracking-widest"><span>Discovery</span><span>Scaling</span><span>Dominance</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-12">
                                    <div>
                                        <div className="flex items-center gap-6 mb-4"><Icon name="radar" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Scenario Radar</h2></div>
                                        <DirectiveBanner text="Ensures the asset survives macro volatility, economic shocks, and unforeseen market shifts. Highly fragile assets are eliminated." />
                                    </div>
                                    <div className="bg-black/30 p-14 rounded-[4.5rem] border border-white/5 space-y-12">
                                        <div className="space-y-14 bg-white/5 p-14 rounded-[4rem] border border-white/5 shadow-inner">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-[0.3em] text-slate-500">Environmental Stability Index</span><span className="text-6xl font-black text-cyan-400 tracking-tighter">{formData.scenarioResilience}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-20px] uppercase tracking-widest">1 = Collapses in recession, 10 = Gains value from market chaos.</p>
                                            <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                            <div className="flex justify-between text-[11px] font-black text-slate-700 uppercase tracking-[0.4em]"><span>Fragile in Volatility</span><span>Fully Antifragile</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-12">
                                    <div>
                                        <div className="flex items-center gap-6 mb-4"><Icon name="briefcase" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Spinout Velocity</h2></div>
                                        <DirectiveBanner text="High capital burn or weak founder-technology fit are universally fatal to independent corporate spinouts." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-12">
                                        <div className="p-12 bg-white/5 rounded-[3.5rem] border border-white/5 space-y-8 shadow-2xl">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-widest text-slate-500">Founder-Tech Depth</span><span className="text-4xl font-black text-cyan-400 tracking-tighter italic">{formData.teamExpertise}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px]">Does the current team possess the deep domain expertise required?</p>
                                            <input type="range" name="teamExpertise" min="1" max="10" value={formData.teamExpertise} onChange={handleInput} className="accent-cyan-500" />
                                        </div>
                                        <div className="p-12 bg-white/5 rounded-[3.5rem] border border-white/5 space-y-8 shadow-2xl">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-widest text-slate-500">Proprietary Moat</span><span className="text-4xl font-black text-blue-400 tracking-tighter italic">{formData.ipDefensibility}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px]">Strength of patents, trade secrets, or network effects.</p>
                                            <input type="range" name="ipDefensibility" min="1" max="10" value={formData.ipDefensibility} onChange={handleInput} className="accent-blue-500" />
                                        </div>
                                        <div className="p-12 bg-white/5 rounded-[3.5rem] border border-white/5 space-y-8 shadow-2xl">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-widest text-slate-500">Capital Burn Intensity</span><span className="text-4xl font-black text-rose-400 tracking-tighter italic">{formData.capitalIntensity}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px]">1 = Capital lean (SaaS), 10 = Capital heavy (DeepTech).</p>
                                            <input type="range" name="capitalIntensity" min="1" max="10" value={formData.capitalIntensity} onChange={handleInput} className="accent-rose-500" />
                                        </div>
                                        <div className="p-12 bg-white/5 rounded-[3.5rem] border border-white/5 space-y-8 shadow-2xl">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-widest text-slate-500">Validation Speed</span><span className="text-4xl font-black text-emerald-400 tracking-tighter italic">{formData.validationVelocity}</span></div>
                                            <p className="text-[10px] text-slate-400/80 mt-[-10px]">How fast can we run build-measure-learn product loops?</p>
                                            <input type="range" name="validationVelocity" min="1" max="10" value={formData.validationVelocity} onChange={handleInput} className="accent-emerald-500" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-12">
                                    <DirectiveBanner text="Synthesizes multidimensional inputs into a binary Go/Kill directive, eliminating emotional and cognitive bias from capital allocation decisions." />
                                    <div className={`p-16 md:p-24 rounded-[6rem] border-2 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-2xl ${analysis.glow}`}>
                                        <div className="absolute top-0 right-0 p-16 opacity-[0.03] scale-[3.5]"><Icon name={analysis.icon} size={300} /></div>
                                        <div className="relative z-10 grid md:grid-cols-2 gap-24 items-center">
                                            <div className="space-y-12">
                                                <h2 className="text-[12px] font-black uppercase text-slate-500 tracking-[1.2em]">Core Intelligence</h2>
                                                <div className={`text-[12rem] font-black ${analysis.color} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                <div className="text-5xl font-black text-white uppercase tracking-tighter">{analysis.status}</div>
                                                <div className="border-t border-white/10 pt-16"><p className="text-slate-400 text-lg italic font-medium leading-relaxed italic">"{analysis.advice}"</p></div>
                                            </div>
                                            <div className="space-y-12">
                                                <div className="bg-black/70 p-14 rounded-[4.5rem] border border-white/10 backdrop-blur-3xl shadow-2xl">
                                                    <div className="flex justify-between text-[12px] font-black uppercase mb-6 tracking-widest"><span>Spinout Readiness</span><span className="text-white text-3xl font-black italic">{analysis.spinoutIndex}/10</span></div>
                                                    <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-cyan-400 transition-all duration-[3000ms] ease-out shadow-[0_0_15px_#22d3ee]" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                    <p className="mt-6 text-[10px] text-slate-500 font-bold uppercase tracking-[0.4em] italic">Velocity Modeling: Optimized</p>
                                                </div>
                                                <div className="grid grid-cols-2 gap-8">
                                                    <div className="bg-white/5 p-8 rounded-[2.5rem] text-center shadow-2xl"><p className="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-3">IP Class</p><p className="text-xl font-black text-white uppercase tracking-widest italic">{formData.trl > 7 ? 'Alpha' : 'Beta'}</p></div>
                                                    <div className="bg-white/5 p-8 rounded-[2.5rem] text-center shadow-2xl"><p className="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-3">Radar Grade</p><p className="text-xl font-black text-cyan-400 italic">{formData.scenarioResilience}/10</p></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Tactical Navigation Bar */}
                            <div className="mt-20 pt-14 border-t border-white/10 flex justify-between items-center no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[11px] font-black uppercase tracking-[0.5em] text-slate-600 hover:text-white transition-all disabled:opacity-0 active:scale-90">Back</button>
                                <div className="text-[10px] font-bold text-slate-800 tracking-[1em] uppercase hidden lg:block italic">System Status: Alpha-2 Stable // Star Labs Protocol</div>
                                <button onClick={() => setStep(Math.min(steps.length - 1, step + 1))} disabled={step === steps.length - 1} className="px-14 py-6 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[11px] font-black uppercase tracking-[0.5em] rounded-[2rem] hover:bg-cyan-500 hover:text-white transition-all shadow-2xl active:scale-95 shadow-cyan-900/10">Next Gate</button>
                            </div>
                        </main>
                    </div>

                    <footer className="mt-32 border-t border-white/10 pt-24 grid md:grid-cols-3 gap-24 text-slate-600">
                        <div className="space-y-10">
                            <h4 className="text-[13px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-4 w-fit">Scenario Intelligence</h4>
                            <p className="text-[12px] leading-relaxed font-medium italic">The Alpha-2 engine leverages proprietary environmental forecasting. By quantifying environmental stability, we detect antifragility in high-frontier assets.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-8">
                             <div className="flex gap-6">
                                <div className="w-3.5 h-3.5 bg-cyan-500 rounded-full animate-ping shadow-[0_0_10px_#22d3ee]"></div>
                                <div className="w-3.5 h-3.5 bg-slate-800 rounded-full"></div>
                                <div className="w-3.5 h-3.5 bg-slate-800 rounded-full"></div>
                            </div>
                            <span className="text-[11px] font-bold uppercase tracking-[1.2em] mt-5 text-slate-800 italic">SECURE // SL-AL2-2026</span>
                        </div>
                        <div className="text-right space-y-10">
                             <h4 className="text-[13px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-4 w-fit ml-auto">Velocity Protocol</h4>
                             <p className="text-[12px] font-black text-cyan-400 uppercase tracking-[0.6em] animate-pulse italic">Verified Terminal</p>
                             <p className="text-[11px] font-bold text-slate-700 uppercase tracking-widest mt-2">Controlled by Star Labs Logic Hub</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
