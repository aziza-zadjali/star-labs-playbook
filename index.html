<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Alpha-1 Decision Engine</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for logic -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Universal Browser Version) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0c10; color: #cbd5e1; margin: 0; }
        
        /* Range Input Styling */
        input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: #1e293b; height: 0.25rem; border-radius: 0.5rem; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -6px; background-color: #06b6d4; height: 1rem; width: 1rem; border-radius: 50%; box-shadow: 0 0 10px rgba(6, 182, 212, 0.5); border: none; }
        
        .glass { background: rgba(18, 22, 31, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0c10; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

        @media print { .no-print { display: none; } body { background: white; color: black; } .glass { border: 1px solid #ddd; background: white; color: black; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Helper component for Lucide icons in the browser
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ className = "w-full h-full", textClassName = "" }) => {
            const [imgError, setImgError] = useState(false);
            
            if (imgError) {
                return <span className={`font-black text-white italic ${textClassName}`}>SL</span>;
            }

            return (
                <img 
                    src="./logo.png" 
                    alt="Star Labs" 
                    className={`${className} object-contain`} 
                    onError={(e) => {
                        console.warn("Logo failed to load at ./logo.png. Ensure the file is named exactly 'logo.png' (lowercase) and is in the root directory.");
                        setImgError(true);
                    }} 
                />
            );
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', earlyAdopters: '',
                uvp: '', unfairAdvantage: '', whyNow: '', revenueStreams: '', costStructure: '',
                trl: 3, mrl: 2, marketSize: 5, teamExpertise: 5,
                ipDefensibility: 5, regulatoryTailwinds: 5, capitalIntensity: 5,
                customerUrgency: 5, strategicMoat: 5
            });

            const steps = [
                { id: 'intake', title: 'Intake', icon: 'target' },
                { id: 'market', title: 'Why Now?', icon: 'clock' },
                { id: 'canvas', title: 'Lean Canvas', icon: 'layout' },
                { id: 'readiness', title: 'TRL x MRL', icon: 'layers' },
                { id: 'spinout', title: 'Spinout', icon: 'rocket' },
                { id: 'report', title: 'Intelligence', icon: 'activity' }
            ];

            const analysis = useMemo(() => {
                const technicalDepth = (formData.trl * 0.6) + (formData.ipDefensibility * 0.4);
                const marketFit = (formData.mrl * 0.4) + (formData.marketSize * 0.3) + (formData.customerUrgency * 0.3);
                const timingFactor = (formData.regulatoryTailwinds * 0.5) + (formData.teamExpertise * 0.5);
                const compositeScore = ((technicalDepth * 0.35) + (marketFit * 0.45) + (timingFactor * 0.2)).toFixed(1);
                
                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + (10 - formData.capitalIntensity) * 0.3).toFixed(1);

                let status = 'INCUBATE';
                let theme = { text: 'text-cyan-400', bg: 'bg-cyan-500/10', border: 'border-cyan-500/30', icon: 'activity' };
                let advice = "Requires technical validation within Star Labs. Maintain as internal R&D until TRL reaches Level 6.";

                if (compositeScore >= 8.2) {
                    status = 'SPINOUT READY';
                    theme = { text: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30', icon: 'rocket' };
                    advice = "Exceptional market-timing and technical moat. Star Labs recommends immediate independent spinout and Seed preparation.";
                } else if (compositeScore < 5.5) {
                    status = 'TERMINATE';
                    theme = { text: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/30', icon: 'skull' };
                    advice = "High capital intensity or low urgency. Archive to preserve Star Labs capital for higher-velocity opportunities.";
                }
                return { score: compositeScore, spinoutIndex, status, ...theme, advice };
            }, [formData]);

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'range' ? parseInt(value) : value }));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("ACCESS DENIED: INVALID LAB KEY");
            };

            if (isLocked) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full glass p-10 rounded-[2.5rem] text-center border-cyan-500/20 shadow-2xl shadow-cyan-500/10 animate-in fade-in zoom-in duration-700">
                            <div className="w-24 h-24 flex items-center justify-center mx-auto mb-8 overflow-hidden">
                                <Logo textClassName="text-3xl" className="w-full h-full" />
                            </div>
                            <h1 className="text-2xl font-black text-white tracking-tighter uppercase italic mb-2">Alpha-1 Terminal</h1>
                            <p className="text-slate-500 text-[10px] font-bold tracking-[0.3em] mb-8">RESTRICTED STAR LABS ACCESS</p>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input 
                                    type="password" 
                                    placeholder="ENTER LAB ACCESS KEY" 
                                    className="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-center text-cyan-400 tracking-[0.5em] outline-none focus:border-cyan-500 transition-all font-mono"
                                    value={accessKey}
                                    onChange={(e) => setAccessKey(e.target.value)}
                                />
                                <button className="w-full py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase tracking-widest rounded-2xl transition-all shadow-lg shadow-cyan-900/20 active:scale-95">Authorize</button>
                            </form>
                            <p className="mt-8 text-[9px] text-slate-600 font-bold tracking-widest uppercase">Encryption: AES-256 Enabled</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto py-8 px-4 md:py-12">
                    <header className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6 border-b border-white/10 pb-10">
                        <div className="flex items-center gap-5">
                            <div className="w-16 h-16 flex items-center justify-center overflow-hidden">
                                <Logo textClassName="text-2xl" className="w-full h-full" />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-white tracking-tighter uppercase italic">Star Labs <span className="text-cyan-500">Alpha-1</span></h1>
                                <p className="text-slate-500 text-[10px] font-bold tracking-[0.3em] uppercase mt-1">Decision Intelligence Suite</p>
                            </div>
                        </div>
                        <div className="flex gap-4 no-print">
                            <button onClick={() => window.print()} className="px-5 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 transition-all">
                                <Icon name="download" size={14} /> Intelligence PDF
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-8">
                        <nav className="lg:col-span-3 space-y-2 no-print">
                            {steps.map((s, i) => (
                                <button key={s.id} onClick={() => setStep(i)} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all border ${step === i ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-lg shadow-cyan-500/5' : 'bg-transparent border-transparent text-slate-500 hover:bg-white/5 hover:text-slate-300'}`}>
                                    <Icon name={s.icon} size={16} className={step === i ? "text-cyan-400" : "text-slate-600"} />
                                    {s.title}
                                </button>
                            ))}
                        </nav>

                        <main className="lg:col-span-9 glass rounded-[2.5rem] overflow-hidden shadow-2xl transition-all duration-500">
                            <div className="p-8 md:p-14">
                                {step === 0 && (
                                    <div className="space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                        <div className="border-l-4 border-cyan-500 pl-6"><h2 className="text-2xl font-black text-white italic tracking-tight">Project Intake</h2><p className="text-slate-500 text-sm mt-1">Define proprietary boundaries and technical scope.</p></div>
                                        <div className="space-y-8">
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em]">Technology Identifier</label>
                                                <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl px-6 py-5 text-white focus:border-cyan-500 outline-none transition-all placeholder-slate-700" placeholder="e.g. Project X-12 Quantum Layer..." />
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-8">
                                                <div className="space-y-3">
                                                    <label className="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em]">Problem Geometry</label>
                                                    <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 h-40 focus:border-cyan-500 outline-none transition-all resize-none" placeholder="Target friction identified..."></textarea>
                                                </div>
                                                <div className="space-y-3">
                                                    <label className="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em]">Proposed Solution</label>
                                                    <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 h-40 focus:border-cyan-500 outline-none transition-all resize-none" placeholder="Novel approach..."></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {step === 1 && (
                                    <div className="space-y-10 animate-in slide-in-from-right duration-500">
                                        <div className="flex items-center gap-5"><Icon name="clock" className="text-cyan-500" size={32} /><h2 className="text-2xl font-black text-white italic">Market Timing Analysis</h2></div>
                                        <div className="space-y-8">
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em]">The "Why Now" Thesis</label>
                                                <textarea name="whyNow" value={formData.whyNow} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-[2rem] p-8 h-48 focus:border-cyan-500 outline-none transition-all" placeholder="Convergent trends driving immediate viability..."></textarea>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-10 p-8 bg-cyan-500/5 rounded-3xl border border-cyan-500/10">
                                                <div className="space-y-5">
                                                    <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">Customer Urgency</span><span className="text-cyan-400 font-black text-lg">{formData.customerUrgency}</span></div>
                                                    <input type="range" name="customerUrgency" min="1" max="10" value={formData.customerUrgency} onChange={handleInput} />
                                                </div>
                                                <div className="space-y-5">
                                                    <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">Regulatory Tailwinds</span><span className="text-cyan-400 font-black text-lg">{formData.regulatoryTailwinds}</span></div>
                                                    <input type="range" name="regulatoryTailwinds" min="1" max="10" value={formData.regulatoryTailwinds} onChange={handleInput} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div className="space-y-10 animate-in slide-in-from-right duration-500">
                                        <div className="border-l-4 border-cyan-500 pl-6"><h2 className="text-2xl font-black text-white italic">Lean High-Fidelity Canvas</h2></div>
                                        <div className="grid md:grid-cols-2 gap-8">
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Unique Value Prop</label>
                                                <textarea name="uvp" value={formData.uvp} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-4 h-24 focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Unfair Advantage</label>
                                                <textarea name="unfairAdvantage" value={formData.unfairAdvantage} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-4 h-24 focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Revenue Streams</label>
                                                <textarea name="revenueStreams" value={formData.revenueStreams} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-4 h-24 focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Cost Structure</label>
                                                <textarea name="costStructure" value={formData.costStructure} onChange={handleInput} className="w-full bg-black/20 border border-white/10 rounded-2xl p-4 h-24 focus:border-cyan-500 outline-none" />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div className="space-y-12 animate-in zoom-in duration-500">
                                        <div className="flex justify-between items-center"><h2 className="text-2xl font-black text-white uppercase italic tracking-tighter">Readiness Matrix</h2><span className="px-4 py-1.5 bg-slate-800 rounded-full text-[9px] font-black text-cyan-400 uppercase tracking-widest border border-cyan-500/20">NASA TRL Protocol</span></div>
                                        <div className="grid md:grid-cols-2 gap-10">
                                            <div className="bg-black/30 p-10 rounded-[2.5rem] border border-white/5 space-y-8">
                                                <div className="flex justify-between items-center"><h3 className="text-xs font-black uppercase text-cyan-500 tracking-[0.2em] flex items-center gap-2"><Icon name="cpu" size={16}/> Tech Readiness</h3><span className="text-5xl font-black text-white">{formData.trl}</span></div>
                                                <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                                <div className="flex justify-between text-[8px] font-black text-slate-600 uppercase tracking-widest"><span>Basic Research</span><span>Validation</span><span>Operational</span></div>
                                            </div>
                                            <div className="bg-black/30 p-10 rounded-[2.5rem] border border-white/5 space-y-8">
                                                <div className="flex justify-between items-center"><h3 className="text-xs font-black uppercase text-blue-500 tracking-[0.2em] flex items-center gap-2"><Icon name="globe" size={16}/> Market Readiness</h3><span className="text-5xl font-black text-white">{formData.mrl}</span></div>
                                                <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                                <div className="flex justify-between text-[8px] font-black text-slate-600 uppercase tracking-widest"><span>No Demand</span><span>Pilot Stage</span><span>Scale Ready</span></div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div className="space-y-10 animate-in slide-in-from-right duration-500">
                                        <div className="flex items-center gap-5"><Icon name="briefcase" className="text-cyan-500" size={32} /><h2 className="text-2xl font-black text-white italic">Spinout Potential</h2></div>
                                        <div className="grid md:grid-cols-2 gap-10">
                                            {[
                                                { key: 'teamExpertise', label: 'Team Depth', color: 'cyan' },
                                                { key: 'ipDefensibility', label: 'IP Defensibility', color: 'blue' },
                                                { key: 'capitalIntensity', label: 'Capital Intensity', color: 'rose' },
                                                { key: 'marketSize', label: 'TAM/SAM Growth', color: 'emerald' }
                                            ].map((m) => (
                                                <div key={m.key} className="space-y-5 p-6 bg-white/5 rounded-2xl border border-white/5">
                                                    <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase tracking-widest">{m.label}</span><span className={`text-xl font-black text-${m.color}-400`}>{formData[m.key]}</span></div>
                                                    <input type="range" name={m.key} min="1" max="10" value={formData[m.key]} onChange={handleInput} className={`accent-${m.color}-500`} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {step === 5 && (
                                    <div className="space-y-10 animate-in zoom-in duration-700">
                                        <div className={`p-10 md:p-14 rounded-[3rem] border-2 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-2xl`}>
                                            <div className="absolute top-0 right-0 p-12 opacity-5"><Icon name={analysis.icon} size={200} /></div>
                                            <div className="relative z-10 grid md:grid-cols-2 gap-14 items-center">
                                                <div className="space-y-6">
                                                    <h2 className="text-[10px] font-black uppercase text-slate-500 tracking-[0.5em]">Intelligence Verdict</h2>
                                                    <div className={`text-[8rem] font-black ${analysis.text} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                    <div className="text-3xl font-black text-white uppercase tracking-tighter">{analysis.status}</div>
                                                    <p className="text-slate-400 text-sm leading-relaxed border-t border-white/10 pt-6 font-medium italic">"{analysis.advice}"</p>
                                                </div>
                                                <div className="space-y-6">
                                                    <div className="bg-black/60 p-8 rounded-[2rem] border border-white/10 backdrop-blur-xl">
                                                        <div className="flex justify-between text-[10px] font-black uppercase mb-4 tracking-widest"><span>Spinout Readiness</span><span className="text-white text-base">{analysis.spinoutIndex}/10</span></div>
                                                        <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-cyan-500 transition-all duration-[2000ms] ease-out" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                        <p className="mt-3 text-[9px] text-slate-500 font-bold">Metrics based on Star Labs Launch-Vector modeling.</p>
                                                    </div>
                                                    <div className="bg-black/60 p-8 rounded-[2rem] border border-white/10 backdrop-blur-xl">
                                                        <div className="flex justify-between text-[10px] font-black uppercase mb-4 tracking-widest"><span>Moat Defensibility</span><span className="text-white text-base">{formData.ipDefensibility}/10</span></div>
                                                        <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-blue-500 transition-all duration-[2000ms] ease-out" style={{ width: `${formData.ipDefensibility * 10}%` }}></div></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                            {[
                                                { label: 'Risk Profile', val: (10 - formData.regulatoryTailwinds) > 7 ? 'High' : 'Controlled' },
                                                { label: 'Market Velocity', val: formData.mrl > 6 ? 'Accelerating' : 'Stable' },
                                                { label: 'Tech Alpha', val: formData.trl > 7 ? 'High-Sig' : 'Emerging' },
                                                { label: 'Audit Result', val: 'Verified' }
                                            ].map((item, i) => (
                                                <div key={i} className="bg-white/5 border border-white/5 p-5 rounded-2xl text-center">
                                                    <p className="text-[8px] font-black uppercase text-slate-600 tracking-widest mb-1">{item.label}</p>
                                                    <p className="text-xs font-black text-slate-300">{item.val}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white/5 px-8 py-8 flex justify-between items-center border-t border-white/5 no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-600 hover:text-cyan-400 disabled:opacity-5 transition-all">Previous Stage</button>
                                <div className="text-[8px] font-black text-slate-800 tracking-[0.5em] uppercase hidden md:block">Star Labs Alpha-1 // 2026 Revision</div>
                                <button onClick={() => setStep(Math.min(steps.length - 1, step + 1))} disabled={step === steps.length - 1} className="px-8 py-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[10px] font-black uppercase tracking-[0.3em] rounded-xl hover:bg-cyan-500 hover:text-white transition-all shadow-lg shadow-cyan-500/10 active:scale-95">Advance Gate</button>
                            </div>
                        </main>
                    </div>

                    <footer className="mt-16 border-t border-white/5 pt-12 grid md:grid-cols-3 gap-12 text-slate-600">
                        <div className="space-y-4">
                            <h4 className="text-[10px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-2 w-fit">Spinout Protocol</h4>
                            <p className="text-[11px] leading-relaxed font-medium">Star Labs prioritizes the 'Founder-Market Fit'. We leverage high-velocity intellectual property to create independent, VC-ready corporate entities.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-3">
                             <div className="flex gap-2.5">
                                <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-ping"></div>
                                <div className="w-1.5 h-1.5 bg-slate-800 rounded-full"></div>
                                <div className="w-1.5 h-1.5 bg-slate-800 rounded-full"></div>
                            </div>
                            <span className="text-[8px] font-black uppercase tracking-[0.5em] mt-2 text-slate-700">Encrypted Terminal v4.2.0</span>
                        </div>
                        <div className="text-right space-y-4">
                             <h4 className="text-[10px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-2 w-fit ml-auto">Security Status</h4>
                             <p className="text-[10px] font-black text-cyan-500 uppercase tracking-widest animate-pulse-slow">Investor Presentation Mode Active</p>
                             <p className="text-[9px] font-bold text-slate-700 uppercase">Handled by Alpha-1 Logic Core</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
