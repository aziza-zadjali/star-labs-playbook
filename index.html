<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | VRP Pro — Venture Readiness Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05060a;
            --surface: #0b0d12;
            --card: #0f1118;
            --card2: #131620;
            --gold: #c9a84c;
            --gold-b: #f0c84a;
            --gold-dim: rgba(201,168,76,0.12);
            --gold-border: rgba(201,168,76,0.22);
            --text: #eeeae0;
            --muted: #555b6a;
            --danger: #f87171;
            --success: #34d399;
            --info: #60a5fa;
            --warn: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .mono { font-family: 'Space Mono', monospace; }
        .display { font-family: 'Syne', sans-serif; }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9998; opacity: 0.5;
        }

        /* Ambient orbs */
        .orb {
            position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 0;
            filter: blur(80px);
        }
        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
            top: -200px; left: 50%; transform: translateX(-50%);
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(96,165,250,0.04) 0%, transparent 70%);
            bottom: 0; right: -100px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.18); border-radius: 99px; }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.25rem;
        }
        .card-gold {
            background: var(--card);
            border: 1px solid var(--gold-border);
            border-radius: 1.25rem;
        }
        .card-danger {
            background: rgba(248,113,113,0.05);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 1.25rem;
        }
        .card-success {
            background: rgba(52,211,153,0.05);
            border: 1px solid rgba(52,211,153,0.2);
            border-radius: 1.25rem;
        }

        /* Nav */
        .nav-item {
            display: flex; align-items: center; gap: 0.65rem;
            padding: 0.65rem 1rem;
            border-radius: 0.6rem;
            font-size: 0.68rem; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
            border: 1px solid transparent;
            color: var(--muted); font-family: 'Syne', sans-serif;
            position: relative;
        }
        .nav-item:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.03); }
        .nav-item.active {
            background: var(--gold-dim);
            border-color: var(--gold-border);
            color: var(--gold);
        }
        .nav-item.done::after {
            content: '✓';
            position: absolute; right: 0.75rem;
            font-size: 0.6rem; color: var(--success); opacity: 0.8;
        }
        .nav-section {
            font-size: 0.55rem; letter-spacing: 0.15em;
            color: rgba(255,255,255,0.2); text-transform: uppercase;
            font-family: 'Space Mono', monospace;
            padding: 1.25rem 1rem 0.4rem;
        }

        /* Fields */
        .field {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 0.75rem;
            padding: 0.8rem 1.1rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .field:focus {
            border-color: var(--gold-border);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.07);
        }
        .field::placeholder { color: #2e333d; }
        select.field option { background: #0f1118; }

        /* Range sliders */
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 3px;
            background: rgba(255,255,255,0.07);
            border-radius: 99px; cursor: pointer; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px rgba(201,168,76,0.5);
        }

        /* Gold text */
        .gold-text {
            background: linear-gradient(135deg, #c9a84c, #f0c84a 45%, #c9a84c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Progress bar */
        .pbar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; }
        .pfill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-b)); border-radius: 99px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }

        /* Tag */
        .tag {
            font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; padding: 0.22rem 0.65rem;
            border-radius: 99px; font-family: 'Space Mono', monospace;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }

        /* AI block */
        .ai-block {
            background: linear-gradient(135deg, rgba(201,168,76,0.03), rgba(201,168,76,0.07));
            border: 1px solid var(--gold-border);
            border-radius: 1rem; padding: 1.75rem;
            position: relative; overflow: hidden;
        }
        .ai-block::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* Typing cursor */
        .typing-cursor::after { content: '▋'; animation: blink 0.9s infinite; color: var(--gold); }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        /* Radar label */
        .rl { font-size: 9px; fill: #555b6a; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.35s ease forwards; }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer-btn {
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-b) 25%, var(--gold) 50%, var(--gold-b) 75%, var(--gold) 100%);
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }

        @keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); } 50% { box-shadow: 0 0 0 8px rgba(201,168,76,0); } }
        .pulse-gold { animation: pulse-ring 2.5s infinite; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; display: inline-block; }

        /* Score ring animation */
        @keyframes ring-draw { from { stroke-dashoffset: 502; } }

        /* Dimension badge */
        .dim-badge {
            width: 2.2rem; height: 2.2rem;
            border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 800;
            font-size: 0.85rem;
        }

        /* Matrix cell */
        .matrix-cell {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 0.75rem;
            padding: 1rem;
            transition: all 0.2s;
        }
        .matrix-cell:hover { border-color: var(--gold-border); background: rgba(201,168,76,0.03); }

        /* Risk pill */
        .risk-low { background: rgba(52,211,153,0.1); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
        .risk-mid { background: rgba(201,168,76,0.1); color: var(--gold); border: 1px solid var(--gold-border); }
        .risk-high { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }

        /* Heatmap cell */
        .hmap-0 { background: rgba(248,113,113,0.15); }
        .hmap-1 { background: rgba(251,146,60,0.12); }
        .hmap-2 { background: rgba(250,204,21,0.1); }
        .hmap-3 { background: rgba(52,211,153,0.1); }

        /* Timeline step */
        .tl-dot {
            width: 10px; height: 10px;
            border-radius: 50%; flex-shrink: 0;
            border: 2px solid var(--gold);
            background: var(--bg);
            box-shadow: 0 0 8px rgba(201,168,76,0.4);
        }
        .tl-line { width: 2px; background: linear-gradient(to bottom, var(--gold-border), transparent); flex-shrink: 0; min-height: 2rem; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ── Helpers ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 16, className = "", style = {} }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (window.lucide && ref.current) window.lucide.createIcons({ rootNode: ref.current });
    }, [name]);
    return (
        <span ref={ref} style={style}>
            <i data-lucide={name} className={className}
               style={{ width: size, height: size, display: 'inline-flex', verticalAlign: 'middle' }}></i>
        </span>
    );
};

const Logo = () => {
    const [err, setErr] = useState(false);
    if (err) return <span className="display font-black text-white tracking-tighter text-xl">STAR LABS</span>;
    return <img src="logo.png" alt="Star Labs" className="h-9 w-auto object-contain" onError={() => setErr(true)} />;
};

const clamp = (v, min = 1, max = 10) => Math.min(max, Math.max(min, v));
const fmt = (v, d = 1) => parseFloat(v).toFixed(d);

// Color scale
const scoreColor = (v) =>
    v >= 8 ? '#34d399' : v >= 6.5 ? '#c9a84c' : v >= 4.5 ? '#f59e0b' : '#f87171';

// ── Radar Chart ────────────────────────────────────────────────────────────────
const RadarChart = ({ data, size = 280 }) => {
    const cx = size / 2, cy = size / 2, r = size * 0.36;
    const n = data.length;
    const pts = data.map((d, i) => {
        const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
        return { ...d, angle, ox: cx + r * Math.cos(angle), oy: cy + r * Math.sin(angle) };
    });

    const polyAt = (scale) =>
        pts.map(p => {
            const v = scale !== undefined ? scale : (p.value / 10);
            return `${cx + r * v * Math.cos(p.angle)},${cy + r * v * Math.sin(p.angle)}`;
        }).join(' ');

    return (
        <svg viewBox={`0 0 ${size} ${size}`} className="w-full">
            {[0.2, 0.4, 0.6, 0.8, 1].map(l => (
                <polygon key={l} points={polyAt(l)} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1" />
            ))}
            {pts.map((p, i) => (
                <line key={i} x1={cx} y1={cy} x2={p.ox} y2={p.oy} stroke="rgba(255,255,255,0.05)" strokeWidth="1" />
            ))}
            <polygon points={pts.map(p => {
                const v = p.value / 10;
                return `${cx + r * v * Math.cos(p.angle)},${cy + r * v * Math.sin(p.angle)}`;
            }).join(' ')} fill="rgba(201,168,76,0.12)" stroke="#c9a84c" strokeWidth="1.5" strokeLinejoin="round" />
            {pts.map((p, i) => {
                const v = p.value / 10;
                return <circle key={i} cx={cx + r * v * Math.cos(p.angle)} cy={cy + r * v * Math.sin(p.angle)} r="3.5" fill="#c9a84c" />;
            })}
            {pts.map((p, i) => {
                const lx = cx + (r + 20) * Math.cos(p.angle);
                const ly = cy + (r + 20) * Math.sin(p.angle);
                return (
                    <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" className="rl">{p.label}</text>
                );
            })}
        </svg>
    );
};

// ── Score Ring ────────────────────────────────────────────────────────────────
const ScoreRing = ({ score, max = 10, label = "VRP" }) => {
    const pct = clamp(score, 0, max) / max;
    const circ = 2 * Math.PI * 80;
    const offset = circ * (1 - pct);
    const color = scoreColor(score);
    return (
        <svg width="200" height="200" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="10" />
            <circle cx="100" cy="100" r="80" fill="none" stroke={color} strokeWidth="10"
                strokeLinecap="round"
                strokeDasharray={circ}
                strokeDashoffset={offset}
                transform="rotate(-90 100 100)"
                style={{ transition: 'stroke-dashoffset 1.8s cubic-bezier(0.4,0,0.2,1)', filter: `drop-shadow(0 0 10px ${color}80)` }}
            />
            <text x="100" y="93" textAnchor="middle" dominantBaseline="middle"
                style={{ fontFamily: 'Syne', fontSize: 38, fontWeight: 800, fill: color }}>{fmt(score)}</text>
            <text x="100" y="118" textAnchor="middle" dominantBaseline="middle"
                style={{ fontFamily: 'Space Mono', fontSize: 8, fill: '#555b6a', letterSpacing: 2, textTransform: 'uppercase' }}>/{max} {label}</text>
        </svg>
    );
};

// ── AI Analysis Block ─────────────────────────────────────────────────────────
const AIBlock = ({ text, streaming, label = "AI Analysis", icon = "cpu" }) => (
    <div className="ai-block space-y-3">
        <div className="flex items-center gap-2">
            <div className="w-1.5 h-1.5 rounded-full" style={{ background: '#c9a84c', boxShadow: '0 0 6px #c9a84c' }}></div>
            <span className="mono text-xs text-yellow-400 font-bold tracking-wider uppercase">{label}</span>
            {streaming && (
                <span className="mono text-xs text-gray-600 flex items-center gap-1">
                    <span className="spin" style={{ display: 'inline-block', width: 10, height: 10 }}>⟳</span> generating
                </span>
            )}
        </div>
        <p className={`text-sm leading-relaxed text-gray-300 whitespace-pre-wrap ${streaming ? 'typing-cursor' : ''}`}>
            {text || (streaming ? '' : <span className="text-gray-600 italic">Analysis will appear here.</span>)}
        </p>
    </div>
);

// ── Metric Slider ─────────────────────────────────────────────────────────────
const Slider = ({ label, name, value, onChange, min = 1, max = 10, step = 1, description, accent }) => {
    const pct = ((value - min) / (max - min)) * 100;
    const color = accent || scoreColor(value);
    return (
        <div className="matrix-cell space-y-3">
            <div className="flex justify-between items-center">
                <span className="display text-xs font-bold uppercase tracking-wider text-gray-400">{label}</span>
                <span className="mono font-bold text-xl" style={{ color }}>{value > 0 ? value : `${value}`}</span>
            </div>
            <div className="relative">
                <input type="range" name={name} min={min} max={max} step={step} value={value} onChange={onChange} />
                <div className="pbar mt-1.5">
                    <div className="pfill" style={{ width: `${pct}%`, background: color }}></div>
                </div>
            </div>
            {description && <p className="text-xs text-gray-600">{description}</p>}
        </div>
    );
};

// ── Constants ─────────────────────────────────────────────────────────────────
const STEPS = [
    { id: 'intake',      title: 'Intake',       icon: 'file-scan',     section: 'Foundation' },
    { id: 'market',      title: 'Market',        icon: 'trending-up',   section: 'Foundation' },
    { id: 'technology',  title: 'Technology',    icon: 'cpu',           section: 'Dimensions' },
    { id: 'financial',   title: 'Financial',     icon: 'bar-chart-2',   section: 'Dimensions' },
    { id: 'risk',        title: 'Risk',          icon: 'shield-alert',  section: 'Dimensions' },
    { id: 'esg',         title: 'ESG & Reg',     icon: 'leaf',          section: 'Dimensions' },
    { id: 'team',        title: 'Team',          icon: 'users',         section: 'Dimensions' },
    { id: 'engine',      title: 'AI Engine',     icon: 'sparkles',      section: 'Verdict' },
    { id: 'verdict',     title: 'Verdict',       icon: 'shield-check',  section: 'Verdict' },
];

const GEMINI_KEY = "AIzaSyDEDCbJtpnwY5i-RTPOOYa5OXaFFk3hLf8";
// Try multiple model endpoints in order — the API has been renamed several times
const GEMINI_MODELS = [
    "gemini-flash-latest",
    "gemini-2.5-flash",
    "gemini-2.0-flash",
    "gemini-1.5-flash",
    "gemini-pro"
];
const buildGeminiUrl = (model) =>
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_KEY}`;

// ── App ───────────────────────────────────────────────────────────────────────
const App = () => {
    const [locked, setLocked] = useState(true);
    const [keyVal, setKeyVal] = useState('');
    const [keyErr, setKeyErr] = useState(false);
    const [step, setStep] = useState(0);
    const [aiText, setAiText] = useState('');
    const [isStreaming, setIsStreaming] = useState(false);
    const [hasAnalyzed, setHasAnalyzed] = useState(false);
    const [sectionAI, setSectionAI] = useState({});
    const [streamingSection, setStreamingSection] = useState(null);
    const [completedSteps, setCompletedSteps] = useState(new Set());

    const [form, setForm] = useState({
        // Intake
        techName: '', category: 'DeepTech', sector: '', problem: '', solution: '', whyNow: '',
        unfairAdvantage: '', stage: 'Concept', partnerName: '', assessorDate: '',
        // Market
        marketSize: 6, customerUrgency: 6, marketTiming: 6, competitiveMoat: 5,
        revenueModel: '', tam: '', marketInsight: '', marketExpertAdj: 0,
        // Technology
        trl: 5, mrl: 4, ipDefensibility: 5, techScalability: 6, integrationComplexity: 5,
        techExpertAdj: 0, techNotes: '',
        // Financial
        capitalIntensity: 5, roiPotential: 6, paybackPeriod: 5, fundingStage: 'Pre-Seed',
        burnRisk: 4, revenueReadiness: 5, financialNotes: '',
        // Risk
        regulatoryRisk: 4, geopoliticalRisk: 3, supplychainRisk: 4, cybersecurityRisk: 3,
        talentRisk: 4, competitionRisk: 5, riskNotes: '',
        // ESG
        environmentalImpact: 5, socialImpact: 5, governanceReadiness: 6, regulatoryCompliance: 6,
        sdgAlignment: 4, esgNotes: '',
        // Team
        teamExpertise: 6, advisoryStrength: 5, validationVelocity: 5, scenarioResilience: 5,
        partnershipNetwork: 5, executionExpertAdj: 0,
        // Expert
        expertNote: ''
    });

    const hi = (e) => {
        const { name, value, type } = e.target;
        setForm(prev => ({ ...prev, [name]: type === 'range' ? parseFloat(value) : value }));
    };

    // ── Scoring Engine ────────────────────────────────────────────────────────
    const scores = useMemo(() => {
        const tech = clamp(
            (form.trl * 0.35) + (form.ipDefensibility * 0.3) + (form.techScalability * 0.2) +
            ((10 - form.integrationComplexity) * 0.15) + form.techExpertAdj, 0, 10);

        const market = clamp(
            (form.marketSize * 0.3) + (form.customerUrgency * 0.25) + (form.marketTiming * 0.2) +
            (form.competitiveMoat * 0.25) + form.marketExpertAdj, 0, 10);

        const financial = clamp(
            (form.roiPotential * 0.35) + (form.revenueReadiness * 0.25) +
            ((10 - form.capitalIntensity) * 0.2) + ((10 - form.burnRisk) * 0.2), 0, 10);

        const risk = clamp(10 - (
            (form.regulatoryRisk + form.geopoliticalRisk + form.supplychainRisk +
             form.cybersecurityRisk + form.talentRisk + form.competitionRisk) / 6
        ), 0, 10);

        const esg = clamp(
            (form.environmentalImpact * 0.25) + (form.socialImpact * 0.2) +
            (form.governanceReadiness * 0.25) + (form.regulatoryCompliance * 0.2) +
            (form.sdgAlignment * 0.1), 0, 10);

        const team = clamp(
            (form.teamExpertise * 0.35) + (form.advisoryStrength * 0.2) +
            (form.validationVelocity * 0.2) + (form.scenarioResilience * 0.15) +
            (form.partnershipNetwork * 0.1) + form.executionExpertAdj, 0, 10);

        // Weighted composite: Market > Tech > Team > Financial > Risk > ESG
        const composite = clamp(
            tech * 0.22 + market * 0.28 + financial * 0.15 + risk * 0.12 + esg * 0.08 + team * 0.15, 0, 10);

        // Fatal flaws
        const fatalFlaw =
            form.marketSize <= 2 ? "TAM too small — terminal constraint." :
            form.teamExpertise <= 2 ? "Leadership gap — execution risk critical." :
            form.capitalIntensity >= 9 ? "Capital intensity unsustainable." :
            form.regulatoryRisk >= 9 ? "Regulatory blocker — prohibitive risk." :
            null;

        const capped = fatalFlaw ? Math.min(composite, 5.2) : composite;

        const verdict =
            capped >= 8.0 ? { status: 'SPINOUT READY', color: '#34d399', label: 'High Investment Grade — Proceed to Spinout Gate' } :
            capped >= 6.5 ? { status: 'ACCELERATE', color: '#c9a84c', label: 'Strong Pipeline — Fast-Track Incubation Recommended' } :
            capped >= 4.5 ? { status: 'INCUBATE', color: '#f59e0b', label: 'Foundry Candidate — De-risk Before Capital Commitment' } :
            { status: 'TERMINATE', color: '#f87171', label: fatalFlaw || 'Risk profile exceeds terminal value threshold' };

        return { tech: fmt(tech), market: fmt(market), financial: fmt(financial), risk: fmt(risk), esg: fmt(esg), team: fmt(team), composite: fmt(capped), fatalFlaw, verdict };
    }, [form]);

    const radarData = [
        { label: 'Tech', value: parseFloat(scores.tech) },
        { label: 'Market', value: parseFloat(scores.market) },
        { label: 'Financial', value: parseFloat(scores.financial) },
        { label: 'Risk', value: parseFloat(scores.risk) },
        { label: 'ESG', value: parseFloat(scores.esg) },
        { label: 'Team', value: parseFloat(scores.team) },
    ];

    // ── Gemini API ────────────────────────────────────────────────────────────
    const callGemini = async (sys, prompt, onChunk) => {
        let lastError = null;
        let workingText = null;

        for (const model of GEMINI_MODELS) {
            try {
                const res = await fetch(buildGeminiUrl(model), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: sys }] },
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { maxOutputTokens: 900, temperature: 0.72 }
                    })
                });

                if (!res.ok) {
                    const errBody = await res.text();
                    lastError = `[${model}] HTTP ${res.status}: ${errBody.substring(0, 200)}`;
                    console.warn(lastError);
                    continue; // try next model
                }

                const data = await res.json();
                if (data?.error) {
                    lastError = `[${model}] API error: ${data.error.message}`;
                    console.warn(lastError);
                    continue;
                }

                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    workingText = text;
                    console.log(`✓ Using model: ${model}`);
                    break;
                } else {
                    lastError = `[${model}] No text in response: ${JSON.stringify(data).substring(0, 200)}`;
                    console.warn(lastError);
                }
            } catch (err) {
                lastError = `[${model}] Network error: ${err.message}`;
                console.warn(lastError);
            }
        }

        if (!workingText) {
            throw new Error(lastError || "All Gemini models failed");
        }

        const words = workingText.split(' ');
        for (let i = 0; i < words.length; i++) {
            onChunk((i === 0 ? '' : ' ') + words[i]);
            await new Promise(r => setTimeout(r, 16));
        }
    };

    const SYS = `You are the Chief Diligence Officer at Star Labs, a deep-tech corporate venture studio operating in the Gulf and global emerging markets. You evaluate technology spinouts for strategic investment readiness across technology, market, financial, risk, ESG, and team dimensions. Be blunt, precise, and institutionally credible. No bullet points. No headers. No markdown. Plain prose paragraphs only. Write like a seasoned VC partner with deep operational experience.`;

    const analyzeSection = useCallback(async (key, prompt) => {
        setStreamingSection(key);
        setSectionAI(prev => ({ ...prev, [key]: '' }));
        try {
            await callGemini(SYS, prompt, (chunk) =>
                setSectionAI(prev => ({ ...prev, [key]: (prev[key] || '') + chunk })));
        } catch (err) {
            console.error('Gemini error:', err);
            setSectionAI(prev => ({ ...prev, [key]: `⚠ Analysis unavailable.\n\nError: ${err.message}\n\nOpen browser console (F12) for full details.` }));
        } finally {
            setStreamingSection(null);
        }
    }, []);

    const runFullAnalysis = useCallback(async () => {
        if (!form.techName) { alert("Enter an Asset Identifier first (Step 1)."); return; }
        setIsStreaming(true); setAiText(''); setHasAnalyzed(true);
        const prompt = `
STAR LABS — VENTURE READINESS PROTOCOL
Full Institutional Diligence Report

=== ASSET PROFILE ===
Name: ${form.techName}
Category: ${form.category} | Sector: ${form.sector || 'Not specified'}
Stage: ${form.stage}
Problem: ${form.problem || 'Not specified'}
Solution: ${form.solution || 'Not specified'}
Why Now: ${form.whyNow || 'Not specified'}
Unfair Advantage: ${form.unfairAdvantage || 'Not specified'}
Revenue Model: ${form.revenueModel || 'Not specified'}
TAM Estimate: ${form.tam || 'Not specified'}
Market Insight: ${form.marketInsight || 'Not specified'}

=== QUANTITATIVE SCORES (out of 10) ===
TECHNOLOGY: TRL=${form.trl}, IP Defensibility=${form.ipDefensibility}, Scalability=${form.techScalability}, Integration Complexity=${form.integrationComplexity}
MARKET: TAM/SAM=${form.marketSize}, Customer Urgency=${form.customerUrgency}, Timing=${form.marketTiming}, Competitive Moat=${form.competitiveMoat}
FINANCIAL: ROI Potential=${form.roiPotential}, Revenue Readiness=${form.revenueReadiness}, Capital Intensity=${form.capitalIntensity}, Burn Risk=${form.burnRisk}
RISK: Regulatory=${form.regulatoryRisk}, Geopolitical=${form.geopoliticalRisk}, Supply Chain=${form.supplychainRisk}, Cybersecurity=${form.cybersecurityRisk}, Talent=${form.talentRisk}, Competition=${form.competitionRisk}
ESG: Environmental=${form.environmentalImpact}, Social=${form.socialImpact}, Governance=${form.governanceReadiness}, Regulatory Compliance=${form.regulatoryCompliance}, SDG Alignment=${form.sdgAlignment}
TEAM: Expertise=${form.teamExpertise}, Advisory=${form.advisoryStrength}, Validation Velocity=${form.validationVelocity}, Resilience=${form.scenarioResilience}

=== COMPUTED SCORES ===
Technology: ${scores.tech}/10 | Market: ${scores.market}/10 | Financial: ${scores.financial}/10
Risk: ${scores.risk}/10 | ESG: ${scores.esg}/10 | Team: ${scores.team}/10
Composite VRP Score: ${scores.composite}/10
Preliminary Gate Decision: ${scores.verdict.status}
${scores.fatalFlaw ? `FATAL FLAW: ${scores.fatalFlaw}` : ''}

Write a rigorous 4-paragraph diligence verdict for the Star Labs investment committee. Paragraph 1: technology IP moat and scalability assessment. Paragraph 2: market opportunity, timing, and competitive positioning. Paragraph 3: financial viability, capital efficiency, and risk-adjusted return profile. Paragraph 4: team execution DNA, ESG alignment, and specific next gate conditions for the venture. Be blunt. No bullet points. Plain prose only.`;

        try {
            await callGemini(SYS, prompt, (chunk) => setAiText(prev => prev + chunk));
        } catch (err) {
            console.error('Gemini error:', err);
            setAiText(`⚠ AI engine unavailable.\n\nError: ${err.message}\n\nCommon causes:\n• API key invalid or quota exceeded\n• Model name deprecated (auto-fallback attempted)\n• Network/CORS issue\n\nOpen browser console (F12) for full details.`);
        } finally {
            setIsStreaming(false);
        }
    }, [form, scores]);

    const markDone = () => setCompletedSteps(prev => new Set([...prev, step]));
    const goStep = (i) => { markDone(); setStep(i); };
    const next = () => { markDone(); setStep(s => Math.min(STEPS.length - 1, s + 1)); };
    const prev = () => setStep(s => Math.max(0, s - 1));

    // ─── Lock Screen ──────────────────────────────────────────────────────────
    if (locked) return (
        <div className="min-h-screen flex items-center justify-center p-6 relative z-10">
            <div className="w-full max-w-sm space-y-8">
                <div className="text-center space-y-4">
                    <div className="flex justify-center mb-2"><Logo /></div>
                    <div>
                        <h1 className="display text-2xl font-black uppercase tracking-tighter text-white">VRP Terminal</h1>
                        <p className="mono text-xs tracking-widest mt-1" style={{ color: '#c9a84c' }}>AUTHORIZATION REQUIRED</p>
                    </div>
                    <p className="text-xs text-gray-600">Venture Readiness Protocol — Institutional Grade</p>
                </div>
                <div className="card-gold p-8 space-y-4">
                    <input type="password" placeholder="ACCESS KEY"
                        value={keyVal}
                        onChange={e => { setKeyVal(e.target.value); setKeyErr(false); }}
                        onKeyDown={e => {
                            if (e.key === 'Enter') {
                                if (keyVal.toUpperCase() === 'STAR2026') setLocked(false);
                                else setKeyErr(true);
                            }
                        }}
                        className="field text-center mono text-base tracking-[0.4em]"
                        style={{ borderColor: keyErr ? 'rgba(248,113,113,0.4)' : undefined }}
                    />
                    {keyErr && <p className="mono text-xs text-red-400 text-center">ACCESS DENIED — Invalid key</p>}
                    <button
                        onClick={() => keyVal.toUpperCase() === 'STAR2026' ? setLocked(false) : setKeyErr(true)}
                        className="w-full py-4 rounded-xl font-black text-sm uppercase tracking-widest transition-all display shimmer-btn"
                        style={{ color: '#05060a' }}>
                        Verify Access
                    </button>
                </div>
                <p className="text-center mono text-xs text-gray-700">SL-VRP-2026 // CLASSIFIED</p>
            </div>
        </div>
    );

    const currentStep = STEPS[step];
    const sections = [...new Set(STEPS.map(s => s.section))];

    // ─── Main UI ──────────────────────────────────────────────────────────────
    return (
        <div className="min-h-screen relative z-10">
            {/* Header */}
            <header className="border-b no-print sticky top-0 z-50 px-6 py-3 flex items-center justify-between"
                style={{ background: 'rgba(5,6,10,0.92)', backdropFilter: 'blur(20px)', borderColor: 'rgba(255,255,255,0.05)' }}>
                <div className="flex items-center gap-4">
                    <Logo />
                    <div className="w-px h-5 bg-white/10 hidden md:block"></div>
                    <div className="hidden md:block">
                        <div className="display text-sm font-bold uppercase tracking-wider text-white">Venture Readiness Protocol</div>
                        <div className="mono text-xs text-gray-600">Pro · v2.0 · 2026</div>
                    </div>
                </div>
                <div className="flex items-center gap-3">
                    {form.techName && (
                        <span className="tag" style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>

                        </span>

                    {form.techName && (
                        <span className="tag" style={{ background: 'rgba(255,255,255,0.04)', color: scoreColor(parseFloat(scores.composite)), border: `1px solid ${scoreColor(parseFloat(scores.composite))}40` }}>
                            {scores.composite}
                        </span>
                    )}
                    <button onClick={() => window.print()}
                        className="tag no-print"
                        style={{ background: 'rgba(255,255,255,0.04)', color: '#555b6a', border: '1px solid rgba(255,255,255,0.08)', cursor: 'pointer' }}>
                        <Icon name="printer" size={11} /> Export
                    </button>
                </div>
            </header>

            <div className="max-w-7xl mx-auto px-4 py-6 flex gap-6">
                {/* Sidebar */}
                <aside className="w-48 shrink-0 no-print">
                    <div className="sticky top-20 space-y-0.5">
                        {sections.map(sec => (
                            <div key={sec}>
                                <div className="nav-section">{sec}</div>
                                {STEPS.filter(s => s.section === sec).map((s, _) => {
                                    const idx = STEPS.findIndex(x => x.id === s.id);
                                    return (
                                        <button key={s.id} onClick={() => goStep(idx)}
                                            className={`nav-item w-full ${step === idx ? 'active' : ''} ${completedSteps.has(idx) && step !== idx ? 'done' : ''}`}>
                                            <Icon name={s.icon} size={13} />
                                            {s.title}
                                        </button>
                                    );
                                })}
                            </div>
                        ))}

                        {/* Live Score Widget */}
                        {form.techName && (
                            <div className="mt-5 card p-4 space-y-3">
                                <p className="mono text-xs text-gray-600 uppercase tracking-wider">Live Score</p>
                                <div className="display text-3xl font-black" style={{ color: scores.verdict.color }}>{scores.composite}</div>
                                <div className="pbar"><div className="pfill" style={{ width: `${parseFloat(scores.composite) * 10}%`, background: scores.verdict.color }}></div></div>
                                <p className="mono text-xs font-bold" style={{ color: scores.verdict.color }}>{scores.verdict.status}</p>
                                <div className="space-y-1.5 pt-1">
                                    {[['T', scores.tech], ['M', scores.market], ['F', scores.financial], ['R', scores.risk], ['E', scores.esg], ['X', scores.team]].map(([l, v]) => (
                                        <div key={l} className="flex items-center gap-2">
                                            <span className="mono text-xs w-3" style={{ color: scoreColor(parseFloat(v)) }}>{l}</span>
                                            <div className="pbar flex-1">
                                                <div className="pfill" style={{ width: `${parseFloat(v) * 10}%`, background: scoreColor(parseFloat(v)) }}></div>
                                            </div>
                                            <span className="mono text-xs text-gray-600">{v}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </aside>

                {/* Main Content */}
                <main className="flex-1 min-w-0 pb-16">
                    {/* Step Header */}
                    <div className="flex items-center gap-3 mb-6 no-print">
                        <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: 'var(--gold-dim)', border: '1px solid var(--gold-border)' }}>
                            <Icon name={currentStep.icon} size={14} style={{ color: 'var(--gold)' }} />
                        </div>
                        <div className="flex-1">
                            <div className="display text-xs font-bold uppercase tracking-widest text-gray-600">{currentStep.section} — Step {step + 1}/{STEPS.length}</div>
                        </div>
                        <div className="flex gap-1">
                            {STEPS.map((_, i) => (
                                <div key={i} className="h-1 rounded-full transition-all" style={{
                                    width: i === step ? 20 : 6,
                                    background: i === step ? 'var(--gold)' : completedSteps.has(i) ? 'rgba(201,168,76,0.3)' : 'rgba(255,255,255,0.08)'
                                }}></div>
                            ))}
                        </div>
                    </div>

                    {/* ══════════════ STEP 0: INTAKE ══════════════ */}
                    {step === 0 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Foundry Intake</h2>
                                <p className="text-sm text-gray-500 mt-1">Establish venture geometry before capital allocation.</p>
                            </div>

                            <div className="card p-6 space-y-5">
                                <div className="grid md:grid-cols-3 gap-4">
                                    <div className="md:col-span-2 space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Asset Identifier *</label>
                                        <input name="techName" value={form.techName} onChange={hi} className="field text-lg font-bold display" placeholder="e.g. PROJECT HELIOS" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Assessment Stage</label>
                                        <select name="stage" value={form.stage} onChange={hi} className="field">
                                            {['Concept','Prototype','MVP','Pilot','Scale','Expansion'].map(s => <option key={s}>{s}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Category</label>
                                        <select name="category" value={form.category} onChange={hi} className="field">
                                            {['DeepTech','FinTech','HealthTech','CleanTech','AgriTech','SpaceTech','AI/ML','Robotics','Biotech','Other'].map(c => <option key={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Target Sector</label>
                                        <input name="sector" value={form.sector} onChange={hi} className="field" placeholder="Energy, Healthcare, Defense..." />
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Market Friction (Problem)</label>
                                        <textarea name="problem" value={form.problem} onChange={hi} className="field h-32 resize-none" placeholder="The critical problem this solves — be specific and quantifiable..." />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Proposed Resolution (Solution)</label>
                                        <textarea name="solution" value={form.solution} onChange={hi} className="field h-32 resize-none" placeholder="Proprietary mechanism and technical approach..." />
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Why Now</label>
                                        <textarea name="whyNow" value={form.whyNow} onChange={hi} className="field h-24 resize-none" placeholder="Catalytic conditions — regulatory shifts, tech enablers, market timing..." />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Unfair Advantage</label>
                                        <textarea name="unfairAdvantage" value={form.unfairAdvantage} onChange={hi} className="field h-24 resize-none" placeholder="What cannot be easily replicated — IP, data, relationships, network effects..." />
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Lead Assessor</label>
                                        <input name="partnerName" value={form.partnerName} onChange={hi} className="field" placeholder="Partner / Analyst name" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Assessment Date</label>
                                        <input name="assessorDate" type="date" value={form.assessorDate} onChange={hi} className="field" />
                                    </div>
                                </div>
                            </div>

                            {form.problem && form.solution && (
                                <div className="flex justify-end">
                                    <button onClick={() => analyzeSection('intake', `Assess this venture concept (max 160 words, plain prose, no bullets, no markdown):\nAsset: ${form.techName}\nCategory: ${form.category} | Sector: ${form.sector}\nProblem: ${form.problem}\nSolution: ${form.solution}\nWhy Now: ${form.whyNow}\nUnfair Advantage: ${form.unfairAdvantage}\n\nIs the problem-solution fit compelling? Is the "why now" credible? What is the single biggest question mark at this stage?`)}
                                        className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                        style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                        <Icon name="cpu" size={12} />
                                        {streamingSection === 'intake' ? 'Analyzing...' : 'Quick AI Read'}
                                    </button>
                                </div>
                            )}
                            {(sectionAI.intake || streamingSection === 'intake') && (
                                <AIBlock text={sectionAI.intake} streaming={streamingSection === 'intake'} label="Concept Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 1: MARKET ══════════════ */}
                    {step === 1 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Market Vector</h2>
                                <p className="text-sm text-gray-500 mt-1">TAM calibration — asset must demonstrate global scale potential.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="TAM / SAM Size" name="marketSize" value={form.marketSize} onChange={hi} description="1 = Niche / 10 = Global dominant market" />
                                <Slider label="Customer Urgency" name="customerUrgency" value={form.customerUrgency} onChange={hi} description="1 = Nice-to-have / 10 = Existential must-solve" />
                                <Slider label="Market Timing" name="marketTiming" value={form.marketTiming} onChange={hi} description="1 = Too early / 5 = Emerging / 10 = Perfect window" />
                                <Slider label="Competitive Moat" name="competitiveMoat" value={form.competitiveMoat} onChange={hi} description="Differentiation depth vs. existing players" />
                            </div>

                            <div className="card p-6 space-y-4">
                                <div className="grid md:grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Revenue Model</label>
                                        <select name="revenueModel" value={form.revenueModel} onChange={hi} className="field">
                                            <option value="">Select model...</option>
                                            {['SaaS','Licensing','Marketplace','B2G','B2B Enterprise','B2C','Usage-based','Hardware + Services','Joint Venture'].map(m => <option key={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">TAM Estimate (USD)</label>
                                        <input name="tam" value={form.tam} onChange={hi} className="field" placeholder="e.g. $4.2B by 2030" />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Market Insight / Vision 2040 Tailwinds</label>
                                    <textarea name="marketInsight" value={form.marketInsight} onChange={hi} className="field h-20 resize-none" placeholder="Sovereign mandates, sector tailwinds, regulatory moats, demographic shifts..." />
                                </div>
                            </div>

                            <div className="matrix-cell p-5 space-y-3" style={{ border: '1px solid rgba(245,158,11,0.25)' }}>
                                <div className="flex justify-between items-center">
                                    <span className="mono text-xs font-bold text-amber-500 uppercase tracking-wider">Expert Regional Adjustment</span>
                                    <span className="mono font-bold text-amber-400">{form.marketExpertAdj > 0 ? '+' : ''}{form.marketExpertAdj}</span>
                                </div>
                                <input type="range" name="marketExpertAdj" min="-3" max="3" step="0.5" value={form.marketExpertAdj} onChange={hi} />
                                <p className="text-xs text-gray-600">Correct for regional knowledge not captured by raw scores (GCC, MENA context).</p>
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('market', `Market analysis for a venture (max 160 words, plain prose):\nTAM Score: ${form.marketSize}/10\nCustomer Urgency: ${form.customerUrgency}/10\nTiming: ${form.marketTiming}/10\nCompetitive Moat: ${form.competitiveMoat}/10\nRevenue Model: ${form.revenueModel}\nTAM Estimate: ${form.tam}\nInsight: ${form.marketInsight}\n\nIs the timing credible? Is the moat defensible? What market risk deserves the most scrutiny?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'market' ? 'Analyzing...' : 'AI Market Read'}
                                </button>
                            </div>
                            {(sectionAI.market || streamingSection === 'market') && (
                                <AIBlock text={sectionAI.market} streaming={streamingSection === 'market'} label="Market Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 2: TECHNOLOGY ══════════════ */}
                    {step === 2 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Technology Dimension</h2>
                                <p className="text-sm text-gray-500 mt-1">Readiness, IP strength, scalability, and integration complexity.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="card-gold p-6 space-y-4">
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <p className="mono text-xs text-yellow-400 uppercase tracking-wider font-bold">TRL</p>
                                            <p className="text-xs text-gray-500 mt-0.5">Technology Readiness Level</p>
                                        </div>
                                        <span className="display text-5xl font-black gold-text">{form.trl}</span>
                                    </div>
                                    <input type="range" name="trl" min="1" max="9" value={form.trl} onChange={hi} />
                                    <div className="pbar"><div className="pfill" style={{ width: `${(form.trl / 9) * 100}%` }}></div></div>
                                    <div className="grid grid-cols-3 gap-1 text-center">
                                        {[['1-3','Basic Research'],['4-6','Prototype'],['7-9','Deployed']].map(([r, l]) => (
                                            <div key={r} className="text-xs text-gray-600"><span className="block mono text-yellow-600">{r}</span>{l}</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="card p-6 space-y-4">
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <p className="mono text-xs text-gray-400 uppercase tracking-wider font-bold">MRL</p>
                                            <p className="text-xs text-gray-500 mt-0.5">Market Readiness Level</p>
                                        </div>
                                        <span className="display text-5xl font-black text-white">{form.mrl}</span>
                                    </div>
                                    <input type="range" name="mrl" min="1" max="10" value={form.mrl} onChange={hi} />

                                    <p className="text-xs text-gray-600">1 = No market engagement → 10 = Full GTM deployed</p>
                                </div>
                            </div>

                            {/* TRL/MRL Gap indicator */}
                            <div className="card p-4 flex items-center justify-between">
                                <span className="mono text-xs text-gray-500 uppercase">TRL/MRL Alignment</span>
                                <div className="flex items-center gap-3">
                                    <div className="pbar w-32">
                                        <div className="pfill" style={{ width: `${(1 - Math.abs(form.trl - form.mrl) / 9) * 100}%`, background: Math.abs(form.trl - form.mrl) > 3 ? '#f87171' : '#c9a84c' }}></div>
                                    </div>
                                    <span className="mono text-xs font-bold" style={{ color: Math.abs(form.trl - form.mrl) > 3 ? '#f87171' : '#c9a84c' }}>
                                        {Math.abs(form.trl - form.mrl) > 3 ? 'MISALIGNED' : Math.abs(form.trl - form.mrl) > 1 ? 'MODERATE GAP' : 'ALIGNED'}
                                    </span>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="IP Defensibility" name="ipDefensibility" value={form.ipDefensibility} onChange={hi} description="Patents, trade secrets, network effects, data moats" />
                                <Slider label="Tech Scalability" name="techScalability" value={form.techScalability} onChange={hi} description="Architecture's ability to scale globally without linear cost" />
                                <Slider label="Integration Complexity" name="integrationComplexity" value={form.integrationComplexity} onChange={hi} description="Lower = faster adoption (high score = more complex)" accent="#f59e0b" />
                                <div className="matrix-cell p-5 space-y-3" style={{ border: '1px solid rgba(245,158,11,0.25)' }}>
                                    <div className="flex justify-between items-center">
                                        <span className="mono text-xs font-bold text-amber-500 uppercase tracking-wider">Tech Expert Adj</span>
                                        <span className="mono font-bold text-amber-400">{form.techExpertAdj > 0 ? '+' : ''}{form.techExpertAdj}</span>
                                    </div>
                                    <input type="range" name="techExpertAdj" min="-3" max="3" step="0.5" value={form.techExpertAdj} onChange={hi} />
                                    <p className="text-xs text-gray-600">Technical expert correction to raw score</p>
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Technology Notes</label>
                                <textarea name="techNotes" value={form.techNotes} onChange={hi} className="field h-20 resize-none" placeholder="Key technical risks, dependencies, breakthroughs..." />
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('tech', `Technology assessment (max 160 words, plain prose):\nTRL: ${form.trl}/9\nMRL: ${form.mrl}/10\nIP Defensibility: ${form.ipDefensibility}/10\nScalability: ${form.techScalability}/10\nIntegration Complexity: ${form.integrationComplexity}/10\nNotes: ${form.techNotes}\n\nWhat does this tech profile suggest about spinout readiness? What's the critical technical risk to address first?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'tech' ? 'Analyzing...' : 'AI Tech Read'}
                                </button>
                            </div>
                            {(sectionAI.tech || streamingSection === 'tech') && (
                                <AIBlock text={sectionAI.tech} streaming={streamingSection === 'tech'} label="Technology Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 3: FINANCIAL ══════════════ */}
                    {step === 3 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Financial Dimension</h2>
                                <p className="text-sm text-gray-500 mt-1">Capital efficiency, ROI potential, and revenue readiness.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="ROI Potential" name="roiPotential" value={form.roiPotential} onChange={hi} description="Risk-adjusted return multiple expectation" accent="#34d399" />
                                <Slider label="Revenue Readiness" name="revenueReadiness" value={form.revenueReadiness} onChange={hi} description="Proximity to first contracted revenue" />
                                <Slider label="Capital Intensity" name="capitalIntensity" value={form.capitalIntensity} onChange={hi} description="Higher = heavier burn — negative signal for VRP" accent="#f87171" />
                                <Slider label="Burn Risk" name="burnRisk" value={form.burnRisk} onChange={hi} description="Probability of runway crisis before revenue" accent="#f59e0b" />
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Funding Stage</label>

                                        {['Pre-Seed','Seed','Series A','Series B','Series C+','Revenue-Generating','Strategic JV'].map(s => <option key={s}>{s}</option>)}
                                    </select>
                                </div>
                                <Slider label="Payback Period Score" name="paybackPeriod" value={form.paybackPeriod} onChange={hi} description="10 = <12 months / 1 = 10+ years" />
                            </div>

                            {/* Financial snapshot */}
                            <div className="card p-5 space-y-4">
                                <p className="mono text-xs text-gray-500 uppercase tracking-wider font-bold">Financial Health Snapshot</p>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    {[
                                        { label: 'ROI', value: scores.financial, icon: 'trending-up' },
                                        { label: 'Cap Eff', value: fmt(10 - form.capitalIntensity), icon: 'zap' },
                                        { label: 'Rev Ready', value: fmt(form.revenueReadiness), icon: 'dollar-sign' },
                                        { label: 'Payback', value: fmt(form.paybackPeriod), icon: 'clock' },
                                    ].map(({ label, value, icon }) => (
                                        <div key={label} className="matrix-cell text-center space-y-1 p-3">
                                            <Icon name={icon} size={14} className="mx-auto" style={{ color: scoreColor(parseFloat(value)) }} />
                                            <div className="mono text-xs text-gray-500 uppercase">{label}</div>
                                            <div className="display text-xl font-black" style={{ color: scoreColor(parseFloat(value)) }}>{value}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Financial Notes</label>
                                <textarea name="financialNotes" value={form.financialNotes} onChange={hi} className="field h-20 resize-none" placeholder="Unit economics, funding pipeline, LOIs, anchor customers..." />
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('financial', `Financial viability assessment (max 160 words, plain prose):\nROI Potential: ${form.roiPotential}/10\nRevenue Readiness: ${form.revenueReadiness}/10\nCapital Intensity: ${form.capitalIntensity}/10\nBurn Risk: ${form.burnRisk}/10\nPayback Score: ${form.paybackPeriod}/10\nFunding Stage: ${form.fundingStage}\nNotes: ${form.financialNotes}\n\nWhat does this financial profile indicate for spinout viability? What's the critical capital risk?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'financial' ? 'Analyzing...' : 'AI Financial Read'}
                                </button>
                            </div>
                            {(sectionAI.financial || streamingSection === 'financial') && (
                                <AIBlock text={sectionAI.financial} streaming={streamingSection === 'financial'} label="Financial Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 4: RISK ══════════════ */}
                    {step === 4 && (
                        <div className="fade-up space-y-6">
                            <div>
                                <h2 className="display text-3xl font-black uppercase tracking-tight">Risk Matrix</h2>
                                <p className="text-sm text-gray-500 mt-1">Multi-vector risk calibration — lower scores preferred.</p>
                            </div>

                            <div className="card-gold p-4 flex items-center gap-3">
                                <Icon name="alert-triangle" size={14} style={{ color: '#f59e0b' }} />
                                <p className="text-xs text-gray-400">Score risk severity 1–10. Higher = more severe. Score translates inversely to venture health.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Slider label="Regulatory Risk" name="regulatoryRisk" value={form.regulatoryRisk} onChange={hi} description="Exposure to adverse regulatory action or prohibition" accent={form.regulatoryRisk >= 7 ? '#f87171' : form.regulatoryRisk >= 4 ? '#f59e0b' : '#34d399'} />
                                <Slider label="Geopolitical Risk" name="geopoliticalRisk" value={form.geopoliticalRisk} onChange={hi} description="Macro geopolitical exposure and sovereignty risk" accent={form.geopoliticalRisk >= 7 ? '#f87171' : form.geopoliticalRisk >= 4 ? '#f59e0b' : '#34d399'} />
                                <Slider label="Supply Chain Risk" name="supplychainRisk" value={form.supplychainRisk} onChange={hi} description="Concentration and fragility of input supply" accent={form.supplychainRisk >= 7 ? '#f87171' : form.supplychainRisk >= 4 ? '#f59e0b' : '#34d399'} />
                                <Slider label="Cybersecurity Risk" name="cybersecurityRisk" value={form.cybersecurityRisk} onChange={hi} description="Attack surface and data sovereignty exposure" accent={form.cybersecurityRisk >= 7 ? '#f87171' : form.cybersecurityRisk >= 4 ? '#f59e0b' : '#34d399'} />
                                <Slider label="Talent Risk" name="talentRisk" value={form.talentRisk} onChange={hi} description="Dependency on rare expertise or key person risk" accent={form.talentRisk >= 7 ? '#f87171' : form.talentRisk >= 4 ? '#f59e0b' : '#34d399'} />
                                <Slider label="Competition Risk" name="competitionRisk" value={form.competitionRisk} onChange={hi} description="Incumbent disruption or fast-follower threat" accent={form.competitionRisk >= 7 ? '#f87171' : form.competitionRisk >= 4 ? '#f59e0b' : '#34d399'} />
                            </div>

                            {/* Risk heatmap */}
                            <div className="card p-5 space-y-3">
                                <p className="mono text-xs text-gray-500 uppercase tracking-wider font-bold">Risk Heatmap</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {[
                                        { label: 'Regulatory', v: form.regulatoryRisk },
                                        { label: 'Geopolitical', v: form.geopoliticalRisk },
                                        { label: 'Supply Chain', v: form.supplychainRisk },
                                        { label: 'Cybersecurity', v: form.cybersecurityRisk },
                                        { label: 'Talent', v: form.talentRisk },
                                        { label: 'Competition', v: form.competitionRisk },
                                    ].map(({ label, v }) => {
                                        const tier = v >= 8 ? 0 : v >= 6 ? 1 : v >= 3 ? 2 : 3;
                                        const cl = `hmap-${tier}`;
                                        const col = v >= 8 ? '#f87171' : v >= 6 ? '#f59e0b' : v >= 3 ? '#c9a84c' : '#34d399';
                                        return (
                                            <div key={label} className={`${cl} rounded-lg p-3 space-y-1 text-center`}>
                                                <div className="mono text-xs text-gray-500">{label}</div>
                                                <div className="display text-xl font-black" style={{ color: col }}>{v}</div>
                                                <div className="tag mx-auto" style={{ background: 'transparent', color: col, border: `1px solid ${col}40`, fontSize: '0.5rem' }}>
                                                    {v >= 8 ? 'CRITICAL' : v >= 6 ? 'HIGH' : v >= 3 ? 'MEDIUM' : 'LOW'}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="mono text-xs font-bold text-gray-500 uppercase tracking-wider">Risk Notes & Mitigants</label>
                                <textarea name="riskNotes" value={form.riskNotes} onChange={hi} className="field h-20 resize-none" placeholder="Identified mitigants, insurance, regulatory approvals in progress..." />
                            </div>

                            <div className="flex justify-end">
                                <button onClick={() => analyzeSection('risk', `Risk profile assessment for a deep-tech venture (max 160 words, plain prose):\nRegulatory: ${form.regulatoryRisk}/10\nGeopolitical: ${form.geopoliticalRisk}/10\nSupply Chain: ${form.supplychainRisk}/10\nCybersecurity: ${form.cybersecurityRisk}/10\nTalent: ${form.talentRisk}/10\nCompetition: ${form.competitionRisk}/10\nNotes: ${form.riskNotes}\n\nWhat is the most critical risk vector? What mitigation strategy should precede capital deployment?`)}
                                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider display transition-all"
                                    style={{ background: 'var(--gold-dim)', color: 'var(--gold)', border: '1px solid var(--gold-border)' }}>
                                    <Icon name="cpu" size={12} />
                                    {streamingSection === 'risk' ? 'Analyzing...' : 'AI Risk Read'}
                                </button>
                            </div>
                            {(sectionAI.risk || streamingSection === 'risk') && (
                                <AIBlock text={sectionAI.risk} streaming={streamingSection === 'risk'} label="Risk Assessment" />
                            )}
                        </div>
                    )}

                    {/* ══════════════ STEP 5: ESG ══════════════ */}
                    {step === 5 && (
                        <div className="fade-up space-y-6">
