<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Star Labs EZP Pro — Emerging Zone Protocol"/>
<meta name="theme-color" content="#0a0b0e"/>
<title>Star Labs | EZP Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0b0e; --card:#111318; --gold:#c9a84c; --gold-b:#e8c76a;
  --gold-dim:rgba(201,168,76,0.13); --gold-border:rgba(201,168,76,0.28);
  --text:#e8e4d8; --text2:#b8b4a8; --text3:#7a7878; --muted:#4a4f5c;
  --red:#f87171; --green:#34d399; --blue:#60a5fa; --amber:#f59e0b;
  --fs-xs:0.75rem; --fs-sm:0.8125rem; --fs-base:0.875rem; --fs-md:0.9375rem;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;min-height:100vh;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;}
.syne{font-family:'Syne',sans-serif;}
.mono{font-family:'Space Mono',monospace;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.4;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,.07),transparent 70%);top:-180px;left:50%;transform:translateX(-50%);}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(96,165,250,.04),transparent 70%);bottom:0;right:-80px;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:99px;}
/* Cards */
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:1.1rem;}
.card-gold{background:var(--card);border:1px solid var(--gold-border);border-radius:1.1rem;}
.card-info{background:rgba(96,165,250,.04);border:1px solid rgba(96,165,250,.15);border-radius:1.1rem;}
.card-success{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.15);border-radius:1.1rem;}
.card-warn{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.2);border-radius:1.1rem;}
/* Fields */
.field{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--text);
  border-radius:.7rem;padding:.8rem 1rem;width:100%;font-family:'Inter',sans-serif;
  font-size:var(--fs-base);transition:border-color .2s,box-shadow .2s;outline:none;}
.field:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(201,168,76,.07);}
.field::placeholder{color:#3a4050;}
select.field option{background:#111318;}
/* Range */
input[type="range"]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:99px;cursor:pointer;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 8px rgba(201,168,76,.5);}
/* Progress */
.pbar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}
/* Tags */
.tag{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:99px;font-family:'Space Mono',monospace;
  display:inline-flex;align-items:center;gap:.25rem;}
/* Nav */
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-radius:.55rem;
  font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;border:1px solid transparent;
  color:var(--muted);font-family:'Syne',sans-serif;position:relative;width:100%;background:none;}
.nav-item:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.03);}
.nav-item.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);}
.nav-item.done::after{content:'✓';position:absolute;right:.7rem;font-size:.55rem;color:var(--green);}
.nav-section{font-size:.5rem;letter-spacing:.15em;color:rgba(232,228,216,.35);
  text-transform:uppercase;font-family:'Space Mono',monospace;padding:1.1rem .9rem .35rem;}
/* Matrix cell */
.mxcell{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:.75rem;padding:1rem;transition:all .2s;}
.mxcell:hover{border-color:var(--gold-border);}
/* AI block */
.ai-block{background:linear-gradient(135deg,rgba(201,168,76,.03),rgba(201,168,76,.07));
  border:1px solid var(--gold-border);border-radius:.9rem;padding:1.5rem;position:relative;overflow:hidden;}
.ai-block::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
/* Gold text */
.gold-text{background:linear-gradient(135deg,#c9a84c,#f0c84a 45%,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
/* Heatmap */
.hmap0{background:rgba(248,113,113,.15);}
.hmap1{background:rgba(251,146,60,.12);}
.hmap2{background:rgba(250,204,21,.1);}
.hmap3{background:rgba(52,211,153,.1);}
/* Radar label */
.rl{font-size:10px;fill:#9a9690;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .3s ease forwards;}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
.shimmer-btn{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-b) 25%,var(--gold) 50%,var(--gold-b) 75%,var(--gold) 100%);background-size:200% auto;animation:shimmer 3s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.cursor::after{content:'▋';animation:blink .9s infinite;color:var(--gold);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.35);}50%{box-shadow:0 0 0 8px rgba(201,168,76,0);}}
.pulse-gold{animation:pulse 2.5s infinite;}
/* Step dot */
.sdot{height:3px;border-radius:99px;transition:all .3s;}
/* Mobile nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(5,6,10,.97);border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(20px);padding:.5rem .5rem;padding-bottom:env(safe-area-inset-bottom,.5rem);}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem .3rem;
  border-radius:.5rem;border:none;background:none;color:var(--muted);cursor:pointer;flex:1;
  font-family:'Space Mono',monospace;transition:color .15s;}
.mbtn span{font-size:.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.mbtn.act{color:var(--gold);}
@media(max-width:768px){
  .mob-nav{display:flex;}
  .desk-sidebar{display:none!important;}
  .main-pad{padding-bottom:5rem!important;}
  .hide-mobile{display:none!important;}
}
.no-print{} 
@media print{
  .no-print{display:none!important;}
  body{background:#fff!important;color:#000!important;}
  .card,.card-gold{border:1px solid #ddd!important;background:#fafafa!important;}
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef,useCallback} = React;

// ── Helpers ───────────────────────────────────────────────────────────────────
const clamp = (v,mn=0,mx=10) => Math.min(mx,Math.max(mn,parseFloat(v)||0));
const fmt = (v,d=1) => parseFloat(v).toFixed(d);
const sc = v => v>=8?'#34d399':v>=6.5?'#c9a84c':v>=4.5?'#f59e0b':'#f87171';

// ── Icon ──────────────────────────────────────────────────────────────────────
const Icon = ({name,size=16,color,className=''}) => {
  const r = useRef(null);
  useEffect(()=>{ if(window.lucide&&r.current) window.lucide.createIcons({rootNode:r.current}); },[name]);
  return <span ref={r}><i data-lucide={name} style={{width:size,height:size,display:'inline-flex',verticalAlign:'middle',color:color||'currentColor'}} className={className}></i></span>;
};

// ── Logo ──────────────────────────────────────────────────────────────────────
const Logo = ({h=36}) => {
  const [err,setErr]=useState(false);
  if(err) return <span className="syne" style={{fontWeight:900,color:'var(--text)',letterSpacing:'-.04em',fontSize:h>60?'2rem':'1.1rem',lineHeight:1}}>STAR<br/><span style={{color:'var(--gold)'}}>LABS</span></span>;
  return <img src="logo.png" alt="Star Labs" style={{height:h,width:'auto',objectFit:'contain',display:'block'}} onError={()=>setErr(true)}/>;
};

// ── Radar ─────────────────────────────────────────────────────────────────────
const Radar = ({data,size=260}) => {
  const cx=size/2,cy=size/2,r=size*.34,n=data.length;
  const pts = data.map((d,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;return{...d,a,ox:cx+r*Math.cos(a),oy:cy+r*Math.sin(a)};});
  const poly = s => pts.map(p=>{const v=s!==undefined?s:(p.value/10);return `${cx+r*v*Math.cos(p.a)},${cy+r*v*Math.sin(p.a)}`;}).join(' ');
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:'100%',maxWidth:300,display:'block',margin:'0 auto'}}>
      {[.2,.4,.6,.8,1].map(l=><polygon key={l} points={poly(l)} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>)}
      {pts.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p.ox} y2={p.oy} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      <polygon points={pts.map(p=>{const v=p.value/10;return `${cx+r*v*Math.cos(p.a)},${cy+r*v*Math.sin(p.a)}`;}).join(' ')} fill="rgba(201,168,76,0.12)" stroke="#c9a84c" strokeWidth="1.5" strokeLinejoin="round"/>
      {pts.map((p,i)=>{const v=p.value/10;return <circle key={i} cx={cx+r*v*Math.cos(p.a)} cy={cy+r*v*Math.sin(p.a)} r="3.5" fill="#c9a84c"/>;} )}
      {pts.map((p,i)=><text key={i} x={cx+(r+18)*Math.cos(p.a)} y={cy+(r+18)*Math.sin(p.a)} textAnchor="middle" dominantBaseline="middle" className="rl">{p.label}</text>)}
    </svg>
  );
};

// ── Score Ring ────────────────────────────────────────────────────────────────
const Ring = ({score}) => {
  const c=2*Math.PI*75,col=sc(score),off=c*(1-(clamp(score,0,10)/10));
  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="9"/>
      <circle cx="90" cy="90" r="75" fill="none" stroke={col} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 90 90)"
        style={{transition:'stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)',filter:`drop-shadow(0 0 8px ${col}80)`}}/>
      <text x="90" y="84" textAnchor="middle" dominantBaseline="middle" style={{fontFamily:'Syne',fontSize:36,fontWeight:800,fill:col}}>{fmt(score)}</text>
      <text x="90" y="106" textAnchor="middle" dominantBaseline="middle" style={{fontFamily:'Space Mono',fontSize:9,fill:'#7a7878',letterSpacing:2}}>/ 10 EZP</text>
    </svg>
  );
};

// ── AI Block ──────────────────────────────────────────────────────────────────
const AIBlock = ({text,loading,label='AI Analysis'}) => (
  <div className="ai-block" style={{marginTop:'1rem'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:'var(--gold)',boxShadow:'0 0 6px var(--gold)',flexShrink:0}}/>
      <span className="mono" style={{fontSize:'var(--fs-sm)',color:'#d4aa56',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase'}}>{label}</span>
      {loading && <span className="spin mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginLeft:4}}>⟳</span>}
    </div>
    <p className={loading?'cursor':''} style={{fontSize:'var(--fs-base)',lineHeight:1.75,color:'#ccc9bc',whiteSpace:'pre-wrap'}}>
      {text || (loading ? '' : <span style={{color:'#5a5650',fontStyle:'italic'}}>Analysis will appear here.</span>)}
    </p>
  </div>
);

// ── Slider ────────────────────────────────────────────────────────────────────
const Slider = ({label,name,value,onChange,min=1,max=10,step=1,desc,accent}) => {
  const pct=((value-min)/(max-min))*100, col=accent||sc(value);
  return (
    <div className="mxcell">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:'#a8a49a'}}>{label}</span>
        <span className="mono" style={{fontSize:'1.2rem',fontWeight:700,color:col}}>{value}</span>
      </div>
      <input type="range" name={name} min={min} max={max} step={step} value={value} onChange={onChange}/>
      <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${pct}%`,background:col}}/></div>
      {desc && <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:6}}>{desc}</p>}
    </div>
  );
};

// ── Doc Upload Card ───────────────────────────────────────────────────────────
const DocCard = ({doc,uploaded,onUpload,onRemove}) => {
  const inp = useRef(null);
  return (
    <div style={{background:uploaded?'rgba(52,211,153,.04)':'rgba(255,255,255,.02)',border:`1px solid ${uploaded?'rgba(52,211,153,.2)':'rgba(255,255,255,.07)'}`,borderRadius:'.8rem',padding:'1rem',transition:'all .2s'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
        <div style={{width:38,height:38,borderRadius:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:uploaded?'rgba(52,211,153,.1)':'var(--gold-dim)',border:`1px solid ${uploaded?'rgba(52,211,153,.2)':'var(--gold-border)'}`}}>
          <Icon name={uploaded?'check-circle':doc.icon} size={16} color={uploaded?'#34d399':'var(--gold)'}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3,flexWrap:'wrap'}}>
            <span className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text)'}}>{doc.label}</span>
            {uploaded && <span className="mono tag" style={{background:'rgba(52,211,153,.1)',color:'#34d399',border:'1px solid rgba(52,211,153,.2)'}}>UPLOADED</span>}
          </div>
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginBottom:3}}>{doc.hint}</p>
          <p className="mono" style={{fontSize:'var(--fs-xs)',color:'rgba(201,168,76,.6)'}}>Validates: {doc.scoreLink}</p>
          {uploaded && <p style={{fontSize:'var(--fs-xs)',color:'#34d399',marginTop:5}}>📄 {uploaded.name} <span style={{color:'var(--text3)'}}>({uploaded.size})</span></p>}
        </div>
        <div style={{flexShrink:0}}>
          {uploaded
            ? <button onClick={()=>onRemove(doc.id)} style={{padding:'5px 10px',borderRadius:6,fontSize:'var(--fs-xs)',fontWeight:700,background:'rgba(248,113,113,.08)',color:'#f87171',border:'1px solid rgba(248,113,113,.2)',cursor:'pointer',fontFamily:'Space Mono'}}>Remove</button>
            : <><input ref={inp} type="file" accept={doc.accept} style={{display:'none'}} onChange={e=>e.target.files[0]&&onUpload(doc.id,e.target.files[0])}/><button onClick={()=>inp.current.click()} className="syne" style={{padding:'5px 12px',borderRadius:6,fontSize:'var(--fs-xs)',fontWeight:700,background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer',textTransform:'uppercase',letterSpacing:'.06em'}}>Upload</button></>
          }
        </div>
      </div>
      {!uploaded && <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:8,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.04)'}}>Accepted: {doc.accept.replace(/\./g,'').replace(/,/g,' · ').toUpperCase()}</p>}
    </div>
  );
};

// ── AI Button ─────────────────────────────────────────────────────────────────
const AIBtn = ({onClick,loading,label='AI Analysis'}) => (
  <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
    <button onClick={onClick} disabled={loading} style={{display:'flex',alignItems:'center',gap:6,padding:'.55rem 1.1rem',borderRadius:'.7rem',fontSize:'var(--fs-xs)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer',fontFamily:'Syne',opacity:loading?.7:1}}>
      <Icon name={loading?'loader':'cpu'} size={11} className={loading?'spin':''}/> {loading?'Analyzing...':label}
    </button>
  </div>
);

// ── Label ─────────────────────────────────────────────────────────────────────
const Lbl = ({children}) => <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:600,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>{children}</label>;

// ── Constants ─────────────────────────────────────────────────────────────────
const DOC_TYPES = [
  {id:'pitchDeck',    label:'Pitch Deck',             icon:'presentation', accept:'.pdf',          required:false, scoreLink:'Overall narrative',    hint:'Full venture pitch — problem, solution, market, team, financials'},
  {id:'financialModel',label:'Financial Model',        icon:'bar-chart-2',  accept:'.xlsx,.xls,.pdf',required:false, scoreLink:'Viability scores',     hint:'Revenue projections, unit economics, burn rate, P&L'},
  {id:'ipSummary',    label:'IP / Patent Summary',    icon:'shield',       accept:'.pdf',          required:false, scoreLink:'IP Defensibility',     hint:'Patent filings, trade secrets, IP ownership structure'},
  {id:'teamCVs',      label:'Founder & Team CVs',     icon:'users',        accept:'.pdf',          required:false, scoreLink:'Team Expertise',       hint:'CVs or LinkedIn exports for key leadership'},
  {id:'loi',          label:'Letters of Intent / MOUs',icon:'file-text',   accept:'.pdf',          required:false, scoreLink:'Customer Urgency',     hint:'Signed LOIs, MOUs, or customer validation letters'},
  {id:'techWhitepaper',label:'Technical White Paper',  icon:'cpu',          accept:'.pdf',          required:false, scoreLink:'TRL / Feasibility',    hint:'Technical architecture, R&D evidence, prototype specs'},
  {id:'esgReport',    label:'ESG / Impact Report',    icon:'leaf',         accept:'.pdf',          required:false, scoreLink:'ESG Gate Score',       hint:'Sustainability report, impact assessment, certifications'},
  {id:'marketResearch',label:'Market Research Report', icon:'trending-up',  accept:'.pdf',          required:false, scoreLink:'Desirability',         hint:'TAM/SAM/SOM analysis, competitive landscape, customer surveys'},
  {id:'legalDocs',    label:'Corporate Legal Docs',   icon:'scale',        accept:'.pdf',          required:false, scoreLink:'Governance Readiness', hint:'Articles of incorporation, cap table, shareholder agreements'},
];

const STEPS = [
  {id:'intake',   title:'Intake',    icon:'file-scan',    sec:'Foundation'},
  {id:'market',   title:'Market',    icon:'trending-up',  sec:'Foundation'},
  {id:'tech',     title:'Tech',      icon:'cpu',          sec:'Dimensions'},
  {id:'fin',      title:'Financial', icon:'bar-chart-2',  sec:'Dimensions'},
  {id:'risk',     title:'Risk',      icon:'shield-alert', sec:'Dimensions'},
  {id:'esg',      title:'ESG',       icon:'leaf',         sec:'Dimensions'},
  {id:'team',     title:'Team',      icon:'users',        sec:'Dimensions'},
  {id:'evidence', title:'Evidence',  icon:'paperclip',    sec:'Evidence'},
  {id:'engine',   title:'AI',        icon:'sparkles',     sec:'Verdict'},
  {id:'verdict',  title:'Verdict',   icon:'shield-check', sec:'Verdict'},
];

const PROXY = "https://starlabs-api-proxy.aziza-11a.workers.dev/api/analyze";

// ── Supabase config ───────────────────────────────────────────────────────────
// Replace these two values with your own from supabase.com → Project → Settings → API
const SB_URL  = "YOUR_SUPABASE_URL";   // e.g. https://xxxx.supabase.co
const SB_ANON = "YOUR_SUPABASE_ANON_KEY"; // public anon key — safe to expose

let _sb = null;
const getSB = () => {
  if(_sb) return _sb;
  if(SB_URL === "YOUR_SUPABASE_URL") return null; // not configured yet
  _sb = supabase.createClient(SB_URL, SB_ANON);
  return _sb;
};

const INIT_FORM = {
  techName:'',category:'DeepTech',sector:'',problem:'',solution:'',whyNow:'',
  unfairAdvantage:'',stage:'Concept',partnerName:'',assessorDate:'',
  // Legacy (kept for scoring compat)
  marketSize:6,marketTiming:6,competitiveMoat:5,
  revenueModel:'',tam:'',marketInsight:'',marketExpertAdj:0,
  // Lean Canvas blocks
  lcSegment:'',lcProblem:'',lcUVP:'',lcSolution:'',
  lcChannels:'',lcRevenue:'',lcCost:'',lcMetrics:'',lcAdvantage:'',
  lcMode:'consumer', // consumer | b2b | deeptech | b2g
  // Problem interviews (PPP - Problem)
  interviewCount:0,recognitionPct:0,topOnePct:0,workaroundPct:0,
  existingAlts:'',interviewNotes:'',
  // Pain scoring inputs
  painFrequency:3,painIntensity:3,painCostAlt:3,
  // Premium scoring inputs
  premiumTier:'none', // none|stated|anchored|vanwestendorp|smoketest|loi
  wtpAmount:'',designPartners:0,loiCount:0,pricingNotes:'',
  // Solution interviews
  solInterviewCount:0,uvpUnderstandPct:0,referralPct:0,prepayPct:0,
  mvpType:'none',solNotes:'',
  // PPP expert override
  pppOverrideEnabled:false,pppP1Override:0,pppP2Override:0,pppP3Override:0,
  trl:5,mrl:4,ipDefensibility:5,techScalability:6,integrationComplexity:5,
  techExpertAdj:0,techNotes:'',
  capitalIntensity:5,roiPotential:6,paybackPeriod:5,fundingStage:'Pre-Seed',
  burnRisk:4,revenueReadiness:5,financialNotes:'',
  regulatoryRisk:4,geopoliticalRisk:3,supplychainRisk:4,cybersecurityRisk:3,
  talentRisk:4,competitionRisk:5,riskNotes:'',
  environmentalImpact:5,socialImpact:5,governanceReadiness:6,regulatoryCompliance:6,
  sdgAlignment:4,esgNotes:'',
  teamExpertise:6,advisoryStrength:5,validationVelocity:5,scenarioResilience:5,
  partnershipNetwork:5,executionExpertAdj:0,expertNote:''
};

// ── App ───────────────────────────────────────────────────────────────────────
const App = () => {
  const [locked,setLocked]   = useState(true);
  const [keyVal,setKeyVal]   = useState('');
  const [keyErr,setKeyErr]   = useState(false);
  const [step,setStep]       = useState(0);
  const [form,setForm]       = useState(INIT_FORM);
  const [done,setDone]       = useState(new Set());
  const [sAI,setSAI]         = useState({});
  const [secLoading,setSecL] = useState(null);
  const [fullAI,setFullAI]   = useState('');
  const [fullLoad,setFullL]  = useState(false);
  const [docs,setDocs]       = useState({});
  const [docAI,setDocAI]     = useState('');
  const [docLoad,setDocL]    = useState(false);
  // ── Session / save-load state ─────────────────────────────────────────────
  const [screen,setScreen]       = useState('lock');  // lock | name | dashboard | assess
  const [userName,setUserName]   = useState('');
  const [nameInput,setNameInput] = useState('');
  const [nameErr,setNameErr]     = useState('');
  const [savedList,setSavedList] = useState([]);
  const [listLoading,setListL]   = useState(false);
  const [saveLoading,setSaveL]   = useState(false);
  const [saveMsg,setSaveMsg]     = useState('');
  const [currentId,setCurrentId] = useState(null); // Supabase row id of current assessment
  const mainRef = useRef(null);

  const hi = e => { const {name,value,type}=e.target; setForm(p=>({...p,[name]:type==='range'?parseFloat(value):value})); };

  // ── Scoring Engine ──────────────────────────────────────────────────────────
  const scores = useMemo(()=>{
    // ── PPP SCORING ENGINE (Ash Maurya / Running Lean) ─────────────────────
    // P1 — Problem validation (interview evidence)
    const ic = form.interviewCount;
    const rp = form.recognitionPct;   // 0-100
    const t1 = form.topOnePct;        // 0-100
    const wp = form.workaroundPct;    // 0-100
    const p1Raw =
      ic>=20&&rp>=85&&t1>=40 ? 9.5 :
      ic>=20&&rp>=70&&t1>=25 ? 8.0 :
      ic>=15&&rp>=70&&t1>=25 ? 7.5 :
      ic>=15&&rp>=60&&t1>=15 ? 6.5 :
      ic>=10&&rp>=50&&t1>=10 ? 5.5 :
      ic>=10&&rp>=30         ? 4.0 :
      ic>=5                  ? 3.0 :
      ic>=1                  ? 2.0 : 1.0;
    // Workaround boost: must-have signal
    const wBoost = wp>=60?0.5:wp>=30?0.2:0;
    const p1Score = clamp(p1Raw + wBoost, 0, 10);

    // P2 — Pain quantification (Frequency × Intensity × Cost)
    const painRaw = form.painFrequency * form.painIntensity * form.painCostAlt; // 1-125
    const p2Score =
      painRaw>=80 ? clamp(9+(painRaw-80)/45,9,10) :
      painRaw>=50 ? 7 + (painRaw-50)/30 :
      painRaw>=27 ? 5 + (painRaw-27)/23 :
      painRaw>=10 ? 3 + (painRaw-10)/17 : 1;

    // P3 — Premium (willingness-to-pay evidence tier)
    const premTierMap = {none:1,stated:3.5,anchored:6,vanwestendorp:7,smoketest:8,loi:9.5};
    const p3Base = premTierMap[form.premiumTier]||1;
    // LOI/design-partner boost
    const loiBoost = form.loiCount>=3?0.5:form.loiCount>=1?0.2:0;
    const dpBoost  = form.designPartners>=3?0.3:form.designPartners>=1?0.1:0;
    const p3Score  = clamp(p3Base+loiBoost+dpBoost, 0, 10);

    // PPP composite = min (bottleneck logic per Maurya)
    const pppRaw = Math.min(p1Score, p2Score, p3Score);

    // Apply expert override if enabled
    const p1Final = form.pppOverrideEnabled&&form.pppP1Override>0 ? form.pppP1Override : p1Score;
    const p2Final = form.pppOverrideEnabled&&form.pppP2Override>0 ? form.pppP2Override : p2Score;
    const p3Final = form.pppOverrideEnabled&&form.pppP3Override>0 ? form.pppP3Override : p3Score;
    const pppComposite = clamp(Math.min(p1Final,p2Final,p3Final), 0, 10);

    // Solution validation boost (post-PPP)
    const solBoost =
      form.uvpUnderstandPct>=80&&form.referralPct>=60&&form.prepayPct>=30 ? 0.8 :
      form.uvpUnderstandPct>=60&&form.referralPct>=40 ? 0.4 : 0;

    // Lean Canvas completeness score (9 blocks, each filled = 1 pt)
    const lcBlocks = [form.lcSegment,form.lcProblem,form.lcUVP,form.lcSolution,
      form.lcChannels,form.lcRevenue,form.lcCost,form.lcMetrics,form.lcAdvantage];
    const lcFilled = lcBlocks.filter(b=>b&&b.trim().length>15).length;
    const lcScore  = clamp((lcFilled/9)*10, 0, 10);

    // Final desirability = weighted blend
    // PPP 60% (evidence-based) + Market timing/moat 25% (contextual) + LC 15% (canvas quality)
    const contextual = clamp((form.marketSize*.4)+(form.marketTiming*.35)+(form.competitiveMoat*.25)+form.marketExpertAdj, 0, 10);
    const desirability = clamp(
      pppComposite*0.60 + contextual*0.25 + lcScore*0.15 + solBoost,
      0, 10
    );
    // Expose sub-scores for UI
    const pppScores = {p1:clamp(p1Final,0,10),p2:clamp(p2Score,0,10),p3:clamp(p3Score,0,10),composite:clamp(pppComposite,0,10),lc:clamp(lcScore,0,10)};
    const trlNorm = form.trl/9*10, gapPenalty = clamp(Math.abs(form.trl-form.mrl)*.4,0,2);
    const feasibility = clamp((trlNorm*.30)+(form.ipDefensibility*.25)+(form.techScalability*.20)+((10-form.integrationComplexity)*.15)+(form.mrl*.10)-gapPenalty+form.techExpertAdj,0,10);
    const hasRM = form.revenueModel?0:-0.5;
    const viability = clamp((form.roiPotential*.30)+(form.revenueReadiness*.25)+((10-form.capitalIntensity)*.20)+((10-form.burnRisk)*.15)+(form.paybackPeriod*.10)+hasRM,0,10);
    const scalability = clamp((form.teamExpertise*.30)+(form.advisoryStrength*.15)+(form.validationVelocity*.20)+(form.scenarioResilience*.20)+(form.partnershipNetwork*.15)+form.executionExpertAdj,0,10);
    const avgRisk = (form.regulatoryRisk+form.geopoliticalRisk+form.supplychainRisk+form.cybersecurityRisk+form.talentRisk+form.competitionRisk)/6;
    const riskScore = clamp(10-avgRisk,0,10);
    const esgScore = clamp((form.environmentalImpact*.25)+(form.socialImpact*.20)+(form.governanceReadiness*.25)+(form.regulatoryCompliance*.20)+(form.sdgAlignment*.10),0,10);
    const esgPen = esgScore<4?-0.8:0;
    const confidence = clamp((riskScore*.65)+(esgScore*.35)+esgPen,0,10);
    const raw = clamp(desirability*.28+feasibility*.22+viability*.18+scalability*.17+confidence*.15,0,10);
    const filledDims = [form.problem,form.solution,form.whyNow,form.unfairAdvantage,form.revenueModel,form.tam,form.techNotes,form.financialNotes,form.riskNotes,form.esgNotes,form.lcSegment,form.lcProblem,form.interviewNotes,form.pricingNotes].filter(v=>v&&v.trim().length>10).length;
    const assumptionConf = Math.round((filledDims/10)*100);
    const kills=[];
    if(form.marketSize<=2) kills.push({code:'K1',label:'TAM KILL',reason:'Market too small — no path to venture-scale returns.'});
    if(pppComposite<=2&&ic>=5) kills.push({code:'K2',label:'PPP KILL',reason:'PPP composite ≤2 with '+ic+' interviews — problem/pain/premium all critically weak.'});
    if(form.teamExpertise<=2) kills.push({code:'K3',label:'TEAM KILL',reason:'Leadership gap — execution risk is terminal.'});
    if(form.capitalIntensity>=9) kills.push({code:'K4',label:'CAPITAL KILL',reason:'Capital intensity unsustainable.'});
    if(form.regulatoryRisk>=9) kills.push({code:'K5',label:'REGULATORY KILL',reason:'Regulatory blocker — prohibitive compliance risk.'});
    if(form.trl<=2&&form.mrl>=7) kills.push({code:'K6',label:'READINESS KILL',reason:'TRL/MRL gap critical — market-pushing unproven tech.'});
    if(esgScore<3) kills.push({code:'K7',label:'ESG KILL',reason:'ESG posture below sovereign capital threshold.'});
    if(form.burnRisk>=9) kills.push({code:'K8',label:'BURN KILL',reason:'Burn rate unsustainable before first revenue.'});
    const flags=[];
    // PPP-specific kills and flags
    if(pppComposite>=1&&ic>=10&&parseFloat(fmt(pppComposite))<4) kills.push({code:'K9',label:'PPP INVALIDATED',reason:'PPP composite '+fmt(pppComposite)+'/10 with '+ic+' interviews — problem/pain/premium critically weak per Ash Maurya thresholds.'});
    if(form.marketTiming<=3) flags.push('Timing risk: market may not be ready yet.');
    if(form.competitiveMoat<=3) flags.push('Weak moat: differentiation insufficient.');
    if(Math.abs(form.trl-form.mrl)>=4) flags.push('TRL/MRL gap of '+Math.abs(form.trl-form.mrl)+' — commercialisation lag risk.');
    if(form.advisoryStrength<=3) flags.push('Thin advisory bench — domain credibility gap.');
    if(form.sdgAlignment<=3) flags.push('Low SDG alignment — sovereign mandate risk.');
    if(form.validationVelocity<=3) flags.push('Slow validation velocity — pivot capacity inadequate.');
    if(!form.revenueModel) flags.push('Revenue model undefined — unit economics unvalidated.');
    if(form.interviewCount<10) flags.push('Fewer than 10 problem interviews — PPP scores below minimum validation threshold.');
    if(form.interviewCount>=10&&form.recognitionPct<50) flags.push('Problem recognition below 50% — market may not exist as hypothesized.');
    if(form.premiumTier==='none'&&form.interviewCount>=10) flags.push('No pricing evidence — premium (P3) entirely unvalidated.');
    if(form.interviewCount>=15&&form.workaroundPct<30) flags.push('Low workaround rate — may be a "nice-to-have" problem, not must-have.');
    const strengths=[];
    if(pppComposite>=8) strengths.push('PPP composite '+fmt(pppComposite)+'/10 — strong problem/pain/premium validation.');
    if(form.interviewCount>=20&&form.recognitionPct>=80) strengths.push('Strong problem interviews: '+form.interviewCount+' interviews, '+form.recognitionPct+'% recognition — validated per Running Lean thresholds.');
    if(form.loiCount>=3) strengths.push(form.loiCount+' signed LOIs — premium validation confirmed, investor-grade evidence.');
    if(form.designPartners>=3) strengths.push(form.designPartners+' committed design partners — strong early adoption signal.');
    if(form.workaroundPct>=60) strengths.push('Workaround rate '+form.workaroundPct+'% — must-have problem confirmed (Maurya threshold: ≥60%).');
    if(form.ipDefensibility>=8) strengths.push('Strong IP moat — defensible technology position.');
    if(form.teamExpertise>=8) strengths.push('Exceptional founder depth — execution confidence high.');
    if(form.competitiveMoat>=8) strengths.push('Deep competitive moat — market position well defended.');
    if(esgScore>=7.5) strengths.push('Strong ESG posture — sovereign capital eligible.');
    if(form.roiPotential>=8) strengths.push('High ROI potential — return profile attractive.');
    if(form.validationVelocity>=8) strengths.push('Fast validation velocity — lean execution confirmed.');
    const composite = kills.length>0?Math.min(raw,4.5):raw;
    const verdict =
      composite>=8?{status:'SPINOUT READY', color:'#34d399',grade:'A',label:'High Investment Grade — Proceed to Spinout Gate'}:
      composite>=6.5?{status:'ACCELERATE',  color:'#c9a84c',grade:'B',label:'Strong Pipeline — Fast-Track Incubation Recommended'}:
      composite>=4.5?{status:'INCUBATE',    color:'#f59e0b',grade:'C',label:'Foundry Candidate — De-risk Before Capital Commitment'}:
      composite>=3?{status:'PIVOT REQUIRED',color:'#f97316',grade:'D',label:'Core assumptions failing — Mandatory pivot or redesign'}:
                   {status:'TERMINATE',    color:'#f87171',grade:'F',label:'Kill switches triggered — Do not deploy capital'};
    return {desirability:fmt(desirability),feasibility:fmt(feasibility),viability:fmt(viability),scalability:fmt(scalability),confidence:fmt(confidence),risk:fmt(riskScore),esg:fmt(esgScore),composite:fmt(composite),assumptionConf,kills,flags,strengths,verdict,fatalFlaw:kills.length>0?kills[0].reason:null,pppScores:{p1:fmt(pppScores.p1),p2:fmt(pppScores.p2),p3:fmt(pppScores.p3),composite:fmt(pppScores.composite),lc:fmt(pppScores.lc)}};
  },[form]);

  const radarData=[{label:'Desirability',value:parseFloat(scores.desirability)},{label:'Feasibility',value:parseFloat(scores.feasibility)},{label:'Viability',value:parseFloat(scores.viability)},{label:'Scalability',value:parseFloat(scores.scalability)},{label:'Confidence',value:parseFloat(scores.confidence)},{label:'ESG',value:parseFloat(scores.esg)}];

  // ── Proxy call ──────────────────────────────────────────────────────────────
  const SYS = `You are the Chief Diligence Officer at Star Labs, a deep-tech corporate venture studio in the Gulf and global emerging markets. You have 20 years of venture diligence experience across 400+ deals. You draw on real historical startup outcomes, sector failure rates, and empirical data. You NEVER summarize scores back to the assessor. Every response must contain at least one specific historical reference, comparable company, or empirical statistic directly relevant to the venture. Be blunt, precise, institutionally credible. Plain prose paragraphs only — no bullets, no headers, no markdown. Always write complete sentences and complete paragraphs — never truncate mid-sentence. Each paragraph must end with a full stop. Aim for 2-3 focused paragraphs of 150-200 words each — quality over length. Complete your thought fully before ending.`;

  const callProxy = useCallback(async(prompt,onChunk,maxTok=3000)=>{
    const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemPrompt:SYS,userPrompt:prompt,maxTokens:maxTok})});
    if(!res.ok){const t=await res.text();throw new Error(`Proxy ${res.status}: ${t.substring(0,200)}`);}
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.text) throw new Error('Empty response from proxy.');
    for(let i=0,w=data.text.split(' ');i<w.length;i++){onChunk((i===0?'':' ')+w[i]);await new Promise(r=>setTimeout(r,14));}
  },[]);

  const runSection = useCallback(async(key,prompt)=>{
    setSecL(key); setSAI(p=>({...p,[key]:''}));
    try{ await callProxy(prompt,c=>setSAI(p=>({...p,[key]:(p[key]||'')+c}))); }
    catch(e){ setSAI(p=>({...p,[key]:`Error: ${e.message}`})); }
    finally{ setSecL(null); }
  },[callProxy]);

  const runFull = useCallback(async()=>{
    if(!form.techName){alert('Enter Asset Identifier first.');return;}
    setFullL(true); setFullAI('');
    const docCtx = Object.keys(docs).length===0
      ? 'NO DOCUMENTS UPLOADED — scores are self-assessed only'
      : 'UPLOADED: '+Object.entries(docs).filter(([_,d])=>d).map(([id,d])=>{ const dt=DOC_TYPES.find(t=>t.id===id); return (dt?dt.label:id)+':"'+d.name+'"'; }).join('; ');
    const prompt = `STAR LABS — EMERGING ZONE PROTOCOL
Full Institutional Diligence Report

ASSET: ${form.techName} | ${form.category} | ${form.sector||'N/A'} | Stage: ${form.stage}
Problem: ${form.problem||'N/A'}
Solution: ${form.solution||'N/A'}
Why Now: ${form.whyNow||'N/A'}
Advantage: ${form.unfairAdvantage||'N/A'}
Revenue Model: ${form.revenueModel||'UNDEFINED'}

PILLAR SCORES: Desirability=${scores.desirability} | Feasibility=${scores.feasibility} | Viability=${scores.viability} | Scalability=${scores.scalability} | Confidence=${scores.confidence} | ESG=${scores.esg}
Composite EZP=${scores.composite}/10 | Gate: ${scores.verdict.status} (Grade ${scores.verdict.grade})
Assumption Confidence: ${scores.assumptionConf}%
Kill Switches: ${scores.kills.length===0?'None':scores.kills.map(k=>k.code+':'+k.label).join(', ')}
Red Flags: ${scores.flags.join('; ')||'None'}
Strengths: ${scores.strengths.join('; ')||'None'}
Evidence: ${docCtx}
${docAI?'Prior Score Audit: '+docAI.substring(0,300)+'...':'No prior audit'}

Write a rigorous 6-paragraph institutional diligence verdict. Each paragraph must contain specific historical references, comparable ventures, or empirical statistics.
Para 1 — DESIRABILITY: Is the problem genuinely urgent at scale? Name a comparable venture that validated or invalidated a similar problem thesis.
Para 2 — FEASIBILITY: Benchmark the TRL and IP position. What is the realistic time and capital to deployment based on historical analogues?
Para 3 — FINANCIAL VIABILITY: Compare financial profile to 2 real ventures. What specific metric is the leading indicator of failure for this model?
Para 4 — TEAM AND SCALABILITY: Reference the empirical relationship between founder-market fit at this level and exit outcomes.
Para 5 — RISK AND ESG: Identify the single most dangerous risk interaction. Cite a historical case. What ESG gap most threatens sovereign capital access?
Para 6 — GATE VERDICT: State the decision (${scores.verdict.status}, Grade ${scores.verdict.grade}) with precise justification. List exactly 3 specific 90-day conditions that must be met.
Plain prose only. No bullets. No markdown. Be ruthlessly precise.`;
    try{ await callProxy(prompt,c=>setFullAI(p=>p+c),6000); }
    catch(e){ setFullAI(`Error: ${e.message}`); }
    finally{ setFullL(false); }
  },[form,scores,docs,docAI,callProxy]);

  const runDocAudit = useCallback(async()=>{
    const up=Object.entries(docs).filter(([_,d])=>d&&d.base64);
    if(!up.length){alert('Upload at least one document first.');return;}
    setDocL(true); setDocAI('');
    const upList=up.map(([id,d])=>{ const dt=DOC_TYPES.find(t=>t.id===id); return '- '+(dt?dt.label:id)+':"'+d.name+'" ('+d.size+') validates:'+( dt?dt.scoreLink:'general'); }).join('\n');
    const missing=DOC_TYPES.filter(dt=>!docs[dt.id]).map(dt=>'- '+dt.label+' (validates '+dt.scoreLink+')').join('\n');
    const prompt = `STAR LABS — AI SCORE AUDIT
Asset: ${form.techName||'N/A'} | ${form.category} | Stage: ${form.stage}

UPLOADED (${up.length}/${DOC_TYPES.length}):
${upList}

NOT UPLOADED:
${missing||'None — full package'}

SELF-ASSESSED SCORES:
PPP Composite:${scores.pppScores?.composite||'?'} (P1:${scores.pppScores?.p1||'?'} P2:${scores.pppScores?.p2||'?'} P3:${scores.pppScores?.p3||'?'}) | Interviews:${form.interviewCount} | LOIs:${form.loiCount} | IP Defensibility:${form.ipDefensibility} | TRL:${form.trl}/9 | MRL:${form.mrl}
ROI:${form.roiPotential} | Revenue Readiness:${form.revenueReadiness} | Capital Intensity:${form.capitalIntensity} | Burn Risk:${form.burnRisk}
Team Expertise:${form.teamExpertise} | Advisory:${form.advisoryStrength} | Governance:${form.governanceReadiness} | ESG:${scores.esg}
Composite EZP: ${scores.composite}/10

Para 1 — EVIDENCE COMPLETENESS: What scores are now evidence-backed vs self-assessed only?
Para 2 — SCORE INTEGRITY: Flag mismatches between document names and claimed scores. Be specific and ruthless.
Para 3 — ADJUSTED SCORES: For inflated scores, state: "[Score]: Claimed X/10 → Suggested Y/10 — Reason:"
Para 4 — MISSING EVIDENCE RISK: What gap represents highest investment risk?
Para 5 — ACTION PLAN: What must be provided before capital deployment, ranked by importance?
Plain prose for paras 1,2,4. Score format for para 3. Short lines for para 5.`;
    try{ await callProxy(prompt,c=>setDocAI(p=>p+c),3000); }
    catch(e){ setDocAI(`Error: ${e.message}`); }
    finally{ setDocL(false); }
  },[docs,form,scores,callProxy]);

  // ── Navigation ──────────────────────────────────────────────────────────────
  // ── Save/Load helpers ────────────────────────────────────────────────────────
  const buildPayload = () => ({
    user_name:   userName,
    tech_name:   form.techName || 'Untitled',
    stage:       form.stage,
    category:    form.category,
    composite:   parseFloat(scores.composite),
    verdict:     scores.verdict.status,
    grade:       scores.verdict.grade,
    form_data:   JSON.stringify(form),
    ai_sections: JSON.stringify(sAI),
    full_ai:     fullAI,
    doc_ai:      docAI,
    doc_names:   JSON.stringify(Object.entries(docs).reduce((a,[k,v])=>{if(v)a[k]=v.name;return a;},{})),
    updated_at:  new Date().toISOString(),
  });

  const saveAssessment = useCallback(async()=>{
    const sb = getSB();
    if(!sb){ setSaveMsg('⚠ Supabase not configured — see setup guide.'); setTimeout(()=>setSaveMsg(''),4000); return; }
    if(!form.techName){ setSaveMsg('⚠ Enter an Asset Identifier first.'); setTimeout(()=>setSaveMsg(''),3000); return; }
    setSaveL(true); setSaveMsg('');
    try {
      const payload = buildPayload();
      let res;
      if(currentId) {
        // Update existing
        res = await sb.from('assessments').update(payload).eq('id', currentId).select().single();
      } else {
        // Insert new
        res = await sb.from('assessments').insert(payload).select().single();
      }
      if(res.error) throw new Error(res.error.message);
      setCurrentId(res.data.id);
      setSaveMsg('✓ Saved — ' + new Date().toLocaleTimeString());
    } catch(e) {
      setSaveMsg('✗ Save failed: ' + e.message);
    } finally {
      setSaveL(false);
      setTimeout(()=>setSaveMsg(''),4000);
    }
  },[form,sAI,fullAI,docAI,docs,userName,currentId,scores]);

  const loadAssessment = useCallback((row)=>{
    try {
      const f = JSON.parse(row.form_data);
      const ai = JSON.parse(row.ai_sections || '{}');
      setForm({...INIT_FORM,...f});
      setSAI(ai);
      setFullAI(row.full_ai || '');
      setDocAI(row.doc_ai || '');
      setCurrentId(row.id);
      setStep(0);
      setDone(new Set());
      setScreen('assess');
      mainRef.current&&mainRef.current.scrollTo({top:0,behavior:'smooth'});
    } catch(e) {
      alert('Failed to load assessment: ' + e.message);
    }
  },[]);

  const loadList = useCallback(async(name)=>{
    const sb = getSB();
    if(!sb){ setSavedList([]); return; }
    setListL(true);
    try {
      const {data,error} = await sb.from('assessments')
        .select('id,tech_name,stage,category,composite,verdict,grade,updated_at')
        .eq('user_name', name)
        .order('updated_at', {ascending:false})
        .limit(50);
      if(error) throw new Error(error.message);
      setSavedList(data||[]);
    } catch(e) {
      setSavedList([]);
    } finally {
      setListL(false);
    }
  },[]);

  const deleteAssessment = useCallback(async(id)=>{
    if(!window.confirm('Delete this assessment? This cannot be undone.')) return;
    const sb = getSB();
    if(!sb) return;
    await sb.from('assessments').delete().eq('id',id).eq('user_name',userName);
    setSavedList(p=>p.filter(r=>r.id!==id));
    if(currentId===id){ setCurrentId(null); }
  },[userName,currentId]);

  const markDone = ()=>setDone(p=>new Set([...p,step]));
  const goTo = useCallback(i=>{markDone();setStep(i);mainRef.current&&mainRef.current.scrollTo({top:0,behavior:'smooth'});},[step]);

TAM: ${form.marketSize}/10 | Timing: ${form.marketTiming}/10 | Moat: ${form.competitiveMoat}/10 | Revenue Model: ${form.revenueModel||'Undefined'}

Do NOT repeat or summarize these scores. Write three analytical paragraphs:

Paragraph 1 — PPP VERDICT: Apply Ash Maurya's bottleneck logic — the weakest P determines the composite. Which P is the rate-limiter here and why? For the interview count of ${form.interviewCount} and recognition rate of ${form.recognitionPct}%, how does this compare to the 10/20/30 rule validation thresholds? Name 2 ventures in ${form.category} that validated or failed at the same stage of evidence maturity. What is the Mom Test compliance assessment based on the interview notes provided?

Paragraph 3 — PREMIUM RISK AND MARKET TIMING: The evidence tier is "${premTierLabels[form.premiumTier]||'none'}" — what does this imply about WTP confidence? In ${form.category} with a ${form.lcMode} model, what is the historical failure rate due to premium gaps (pricing too low, wrong buyer, no budget)? Given market timing ${form.marketTiming}/10 and the TAM of ${form.tam||'unspecified'}, what is the realistic time-to-first-paying-customer based on comparable ventures in ${form.sector||'this sector'}?`;
  };

  const buildTechPrompt = () =>
    `STAR LABS — TECHNOLOGY FEASIBILITY\nAsset: ${form.techName} | ${form.category}\nTRL: ${form.trl}/9 | MRL: ${form.mrl}/10 | Gap: ${Math.abs(form.trl-form.mrl)} pts | IP: ${form.ipDefensibility}/10 | Scalability: ${form.techScalability}/10\nNotes: ${form.techNotes||'None'}\n\nDo NOT repeat scores. Write two analytical paragraphs:\n\nParagraph 1 — TRL DEATH VALLEY: Studies show 67% of deep-tech spinouts stalling at TRL 4-5 never reach commercial deployment. Compare to 2-3 ventures in ${form.category} that started at TRL ${form.trl}: which crossed the valley and how long did it take? The TRL-MRL gap of ${Math.abs(form.trl-form.mrl)} is ${Math.abs(form.trl-form.mrl)<=2?'healthy':'dangerous — what does empirical data say about ventures with this gap in '+form.category}?\n\nParagraph 2 — IP MOAT STRESS TEST: In ${form.category}, patent protection averages 18 months before a competitor finds a design-around. What IP strategy is implied by a score of ${form.ipDefensibility}/10? Name a specific venture that overestimated its IP moat in this space and the consequence.`;

  const buildFinPrompt = () =>
    `STAR LABS — FINANCIAL VIABILITY\nAsset: ${form.techName} | Stage: ${form.fundingStage}\nROI: ${form.roiPotential}/10 | Revenue Readiness: ${form.revenueReadiness}/10 | Capital Intensity: ${form.capitalIntensity}/10 | Burn: ${form.burnRisk}/10\nModel: ${form.revenueModel||'Undefined'} | Notes: ${form.financialNotes||'None'}\n\nDo NOT repeat scores. Write two analytical paragraphs:\n\nParagraph 1 — CAPITAL EFFICIENCY BENCHMARK: Deep-tech ventures with capital intensity above 7/10 at pre-Series A have 73% higher failure rates per Dealroom data. Compare to 2-3 real ventures in ${form.category} at ${form.fundingStage} stage. For the ${form.revenueModel||'undefined'} model, what are typical gross margins, CAC payback, and capital to breakeven?\n\nParagraph 2 — RUNWAY SURVIVAL PROBABILITY: The median deep-tech venture at ${form.fundingStage} has 14-18 months runway. Given burn risk ${form.burnRisk}/10 and revenue readiness ${form.revenueReadiness}/10, what is the realistic probability of reaching the next funding milestone? What specific metric must be hit, and what did comparable ventures require at this stage?`;

  const buildEsgPrompt = () =>
    `STAR LABS — ESG AND SOVEREIGN CAPITAL GATE\nAsset: ${form.techName} | ${form.category}\nEnvironmental: ${form.environmentalImpact}/10 | Social: ${form.socialImpact}/10 | Governance: ${form.governanceReadiness}/10 | Compliance: ${form.regulatoryCompliance}/10 | SDG: ${form.sdgAlignment}/10\nNotes: ${form.esgNotes||'None'}\n\nDo NOT repeat scores. Write two analytical paragraphs:\n\nParagraph 1 — GCC SOVEREIGN CAPITAL ELIGIBILITY: PIF, Mubadala, ADIA, and QIA have explicit ESG thresholds. Assess this venture's realistic eligibility. What specific frameworks (TCFD, GRI, UAE Net Zero 2050, Saudi Vision 2030) must be adopted? Name 2-3 ventures in ${form.category} that successfully accessed GCC sovereign capital through ESG alignment — what did they do?\n\nParagraph 2 — ESG AS COMPETITIVE MOAT: MSCI and McKinsey research shows ESG-strong ventures command 10-15% valuation premiums and 20% lower cost of capital. What are the 3 most common governance failures causing deep-tech spinouts to lose institutional backing at due diligence? What minimum governance infrastructure is needed before Series A?`;

  const buildTeamPrompt = () =>
    `STAR LABS — EXECUTION DNA\nAsset: ${form.techName} | ${form.category} | Stage: ${form.stage}\nFounder Depth: ${form.teamExpertise}/10 | Advisory: ${form.advisoryStrength}/10 | Velocity: ${form.validationVelocity}/10 | Resilience: ${form.scenarioResilience}/10 | Network: ${form.partnershipNetwork}/10\n\nDo NOT repeat scores. Write two analytical paragraphs:\n\nParagraph 1 — FOUNDER-MARKET FIT: First Round Capital's analysis of 300 seed investments found teams with deep domain expertise outperform generalists by 3.5x. At domain depth ${form.teamExpertise}/10, what performance decile is this? Name 2-3 founders in ${form.category} at a similar level — one who succeeded and one who failed. What was the pivotal capability difference? What is the realistic runway to first institutional close with this team profile?\n\nParagraph 2 — VALIDATION VELOCITY: YC cohort analysis shows top-quartile iteration speed ventures are 2.4x more likely to reach PMF within 18 months. What does velocity ${form.validationVelocity}/10 imply about this team's learning loop? What are the 2-3 most critical hypotheses to validate in the next 90 days? Who — by role — is missing from the advisory bench to unlock the highest-value doors in ${form.category}?`;

  const buildRiskPrompt = () => {

    const maxV=Math.max(...vals), topLbl=lbls[vals.indexOf(maxV)];
    return `STAR LABS — MULTI-VECTOR RISK ANALYSIS\nAsset: ${form.techName} | ${form.category} | Sector: ${form.sector||'N/A'}\nRegulatory: ${form.regulatoryRisk}/10 | Geopolitical: ${form.geopoliticalRisk}/10 | Supply Chain: ${form.supplychainRisk}/10 | Cybersecurity: ${form.cybersecurityRisk}/10 | Talent: ${form.talentRisk}/10 | Competition: ${form.competitionRisk}/10\nHighest vector: ${topLbl} at ${maxV}/10\n\nDo NOT list or summarize these scores. Write two analytical paragraphs:\n\nParagraph 1 — HISTORICAL RISK-ADJUSTED SUCCESS RATE: For ventures in ${form.category} in Gulf/MENA with this risk configuration, what does historical data show? Name 2 ventures that faced ${topLbl} risk: one that navigated it successfully and one that did not. What was the difference? What percentage of comparable ventures at ${form.stage} reach successful exit or sustainable revenue, and what is the typical timeline?\n\nParagraph 2 — RISK COMPOUNDING: Identify the most dangerous risk interaction in this profile. What is the realistic worst-case scenario if the two highest risks materialise simultaneously in 18 months? Name a historical case of this compounding in ${form.category}. What is the single mitigation action that addresses the most risk per dollar, and what does implementation require?`;

  // ── Centered page shell ────────────────────────────────────────────────────
  const CenterPage = ({children}) => (

          <p className="mono" style={{fontSize:'var(--fs-xs)',letterSpacing:'.25em',color:'var(--gold)',opacity:.9}}>EMERGING ZONE PROTOCOL · 2026</p>

  if(screen==='lock') return (

  if(screen==='name') return (

        <button onClick={()=>{
          const n=nameInput.trim();
          if(!n){setNameErr('Please enter your name.');return;}

        }} className="syne" style={{width:'100%',padding:'1rem',borderRadius:'.9rem',fontWeight:900,fontSize:'var(--fs-md)',textTransform:'uppercase',letterSpacing:'.15em',border:'none',color:'#05060a',cursor:'pointer',background:'var(--gold)'}}>

        <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
          <Logo h={44}/>
          <div style={{borderLeft:'1px solid rgba(255,255,255,.08)',paddingLeft:'1rem'}}>

          </div>

          <Icon name="plus" size={13}/> New Assessment
        </button>
      </header>

      <div style={{maxWidth:900,margin:'0 auto',padding:'2rem 1.25rem'}}>

              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>{label}</p>
            </div>
          ))}
        </div>

        <div className="card" style={{padding:'1.25rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>

              <Icon name="refresh-cw" size={11}/> Refresh

          {listLoading?(
            <div style={{textAlign:'center',padding:'3rem',color:'var(--text3)'}}>

          ):savedList.length===0?(

              <div style={{display:'flex',justifyContent:'center',marginBottom:12}}><Icon name="inbox" size={32} color="var(--muted)"/></div>
              <p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'var(--text3)',marginBottom:6}}>No saved assessments</p>
              <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',marginBottom:'1.25rem'}}>{getSB()?'Start a new assessment and save it to see it here.':'Configure Supabase to enable saving — see setup guide.'}</p>
              <button onClick={()=>{setScreen('assess');setCurrentId(null);}}
                className="syne" style={{padding:'.6rem 1.25rem',borderRadius:'.75rem',fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer'}}>
                Start New Assessment →

                const saved = new Date(row.updated_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
                return (
                  <div key={row.id} style={{display:'flex',alignItems:'center',gap:12,padding:'1rem',background:'rgba(255,255,255,.02)',border:'1px solid rgba(255,255,255,.06)',borderRadius:'.75rem',transition:'all .15s',cursor:'pointer'}}
                    onClick={()=>loadAssessment(row)}
                    onMouseOver={e=>e.currentTarget.style.borderColor='var(--gold-border)'}
                    onMouseOut={e=>e.currentTarget.style.borderColor='rgba(255,255,255,.06)'}>
                    {/* Grade badge */}

                    <button onClick={e=>{e.stopPropagation();deleteAssessment(row.id);}}

                      <Icon name="trash-2" size={12}/>
                    </button>
                  </div>
                );
              })}

            </p>

);

-- Allow anyone with the anon key to read/write their own rows
alter table assessments enable row level security;
create policy "users manage own" on assessments

            <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',marginTop:12}}>Then copy your <strong>Project URL</strong> and <strong>anon key</strong> from Settings → API and paste them into <code style={{color:'var(--gold)'}}>SB_URL</code> and <code style={{color:'var(--gold)'}}>SB_ANON</code> at the top of index.html.</p>

  const sections=[...new Set(STEPS.map(s=>s.sec))];

        <div>

          <p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Establish venture geometry before capital allocation.</p>
        </div>
        <div className="card-info" style={{padding:'.9rem',display:'flex',gap:10,alignItems:'flex-start'}}>
          <span style={{fontSize:'1rem',flexShrink:0}}>🔬</span>
          <div>
            <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#60a5fa',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>LeanSpark Stress-Test Active</p>
            <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6}}>8 binary Kill Switches · 5 Pillar scoring · Assumption Confidence tracking · Real-time Red Flags &amp; Strengths. Fill all text fields to maximise confidence score.</p>

          </div>
