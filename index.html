<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Alpha-2 Strategic Decision Intelligence</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #020408;
            --surface: rgba(13, 17, 23, 0.7);
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep); 
            color: #f1f5f9; 
            margin: 0; 
            overflow-x: hidden; 
        }

        .glass-panel { 
            background: var(--surface); 
            backdrop-filter: blur(24px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .command-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
        }

        /* 2026 Range Slider Style */
        input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            margin-top: -7px; 
            background: #fff; 
            height: 20px; 
            width: 20px; 
            border-radius: 50%; 
            border: 4px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .glow-bg {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
            pointer-events: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(34, 211, 238, 0.02) 51%, transparent 100%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="scanline">
    <div class="glow-bg" style="top: -200px; right: -200px;"></div>
    <div class="glow-bg" style="bottom: -200px; left: -200px;"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ className = "w-full h-full" }) => {
            const [imgError, setImgError] = useState(false);
            if (imgError) return <span className="font-black text-white italic">SL</span>;
            return <img src="./logo.png" alt="Star Labs" className={`${className} object-contain`} onError={() => setImgError(true)} />;
        };

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', earlyAdopters: '',
                uvp: '', unfairAdvantage: '', whyNow: '', revenueStreams: '', costStructure: '',
                trl: 4, mrl: 3, ipDefensibility: 6, regulatoryTailwinds: 5, teamExpertise: 7,
                marketSize: 6, capitalIntensity: 4, customerUrgency: 6,
                scenarioStability: 5, validationVelocity: 5
            });

            const steps = [
                { id: 'intake', title: 'Intake', icon: 'binary' },
                { id: 'market', title: 'Timing', icon: 'zap' },
                { id: 'canvas', title: 'Lean High-Fi', icon: 'layout-template' },
                { id: 'readiness', title: 'TRL x MRL', icon: 'layers' },
                { id: 'radar', title: 'Akaio Radar', icon: 'radar' },
                { id: 'spinout', title: 'Spinout Readiness', icon: 'rocket' },
                { id: 'report', title: 'Verdict', icon: 'shield-check' }
            ];

            const analysis = useMemo(() => {
                const techScore = (formData.trl * 0.6) + (formData.ipDefensibility * 0.4);
                const marketScore = (formData.mrl * 0.4) + (formData.customerUrgency * 0.4) + (formData.marketSize * 0.2);
                const riskHedge = (formData.scenarioStability * 0.7) + (formData.validationVelocity * 0.3);
                
                const score = ((techScore * 0.35) + (marketScore * 0.45) + (riskHedge * 0.2)).toFixed(1);
                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + (10 - formData.capitalIntensity) * 0.3).toFixed(1);

                let verdict = { status: 'INCUBATE', color: 'text-cyan-400', border: 'border-cyan-500/30', glow: 'shadow-cyan-500/20', advice: "Strong internal R&D potential. Maintain as stealth-mode asset until TRL 6 is reached." };
                if (score >= 8.2) verdict = { status: 'SPINOUT READY', color: 'text-emerald-400', border: 'border-emerald-500/30', glow: 'shadow-emerald-500/20', advice: "Exceptional market-timing and technical moat. Authorize immediate corporate spinout and Seed A round." };
                else if (score < 5.5) verdict = { status: 'TERMINATE', color: 'text-rose-400', border: 'border-rose-500/30', glow: 'shadow-rose-500/20', advice: "High assumption risk with low capital efficiency. Archive project to preserve Star Labs treasury." };

                return { score, spinoutIndex, ...verdict };
            }, [formData]);

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'range' ? parseInt(value) : value }));
            };

            const unlock = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("AUTH_FAIL: INVALID_ENCRYPTION_KEY");
            };

            if (isLocked) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="max-w-md w-full glass-panel p-12 rounded-[2.5rem] text-center">
                        <div className="w-20 h-20 mx-auto mb-8 bg-black/40 rounded-3xl p-4 flex items-center justify-center border border-white/10">
                            <Logo />
                        </div>
                        <h1 className="text-2xl font-extrabold text-white tracking-tighter uppercase italic mb-1">Terminal Access</h1>
                        <p className="text-[10px] font-bold text-slate-500 tracking-[0.4em] mb-10">STAR LABS // LEVEL 4 CLEARANCE</p>
                        <form onSubmit={unlock} className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="PASSKEY" 
                                value={accessKey}
                                onChange={(e) => setAccessKey(e.target.value)}
                                className="w-full command-input rounded-2xl px-6 py-5 text-center text-cyan-400 tracking-[0.8em] font-mono outline-none"
                            />
                            <button className="w-full py-5 bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold uppercase tracking-widest rounded-2xl transition-all active:scale-95 shadow-lg shadow-cyan-900/20">Decrypt Access</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto py-10 px-6">
                    {/* Professional Header */}
                    <header className="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8 pb-10 border-b border-white/10">
                        <div className="flex items-center gap-6">
                            <div className="w-16 h-16 bg-white/5 p-3 rounded-2xl border border-white/10">
                                <Logo />
                            </div>
                            <div>
                                <h1 className="text-3xl font-extrabold text-white italic tracking-tighter uppercase">Alpha-2 <span className="text-cyan-400">Intelligence</span></h1>
                                <p className="text-slate-500 text-[10px] font-bold tracking-[0.5em] uppercase mt-1">GIMI x LeanSpark Unified Framework</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-10">
                            <div className="text-right">
                                <div className="flex items-center gap-2 justify-end">
                                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">System Operational</span>
                                </div>
                                <p className="text-[10px] font-bold text-cyan-500 tracking-widest mt-1 uppercase italic">Authorized Investor View</p>
                            </div>
                            <button onClick={() => window.print()} className="px-6 py-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-[10px] font-bold uppercase tracking-widest flex items-center gap-2">
                                <Icon name="file-text" size={14} /> Export Intel
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-12">
                        {/* Interactive Nav */}
                        <aside className="lg:col-span-3 space-y-3 no-print">
                            {steps.map((s, i) => (
                                <button 
                                    key={s.id} 
                                    onClick={() => setStep(i)}
                                    className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-[11px] font-extrabold uppercase tracking-widest transition-all border ${step === i ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-lg shadow-cyan-500/5' : 'bg-transparent border-transparent text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}
                                >
                                    <Icon name={s.icon} size={16} className={step === i ? "text-cyan-400" : "text-slate-600"} />
                                    {s.title}
                                </button>
                            ))}
                        </aside>

                        {/* Main Interaction Surface */}
                        <main className="lg:col-span-9 glass-panel rounded-[3rem] p-8 md:p-14 min-h-[600px] transition-all duration-700">
                            
                            {step === 0 && (
                                <div className="space-y-12 animate-in">
                                    <div className="space-y-2"><h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">Project Intake</h2><p className="text-slate-400 text-sm">Define technical boundaries and initial problem space.</p></div>
                                    <div className="space-y-8">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Technology Identifier</label>
                                            <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full command-input rounded-2xl px-6 py-5 text-white outline-none" placeholder="e.g. Project Helios-9 Core" />
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-10">
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Problem Geometry</label>
                                                <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full command-input rounded-2xl p-6 h-40 outline-none resize-none" placeholder="What core friction is this solving?"></textarea>
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Technical Solution</label>
                                                <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full command-input rounded-2xl p-6 h-40 outline-none resize-none" placeholder="Proposed technological intervention..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-12 animate-in">
                                    <div className="flex items-center gap-4"><Icon name="zap" className="text-cyan-400" size={32} /><h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">Why Now?</h2></div>
                                    <div className="space-y-8">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Market Timing Thesis</label>
                                            <textarea name="whyNow" value={formData.whyNow} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-8 h-48 outline-none" placeholder="What regulatory or technical shifts make this viable today?"></textarea>
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-12 p-10 bg-white/5 rounded-[2.5rem] border border-white/5">
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-bold uppercase tracking-widest">Customer Urgency</span><span className="text-cyan-400 font-black text-xl">{formData.customerUrgency}</span></div>
                                                <input type="range" name="customerUrgency" min="1" max="10" value={formData.customerUrgency} onChange={handleInput} />
                                            </div>
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-bold uppercase tracking-widest">Regulatory Tailwinds</span><span className="text-cyan-400 font-black text-xl">{formData.regulatoryTailwinds}</span></div>
                                                <input type="range" name="regulatoryTailwinds" min="1" max="10" value={formData.regulatoryTailwinds} onChange={handleInput} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-12 animate-in">
                                    <h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">Lean High-Fidelity Canvas</h2>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        {['uvp', 'unfairAdvantage', 'revenueStreams', 'costStructure'].map((k) => (
                                            <div key={k} className="space-y-3">
                                                <label className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{k.replace(/([A-Z])/g, ' $1').trim()}</label>
                                                <textarea name={k} value={formData[k]} onChange={handleInput} className="w-full command-input rounded-2xl p-5 h-24 outline-none text-sm" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-12 animate-in">
                                    <div className="flex justify-between items-end"><h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">Readiness matrix</h2><span className="px-4 py-1 bg-slate-800 rounded-full text-[9px] font-bold text-cyan-400 uppercase tracking-widest border border-cyan-500/20">NASA TRL Logic</span></div>
                                    <div className="grid md:grid-cols-2 gap-12">
                                        <div className="bg-black/30 p-12 rounded-[3rem] border border-white/5 space-y-10 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-xs font-bold uppercase text-cyan-400 tracking-widest flex items-center gap-2"><Icon name="cpu" size={16}/> Tech Readiness</h3><span className="text-6xl font-black text-white">{formData.trl}</span></div>
                                            <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                            <div className="flex justify-between text-[9px] font-bold text-slate-600 uppercase"><span>Theory</span><span>Prototype</span><span>Mission Capable</span></div>
                                        </div>
                                        <div className="bg-black/30 p-12 rounded-[3rem] border border-white/5 space-y-10 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-xs font-bold uppercase text-blue-500 tracking-widest flex items-center gap-2"><Icon name="globe" size={16}/> Market Readiness</h3><span className="text-6xl font-black text-white">{formData.mrl}</span></div>
                                            <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                            <div className="flex justify-between text-[9px] font-bold text-slate-600 uppercase"><span>Problem Fit</span><span>Scaling</span><span>Dominance</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-12 animate-in">
                                    <div className="flex items-center gap-5"><Icon name="radar" className="text-cyan-400" size={32} /><h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">Akaio Scenario Radar</h2></div>
                                    <div className="bg-black/30 p-12 rounded-[3rem] border border-white/5 space-y-10">
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-widest">Stability in Volatility</h3>
                                            <p className="text-sm text-slate-400 leading-relaxed max-w-xl">Akaio's core differentiator: We test if this technology survives under divergent futures (Economic crash vs. Tech boom).</p>
                                        </div>
                                        <div className="space-y-10 bg-white/5 p-10 rounded-[2rem] border border-white/5">
                                            <div className="flex justify-between items-center"><span className="text-xs font-bold uppercase tracking-widest">Scenario stability Index</span><span className="text-4xl font-black text-cyan-400">{formData.scenarioStability}</span></div>
                                            <input type="range" name="scenarioStability" min="1" max="10" value={formData.scenarioStability} onChange={handleInput} />
                                            <div className="flex justify-between text-[9px] font-bold text-slate-700 uppercase"><span>Fails in Market Swings</span><span>Fully Antifragile</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-12 animate-in">
                                    <div className="flex items-center gap-5"><Icon name="briefcase" className="text-cyan-400" size={32} /><h2 className="text-3xl font-extrabold text-white tracking-tighter uppercase italic">LeanSpark Spinout Readiness</h2></div>
                                    <div className="grid md:grid-cols-2 gap-10">
                                        {[
                                            { k: 'teamExpertise', l: 'Execution Velocity', c: 'cyan' },
                                            { k: 'ipDefensibility', l: 'Moat Depth', c: 'blue' },
                                            { k: 'capitalIntensity', l: 'Resource Burn', c: 'rose' },
                                            { k: 'validationVelocity', l: 'Feedback Loop Speed', c: 'emerald' }
                                        ].map((m) => (
                                            <div key={m.k} className="p-8 bg-white/5 rounded-3xl border border-white/5 space-y-6">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">{m.l}</span><span className={`text-2xl font-black text-${m.c}-400`}>{formData[m.key]}</span></div>
                                                <input type="range" name={m.k} min="1" max="10" value={formData[m.k]} onChange={handleInput} className={`accent-${m.c}-500`} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-12 animate-in">
                                    <div className={`p-14 rounded-[4rem] border-2 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-2xl ${analysis.glow}`}>
                                        <div className="absolute top-0 right-0 p-12 opacity-5 scale-150"><Icon name={analysis.icon} size={200} /></div>
                                        <div className="relative z-10 grid md:grid-cols-2 gap-20 items-center">
                                            <div className="space-y-8">
                                                <h2 className="text-[10px] font-bold uppercase text-slate-500 tracking-[0.8em]">Final Verdict</h2>
                                                <div className={`text-[9rem] font-black ${analysis.color} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                <div className="text-3xl font-black text-white uppercase tracking-tighter">{analysis.status}</div>
                                                <div className="border-t border-white/10 pt-10"><p className="text-slate-400 text-sm italic font-medium">"{analysis.advice}"</p></div>
                                            </div>
                                            <div className="space-y-8">
                                                <div className="bg-black/60 p-10 rounded-[3rem] border border-white/10 backdrop-blur-3xl shadow-2xl">
                                                    <div className="flex justify-between text-[11px] font-bold uppercase mb-4 tracking-widest"><span>Spinout Readiness</span><span className="text-white text-lg">{analysis.spinoutIndex}/10</span></div>
                                                    <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-cyan-400 transition-all duration-[2000ms] ease-out" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                    <p className="mt-4 text-[9px] text-slate-500 font-bold uppercase tracking-widest italic">LeanSpark De-Risking Protocol active.</p>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-white/5 p-5 rounded-2xl text-center"><p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">TRL Grade</p><p className="text-sm font-black text-white">Class {formData.trl > 7 ? 'A' : 'B'}</p></div>
                                                    <div className="bg-white/5 p-5 rounded-2xl text-center"><p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Akaio Stability</p><p className="text-sm font-black text-cyan-400">{formData.scenarioStability}/10</p></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Global Action Bar */}
                            <div className="mt-16 pt-10 border-t border-white/10 flex justify-between items-center no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[10px] font-extrabold uppercase tracking-widest text-slate-600 hover:text-white transition-all disabled:opacity-5 active:scale-90">Previous Gate</button>
                                <div className="text-[8px] font-bold text-slate-800 tracking-[0.6em] uppercase hidden md:block">Star Labs Alpha-2 // Terminal STABLE</div>
                                <button onClick={() => setStep(Math.min(steps.length - 1, step + 1))} disabled={step === steps.length - 1} className="px-10 py-4 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[10px] font-extrabold uppercase tracking-widest rounded-2xl hover:bg-cyan-500 hover:text-white transition-all shadow-xl active:scale-95 shadow-cyan-900/10">Advance Protocol</button>
                            </div>
                        </main>
                    </div>

                    <footer className="mt-24 border-t border-white/10 pt-16 grid md:grid-cols-3 gap-16 text-slate-600">
                        <div className="space-y-6">
                            <h4 className="text-[11px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-3 w-fit">Decision Engine 4.0</h4>
                            <p className="text-[11px] leading-relaxed font-medium">Alpha-2 integrates Akaio Scenario Rigor for environmental stability and LeanSpark for validation velocity. We optimize for high-moat, capital-lean spinouts.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-5">
                             <div className="flex gap-4">
                                <div className="w-2.5 h-2.5 bg-cyan-500 rounded-full animate-ping"></div>
                                <div className="w-2.5 h-2.5 bg-slate-800 rounded-full"></div>
                                <div className="w-2.5 h-2.5 bg-slate-800 rounded-full"></div>
                            </div>
                            <span className="text-[9px] font-bold uppercase tracking-[0.8em] mt-3 text-slate-800">SECURE TERMINAL // SL-AL2-2026</span>
                        </div>
                        <div className="text-right space-y-6">
