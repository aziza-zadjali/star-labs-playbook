          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
            <div><Lbl>Problem Statement</Lbl><textarea name="problem" value={form.problem} onChange={hi} className="field" style={{height:100,resize:'none'}} placeholder="The critical problem — specific and quantifiable..."/></div>
            <div><Lbl>Solution</Lbl><textarea name="solution" value={form.solution} onChange={hi} className="field" style={{height:100,resize:'none'}} placeholder="Proprietary mechanism and technical approach..."/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
            <div><Lbl>Why Now</Lbl><textarea name="whyNow" value={form.whyNow} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="Catalytic conditions, regulatory shifts..."/></div>
            <div><Lbl>Unfair Advantage</Lbl><textarea name="unfairAdvantage" value={form.unfairAdvantage} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="IP, data moats, network effects..."/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
            <div><Lbl>Lead Assessor</Lbl><input name="partnerName" value={form.partnerName} onChange={hi} className="field" placeholder="Partner / Analyst name"/></div>
            <div><Lbl>Assessment Date</Lbl><input name="assessorDate" type="date" value={form.assessorDate} onChange={hi} className="field"/></div>
          </div>
        </div>
        {form.problem&&form.solution&&<AIBtn onClick={()=>runSection('intake',buildIntakePrompt())} loading={secLoading==='intake'} label="Quick AI Read"/>}
        {(sAI.intake||secLoading==='intake')&&<AIBlock text={sAI.intake} loading={secLoading==='intake'} label="Concept Assessment"/>}
      </div>
    );

    // ── MARKET — PPP + Lean Canvas ───────────────────────────────────────────
    if(step===1) {
      const [mktTab,setMktTab] = React.useState('ppp');
      const ppp = scores.pppScores||{p1:'—',p2:'—',p3:'—',composite:'—',lc:'—'};
      const pppNum = parseFloat(ppp.composite)||0;
      const pppStage = pppNum>=8?{l:'STRONGLY VALIDATED',c:'#34d399'}:pppNum>=6.5?{l:'VALIDATED',c:'#c9a84c'}:pppNum>=5?{l:'PARTIALLY VALIDATED',c:'#f59e0b'}:pppNum>=3?{l:'NOT YET VALIDATED',c:'#f97316'}:{l:'LIKELY INVALIDATED',c:'#f87171'};
      const tabStyle = (t) => ({padding:'.5rem 1rem',borderRadius:'.5rem',fontSize:'var(--fs-xs)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',cursor:'pointer',fontFamily:'Syne,sans-serif',border:'none',transition:'all .15s',background:mktTab===t?'var(--gold-dim)':'transparent',color:mktTab===t?'var(--gold)':'var(--text3)',borderBottom:mktTab===t?'2px solid var(--gold)':'2px solid transparent'});
      return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div>
          <h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>Market Fit</h2>
          <p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Evidence-based validation · Ash Maurya's Lean Canvas + Problem–Pain–Premium</p>
        </div>

        {/* PPP Live Score Bar */}
        <div className="card-gold" style={{padding:'1rem'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:8}}>
            <div>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',marginBottom:3}}>PPP Composite Score</p>
              <p className="syne" style={{fontSize:'1.75rem',fontWeight:800,color:pppStage.c,lineHeight:1}}>{ppp.composite}</p>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:pppStage.c,marginTop:2}}>{pppStage.l}</p>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,minWidth:220}}>
              {[['Problem',ppp.p1,'P1'],['Pain',ppp.p2,'P2'],['Premium',ppp.p3,'P3']].map(([l,v,code])=>(
                <div key={code} style={{textAlign:'center',background:'rgba(0,0,0,.2)',borderRadius:8,padding:'8px 6px'}}>
                  <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>{code}</p>
                  <p className="syne" style={{fontSize:'1.2rem',fontWeight:800,color:sc(parseFloat(v)||0)}}>{v||'—'}</p>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>{l}</p>
                </div>
              ))}
            </div>
          </div>
          <div className="pbar" style={{height:5}}>
            <div className="pfill" style={{width:`${pppNum*10}%`,height:'100%',background:pppStage.c}}/>
          </div>
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:6}}>
            Score uses <strong style={{color:'var(--gold)'}}>min(P1,P2,P3)</strong> — weakest P caps the composite · LC Canvas: {ppp.lc}/10
          </p>
        </div>

        {/* Tab nav */}
        <div style={{display:'flex',gap:4,borderBottom:'1px solid rgba(255,255,255,.07)',paddingBottom:0}}>
          {[['ppp','🎯 P-P-P'],['canvas','📋 Lean Canvas'],['context','📊 Context'],['solution','🧪 Solution']].map(([t,l])=>(
            <button key={t} style={tabStyle(t)} onClick={()=>setMktTab(t)}>{l}</button>
          ))}
        </div>

        {/* ── TAB: PPP ─────────────────────────────────────────────────────── */}
        {mktTab==='ppp'&&(
          <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
            <div className="card-info" style={{padding:'.85rem',display:'flex',gap:8,alignItems:'flex-start'}}>
              <span style={{flexShrink:0}}>📖</span>
              <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6}}>
                <strong style={{color:'var(--text2)'}}>Problem–Pain–Premium</strong> by Ash Maurya: all 3 Ps must clear thresholds. Score uses <code style={{color:'var(--gold)'}}>min(P1,P2,P3)</code> — a weak Premium caps a strong Problem. Fill interview data below to generate evidence-based scores instead of gut-feel sliders.
              </p>
            </div>

            {/* P1 — Problem */}
            <div className="card" style={{padding:'1.1rem',borderTop:'3px solid #60a5fa'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div><p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'#60a5fa'}}>P1 — Problem Validation</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Interview evidence · Mom Test criteria</p></div>
                <div style={{textAlign:'right'}}><p className="syne" style={{fontSize:'1.5rem',fontWeight:800,color:sc(parseFloat(ppp.p1)||0)}}>{ppp.p1}</p><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>/ 10</p></div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem',marginBottom:10}}>
                <div>
                  <Lbl>Interviews Completed</Lbl>
                  <input type="number" name="interviewCount" value={form.interviewCount} onChange={hi} className="field" min="0" max="200" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>Target: ≥20 · B2B/Deep-tech: ≥15</p>
                </div>
                <div>
                  <Lbl>Recognition Rate %</Lbl>
                  <input type="number" name="recognitionPct" value={form.recognitionPct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>% who recognized problem when described · Target ≥70%</p>
                </div>
                <div>
                  <Lbl>Top-1 Ranking %</Lbl>
                  <input type="number" name="topOnePct" value={form.topOnePct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>% who ranked it #1 unprompted · Target ≥30%</p>
                </div>
                <div>
                  <Lbl>Workaround Rate %</Lbl>
                  <input type="number" name="workaroundPct" value={form.workaroundPct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>% actively using a workaround today · ≥60% = must-have</p>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
                <div>
                  <Lbl>Existing Alternatives Identified</Lbl>
                  <textarea name="existingAlts" value={form.existingAlts} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="List competitors, DIY workarounds, do-nothing..."/>
                </div>
                <div>
                  <Lbl>Interview Notes (Mom Test compliant)</Lbl>
                  <textarea name="interviewNotes" value={form.interviewNotes} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="Paste key quotes — past behavior, specific dates, costs..."/>
                </div>
              </div>
              {/* P1 threshold guide */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:4,marginTop:10}}>
                {[[9,'≥20 int
≥85% rec
≥40% top'],[7,'15-19 int
70-85% rec
25-40% top'],[5,'10-14 int
50-70% rec
10-25% top'],[3,'5-9 int
30-50% rec
'],[1,'<5 int
or unknown']].map(([s,d])=>(
                  <div key={s} style={{background:(parseFloat(ppp.p1)||0)>=s-0.5?`${sc(s)}18`:'rgba(255,255,255,.02)',border:`1px solid ${(parseFloat(ppp.p1)||0)>=s-0.5?sc(s):'rgba(255,255,255,.06)'}`,borderRadius:6,padding:'5px 6px',textAlign:'center'}}>
                    <p className="syne" style={{fontSize:'.85rem',fontWeight:800,color:sc(s)}}>{s}</p>
                    <p style={{fontSize:'.62rem',color:'var(--text3)',whiteSpace:'pre-line',lineHeight:1.3}}>{d}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* P2 — Pain */}
            <div className="card" style={{padding:'1.1rem',borderTop:'3px solid #f59e0b'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div><p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'#f59e0b'}}>P2 — Pain Quantification</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Frequency × Intensity × Cost of Alternative</p></div>
                <div style={{textAlign:'right'}}><p className="syne" style={{fontSize:'1.5rem',fontWeight:800,color:sc(parseFloat(ppp.p2)||0)}}>{ppp.p2}</p><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>/ 10</p></div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem'}}>
                <div>
                  <Lbl>Frequency (1-5)</Lbl>
                  <select name="painFrequency" value={form.painFrequency} onChange={hi} className="field">
                    <option value={5}>5 — Daily</option>
                    <option value={4}>4 — Weekly</option>
                    <option value={3}>3 — Monthly</option>
                    <option value={2}>2 — Quarterly</option>
                    <option value={1}>1 — Annually</option>
                  </select>
                </div>
                <div>
                  <Lbl>Intensity (1-5)</Lbl>
                  <select name="painIntensity" value={form.painIntensity} onChange={hi} className="field">
                    <option value={5}>5 — Blocks core workflow</option>
                    <option value={4}>4 — Budget / overtime overrun</option>
                    <option value={3}>3 — Annoyance + rework</option>
                    <option value={2}>2 — Mild inconvenience</option>
                    <option value={1}>1 — Barely noticed</option>
                  </select>
                </div>
                <div>
                  <Lbl>Cost of Alternative (1-5)</Lbl>
                  <select name="painCostAlt" value={form.painCostAlt} onChange={hi} className="field">
                    <option value={5}>5 — &gt;$10k/mo or &gt;40 hrs</option>
                    <option value={4}>4 — $1k-10k or 10-40 hrs</option>
                    <option value={3}>3 — $100-1k or 2-10 hrs</option>
                    <option value={2}>2 — &lt;$100 or &lt;2 hrs</option>
                    <option value={1}>1 — $0 / do nothing</option>
                  </select>
                </div>
              </div>
              <div className="card" style={{padding:'.7rem',marginTop:10,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Pain Raw Score: {form.painFrequency} × {form.painIntensity} × {form.painCostAlt} =</span>
                <span className="syne" style={{fontSize:'1.25rem',fontWeight:800,color:sc(parseFloat(ppp.p2)||0)}}>{form.painFrequency*form.painIntensity*form.painCostAlt} / 125</span>
              </div>
            </div>

            {/* P3 — Premium */}
            <div className="card" style={{padding:'1.1rem',borderTop:'3px solid #34d399'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div><p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'#34d399'}}>P3 — Premium Validation</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Willingness-to-pay evidence · 3-of-5 rule</p></div>
                <div style={{textAlign:'right'}}><p className="syne" style={{fontSize:'1.5rem',fontWeight:800,color:sc(parseFloat(ppp.p3)||0)}}>{ppp.p3}</p><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>/ 10</p></div>
              </div>
              <div style={{marginBottom:10}}>
                <Lbl>Highest Evidence Tier Achieved</Lbl>
                <select name="premiumTier" value={form.premiumTier} onChange={hi} className="field">
                  <option value="none">None — no pricing evidence yet (score: 1)</option>
                  <option value="stated">Stated WTP — interviewees named a price (score: ~3.5)</option>
                  <option value="anchored">Price anchoring — 3-of-5 accepted target price (score: ~6)</option>
                  <option value="vanwestendorp">Van Westendorp test completed (score: ~7)</option>
                  <option value="smoketest">Smoke test / landing page conversion (score: ~8)</option>
                  <option value="loi">Signed LOI / pre-order / pilot contract (score: ~9.5)</option>
                </select>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'1rem',marginBottom:10}}>
                <div>
                  <Lbl>Design Partners</Lbl>
                  <input type="number" name="designPartners" value={form.designPartners} onChange={hi} className="field" min="0" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>Committed design partners (target ≥3)</p>
                </div>
                <div>
                  <Lbl>Signed LOIs / Pre-orders</Lbl>
                  <input type="number" name="loiCount" value={form.loiCount} onChange={hi} className="field" min="0" placeholder="0"/>
                  <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:4}}>Signed papers at target price</p>
                </div>
                <div>
                  <Lbl>WTP Amount (stated)</Lbl>
                  <input name="wtpAmount" value={form.wtpAmount} onChange={hi} className="field" placeholder="e.g. $500/month"/>
                </div>
              </div>
              <div>
                <Lbl>Pricing Notes</Lbl>
                <textarea name="pricingNotes" value={form.pricingNotes} onChange={hi} className="field" style={{height:64,resize:'none'}} placeholder="Pricing reactions, budget authority, procurement process..."/>
              </div>
            </div>

            {/* PPP Expert Override */}
            <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#f59e0b',textTransform:'uppercase'}}>Expert Override</span>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                  <input type="checkbox" name="pppOverrideEnabled" checked={form.pppOverrideEnabled} onChange={e=>setForm(p=>({...p,pppOverrideEnabled:e.target.checked}))} style={{width:14,height:14,accentColor:'var(--gold)'}}/>
                  <span style={{fontSize:'var(--fs-sm)',color:'var(--text3)'}}>Enable manual override</span>
                </label>
              </div>
              {form.pppOverrideEnabled&&(
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem',marginTop:8}}>
                  {[['pppP1Override','P1 Override'],['pppP2Override','P2 Override'],['pppP3Override','P3 Override']].map(([n,l])=>(
                    <div key={n}>
                      <Lbl>{l} (1–10)</Lbl>
                      <input type="number" name={n} value={form[n]} onChange={hi} className="field" min="1" max="10" step=".5"/>
                    </div>
                  ))}
                </div>
              )}
              <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:8}}>AI-suggested scores shown below. Override only when expert contextual knowledge justifies deviation.</p>
            </div>

            <AIBtn onClick={()=>runSection('market',buildMarketPrompt())} loading={secLoading==='market'} label="AI PPP Analysis"/>
            {(sAI.market||secLoading==='market')&&<AIBlock text={sAI.market} loading={secLoading==='market'} label="PPP Market Assessment"/>}
          </div>
        )}

        {/* ── TAB: LEAN CANVAS ──────────────────────────────────────────────── */}
        {mktTab==='canvas'&&(
          <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
            <div className="card-info" style={{padding:'.85rem',display:'flex',gap:8,alignItems:'flex-start'}}>
              <span style={{flexShrink:0}}>📋</span>
              <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6}}>
                Fill in order: <strong style={{color:'var(--text2)'}}>2→1→3→4→5→6→7→8→9</strong>. Each block scored on fill quality. Canvas completeness = {ppp.lc}/10.
              </p>
            </div>
            <div>
              <Lbl>Venture Mode</Lbl>
              <select name="lcMode" value={form.lcMode} onChange={hi} className="field" style={{marginBottom:'1rem'}}>
                <option value="consumer">Consumer / B2C</option>
                <option value="b2b">B2B SaaS / Enterprise</option>
                <option value="deeptech">Deep-Tech / Hardware</option>
                <option value="b2g">B2G / Government</option>
              </select>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:'1rem'}}>
              {[
                {n:'lcSegment',    num:2, title:'Customer Segments',     hint:'Specific early-adopter persona — not "SMBs" but "ops managers at 50-500 person logistics cos"'},
                {n:'lcProblem',    num:1, title:'Problem (Top 1–3)',      hint:'Top 3 pains for that persona + existing alternatives'},
                {n:'lcUVP',        num:3, title:'Unique Value Prop',      hint:'One sentence: "[Clear promise] for [persona] who [pain]"'},
                {n:'lcSolution',   num:4, title:'Solution',               hint:'Smallest feature set solving top 3 problems — resist feature creep'},
                {n:'lcChannels',   num:5, title:'Channels',               hint:'At least one inbound + one outbound. Deep-tech: add one trust channel (publication, regulatory milestone)'},
                {n:'lcRevenue',    num:6, title:'Revenue Streams',        hint:'Pricing model + initial price hypothesis — revisit after WTP tests'},
                {n:'lcCost',       num:7, title:'Cost Structure',         hint:'CAC estimate, COGS/hosting, key fixed costs'},
                {n:'lcMetrics',    num:8, title:'Key Metrics',            hint:'The ONE number that signals stage progress. Pre-PMF: active design partners. PMF: Sean Ellis %.'},
                {n:'lcAdvantage',  num:9, title:'Unfair Advantage',       hint:'What cannot be copied or bought? Leave blank if not yet earned.'},
              ].map(({n,num,title,hint})=>{
                const filled = form[n]&&form[n].trim().length>15;
                return (
                  <div key={n} style={{background:filled?'rgba(52,211,153,.03)':'rgba(255,255,255,.02)',border:`1px solid ${filled?'rgba(52,211,153,.2)':'rgba(255,255,255,.06)'}`,borderRadius:'.8rem',padding:'1rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{width:20,height:20,borderRadius:'50%',background:filled?'rgba(52,211,153,.15)':'var(--gold-dim)',border:`1px solid ${filled?'rgba(52,211,153,.3)':'var(--gold-border)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                          <span className="mono" style={{fontSize:'.55rem',fontWeight:700,color:filled?'#34d399':'var(--gold)'}}>{num}</span>
                        </span>
                        <span className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text)'}}>{title}</span>
                      </div>
                      {filled&&<Icon name="check-circle" size={13} color="#34d399"/>}
                    </div>
                    <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginBottom:6,lineHeight:1.5}}>{hint}</p>
                    <textarea name={n} value={form[n]} onChange={hi} className="field" style={{height:80,resize:'none',fontSize:'var(--fs-sm)'}} placeholder="Fill this block..."/>
                  </div>
                );
              })}
            </div>
            {/* Canvas completeness bar */}
            <div className="card" style={{padding:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>Canvas Completeness</span>
                <span className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:sc(parseFloat(ppp.lc)||0)}}>{[form.lcSegment,form.lcProblem,form.lcUVP,form.lcSolution,form.lcChannels,form.lcRevenue,form.lcCost,form.lcMetrics,form.lcAdvantage].filter(b=>b&&b.trim().length>15).length} / 9 blocks</span>
              </div>
              <div className="pbar" style={{height:5}}>
                <div className="pfill" style={{width:`${([form.lcSegment,form.lcProblem,form.lcUVP,form.lcSolution,form.lcChannels,form.lcRevenue,form.lcCost,form.lcMetrics,form.lcAdvantage].filter(b=>b&&b.trim().length>15).length/9)*100}%`,height:'100%',background:sc(parseFloat(ppp.lc)||0)}}/>
              </div>
            </div>
          </div>
        )}

        {/* ── TAB: CONTEXT ──────────────────────────────────────────────────── */}
        {mktTab==='context'&&(
          <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
              <Slider label="TAM / SAM Size" name="marketSize" value={form.marketSize} onChange={hi} desc="1=Niche / 10=Global dominant market"/>
              <Slider label="Market Timing" name="marketTiming" value={form.marketTiming} onChange={hi} desc="1=Too early / 5=Emerging / 10=Perfect window"/>
              <Slider label="Competitive Moat" name="competitiveMoat" value={form.competitiveMoat} onChange={hi} desc="Differentiation depth vs existing players"/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
              <div><Lbl>Revenue Model</Lbl><select name="revenueModel" value={form.revenueModel} onChange={hi} className="field"><option value="">Select...</option>{['SaaS','Licensing','Marketplace','B2G','B2B Enterprise','B2C','Usage-based','Hardware + Services','Joint Venture'].map(m=><option key={m}>{m}</option>)}</select></div>

            <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#f59e0b',textTransform:'uppercase'}}>Expert Regional Adj (±3)</span>
                <span className="mono" style={{fontWeight:700,color:'var(--gold-b)'}}>{form.marketExpertAdj>0?'+':''}{form.marketExpertAdj}</span>
              </div>
              <input type="range" name="marketExpertAdj" min="-3" max="3" step=".5" value={form.marketExpertAdj} onChange={hi}/>

          <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>

              <div>
                <Lbl>Solution Interviews Done</Lbl>
                <input type="number" name="solInterviewCount" value={form.solInterviewCount} onChange={hi} className="field" min="0" placeholder="0"/>
              </div>
              <div>
                <Lbl>UVP Understood % (target ≥80)</Lbl>
                <input type="number" name="uvpUnderstandPct" value={form.uvpUnderstandPct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>
              </div>
              <div>
                <Lbl>Would Refer % (target ≥60)</Lbl>
                <input type="number" name="referralPct" value={form.referralPct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>
              </div>
              <div>
                <Lbl>Would Pre-pay % (target ≥30)</Lbl>
                <input type="number" name="prepayPct" value={form.prepayPct} onChange={hi} className="field" min="0" max="100" placeholder="0"/>

            </div>
            <div>
              <Lbl>MVP / Experiment Type</Lbl>
              <select name="mvpType" value={form.mvpType} onChange={hi} className="field">
                <option value="none">None yet</option>
                <option value="sketch">Sketch / Wireframe</option>
                <option value="landingpage">Landing page smoke test</option>
                <option value="concierge">Concierge MVP (manual delivery)</option>
                <option value="wizard">Wizard-of-Oz MVP</option>
                <option value="preorder">Pre-order page</option>
                <option value="pilot">Paid pilot agreement</option>

                  <span style={{fontSize:'.7rem',width:90,flexShrink:0,color:'var(--text2)'}}>{l}</span>

                  <span className="mono" style={{fontSize:'var(--fs-xs)',width:50,textAlign:'right',color:v>=t?'#34d399':'var(--text3)'}}>{v}% {v>=t?'✓':'/ '+t+'%'}</span>

            <div><Lbl>Solution Interview Notes</Lbl><textarea name="solNotes" value={form.solNotes} onChange={hi} className="field" style={{height:80,resize:'none'}} placeholder="Key reactions to demo, commitment currencies, objections..."/></div>
          </div>

    // ── TECH ──────────────────────────────────────────────────────────────────
    if(step===2) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          <div className="card-gold" style={{padding:'1.25rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
              <div><p className="mono" style={{fontSize:'var(--fs-sm)',color:'#fbbf24',fontWeight:700,textTransform:'uppercase'}}>TRL</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:2}}>Technology Readiness</p></div>
              <span className="syne gold-text" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1}}>{form.trl}</span>
            </div>
            <input type="range" name="trl" min="1" max="9" value={form.trl} onChange={hi}/>

              {[['1–3','Research'],['4–6','Prototype'],['7–9','Deployed']].map(([r,l])=><div key={r}><span className="mono" style={{fontSize:'var(--fs-xs)',color:'#c9a84c',display:'block'}}>{r}</span><span style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>{l}</span></div>)}
            </div>

          <div className="card" style={{padding:'1.25rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
              <div><p className="mono" style={{fontSize:'var(--fs-sm)',color:'#9ca3af',fontWeight:700,textTransform:'uppercase'}}>MRL</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:2}}>Market Readiness</p></div>
              <span className="syne" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1,color:'#fff'}}>{form.mrl}</span>
            </div>
            <input type="range" name="mrl" min="1" max="10" value={form.mrl} onChange={hi}/>
            <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${form.mrl*10}%`,background:'#9ca3af'}}/></div>
            <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:8}}>1=No market engagement → 10=Full GTM deployed</p>
          </div>
        </div>
        <div className="card" style={{padding:'1rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div className="pbar" style={{width:100}}><div className="pfill" style={{width:`${(1-Math.abs(form.trl-form.mrl)/9)*100}%`,background:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}/></div>
            <span className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}>{Math.abs(form.trl-form.mrl)>3?'MISALIGNED':Math.abs(form.trl-form.mrl)>1?'GAP':'ALIGNED'}</span>

        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          <Slider label="IP Defensibility" name="ipDefensibility" value={form.ipDefensibility} onChange={hi} desc="Patents, trade secrets, network effects"/>
          <Slider label="Tech Scalability" name="techScalability" value={form.techScalability} onChange={hi} desc="Global scale without linear cost"/>
          <Slider label="Integration Complexity" name="integrationComplexity" value={form.integrationComplexity} onChange={hi} desc="Higher=more complex adoption" accent="#f59e0b"/>
          <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#f59e0b',textTransform:'uppercase'}}>Tech Expert Adj</span><span className="mono" style={{fontWeight:700,color:'var(--gold-b)'}}>{form.techExpertAdj>0?'+':''}{form.techExpertAdj}</span></div>
            <input type="range" name="techExpertAdj" min="-3" max="3" step=".5" value={form.techExpertAdj} onChange={hi}/>
          </div>
        </div>
        <div><Lbl>Technology Notes</Lbl><textarea name="techNotes" value={form.techNotes} onChange={hi} className="field" style={{height:64,resize:'none'}} placeholder="Key technical risks, dependencies, breakthroughs..."/></div>
        <AIBtn onClick={()=>runSection('tech',buildTechPrompt())} loading={secLoading==='tech'} label="AI Tech Read"/>
        {(sAI.tech||secLoading==='tech')&&<AIBlock text={sAI.tech} loading={secLoading==='tech'} label="Technology Assessment"/>}
      </div>
    );

    // ── FINANCIAL ─────────────────────────────────────────────────────────────
    if(step===3) return (

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          <Slider label="ROI Potential" name="roiPotential" value={form.roiPotential} onChange={hi} desc="Risk-adjusted return multiple expectation" accent="#34d399"/>

            {[{l:'ROI',v:scores.viability,i:'trending-up'},{l:'Cap Eff',v:fmt(10-form.capitalIntensity),i:'zap'},{l:'Rev Ready',v:fmt(form.revenueReadiness),i:'dollar-sign'},{l:'Payback',v:fmt(form.paybackPeriod),i:'clock'}].map(({l,v,i})=>(

        {(sAI.financial||secLoading==='financial')&&<AIBlock text={sAI.financial} loading={secLoading==='financial'} label="Financial Assessment"/>}
      </div>
    );

    // ── RISK ──────────────────────────────────────────────────────────────────
    if(step===4) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>Risk Matrix</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Multi-vector risk calibration — lower scores preferred.</p></div>
        <div className="card-warn" style={{padding:'.85rem',display:'flex',alignItems:'center',gap:8}}>
          <Icon name="alert-triangle" size={13} color="#f59e0b"/>
          <p style={{fontSize:'var(--fs-sm)',color:'var(--text2)'}}>Score severity 1–10. Higher=more severe. Translates inversely to venture health.</p>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          {[['Regulatory Risk','regulatoryRisk',form.regulatoryRisk,'Adverse regulatory action'],['Geopolitical Risk','geopoliticalRisk',form.geopoliticalRisk,'Macro geopolitical exposure'],['Supply Chain Risk','supplychainRisk',form.supplychainRisk,'Concentration of input supply'],['Cybersecurity Risk','cybersecurityRisk',form.cybersecurityRisk,'Attack surface exposure'],['Talent Risk','talentRisk',form.talentRisk,'Key person dependency'],['Competition Risk','competitionRisk',form.competitionRisk,'Fast-follower threat']].map(([l,n,v,d])=>(
            <Slider key={n} label={l} name={n} value={v} onChange={hi} desc={d} accent={v>=7?'#f87171':v>=4?'#f59e0b':'#34d399'}/>
          ))}
        </div>
        <div className="card" style={{padding:'1.1rem'}}>
          <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Risk Heatmap</p>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
            {[['Regulatory',form.regulatoryRisk],['Geopolitical',form.geopoliticalRisk],['Supply Chain',form.supplychainRisk],['Cybersec',form.cybersecurityRisk],['Talent',form.talentRisk],['Competition',form.competitionRisk]].map(([l,v])=>{
              const t=v>=8?0:v>=6?1:v>=3?2:3, col=v>=8?'#f87171':v>=6?'#f59e0b':v>=3?'#c9a84c':'#34d399';
              return <div key={l} className={`hmap${t}`} style={{borderRadius:8,padding:'.6rem',textAlign:'center'}}>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginBottom:3}}>{l}</p>
                <p className="syne" style={{fontSize:'1.35rem',fontWeight:800,color:col}}>{v}</p>
                <span className="tag" style={{background:'transparent',color:col,border:`1px solid ${col}40`,fontSize:'.45rem'}}>{v>=8?'CRITICAL':v>=6?'HIGH':v>=3?'MEDIUM':'LOW'}</span>
              </div>;
            })}
          </div>
        </div>
        <div><Lbl>Risk Notes & Mitigants</Lbl><textarea name="riskNotes" value={form.riskNotes} onChange={hi} className="field" style={{height:64,resize:'none'}} placeholder="Mitigants, insurance, regulatory approvals..."/></div>
        <AIBtn onClick={()=>runSection('risk',buildRiskPrompt())} loading={secLoading==='risk'} label="AI Risk Read"/>
        {(sAI.risk||secLoading==='risk')&&<AIBlock text={sAI.risk} loading={secLoading==='risk'} label="Risk Assessment"/>}
      </div>
    );

    // ── ESG ───────────────────────────────────────────────────────────────────
    if(step===5) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>ESG & Regulatory</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Environmental, social, governance — mandatory for Gulf sovereign capital.</p></div>
        <div className="card-success" style={{padding:'.85rem',display:'flex',alignItems:'center',gap:8}}>
          <Icon name="leaf" size={13} color="#34d399"/>

        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          <Slider label="Environmental Impact" name="environmentalImpact" value={form.environmentalImpact} onChange={hi} desc="Positive environmental contribution — net zero" accent="#34d399"/>
          <Slider label="Social Impact" name="socialImpact" value={form.socialImpact} onChange={hi} desc="Job creation, community benefit, inclusivity" accent="#60a5fa"/>
          <Slider label="Governance Readiness" name="governanceReadiness" value={form.governanceReadiness} onChange={hi} desc="Board quality, transparency, accountability"/>
          <Slider label="Regulatory Compliance" name="regulatoryCompliance" value={form.regulatoryCompliance} onChange={hi} desc="Current compliance posture and audit readiness"/>
        </div>
        <div className="card" style={{padding:'1.1rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>UN SDG Alignment</p>

          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
            {[['SDG 9','Innovation'],['SDG 13','Climate'],['SDG 8','Growth'],['SDG 17','Partners']].map(([g,l])=>(
              <div key={g} className="mxcell" style={{textAlign:'center',padding:'.5rem'}}>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#c9a84c'}}>{g}</p>
                <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:2}}>{l}</p>
              </div>
            ))}
          </div>
        </div>
        <div><Lbl>ESG Notes & Certifications</Lbl><textarea name="esgNotes" value={form.esgNotes} onChange={hi} className="field" style={{height:64,resize:'none'}} placeholder="ISO certifications, ESG frameworks, impact reporting..."/></div>
        <AIBtn onClick={()=>runSection('esg',buildEsgPrompt())} loading={secLoading==='esg'} label="AI ESG Read"/>
        {(sAI.esg||secLoading==='esg')&&<AIBlock text={sAI.esg} loading={secLoading==='esg'} label="ESG Assessment"/>}
      </div>
    );

    // ── TEAM ──────────────────────────────────────────────────────────────────
    if(step===6) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>Execution DNA</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Team depth, validation speed, resilience, and network capital.</p></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
          <Slider label="Founder Domain Depth" name="teamExpertise" value={form.teamExpertise} onChange={hi} desc="Technical and domain expertise of leadership" accent="#f0c84a"/>
          <Slider label="Advisory Strength" name="advisoryStrength" value={form.advisoryStrength} onChange={hi} desc="Quality and commitment of advisors and board"/>
          <Slider label="Validation Velocity" name="validationVelocity" value={form.validationVelocity} onChange={hi} desc="Feedback loop speed and iteration cadence"/>
          <Slider label="Scenario Resilience" name="scenarioResilience" value={form.scenarioResilience} onChange={hi} desc="Antifragility against macro shocks"/>
          <Slider label="Partnership Network" name="partnershipNetwork" value={form.partnershipNetwork} onChange={hi} desc="Strategic partner depth and commercial pipeline"/>
          <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#f59e0b',textTransform:'uppercase'}}>Execution Expert Adj</span><span className="mono" style={{fontWeight:700,color:'var(--gold-b)'}}>{form.executionExpertAdj>0?'+':''}{form.executionExpertAdj}</span></div>
            <input type="range" name="executionExpertAdj" min="-3" max="3" step=".5" value={form.executionExpertAdj} onChange={hi}/>
          </div>
        </div>
        <AIBtn onClick={()=>runSection('team',buildTeamPrompt())} loading={secLoading==='team'} label="AI Team Read"/>
        {(sAI.team||secLoading==='team')&&<AIBlock text={sAI.team} loading={secLoading==='team'} label="Team Assessment"/>}
      </div>
    );

    // ── EVIDENCE ──────────────────────────────────────────────────────────────
    if(step===7) {
      const upCount=Object.keys(docs).length;
      return (
        <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
          <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>Evidence Vault</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Upload supporting documents — AI will cross-check against your self-assessed scores.</p></div>
          <div className="card-info" style={{padding:'.9rem',display:'flex',gap:10,alignItems:'flex-start'}}>
            <span style={{fontSize:'1rem',flexShrink:0}}>⚖️</span>
            <div>
              <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#60a5fa',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>AI Score Auditor — All Documents Optional</p>
              <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6}}>Upload any document to activate the AI auditor. It cross-checks your self-assessed scores against the evidence — flagging mismatches and suggesting adjusted scores. Without uploads, all scores proceed at face value.</p>
            </div>
          </div>
          <div className="card" style={{padding:'1rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>Evidence Uploaded</span>
              <span className="mono" style={{fontSize:'var(--fs-xs)',color:upCount>=5?'#34d399':upCount>=2?'var(--gold)':'var(--text3)',fontWeight:700}}>{upCount}/{DOC_TYPES.length} · {upCount===0?'No audit possible':upCount<3?'Partial audit':'Strong coverage'}</span>
            </div>
            <div className="pbar" style={{height:5}}><div className="pfill" style={{width:`${(upCount/DOC_TYPES.length)*100}%`,height:'100%',background:upCount>=5?'#34d399':upCount>=2?'var(--gold)':'#f59e0b'}}/></div>
            <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:6}}>More documents = more precise score audit. Zero uploads = scores accepted at face value.</p>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {DOC_TYPES.map(doc=><DocCard key={doc.id} doc={doc} uploaded={docs[doc.id]} onUpload={handleDoc} onRemove={removeDoc}/>)}
          </div>
          {upCount>0?(
            <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
              <div className="card-gold" style={{padding:'1rem',display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:'1rem',flexShrink:0}}>🔍</span>
                <div>
                  <p className="mono" style={{fontSize:'var(--fs-sm)',color:'var(--gold)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>{upCount} document{upCount>1?'s':''} ready for audit</p>
                  <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.5}}>The AI will cross-check every uploaded document against your self-assessed scores — flagging mismatches and suggesting adjusted scores.</p>
                </div>
              </div>
              <AIBtn onClick={runDocAudit} loading={docLoad} label="Run AI Score Audit"/>
              {(docAI||docLoad)&&<AIBlock text={docAI} loading={docLoad} label="Score Audit — Evidence vs Claims"/>}
            </div>
          ):(
            <div className="card" style={{padding:'1.5rem',textAlign:'center'}}>
              <div style={{display:'flex',justifyContent:'center',marginBottom:8}}><Icon name="upload-cloud" size={28} color="var(--muted)"/></div>
              <p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'var(--text3)',marginBottom:4}}>No Documents Uploaded</p>
              <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6,maxWidth:400,margin:'0 auto'}}>All documents are optional. Upload any combination above to activate the AI Score Auditor.</p>
            </div>
          )}
        </div>
      );
    }

    // ── AI ENGINE ─────────────────────────────────────────────────────────────
    if(step===8) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>AI Diligence Engine</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>Full 6-paragraph institutional analysis with historical benchmarks — powered by Gemini.</p></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {[{l:'Desirability',v:scores.desirability,i:'trending-up'},{l:'Feasibility',v:scores.feasibility,i:'cpu'},{l:'Viability',v:scores.viability,i:'bar-chart-2'},{l:'Scalability',v:scores.scalability,i:'users'},{l:'Confidence',v:scores.confidence,i:'shield-check'},{l:'ESG Gate',v:scores.esg,i:'leaf'}].map(({l,v,i})=>(
            <div key={l} className="card" style={{padding:'.75rem',textAlign:'center'}}>
              <div style={{display:'flex',justifyContent:'center',marginBottom:4}}><Icon name={i} size={11} color={sc(parseFloat(v))}/></div>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>{l}</p>
              <p className="syne" style={{fontSize:'1.35rem',fontWeight:800,color:sc(parseFloat(v))}}>{v}</p>
            </div>
          ))}
        </div>
        <div className="card" style={{padding:'1.25rem'}}>
          <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12}}>LeanSpark 5-Pillar Radar</p>
          <Radar data={radarData}/>
        </div>
        <button onClick={runFull} disabled={fullLoad} className="pulse-gold"
          style={{width:'100%',padding:'1.1rem',borderRadius:'1rem',fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:'var(--fs-md)',textTransform:'uppercase',letterSpacing:'.15em',border:'1px solid var(--gold-border)',background:fullLoad?'var(--gold-dim)':'var(--gold)',color:fullLoad?'var(--gold)':'#05060a',cursor:fullLoad?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'all .2s'}}>
          <span className={fullLoad?'spin':''}><Icon name={fullLoad?'loader':'sparkles'} size={14}/></span>
          {fullLoad?'Diligence Engine Running...':'Run Full AI Diligence Report'}
        </button>
        {(fullAI||fullLoad)&&<AIBlock text={fullAI} loading={fullLoad} label="Chief Diligence Officer — Star Labs AI Engine"/>}
      </div>
    );

    // ── VERDICT ───────────────────────────────────────────────────────────────
    if(step===9) return (
      <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
        <div><h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em'}}>Gate Verdict</h2><p style={{fontSize:'var(--fs-base)',color:'var(--text3)',marginTop:4}}>EZP gate decision — {form.techName||'Unnamed Asset'}</p></div>
        {/* Main verdict card */}
        <div className="card-gold" style={{padding:'1.5rem'}}>
          <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'1.5rem'}}>
            <Ring score={parseFloat(scores.composite)}/>
            <div style={{flex:1,minWidth:200}}>
              <div className="syne" style={{fontSize:'clamp(1.6rem,5vw,2.5rem)',fontWeight:800,color:scores.verdict.color,lineHeight:1}}>{scores.verdict.status}</div>
              <p style={{fontSize:'var(--fs-base)',color:'var(--text3)',fontStyle:'italic',marginTop:6,lineHeight:1.5}}>{scores.verdict.label}</p>
              {scores.fatalFlaw&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:10}}><span className="tag" style={{background:'rgba(248,113,113,.1)',color:'#f87171',border:'1px solid rgba(248,113,113,.3)'}}>⚠ FATAL FLAW</span><span style={{fontSize:'var(--fs-sm)',color:'#f87171'}}>{scores.fatalFlaw}</span></div>}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 12px',marginTop:12}}>
                {[['Asset',form.techName||'—'],['Stage',form.stage],['Category',form.category],['Date',form.assessorDate||new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'})]].map(([l,v])=>(
                  <div key={l}><span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>{l}: </span><span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text2)'}}>{v}</span></div>
                ))}
              </div>
            </div>
          </div>
          {/* Pillar bars */}
          <div style={{marginTop:'1.25rem',paddingTop:'1.25rem',borderTop:'1px solid rgba(255,255,255,.05)'}}>
            <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.12em',marginBottom:10}}>LeanSpark Stress-Test Pillars</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'1rem'}}>
              {[{l:'Desirability',v:scores.desirability,w:'28%'},{l:'Feasibility',v:scores.feasibility,w:'22%'},{l:'Viability',v:scores.viability,w:'18%'},{l:'Scalability',v:scores.scalability,w:'17%'},{l:'Confidence',v:scores.confidence,w:'15%'}].map(({l,v,w})=>(
                <div key={l}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>{l}</span>
                    <span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:sc(parseFloat(v))}}>{v}</span>
                  </div>
                  <div className="pbar"><div className="pfill" style={{width:`${parseFloat(v)*10}%`,background:sc(parseFloat(v))}}/></div>
                  <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--muted)',marginTop:3}}>Weight {w}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
        {/* Assumption confidence */}
        <div className="card" style={{padding:'1.1rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase'}}>Assumption Confidence</p><p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:2}}>Documented assumptions vs total critical dimensions</p></div>
            <div style={{textAlign:'right'}}>
              <span className="syne" style={{fontSize:'1.75rem',fontWeight:800,color:scores.assumptionConf>=70?'#34d399':scores.assumptionConf>=40?'#c9a84c':'#f87171'}}>{scores.assumptionConf}%</span>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginTop:1}}>{scores.assumptionConf>=70?'HIGH':scores.assumptionConf>=40?'MODERATE':'LOW'}</p>
            </div>
          </div>
          <div className="pbar" style={{height:5}}><div className="pfill" style={{width:`${scores.assumptionConf}%`,height:'100%',background:scores.assumptionConf>=70?'#34d399':scores.assumptionConf>=40?'#c9a84c':'#f87171'}}/></div>
        </div>
        {/* Kill switches */}
        {scores.kills.length>0&&(
          <div style={{background:'rgba(248,113,113,.05)',border:'1px solid rgba(248,113,113,.25)',borderRadius:'1.1rem',padding:'1.1rem'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:'#f87171',boxShadow:'0 0 6px #f87171'}}/>
              <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#f87171',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em'}}>Kill Switches ({scores.kills.length})</p>
            </div>
            {scores.kills.map(k=>(
              <div key={k.code} style={{display:'flex',gap:10,alignItems:'flex-start',background:'rgba(248,113,113,.06)',borderRadius:8,padding:'.6rem .8rem',marginBottom:6}}>
                <span className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:'#f87171',background:'rgba(248,113,113,.15)',padding:'2px 6px',borderRadius:4,flexShrink:0}}>{k.code}</span>
                <div><p className="mono" style={{fontSize:'var(--fs-sm)',color:'#f87171',fontWeight:700}}>{k.label}</p><p style={{fontSize:'var(--fs-base)',color:'var(--text2)',marginTop:2,lineHeight:1.4}}>{k.reason}</p></div>
              </div>
            ))}
          </div>
        )}
        {/* Red flags + Strengths */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:'1rem'}}>
          {scores.flags.length>0&&(
            <div style={{background:'rgba(245,158,11,.04)',border:'1px solid rgba(245,158,11,.2)',borderRadius:'1.1rem',padding:'1rem'}}>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#f59e0b',fontWeight:700,textTransform:'uppercase',marginBottom:8}}>⚠ Red Flags ({scores.flags.length})</p>
              {scores.flags.map((f,i)=><div key={i} style={{display:'flex',gap:7,marginBottom:5}}><span style={{color:'#f59e0b',flexShrink:0}}>›</span><p style={{fontSize:'var(--fs-base)',color:'var(--text2)',lineHeight:1.4}}>{f}</p></div>)}
            </div>
          )}
          {scores.strengths.length>0&&(
            <div style={{background:'rgba(52,211,153,.04)',border:'1px solid rgba(52,211,153,.15)',borderRadius:'1.1rem',padding:'1rem'}}>
              <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#34d399',fontWeight:700,textTransform:'uppercase',marginBottom:8}}>✓ Strengths ({scores.strengths.length})</p>
              {scores.strengths.map((s,i)=><div key={i} style={{display:'flex',gap:7,marginBottom:5}}><span style={{color:'#34d399',flexShrink:0}}>✓</span><p style={{fontSize:'var(--fs-base)',color:'var(--text2)',lineHeight:1.4}}>{s}</p></div>)}
            </div>
          )}
        </div>
        {/* Radar */}
        <div className="card" style={{padding:'1.25rem'}}>
          <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12}}>LeanSpark 5-Pillar Radar</p>
          <Radar data={radarData}/>
        </div>
        {/* Section insights */}
        {Object.keys(sAI).length>0&&(
          <div className="card" style={{padding:'1.1rem'}}>
            <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Section Insights</p>
            {Object.entries(sAI).filter(([_,v])=>v).map(([k,v])=>(
              <div key={k} style={{marginBottom:10}}>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--gold)',textTransform:'uppercase',fontWeight:700,marginBottom:3}}>{k} dimension</p>
                <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.5}}>{v.substring(0,180)}{v.length>180?'…':''}</p>
              </div>
            ))}
          </div>
        )}
        {/* Full AI verdict */}
        {fullAI?<AIBlock text={fullAI} loading={false} label="Full AI Diligence Verdict"/>:(
          <div className="ai-block" style={{textAlign:'center',padding:'2rem'}}>
            <div style={{display:'flex',justifyContent:'center',marginBottom:8}}><Icon name="sparkles" size={22} color="var(--muted)"/></div>
            <p className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'var(--text3)',marginBottom:4}}>Run the AI Diligence Engine</p>
            <p style={{fontSize:'var(--fs-sm)',color:'var(--text3)',lineHeight:1.6,marginBottom:12}}>Go to Step 9 to generate the full 6-paragraph institutional verdict with historical benchmarks.</p>
            <button onClick={()=>goTo(8)} className="syne" style={{padding:'.5rem 1.1rem',borderRadius:'.7rem',fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer'}}>Go to AI Engine →</button>
          </div>
        )}
        {/* Expert sign-off */}
        <div><Lbl>Expert Sign-off & Gate Conditions</Lbl><textarea name="expertNote" value={form.expertNote} onChange={hi} className="field" style={{height:96,resize:'none'}} placeholder="Analyst recommendation, conditions precedent, next milestones..."/></div>
        {/* Actions */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <button onClick={exportReport} className="syne" style={{width:'100%',padding:'1.1rem',borderRadius:'1rem',fontWeight:900,fontSize:'var(--fs-md)',textTransform:'uppercase',letterSpacing:'.15em',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'linear-gradient(90deg,var(--gold),var(--gold-b))',color:'#05060a',border:'none',boxShadow:'0 4px 24px rgba(201,168,76,.25)'}}>
            <Icon name="download" size={16}/> Export Full Diligence Report
          </button>
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textAlign:'center'}}>Opens a formatted report in a new tab — use Print → Save as PDF</p>
          <div style={{display:'flex',gap:10}}>
            <NavBtn onClick={()=>goTo(0)} variant="ghost"><Icon name="arrow-left" size={13}/> Back to Step 1</NavBtn>
            <NavBtn onClick={saveAssessment} variant="green"><Icon name="save" size={13}/> {saveLoading?'Saving...':'Save Assessment'}</NavBtn>
            <NavBtn onClick={reset} variant="ghost"><Icon name="plus-circle" size={13}/> New Case</NavBtn>
          </div>
        </div>
        {/* Footer */}
        <div style={{display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8,paddingTop:'1rem',borderTop:'1px solid rgba(255,255,255,.05)'}}>
          <div><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>SL-EZP-2026 // CONFIDENTIAL</p><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>5-Pillar LeanSpark Stress-Test Framework</p></div>
          <div style={{textAlign:'right'}}>{form.partnerName&&<p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>{form.partnerName}</p>}<p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Star Labs Global Intelligence</p></div>
        </div>
      </div>
    );
    return null;
  };

  // ── Main render ─────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh',position:'relative',zIndex:10,display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <header className="no-print" style={{position:'sticky',top:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'.75rem 1.25rem',background:'rgba(10,11,14,.94)',backdropFilter:'blur(20px)',borderBottom:'1px solid rgba(255,255,255,.05)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
          <Logo h={48}/>
          <div className="hide-mobile" style={{borderLeft:'1px solid rgba(255,255,255,.08)',paddingLeft:'1rem'}}>
            <div className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--text)'}}>Emerging Zone Protocol</div>
            <div className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Pro · v2.0 · 2026</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {form.techName&&<span className="tag" style={{background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)'}}>
            {currentId&&<span style={{width:5,height:5,borderRadius:'50%',background:'#34d399',display:'inline-block',marginRight:4,boxShadow:'0 0 4px #34d399'}}/>}
            {form.techName.length>14?form.techName.substring(0,14)+'…':form.techName}
          </span>}
          {form.techName&&<span className="tag" style={{background:'rgba(255,255,255,.04)',color:sc(parseFloat(scores.composite)),border:`1px solid ${sc(parseFloat(scores.composite))}40`}}>{scores.composite}</span>}
          {/* Save status */}
          {saveMsg&&<span className="mono" style={{fontSize:'var(--fs-xs)',color:saveMsg.startsWith('✓')?'#34d399':'#f87171'}}>{saveMsg}</span>}
          {/* Save button */}
          <button onClick={saveAssessment} disabled={saveLoading} className="tag no-print"
            style={{background:'rgba(52,211,153,.08)',color:'#34d399',border:'1px solid rgba(52,211,153,.2)',cursor:'pointer',opacity:saveLoading?.6:1}}>
            <Icon name={saveLoading?'loader':'save'} size={10} className={saveLoading?'spin':''}/> {saveLoading?'Saving...':'Save'}
          </button>
          <button onClick={exportReport} className="tag no-print" style={{background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer'}}><Icon name="download" size={10}/> Export</button>
          <button onClick={()=>setScreen('dashboard')} className="tag no-print" style={{background:'rgba(255,255,255,.04)',color:'var(--text3)',border:'1px solid rgba(255,255,255,.08)',cursor:'pointer'}}><Icon name="layout-dashboard" size={10}/> Dashboard</button>
          <button onClick={reset} className="tag no-print" style={{background:'rgba(255,255,255,.04)',color:'var(--text3)',border:'1px solid rgba(255,255,255,.08)',cursor:'pointer'}}><Icon name="plus" size={10}/> New</button>
        </div>
      </header>

      {/* Body */}
      <div style={{display:'flex',flex:1,maxWidth:1280,margin:'0 auto',width:'100%',padding:'1.25rem 1rem',gap:'1.25rem'}}>
        {/* Sidebar */}
        <aside className="desk-sidebar" style={{width:180,flexShrink:0}}>
          <div style={{position:'sticky',top:80}}>
            {[...new Set(STEPS.map(s=>s.sec))].map(sec=>(
              <div key={sec}>
                <div className="nav-section">{sec}</div>
                {STEPS.filter(s=>s.sec===sec).map(s=>{
                  const i=STEPS.findIndex(x=>x.id===s.id);
                  return <button key={s.id} onClick={()=>goTo(i)} className={`nav-item${step===i?' active':''}${done.has(i)&&step!==i?' done':''}`}><Icon name={s.icon} size={12}/>{s.title}</button>;
                })}
              </div>
            ))}
            {/* Live score */}
            {form.techName&&(
              <div className="card" style={{marginTop:'1.25rem',padding:'1rem'}}>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Live Score</p>
                <div className="syne" style={{fontSize:'2rem',fontWeight:800,color:scores.verdict.color,lineHeight:1}}>{scores.composite}</div>
                <div className="pbar" style={{margin:'6px 0'}}><div className="pfill" style={{width:`${parseFloat(scores.composite)*10}%`,background:scores.verdict.color}}/></div>
                <p className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:scores.verdict.color,marginBottom:4}}>{scores.verdict.status}</p>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',marginBottom:4}}>Grade {scores.verdict.grade} · {scores.assumptionConf}%</p>
                {scores.kills.length>0&&<div style={{background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',borderRadius:6,padding:'4px 7px',marginBottom:6}}><p className="mono" style={{fontSize:'var(--fs-xs)',color:'#f87171',fontWeight:700}}>{scores.kills.length} KILL{scores.kills.length>1?'S':''}</p></div>}
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:Object.keys(docs).length>=3?'#34d399':'var(--text3)',marginBottom:8}}>{Object.keys(docs).length===0?'No docs':'Evidence: '+Object.keys(docs).length+'/'+DOC_TYPES.length}</p>
                {[['D',scores.desirability],['F',scores.feasibility],['V',scores.viability],['S',scores.scalability],['C',scores.confidence]].map(([l,v])=>(
                  <div key={l} style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
                    <span className="mono" style={{fontSize:'var(--fs-xs)',width:10,flexShrink:0,color:sc(parseFloat(v))}}>{l}</span>
                    <div className="pbar" style={{flex:1}}><div className="pfill" style={{width:`${parseFloat(v)*10}%`,background:sc(parseFloat(v))}}/></div>
                    <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',width:24,textAlign:'right'}}>{v}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </aside>

        {/* Main */}
        <main ref={mainRef} className="main-pad" style={{flex:1,minWidth:0,paddingBottom:'2rem'}}>
          {/* Step header */}
          <div className="no-print" style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}}>
            <div style={{width:30,height:30,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--gold-dim)',border:'1px solid var(--gold-border)',flexShrink:0}}>
              <Icon name={cur.icon} size={13} color="var(--gold)"/>
            </div>
            <div style={{flex:1}}><div className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text3)'}}>{cur.sec} — Step {step+1}/{STEPS.length}</div></div>
            <div style={{display:'flex',gap:3}}>
              {STEPS.map((_,i)=><div key={i} className="sdot" style={{width:i===step?18:5,background:i===step?'var(--gold)':done.has(i)?'rgba(201,168,76,.3)':'rgba(255,255,255,.07)'}}/>)}
            </div>
          </div>
          {renderStep()}
          {/* Nav buttons */}
          <div className="no-print" style={{marginTop:'2rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <button onClick={prev} disabled={step===0} style={{display:'flex',alignItems:'center',gap:6,fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',background:'none',border:'none',cursor:'pointer',fontFamily:'Syne',opacity:step===0?0:1,transition:'color .2s'}}
              onMouseOver={e=>e.currentTarget.style.color='var(--text)'} onMouseOut={e=>e.currentTarget.style.color='var(--text3)'}>
              <Icon name="arrow-left" size={11}/> Back
            </button>
            {step<STEPS.length-1&&(
              <button onClick={next} style={{display:'flex',alignItems:'center',gap:6,padding:'.6rem 1.4rem',borderRadius:'.8rem',fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer',fontFamily:'Syne',transition:'all .2s'}}>
                Next <Icon name="arrow-right" size={11}/>
              </button>
            )}
          </div>
        </main>
      </div>

      {/* Footer */}
      <footer className="no-print" style={{borderTop:'1px solid rgba(255,255,255,.04)',padding:'1rem 1.5rem',display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.1em'}}>Star Labs Global Intelligence // EZP Pro 2.0</p>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>5 Pillars · LeanSpark · AI-Powered</span>
          <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:5,height:5,borderRadius:'50%',background:'#34d399',boxShadow:'0 0 4px #34d399'}}/><span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text3)'}}>Engine Online</span></div>
        </div>
      </footer>

      {/* Mobile nav */}
      <nav className="mob-nav no-print">
        {[{i:0,n:'file-scan',t:'Intake'},{i:2,n:'cpu',t:'Tech'},{i:3,n:'bar-chart-2',t:'Finance'},{i:4,n:'shield-alert',t:'Risk'},{i:7,n:'paperclip',t:'Evidence'},{i:8,n:'sparkles',t:'AI'},{i:9,n:'shield-check',t:'Verdict'}].map(({i,n,t})=>(
          <button key={i} className={`mbtn${step===i?' act':''}`} onClick={()=>goTo(i)}>
            <Icon name={n} size={16} color={step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.5)':'#555b6a'}/>
            <span style={{color:step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.4)':'#555b6a'}}>{t}</span>
          </button>
        ))}
        <button className="mbtn" onClick={reset} style={{borderLeft:'1px solid rgba(255,255,255,.06)'}}>
          <Icon name="rotate-ccw" size={16} color="#555b6a"/>
          <span style={{color:'#555b6a'}}>Reset</span>
        </button>
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
