<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Alpha-2 EZP Intelligence</title>
    <!-- Modern Tech Stack CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #020408;
            --surface: rgba(13, 17, 23, 0.75);
            --accent-cyan: #22d3ee;
            --accent-amber: #f59e0b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep); 
            color: #f1f5f9; 
            margin: 0; 
            overflow-x: hidden; 
        }

        .glass-panel { 
            background: var(--surface); 
            backdrop-filter: blur(35px) saturate(210%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.7);
        }

        .command-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
        }

        /* Expert Adjustment Slider */
        .expert-slider::-webkit-slider-thumb { 
            border: 4px solid var(--accent-amber) !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6) !important;
        }

        input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 10px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            margin-top: -8px; 
            background: #fff; 
            height: 22px; 
            width: 22px; 
            border-radius: 50%; 
            border: 5px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.8);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glow-sphere {
            position: fixed;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.03) 0%, transparent 70%);
            z-index: -1;
            filter: blur(120px);
            pointer-events: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-ui { animation: fadeIn 0.5s ease-out forwards; }

        @media print { .no-print { display: none; } body { background: white; color: black; } .glass-panel { border: 1px solid #ddd; } }
    </style>
</head>
<body>
    <div class="glow-sphere" style="top: -400px; right: -400px;"></div>
    <div class="glow-sphere" style="bottom: -400px; left: -400px;"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ size = "w-40 h-40" }) => {
            const [imgError, setImgError] = useState(false);
            if (imgError) return <span className="font-black text-white italic tracking-tighter text-3xl">STAR LABS</span>;
            return <img src="logo.png" alt="Star Labs" className={`${size} object-contain block`} onError={() => setImgError(true)} />;
        };

        const DirectiveBanner = ({ text }) => (
            <div className="flex items-start gap-4 p-5 rounded-2xl bg-cyan-900/10 border border-cyan-500/20 w-fit max-w-4xl shadow-[0_0_20px_rgba(34,211,238,0.05)] mb-8">
                <Icon name="terminal" className="text-cyan-400 mt-0.5 shrink-0" size={16} />
                <p className="text-[11px] text-cyan-100/80 uppercase tracking-[0.2em] leading-relaxed">
                    <span className="font-black text-cyan-400 mr-2">PROTOCOL //</span> {text}
                </p>
            </div>
        );

        const ExpertOverlay = ({ label, value, name, onChange, description }) => (
            <div className="mt-10 p-8 rounded-3xl bg-amber-500/5 border border-amber-500/20 shadow-inner">
                <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                        <Icon name="user-check" className="text-amber-500" size={18} />
                        <span className="text-[11px] font-black uppercase text-amber-500 tracking-[0.2em]">Expert Calibration: {label}</span>
                    </div>
                    <span className="text-xl font-black text-amber-500">{value > 0 ? `+${value}` : value}</span>
                </div>
                <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-6">{description}</p>
                <input 
                    type="range" min="-3" max="3" step="0.5" 
                    name={name} value={value} onChange={onChange}
                    className="expert-slider"
                />
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', whyNow: '',
                trl: 4, mrl: 3, marketSize: 6, customerUrgency: 6,
                teamExpertise: 7, ipDefensibility: 6, capitalIntensity: 4,
                scenarioResilience: 5, validationVelocity: 5,
                uvp: '', unfairAdvantage: '', revenueStreams: '', costStructure: '',
                // Expert HITL adjustments
                marketExpertAdj: 0, techExpertAdj: 0, executionExpertAdj: 0,
                expertNote: ''
            });

            const steps = [
                { id: 'intake', title: 'Intake', icon: 'binary' },
                { id: 'market', title: 'Market Vector', icon: 'zap' },
                { id: 'readiness', title: 'Readiness', icon: 'layers' },
                { id: 'radar', title: 'Scenario Radar', icon: 'radar' },
                { id: 'canvas', title: 'Lean High-Fi', icon: 'layout-template' },
                { id: 'spinout', title: 'Velocity', icon: 'rocket' },
                { id: 'verdict', title: 'Verdict', icon: 'shield-check' }
            ];

            const analysis = useMemo(() => {
                const techScore = (formData.trl * 0.5) + (formData.ipDefensibility * 0.5) + formData.techExpertAdj;
                const marketScore = (formData.mrl * 0.3) + (formData.customerUrgency * 0.3) + (formData.marketSize * 0.4) + formData.marketExpertAdj;
                const executionRisk = ((10 - formData.capitalIntensity) * 0.4) + (formData.scenarioResilience * 0.3) + (formData.validationVelocity * 0.3) + formData.executionExpertAdj;
                
                let score = ((techScore * 0.3) + (marketScore * 0.4) + (executionRisk * 0.3)).toFixed(1);
                
                // STAR LABS PRIMARY FAILURE VECTORS
                let fatalFlaw = "";
                if (formData.marketSize <= 3) fatalFlaw = "MARKET SIZE MISCALCULATION: Market depth is too shallow for venture-scale return.";
                else if (formData.teamExpertise <= 3) fatalFlaw = "TEAM INCAPABILITY: Technical/Founder domain expertise gap is currently unbridgeable.";
                else if (formData.capitalIntensity >= 9) fatalFlaw = "FUND MISALLOCATION RISK: Capital burn requirement exceeds ecosystem liquidity thresholds.";
                
                if (fatalFlaw !== "") score = Math.min(score, 5.4).toFixed(1);

                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + ((10 - formData.capitalIntensity) * 0.3)).toFixed(1);

                let verdict = { status: 'INCUBATE', color: 'text-cyan-400', border: 'border-cyan-500/30', glow: 'shadow-cyan-500/20', advice: "Meets R&D threshold. Retain in Star Labs foundry for internal EZP Phase 2 de-risking." };
                if (score >= 8.2) verdict = { status: 'SPINOUT READY', color: 'text-emerald-400', border: 'border-emerald-500/30', glow: 'shadow-emerald-500/20', advice: "Alpha-grade alignment. Move to standalone corporate entity and authorize Series Seed preparation." };
                else if (score < 5.5) verdict = { status: 'TERMINATE', color: 'text-rose-400', border: 'border-rose-500/30', glow: 'shadow-rose-500/20', advice: fatalFlaw || "Execution risk exceeds projected terminal value. Archive to preserve Star Labs treasury." };

                return { score, spinoutIndex, ...verdict };
            }, [formData]);

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: (type === 'range' || name.includes('Adj')) ? parseFloat(value) : value }));
            };

            const unlock = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("AUTH_FAILED: ACCESS REJECTED");
            };

            if (isLocked) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="max-w-md w-full glass-panel p-16 rounded-[4rem] text-center">
                        <div className="flex justify-center mb-8"><Logo size="w-56 h-56" /></div>
                        <h1 className="text-2xl font-black text-white tracking-tighter uppercase italic mb-1">Terminal Decrypt</h1>
                        <p className="text-[10px] font-bold text-slate-500 tracking-[0.5em] mb-12">STAR LABS // CORE CLEARANCE</p>
                        <form onSubmit={unlock} className="space-y-6">
                            <input 
                                type="password" placeholder="PROTOCOL KEY" value={accessKey}
                                onChange={(e) => setAccessKey(e.target.value)}
                                className="w-full command-input rounded-2xl px-6 py-5 text-center text-cyan-400 tracking-[0.8em] font-mono outline-none"
                            />
                            <button className="w-full py-5 bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold uppercase tracking-widest rounded-2xl shadow-xl transition-all">Authorize Access</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto py-12 px-8">
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between mb-20 gap-10 pb-12 border-b border-white/10">
                        <div className="flex items-center gap-12">
                            <div className="w-36 h-36 flex items-center justify-center"><Logo size="w-full h-full" /></div>
                            <div className="h-16 w-px bg-white/10 hidden lg:block"></div>
                            <div>
                                <h1 className="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">Alpha-2 <span className="text-cyan-400">EZP Suite</span></h1>
                                <p className="text-slate-500 text-[10px] font-bold tracking-[0.6em] uppercase mt-4 italic">Star Labs Founder-Market Interface</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-10 no-print">
                            <div className="text-right">
                                <div className="flex items-center gap-2 justify-end">
                                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_15px_#10b981]"></div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Protocol Active</span>
                                </div>
                                <p className="text-[11px] font-black text-cyan-500 tracking-widest mt-1 uppercase italic">Expert Review Mode</p>
                            </div>
                            <button onClick={() => window.print()} className="px-8 py-4 bg-white/5 border border-white/10 rounded-2xl text-[11px] font-bold uppercase tracking-widest flex items-center gap-3 transition-all hover:bg-white/10">
                                <Icon name="download" size={16} /> Audit PDF
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-16">
                        <aside className="lg:col-span-3 space-y-4 no-print">
                            {steps.map((s, i) => (
                                <button key={s.id} onClick={() => setStep(i)} className={`w-full flex items-center gap-6 px-8 py-6 rounded-[2.5rem] text-[11px] font-extrabold uppercase tracking-widest transition-all border ${step === i ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-2xl translate-x-3' : 'bg-transparent border-transparent text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                    <Icon name={s.icon} size={20} className={step === i ? "text-cyan-400" : "text-slate-700"} />
                                    {s.title}
                                </button>
                            ))}
                        </aside>

                        <main className="lg:col-span-9 glass-panel rounded-[5rem] p-12 md:p-24 min-h-[750px] animate-ui">
                            
                            {step === 0 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Intake Analysis</h2>
                                        <DirectiveBanner text="Problem-Solution fit is the EZP Phase 1 priority. Precise friction mapping is required for downstream predictive validity." />
                                    </div>
                                    <div className="space-y-12">
                                        <div className="space-y-4">
                                            <label className="text-[11px] font-black uppercase text-slate-500 tracking-widest">Technology ID</label>
                                            <p className="text-[10px] text-slate-500 uppercase">The specific designation for this IP asset.</p>
                                            <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full command-input rounded-3xl px-8 py-6 text-white text-xl outline-none" placeholder="Project Identifier..." />
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-12">
                                            <div className="space-y-4">
                                                <label className="text-[11px] font-black uppercase text-slate-500 tracking-widest">Observed Market Friction</label>
                                                <p className="text-[10px] text-slate-500 uppercase">The critical pain point being solved.</p>
                                                <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-7 h-48 outline-none resize-none leading-relaxed" placeholder="Bleeding neck wound..."></textarea>
                                            </div>
                                            <div className="space-y-4">
                                                <label className="text-[11px] font-black uppercase text-slate-500 tracking-widest">Technical Solution</label>
                                                <p className="text-[10px] text-slate-500 uppercase">The proprietary mechanism of intervention.</p>
                                                <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-7 h-48 outline-none resize-none leading-relaxed" placeholder="Technical response..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-16">
                                    <div>
                                        <div className="flex items-center gap-6"><Icon name="zap" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Market Vector</h2></div>
                                        <DirectiveBanner text="Detects TAM miscalculation. Star Labs requires billion-dollar scale potential for any standalone spinout." />
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-10">
                                        <div className="space-y-8 bg-black/20 p-10 rounded-[3rem]">
                                            <div className="flex justify-between items-center"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">TAM Size</span><span className="text-2xl font-black text-cyan-400">{formData.marketSize}</span></div>
                                            <p className="text-[9px] text-slate-600 uppercase font-bold">1 = Restricted, 10 = Billion-Scale</p>
                                            <input type="range" name="marketSize" min="1" max="10" value={formData.marketSize} onChange={handleInput} />
                                        </div>
                                        <div className="space-y-8 bg-black/20 p-10 rounded-[3rem]">
                                            <div className="flex justify-between items-center"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Customer Urgency</span><span className="text-2xl font-black text-cyan-400">{formData.customerUrgency}</span></div>
                                            <p className="text-[9px] text-slate-600 uppercase font-bold">1 = Optional, 10 = Mission Critical</p>
                                            <input type="range" name="customerUrgency" min="1" max="10" value={formData.customerUrgency} onChange={handleInput} />
                                        </div>
                                        <div className="space-y-8 bg-black/20 p-10 rounded-[3rem]">
                                            <div className="flex justify-between items-center"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Timing Check</span><span className="text-2xl font-black text-cyan-400">{formData.scenarioResilience}</span></div>
                                            <p className="text-[9px] text-slate-600 uppercase font-bold">1 = Too Early, 10 = Perfect Tailwind</p>
                                            <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                        </div>
                                    </div>
                                    <ExpertOverlay 
                                        label="Vision 2040 Nuance" name="marketExpertAdj" value={formData.marketExpertAdj} onChange={handleInput}
                                        description="Adjust market score based on sovereign mandates or regional partnership tailwinds."
                                    />
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Star Labs Readiness</h2>
                                        <DirectiveBanner text="Detects premature scaling risks. Prevents technical over-engineering before market verification." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-14">
                                        <div className="bg-black/30 p-14 rounded-[4rem] border border-white/5 space-y-10">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-cyan-400 tracking-widest flex items-center gap-4"><Icon name="cpu" size={20}/> TRL Standard</h3><span className="text-7xl font-black text-white italic">{formData.trl}</span></div>
                                            <p className="text-[10px] text-slate-500 uppercase">1 = Lab Theory, 10 = Production Ready</p>
                                            <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                        </div>
                                        <div className="bg-black/30 p-14 rounded-[4rem] border border-white/5 space-y-10">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-blue-500 tracking-widest flex items-center gap-4"><Icon name="globe" size={20}/> MRL Standard</h3><span className="text-7xl font-black text-white italic">{formData.mrl}</span></div>
                                            <p className="text-[10px] text-slate-500 uppercase">1 = No Demand, 10 = Scaled Market</p>
                                            <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-16 animate-ui">
                                    <div>
                                        <div className="flex items-center gap-6 mb-4"><Icon name="radar" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Scenario Resilience Radar</h2></div>
                                        <DirectiveBanner text="Antifragility test. Ensures the project gains value from market volatility rather than collapsing under macro pressure." />
                                    </div>
                                    <div className="bg-black/30 p-14 rounded-[4.5rem] border border-white/5 space-y-12 shadow-2xl">
                                        <div className="space-y-5">
                                            <h3 className="text-sm font-black text-cyan-400 uppercase tracking-[0.3em] italic">Environmental Stress Test</h3>
                                            <p className="text-base text-slate-400 leading-relaxed max-w-2xl font-medium">How resilient is this model against unexpected macro shifts (recessions, regulatory freezes, energy shocks)?</p>
                                        </div>
                                        <div className="space-y-14 bg-white/5 p-14 rounded-[4rem] border border-white/5 shadow-inner">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-[0.3em] text-slate-500">Scenario Stability Index</span><span className="text-6xl font-black text-cyan-400 tracking-tighter">{formData.scenarioResilience}</span></div>
                                            <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-[-20px]">1 = Fragile in Market Swings, 10 = Antifragile Core</p>
                                            <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic mb-4">Lean High-Fi Canvas</h2>
                                        <DirectiveBanner text="Commercial architecture mapping. Ensures monetization and defensibility paths are established early." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-10">
                                        {[
                                            { k: 'uvp', l: 'Value Prop', d: 'The single message of conversion.' },
                                            { k: 'unfairAdvantage', l: 'Moat Strength', d: 'Patents or barriers to entry.' },
                                            { k: 'revenueStreams', l: 'Revenue Engine', d: 'Primary monetization pathways.' },
                                            { k: 'costStructure', l: 'Burn Drivers', d: 'DeepTech resource requirements.' }
                                        ].map((item) => (
                                            <div key={item.k} className="space-y-4">
                                                <label className="text-[11px] font-black uppercase tracking-widest text-slate-500">{item.l}</label>
                                                <p className="text-[9px] text-slate-600 uppercase font-bold">{item.d}</p>
                                                <textarea name={item.k} value={formData[item.k]} onChange={handleInput} className="w-full command-input rounded-3xl p-7 h-32 outline-none text-sm leading-relaxed" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-16">
                                    <div>
                                        <div className="flex items-center gap-6 mb-4"><Icon name="rocket" className="text-cyan-400" size={36} /><h2 className="text-4xl font-extrabold text-white tracking-tighter uppercase italic">Spinout Velocity</h2></div>
                                        <DirectiveBanner text="Identifies team capability gaps and capital burn risks. Validates the project's standalone survival velocity." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-12">
                                        {[
                                            { k: 'teamExpertise', l: 'Team Capability', c: 'cyan', d: 'Expertise depth of lead founders.' },
                                            { k: 'ipDefensibility', l: 'Defensible Moat', c: 'blue', d: 'Strength of technical IP.' },
                                            { k: 'capitalIntensity', l: 'Burn Intensity', c: 'rose', d: '10 = Extreme Capital Drag.' },
                                            { k: 'validationVelocity', l: 'Feedback Speed', c: 'emerald', d: 'Velocity of build-measure-learn loops.' }
                                        ].map((m) => (
                                            <div key={m.k} className="p-12 bg-white/5 rounded-[3.5rem] border border-white/5 space-y-8 shadow-xl">
                                                <div className="flex justify-between items-center"><span className="text-[11px] font-black uppercase tracking-widest text-slate-500">{m.l}</span><span className={`text-4xl font-black text-${m.c}-400 italic`}>{formData[m.k]}</span></div>
                                                <p className="text-[10px] text-slate-500 uppercase">{m.d}</p>
                                                <input type="range" name={m.k} min="1" max="10" value={formData[m.k]} onChange={handleInput} className={`accent-${m.c}-500`} />
                                            </div>
                                        ))}
                                    </div>
                                    <ExpertOverlay 
                                        label="Foundry Operations Sync" name="executionExpertAdj" value={formData.executionExpertAdj} onChange={handleInput}
                                        description="Calibration of team performance or Star Labs resource availability."
                                    />
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-16">
                                    <DirectiveBanner text="Algorithmic Decision Gate. Eliminates bias and quantifies the Go/Kill probability of deep tech assets." />
                                    <div className={`p-20 md:p-24 rounded-[6rem] border-2 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-2xl`}>
                                        <div className="absolute top-0 right-0 p-16 opacity-[0.03] scale-[3.5]"><Icon name={analysis.icon} size={300} /></div>
                                        <div className="relative z-10 grid md:grid-cols-2 gap-24 items-center">
                                            <div className="space-y-12">
                                                <h2 className="text-[13px] font-black uppercase text-slate-500 tracking-[1.2em]">EZP Decision</h2>
                                                <div className={`text-[12rem] font-black ${analysis.color} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                <div className="text-5xl font-black text-white uppercase tracking-tighter">{analysis.status}</div>
                                                <div className="border-t border-white/10 pt-16 font-medium leading-relaxed italic"><p className="text-slate-400 text-lg">"{analysis.advice}"</p></div>
                                            </div>
                                            <div className="space-y-12">
                                                <div className="bg-black/70 p-14 rounded-[4.5rem] border border-white/10 backdrop-blur-3xl shadow-2xl">
                                                    <div className="flex justify-between text-[12px] font-black uppercase mb-6 tracking-widest"><span>Spinout Readiness</span><span className="text-white text-3xl font-black italic">{analysis.spinoutIndex}/10</span></div>
                                                    <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-cyan-400 transition-all duration-[3000ms] ease-out shadow-[0_0_15px_#22d3ee]" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                </div>
                                                <textarea 
                                                    placeholder="Final Expert Decision Sign-off..." 
                                                    name="expertNote" value={formData.expertNote} onChange={handleInput}
                                                    className="w-full command-input rounded-[2.5rem] p-8 h-48 outline-none text-base italic leading-relaxed text-amber-500"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Tactical Navigation Bar */}
                            <div className="mt-24 pt-14 border-t border-white/10 flex justify-between items-center no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[11px] font-black uppercase tracking-[0.5em] text-slate-600 hover:text-white transition-all disabled:opacity-0 active:scale-90">Gate-Back</button>
                                <div className="text-[10px] font-bold text-slate-800 tracking-[1em] uppercase hidden lg:block italic">Star Labs Alpha-2 // Final EZP Gateway</div>
                                {step < steps.length - 1 && (
                                    <button onClick={() => setStep(step + 1)} className="px-16 py-7 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[12px] font-black uppercase tracking-[0.5em] rounded-[2.5rem] hover:bg-cyan-500 hover:text-white transition-all shadow-2xl active:scale-95 shadow-cyan-900/10">Advance Gate</button>
                                )}
                            </div>
                        </main>
                    </div>

                    <footer className="mt-36 border-t border-white/10 pt-24 grid md:grid-cols-3 gap-24 text-slate-600">
                        <div className="space-y-10 text-left">
                            <h4 className="text-[14px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-4 w-fit">Decision Engine 4.5</h4>
                            <p className="text-[13px] leading-relaxed font-medium italic">Empowered by Star Labs EZP v2.0. We prioritize capital allocation based on Technical Alpha and Market Resiliency Radar.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-10">
                             <div className="flex gap-8">
                                <div className="w-4 h-4 bg-cyan-500 rounded-full animate-ping shadow-[0_0_10px_#22d3ee]"></div>
                                <div className="w-4 h-4 bg-slate-800 rounded-full"></div>
                                <div className="w-4 h-4 bg-slate-800 rounded-full"></div>
                            </div>
                            <span className="text-[11px] font-bold uppercase tracking-[1.5em] mt-5 text-slate-800 italic">SECURE // SL-EZP-2026</span>
                        </div>
                        <div className="text-right space-y-10 ml-auto">
                             <h4 className="text-[14px] font-black uppercase tracking-widest text-white border-b border-cyan-500/30 pb-4 w-fit ml-auto">Foundry Protocol</h4>
                             <p className="text-[13px] font-black text-cyan-400 uppercase tracking-[0.6em] animate-pulse italic text-right">System Signature: Verified</p>
                             <p className="text-[11px] font-bold text-slate-800 uppercase tracking-widest mt-4">Controlled by Star Labs Logic Hub</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
