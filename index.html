<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Star Labs EZP Pro — Emerging Zone Protocol"/>
<meta name="theme-color" content="#0a0b0e"/>
<title>Star Labs | EZP Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#0a0b0e; --card:#111318; --gold:#c9a84c; --gold-b:#e8c76a;
  --gold-dim:rgba(201,168,76,0.13); --gold-border:rgba(201,168,76,0.28);
  --text:#e8e4d8; --text2:#b8b4a8; --text3:#7a7878; --muted:#4a4f5c;
  --red:#f87171; --green:#34d399; --blue:#60a5fa; --amber:#f59e0b;
  --fs-xs:0.75rem; --fs-sm:0.8125rem; --fs-base:0.875rem; --fs-md:0.9375rem;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;min-height:100vh;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;}
.syne{font-family:'Syne',sans-serif;}
.mono{font-family:'Space Mono',monospace;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.4;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,.07),transparent 70%);top:-180px;left:50%;transform:translateX(-50%);}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(96,165,250,.04),transparent 70%);bottom:0;right:-80px;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:99px;}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:1.1rem;}
.card-gold{background:var(--card);border:1px solid var(--gold-border);border-radius:1.1rem;}
.card-info{background:rgba(96,165,250,.04);border:1px solid rgba(96,165,250,.15);border-radius:1.1rem;}
.card-success{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.15);border-radius:1.1rem;}
.card-warn{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.2);border-radius:1.1rem;}
.field{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--text);
  border-radius:.7rem;padding:.8rem 1rem;width:100%;font-family:'Inter',sans-serif;
  font-size:var(--fs-base);transition:border-color .2s,box-shadow .2s;outline:none;}
.field:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(201,168,76,.07);}
.field::placeholder{color:#3a4050;}
select.field option{background:#111318;}
input[type="range"]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:99px;cursor:pointer;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 8px rgba(201,168,76,.5);}
.pbar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.tag{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:99px;font-family:'Space Mono',monospace;
  display:inline-flex;align-items:center;gap:.25rem;}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-radius:.55rem;
  font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;border:1px solid transparent;
  color:var(--muted);font-family:'Syne',sans-serif;position:relative;width:100%;background:none;}
.nav-item:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.03);}
.nav-item.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);}
.nav-section{font-size:.5rem;letter-spacing:.15em;color:rgba(232,228,216,.35);
  text-transform:uppercase;font-family:'Space Mono',monospace;padding:1.1rem .9rem .35rem;}
.mxcell{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:.75rem;padding:1rem;transition:all .2s;}
.mxcell:hover{border-color:var(--gold-border);}
.ai-block{background:linear-gradient(135deg,rgba(201,168,76,.03),rgba(201,168,76,.07));
  border:1px solid var(--gold-border);border-radius:.9rem;padding:1.5rem;position:relative;overflow:hidden;}
.ai-block::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .3s ease forwards;}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
.shimmer-btn{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-b) 25%,var(--gold) 50%,var(--gold-b) 75%,var(--gold) 100%);background-size:200% auto;animation:shimmer 3s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.35);}50%{box-shadow:0 0 0 8px rgba(201,168,76,0);}}
.pulse-gold{animation:pulse 2.5s infinite;}
.sdot{height:3px;border-radius:99px;transition:all .3s;}
@media(max-width:768px){ .desk-sidebar{display:none!important;} .main-pad{padding-bottom:5rem!important;} }
@media print{ .no-print{display:none!important;} body{background:#fff!important;color:#000!important;} }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef,useCallback} = React;

// ── Helpers ──
const clamp = (v,mn=0,mx=10) => Math.min(mx,Math.max(mn,parseFloat(v)||0));
const fmt = (v,d=1) => parseFloat(v).toFixed(d);
const sc = v => v>=8?'#34d399':v>=6.5?'#c9a84c':v>=4.5?'#f59e0b':'#f87171';

const Icon = ({name,size=16,color}) => {
  const r = useRef(null);
  useEffect(()=>{ if(window.lucide&&r.current) window.lucide.createIcons({rootNode:r.current}); },[name]);
  return <span ref={r}><i data-lucide={name} style={{width:size,height:size,display:'inline-flex',verticalAlign:'middle',color:color||'currentColor'}}></i></span>;
};

const Logo = ({h=36}) => (
  <span className="syne" style={{fontWeight:900,color:'var(--text)',letterSpacing:'-.04em',fontSize:h>60?'2.5rem':'1.2rem',lineHeight:1}}>STAR<br/><span style={{color:'var(--gold)'}}>LABS</span></span>
);

const Radar = ({data,size=260}) => {
  const cx=size/2,cy=size/2,r=size*.34,n=data.length;
  const pts = data.map((d,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;return{...d,a,ox:cx+r*Math.cos(a),oy:cy+r*Math.sin(a)};});
  const poly = s => pts.map(p=>{const v=s!==undefined?s:(p.value/10);return `${cx+r*v*Math.cos(p.a)},${cy+r*v*Math.sin(p.a)}`;}).join(' ');
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:'100%',maxWidth:300,display:'block',margin:'0 auto'}}>
      {[.2,.4,.6,.8,1].map(l=><polygon key={l} points={poly(l)} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>)}
      <polygon points={pts.map(p=>{const v=p.value/10;return `${cx+r*v*Math.cos(p.a)},${cy+r*v*Math.sin(p.a)}`;}).join(' ')} fill="rgba(201,168,76,0.12)" stroke="#c9a84c" strokeWidth="1.5"/>
      {pts.map((p,i)=><text key={i} x={cx+(r+20)*Math.cos(p.a)} y={cy+(r+20)*Math.sin(p.a)} textAnchor="middle" dominantBaseline="middle" style={{fontSize:9,fill:'#7a7878',fontFamily:'Space Mono'}}>{p.label}</text>)}
    </svg>
  );
};

const Ring = ({score}) => {
  const c=2*Math.PI*75,col=sc(score),off=c*(1-(clamp(score,0,10)/10));
  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="9"/>
      <circle cx="90" cy="90" r="75" fill="none" stroke={col} strokeWidth="9" strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 90 90)" style={{transition:'all 1s ease'}}/>
      <text x="90" y="90" textAnchor="middle" dominantBaseline="middle" style={{fontFamily:'Syne',fontSize:36,fontWeight:800,fill:col}}>{fmt(score)}</text>
    </svg>
  );
};

const Lbl = ({children}) => <label className="mono" style={{fontSize:'0.75rem',color:'var(--text2)',textTransform:'uppercase',display:'block',marginBottom:6}}>{children}</label>;

const Slider = ({label,name,value,onChange,desc,accent}) => {
  const col = accent || sc(value);
  return (
    <div className="mxcell">
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <span className="syne" style={{fontSize:'0.8rem',fontWeight:700}}>{label}</span>
        <span className="mono" style={{color:col,fontWeight:700}}>{value}</span>
      </div>
      <input type="range" name={name} min="1" max="10" step="1" value={value} onChange={onChange}/>
      {desc && <p style={{fontSize:'0.7rem',color:'var(--text3)',marginTop:6}}>{desc}</p>}
    </div>
  );
};

const STEPS = [
  {id:'intake', title:'Intake', icon:'file-scan', sec:'Foundation'},
  {id:'market', title:'Market', icon:'trending-up', sec:'Foundation'},
  {id:'tech', title:'Tech', icon:'cpu', sec:'Dimensions'},
  {id:'fin', title:'Financial', icon:'bar-chart-2', sec:'Dimensions'},
  {id:'risk', title:'Risk', icon:'shield-alert', sec:'Dimensions'},
  {id:'esg', title:'ESG', icon:'leaf', sec:'Dimensions'},
  {id:'team', title:'Team', icon:'users', sec:'Dimensions'},
  {id:'evidence', title:'Evidence', icon:'paperclip', sec:'Evidence'},
  {id:'engine', title:'AI', icon:'sparkles', sec:'Verdict'},
  {id:'verdict', title:'Verdict', icon:'shield-check', sec:'Verdict'},
];

const INIT_FORM = {
  techName:'', category:'DeepTech', problem:'', solution:'', stage:'Concept',
  marketSize:6, marketTiming:6, competitiveMoat:5, pppOverrideEnabled:false,
  trl:5, mrl:4, ipDefensibility:5, techScalability:6,
  roiPotential:6, capitalIntensity:5, revenueReadiness:5,
  regulatoryRisk:4, talentRisk:4, competitionRisk:5,
  environmentalImpact:5, socialImpact:5, governanceReadiness:6,
  teamExpertise:6, validationVelocity:5, partnershipNetwork:5
};

const App = () => {
  const [screen, setScreen] = useState('lock');
  const [keyVal, setKeyVal] = useState('');
  const [keyErr, setKeyErr] = useState(false);
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(INIT_FORM);
  const [sAI, setSAI] = useState({});
  const [loading, setLoading] = useState(false);

  const hi = e => { const {name,value,type}=e.target; setForm(p=>({...p,[name]:type==='range'?parseFloat(value):value})); };

  const scores = useMemo(() => {
    const d = clamp((form.marketSize * 0.4) + 5);
    const f = clamp((form.trl / 9 * 10 * 0.4) + (form.ipDefensibility * 0.6));
    const v = clamp((form.roiPotential * 0.5) + (form.revenueReadiness * 0.5));
    const s = clamp((form.teamExpertise * 0.6) + (form.validationVelocity * 0.4));
    const raw = (d * 0.3 + f * 0.2 + v * 0.2 + s * 0.3);
    const verdict = raw >= 7.5 ? {status:'SPINOUT READY', color:'#34d399'} : raw >= 5 ? {status:'INCUBATE', color:'#c9a84c'} : {status:'TERMINATE', color:'#f87171'};
    return { d:fmt(d), f:fmt(f), v:fmt(v), s:fmt(s), composite:fmt(raw), verdict };
  }, [form]);

  const radarData = [
    {label:'Desirability', value:parseFloat(scores.d)},
    {label:'Feasibility', value:parseFloat(scores.f)},
    {label:'Viability', value:parseFloat(scores.v)},
    {label:'Scalability', value:parseFloat(scores.s)},
  ];

  if(screen === 'lock') return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
      <div className="card-gold" style={{padding:'2.5rem',width:360,textAlign:'center'}}>
        <Logo h={100}/>
        <div style={{marginTop:'2rem'}}>
          <Lbl>Enter Access Key</Lbl>
          <input type="password" value={keyVal} onChange={e=>{setKeyVal(e.target.value);setKeyErr(false);}} className="field mono" style={{textAlign:'center',letterSpacing:'0.4em'}}/>
          {keyErr && <p style={{color:'var(--red)',fontSize:11,marginTop:8}}>Invalid Key</p>}
          <button onClick={()=>keyVal.toUpperCase()==='STAR2026'?setScreen('assess'):setKeyErr(true)} className="shimmer-btn syne" style={{width:'100%',padding:'1rem',borderRadius:'0.8rem',marginTop:'1.5rem',border:'none',fontWeight:800,cursor:'pointer'}}>ACCESS TERMINAL</button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{display:'flex',minHeight:'100vh'}}>
      <aside className="desk-sidebar" style={{width:240,borderRight:'1px solid rgba(255,255,255,0.05)',padding:'1.5rem',background:'var(--card)'}}>
        <Logo h={40}/>
        <div style={{marginTop:'2.5rem'}}>
          {STEPS.map((s,i)=>(
            <button key={s.id} onClick={()=>setStep(i)} className={`nav-item ${step===i?'active':''}`} style={{marginBottom:4}}>
              <Icon name={s.icon} size={14}/> {s.title}
            </button>
          ))}
        </div>
      </aside>
      <main style={{flex:1,padding:'2.5rem',overflowY:'auto'}}>
        {step === 0 && (
          <div className="fade-up">
            <h2 className="syne" style={{fontSize:'2.2rem',fontWeight:800}}>Venture Intake</h2>
            <div className="card" style={{padding:'1.5rem',marginTop:'1.5rem',display:'flex',flexDirection:'column',gap:'1.2rem'}}>
              <div><Lbl>Asset Name</Lbl><input name="techName" value={form.techName} onChange={hi} className="field syne" placeholder="Project Alpha"/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
                <div><Lbl>Category</Lbl><select name="category" value={form.category} onChange={hi} className="field"><option>DeepTech</option><option>FinTech</option><option>AI</option></select></div>
                <div><Lbl>Stage</Lbl><select name="stage" value={form.stage} onChange={hi} className="field"><option>Concept</option><option>Prototype</option><option>MVP</option></select></div>
              </div>
              <div><Lbl>Problem Statement</Lbl><textarea name="problem" value={form.problem} onChange={hi} className="field" style={{height:80}}/></div>
              <div><Lbl>Solution Overview</Lbl><textarea name="solution" value={form.solution} onChange={hi} className="field" style={{height:80}}/></div>
            </div>
          </div>
        )}
        {step === 1 && (
          <div className="fade-up">
            <h2 className="syne" style={{fontSize:'2.2rem',fontWeight:800}}>Market Context</h2>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem',marginTop:'1.5rem'}}>
              <Slider label="Market Size" name="marketSize" value={form.marketSize} onChange={hi}/>
              <Slider label="Market Timing" name="marketTiming" value={form.marketTiming} onChange={hi}/>
              <Slider label="Competitive Moat" name="competitiveMoat" value={form.competitiveMoat} onChange={hi}/>
            </div>
          </div>
        )}
        {step === 2 && (
            <div className="fade-up">
              <h2 className="syne" style={{fontSize:'2.2rem',fontWeight:800}}>Technical Feasibility</h2>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem',marginTop:'1.5rem'}}>
                <Slider label="TRL Level" name="trl" value={form.trl} onChange={hi}/>
                <Slider label="MRL Level" name="mrl" value={form.mrl} onChange={hi}/>
                <Slider label="IP Defensibility" name="ipDefensibility" value={form.ipDefensibility} onChange={hi}/>
                <Slider label="Scalability" name="techScalability" value={form.techScalability} onChange={hi}/>
              </div>
            </div>
        )}
        {step === 9 && (
          <div className="fade-up" style={{textAlign:'center'}}>
            <h2 className="syne" style={{fontSize:'2.2rem',fontWeight:800}}>Institutional Verdict</h2>
            <div className="card-gold" style={{padding:'3rem',marginTop:'2rem'}}>
              <Ring score={parseFloat(scores.composite)}/>
              <h1 className="syne" style={{fontSize:'3.5rem',color:scores.verdict.color,marginTop:20}}>{scores.verdict.status}</h1>
              <div style={{display:'flex',justifyContent:'center',gap:'2rem',marginTop:'2rem'}}>
                <Radar data={radarData}/>
              </div>
              <button onClick={()=>window.print()} className="shimmer-btn syne" style={{marginTop:'2rem',padding:'1rem 2rem',border:'none',borderRadius:'0.8rem',fontWeight:800,cursor:'pointer'}}>EXPORT DILIGENCE REPORT</button>
            </div>
          </div>
        )}
        <div style={{marginTop:'3rem',display:'flex',justifyContent:'space-between'}} className="no-print">
          <button onClick={prev} disabled={step===0} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer'}}>← BACK</button>
          {step < 9 && <button onClick={next} className="syne" style={{padding:'0.8rem 2rem',borderRadius:'0.8rem',background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',fontWeight:700,cursor:'pointer'}}>NEXT STEP</button>}
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
