                  background:streaming?'var(--gold-dim)':'var(--gold)',
                  color:streaming?'var(--gold)':'#05060a',cursor:streaming?'not-allowed':'pointer',
                  display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'all .2s'}}>
                <span className={streaming?'spin':''}><Icon name={streaming?'loader':'sparkles'} size={14}/></span>
                {streaming?'Diligence Engine Running...':'Run Full AI Diligence Report'}
              </button>
              {(aiText||streaming)&&<AIBlock text={aiText} streaming={streaming} label="Chief Diligence Officer — Star Labs AI Engine"/>}
            </div>
          )}

          {/* ════ STEP 9: VERDICT ════ */}
          {step===9&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em',color:'var(--text)'}}>Gate Verdict</h2>
                <p style={{fontSize:'.8rem',color:'var(--text-3)',marginTop:4}}>EZP gate decision — {form.techName||'Unnamed Asset'}</p>
              </div>
              {/* Main verdict */}
              <div className="card-gold" style={{padding:'1.5rem'}}>
                <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'1.5rem'}}>
                  <ScoreRing score={parseFloat(scores.composite)}/>
                  <div style={{flex:1,minWidth:200}}>
                    <div className="syne" style={{fontSize:'clamp(1.6rem,5vw,2.5rem)',fontWeight:800,color:scores.verdict.color,lineHeight:1}}>{scores.verdict.status}</div>
                    <p style={{fontSize:'.8rem',color:'#9a9690',fontStyle:'italic',marginTop:6,lineHeight:1.5}}>{scores.verdict.label}</p>
                    {scores.fatalFlaw&&(
                      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:10}}>
                        <span className="tag" style={{background:'rgba(248,113,113,.1)',color:'#f87171',border:'1px solid rgba(248,113,113,.3)'}}>
                          ⚠ FATAL FLAW
                        </span>
                        <span style={{fontSize:'var(--fs-base)',color:'#f87171'}}>{scores.fatalFlaw}</span>
                      </div>
                    )}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 12px',marginTop:12}}>
                      {[['Asset',form.techName||'—'],['Stage',form.stage],['Category',form.category],['Date',form.assessorDate||new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'})]].map(([l,v])=>(
                        <div key={l}><span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>{l}: </span><span className="mono" style={{fontSize:'var(--fs-xs)',color:'#ccc9bc'}}>{v}</span></div>
                      ))}
                    </div>
                  </div>
                </div>
                {/* Stress-Test Pillar Bars */}
                <div style={{marginTop:'1.25rem',paddingTop:'1.25rem',borderTop:'1px solid rgba(255,255,255,.05)'}}>
                  <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.12em',marginBottom:10}}>LeanSpark Stress-Test Pillars</p>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'1rem'}}>
                    {[
                      {label:'Desirability',value:scores.desirability,w:'28%',desc:'Market pull'},
                      {label:'Feasibility', value:scores.feasibility, w:'22%',desc:'Tech readiness'},
                      {label:'Viability',   value:scores.viability,   w:'18%',desc:'Financial model'},
                      {label:'Scalability', value:scores.scalability, w:'17%',desc:'Team execution'},
                      {label:'Confidence',  value:scores.confidence,  w:'15%',desc:'Risk-adjusted'},
                    ].map(({label,value,w,desc})=>(
                      <div key={label}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                          <div>
                            <span className="mono" style={{fontSize:'var(--fs-xs)',color:'#8a8680',textTransform:'uppercase',display:'block'}}>{label}</span>
                            <span style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>{desc}</span>
                          </div>
                          <span className="mono" style={{fontSize:'var(--fs-base)',fontWeight:700,color:scoreColor(parseFloat(value))}}>{value}</span>
                        </div>
                        <div className="pbar"><div className="pfill" style={{width:`${parseFloat(value)*10}%`,background:scoreColor(parseFloat(value))}}></div></div>
                        <div className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginTop:3}}>Weight {w}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              {/* ── STRESS-TEST DIAGNOSTICS ── */}

              {/* Assumption Confidence Meter */}
              <div className="card" style={{padding:'1.1rem'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div>
                    <p className="mono" style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.08em'}}>Assumption Confidence</p>
                    <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:2}}>Documented assumptions vs total critical dimensions</p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <span className="syne" style={{fontSize:'1.75rem',fontWeight:800,
                      color:scores.assumptionConfidence>=70?'#34d399':scores.assumptionConfidence>=40?'#f59e0b':'#f87171'}}>
                      {scores.assumptionConfidence}%
                    </span>
                    <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginTop:1}}>
                      {scores.assumptionConfidence>=70?'HIGH CONFIDENCE':scores.assumptionConfidence>=40?'MODERATE':'LOW — HIGH UNCERTAINTY'}
                    </p>
                  </div>
                </div>
                <div className="pbar" style={{height:5}}>
                  <div className="pfill" style={{
                    width:`${scores.assumptionConfidence}%`,height:'100%',
                    background:scores.assumptionConfidence>=70?'#34d399':scores.assumptionConfidence>=40?'#f59e0b':'#f87171'
                  }}></div>
                </div>
                <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:6}}>
                  Fill in problem, solution, why-now, advantage, revenue model, TAM, notes in each section to increase confidence.
                </p>
              </div>

              {/* Kill Switches */}
              {scores.killSwitches.length>0&&(
                <div style={{background:'rgba(248,113,113,.05)',border:'1px solid rgba(248,113,113,.25)',borderRadius:'1.1rem',padding:'1.1rem'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                    <div style={{width:6,height:6,borderRadius:'50%',background:'#f87171',boxShadow:'0 0 6px #f87171',flexShrink:0}}></div>
                    <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#f87171',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em'}}>
                      Kill Switches Triggered ({scores.killSwitches.length})
                    </p>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {scores.killSwitches.map(k=>(
                      <div key={k.code} style={{display:'flex',gap:10,alignItems:'flex-start',
                        background:'rgba(248,113,113,.06)',borderRadius:8,padding:'.6rem .8rem'}}>
                        <span className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:'#f87171',
                          background:'rgba(248,113,113,.15)',padding:'2px 6px',borderRadius:4,flexShrink:0}}>{k.code}</span>
                        <div>
                          <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#f87171',fontWeight:700}}>{k.label}</p>
                          <p style={{fontSize:'var(--fs-base)',color:'#9a9690',marginTop:2,lineHeight:1.4}}>{k.reason}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Red Flags & Strengths side by side */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:'1rem'}}>
                {/* Red Flags */}
                {scores.redFlags.length>0&&(
                  <div style={{background:'rgba(245,158,11,.04)',border:'1px solid rgba(245,158,11,.2)',borderRadius:'1.1rem',padding:'1rem'}}>
                    <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#f59e0b',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:8}}>
                      ⚠ Red Flags ({scores.redFlags.length})
                    </p>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {scores.redFlags.map((f,i)=>(
                        <div key={i} style={{display:'flex',gap:7,alignItems:'flex-start'}}>
                          <span style={{color:'#f59e0b',flexShrink:0,marginTop:1,fontSize:'var(--fs-sm)'}}>›</span>
                          <p style={{fontSize:'var(--fs-base)',color:'#9a9690',lineHeight:1.4}}>{f}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {/* Strengths */}
                {scores.strengths.length>0&&(
                  <div style={{background:'rgba(52,211,153,.04)',border:'1px solid rgba(52,211,153,.15)',borderRadius:'1.1rem',padding:'1rem'}}>
                    <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#34d399',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:8}}>
                      ✓ Confirmed Strengths ({scores.strengths.length})
                    </p>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {scores.strengths.map((s,i)=>(
                        <div key={i} style={{display:'flex',gap:7,alignItems:'flex-start'}}>
                          <span style={{color:'#34d399',flexShrink:0,marginTop:1,fontSize:'var(--fs-sm)'}}>✓</span>
                          <p style={{fontSize:'var(--fs-base)',color:'#9a9690',lineHeight:1.4}}>{s}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* Radar */}
              <div className="card" style={{padding:'1.25rem'}}>
                <p className="mono" style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12}}>LeanSpark 5-Pillar Radar</p>
                <RadarChart data={radarData}/>
              </div>
              {/* Section insights */}
              {Object.keys(sectionAI).length>0&&(
                <div className="card" style={{padding:'1.1rem'}}>
                  <p className="mono" style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Section Insights Summary</p>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {Object.entries(sectionAI).filter(([_,v])=>v).map(([k,v])=>(
                      <div key={k}>
                        <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--gold-b)',textTransform:'uppercase',fontWeight:700,marginBottom:3}}>{k} dimension</p>
                        <p style={{fontSize:'var(--fs-base)',color:'#8a8680',lineHeight:1.5}}>{v.substring(0,180)}{v.length>180?'…':''}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* AI verdict */}
              {aiText?(
                <AIBlock text={aiText} streaming={false} label="Full AI Diligence Verdict"/>
              ):(
                <div className="ai-block" style={{textAlign:'center',padding:'2rem'}}>
                  <div style={{display:'flex',justifyContent:'center',marginBottom:8}}><Icon name="sparkles" size={22} style={{color:'var(--text-3)'}}/></div>
                  <p style={{fontSize:'.8rem',color:'var(--text-3)',marginBottom:12}}>Run the AI Diligence Engine (Step 8) for the full institutional verdict.</p>
                  <button onClick={()=>goStep(8)} className="syne"
                    style={{padding:'.5rem 1.1rem',borderRadius:'.7rem',fontSize:'var(--fs-sm)',fontWeight:700,
                      textTransform:'uppercase',letterSpacing:'.08em',background:'var(--gold-dim)',
                      color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer'}}>
                    Go to AI Engine →
                  </button>
                </div>
              )}
              {/* Expert sign-off */}
              <div>
                <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Expert Sign-off & Gate Conditions</label>
                <textarea name="expertNote" value={form.expertNote} onChange={hi} className="field" style={{height:96,resize:'none'}}
                  placeholder="Analyst recommendation, conditions precedent, next milestones, escalation path..."/>
              </div>
              {/* Footer */}
              <div style={{display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8,paddingTop:'1rem',borderTop:'1px solid rgba(255,255,255,.05)'}}>
                <div><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>SL-EZP-2026 // CONFIDENTIAL</p><p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>6-Dimension Institutional Assessment Framework</p></div>
                <div style={{textAlign:'right'}}>{form.partnerName&&<p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>{form.partnerName}</p>}<p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>Star Labs Global Intelligence</p></div>
              </div>
            </div>
          )}

          {/* Navigation */}
          <div className="no-print" style={{marginTop:'2rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <button onClick={prev} disabled={step===0}
              style={{display:'flex',alignItems:'center',gap:6,fontSize:'var(--fs-sm)',fontWeight:700,
                color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.08em',background:'none',
                border:'none',cursor:'pointer',fontFamily:'Syne',opacity:step===0?0:1,transition:'color .2s'}}
              onMouseOver={e=>e.currentTarget.style.color='#fff'}
              onMouseOut={e=>e.currentTarget.style.color='#374151'}>
              <Icon name="arrow-left" size={11}/> Back
            </button>
            {step<STEPS.length-1&&(
              <button onClick={next}
                style={{display:'flex',alignItems:'center',gap:6,padding:'.6rem 1.4rem',borderRadius:'.8rem',
                  fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',
                  background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',
                  cursor:'pointer',fontFamily:'Syne',transition:'all .2s'}}>
                Next <Icon name="arrow-right" size={11}/>
              </button>
            )}
          </div>
        </main>
      </div>

      {/* ── Footer ── */}
      <footer className="no-print" style={{borderTop:'1px solid rgba(255,255,255,.04)',padding:'1rem 1.5rem',
        display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'.1em'}}>Star Labs Global Intelligence // EZP Pro 2.0</p>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>6 Dimensions · AI-Powered · Institutional Grade</span>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:5,height:5,borderRadius:'50%',background:'#34d399',boxShadow:'0 0 4px #34d399'}}></div>
            <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>Engine Online</span>
          </div>
        </div>
      </footer>

      {/* ── Mobile Bottom Nav ── */}
      {/* Mobile bottom nav — show condensed key steps only */}
      <nav className="mobile-nav no-print">
        {[
          {i:0,icon:'file-scan',   title:'Intake'},
          {i:2,icon:'cpu',         title:'Tech'},
          {i:3,icon:'bar-chart-2', title:'Finance'},
          {i:4,icon:'shield-alert',title:'Risk'},
          {i:7,icon:'paperclip',   title:'Evidence'},
          {i:8,icon:'sparkles',    title:'AI'},
          {i:9,icon:'shield-check',title:'Verdict'},
        ].map(({i,icon,title})=>(
          <button key={i} className={`mob-btn ${step===i?'active':''}`} onClick={()=>goStep(i)}>
            <Icon name={icon} size={16} style={{color:step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.5)':'#555b6a'}}/>
            <span style={{color:step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.4)':'#555b6a'}}>{title}</span>
          </button>
        ))}
      </nav>

    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
