<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="description" content="Star Labs EZP Pro — Emerging Zone Protocol. AI-powered institutional tech assessment."/>
<meta property="og:title" content="Star Labs | EZP Pro"/>
<meta property="og:description" content="Emerging Zone Protocol — 6-Dimension AI Assessment Platform"/>
<meta name="theme-color" content="#05060a"/>
<title>Star Labs | EZP Pro — Emerging Zone Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#05060a;--card:#0f1118;--card2:#131620;
  --gold:#c9a84c;--gold-b:#f0c84a;
  --gold-dim:rgba(201,168,76,0.12);--gold-border:rgba(201,168,76,0.22);
  --text:#eeeae0;--muted:#555b6a;
  --red:#f87171;--green:#34d399;--blue:#60a5fa;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;}
.mono{font-family:'Space Mono',monospace;}
.syne{font-family:'Syne',sans-serif;}

/* Grain */
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9998;opacity:.5;}

/* Orbs */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,.07) 0%,transparent 70%);top:-180px;left:50%;transform:translateX(-50%);}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(96,165,250,.04) 0%,transparent 70%);bottom:0;right:-80px;}

/* Scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:99px;}

/* Cards */
.card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:1.1rem;}
.card-gold{background:var(--card);border:1px solid var(--gold-border);border-radius:1.1rem;}
.card-info{background:rgba(96,165,250,.04);border:1px solid rgba(96,165,250,.15);border-radius:1.1rem;}
.card-success{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.15);border-radius:1.1rem;}
.card-warn{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.2);border-radius:1.1rem;}

/* Nav sidebar */
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-radius:.55rem;
  font-size:.65rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;border:1px solid transparent;
  color:var(--muted);font-family:'Syne',sans-serif;position:relative;width:100%;background:none;}
.nav-item:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.03);}
.nav-item.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);}
.nav-item.done::after{content:'✓';position:absolute;right:.7rem;font-size:.55rem;color:var(--green);opacity:.8;}
.nav-section-label{font-size:.5rem;letter-spacing:.15em;color:rgba(255,255,255,.18);
  text-transform:uppercase;font-family:'Space Mono',monospace;padding:1.1rem .9rem .35rem;}

/* Mobile bottom nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(5,6,10,.97);border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(20px);padding:.5rem .75rem;padding-bottom:env(safe-area-inset-bottom,.5rem);}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;
  padding:.4rem .5rem;border-radius:.5rem;border:none;background:none;
  color:var(--muted);cursor:pointer;transition:all .15s;flex:1;font-family:'Space Mono',monospace;}
.mob-btn span{font-size:.45rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.mob-btn.active{color:var(--gold);}
.mob-btn.active svg{filter:drop-shadow(0 0 4px rgba(201,168,76,.6));}

@media(max-width:768px){
  .mobile-nav{display:flex;}
  .desktop-sidebar{display:none!important;}
  .main-content{padding-bottom:5rem!important;}
  .header-subtitle{display:none;}
}

/* Fields */
.field{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);color:var(--text);
  border-radius:.7rem;padding:.75rem 1rem;width:100%;font-family:'Inter',sans-serif;
  font-size:.875rem;transition:border-color .2s,box-shadow .2s;outline:none;}
.field:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(201,168,76,.07);}
.field::placeholder{color:#2a2f3a;}
select.field option{background:#0f1118;}

/* Sliders */
input[type="range"]{-webkit-appearance:none;width:100%;height:3px;
  background:rgba(255,255,255,.07);border-radius:99px;cursor:pointer;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
  width:15px;height:15px;border-radius:50%;background:var(--bg);
  border:2px solid var(--gold);box-shadow:0 0 8px rgba(201,168,76,.5);}
input[type="range"]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--bg);border:2px solid var(--gold);cursor:pointer;}

/* Gold text */
.gold-text{background:linear-gradient(135deg,#c9a84c,#f0c84a 45%,#c9a84c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Progress bars */
.pbar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));
  border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}

/* Tags */
.tag{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:99px;font-family:'Space Mono',monospace;
  display:inline-flex;align-items:center;gap:.25rem;}

/* AI block */
.ai-block{background:linear-gradient(135deg,rgba(201,168,76,.03),rgba(201,168,76,.07));
  border:1px solid var(--gold-border);border-radius:.9rem;padding:1.5rem;
  position:relative;overflow:hidden;}
.ai-block::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* Matrix cell (slider card) */
.mxcell{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:.75rem;padding:1rem;transition:all .2s;}
.mxcell:hover{border-color:var(--gold-border);background:rgba(201,168,76,.02);}

/* Heatmap cells */
.hmap0{background:rgba(248,113,113,.15);}
.hmap1{background:rgba(251,146,60,.12);}
.hmap2{background:rgba(250,204,21,.1);}
.hmap3{background:rgba(52,211,153,.1);}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .3s ease forwards;}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
.shimmer-btn{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-b) 25%,var(--gold) 50%,var(--gold-b) 75%,var(--gold) 100%);
  background-size:200% auto;animation:shimmer 3s linear infinite;}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.35);}50%{box-shadow:0 0 0 8px rgba(201,168,76,0);}}
.pulse-gold{animation:pulse-ring 2.5s infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.typing-cursor::after{content:'▋';animation:blink .9s infinite;color:var(--gold);}

/* Radar svg labels */
.rl{font-size:8.5px;fill:#555b6a;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}

/* Step dots */
.step-dot{height:3px;border-radius:99px;transition:all .3s;}

/* Print */
@media print{
  .no-print{display:none!important;}
  body{background:#fff;color:#000;}
  .card,.card-gold{border:1px solid #ddd!important;background:#fafafa!important;}
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div id="root"></div>

<script type="text/babel">
const {useState,useMemo,useEffect,useRef,useCallback} = React;

// ── Icon ─────────────────────────────────────────────────────────────────────
const Icon = ({name,size=16,style={}}) => {
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide&&ref.current) window.lucide.createIcons({rootNode:ref.current}); },[name]);
  return <span ref={ref} style={style}><i data-lucide={name} style={{width:size,height:size,display:'inline-flex',verticalAlign:'middle'}}></i></span>;
};

// ── Logo ─────────────────────────────────────────────────────────────────────
const Logo = () => {
  const [err,setErr] = useState(false);
  if(err) return <span style={{fontFamily:"'Syne',sans-serif",fontWeight:900,color:"#fff",letterSpacing:"-.04em",fontSize:"1.25rem",lineHeight:1}}>STAR<br/><span style={{color:"var(--gold)"}}>LABS</span></span>;
  return <img src="logo.png" alt="Star Labs" style={{height:36,width:'auto',objectFit:'contain'}} onError={()=>setErr(true)}/>;
};

// ── Helpers ───────────────────────────────────────────────────────────────────
const clamp = (v,mn=0,mx=10) => Math.min(mx,Math.max(mn,v));
const fmt = (v,d=1) => parseFloat(v).toFixed(d);
const scoreColor = v => v>=8?'#34d399':v>=6.5?'#c9a84c':v>=4.5?'#f59e0b':'#f87171';

// ── Radar ─────────────────────────────────────────────────────────────────────
const RadarChart = ({data,size=260}) => {
  const cx=size/2,cy=size/2,r=size*.34,n=data.length;
  const pts = data.map((d,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    return{...d,angle,ox:cx+r*Math.cos(angle),oy:cy+r*Math.sin(angle)};
  });
  const polyAt = scale => pts.map(p=>{
    const v = scale!==undefined?scale:(p.value/10);
    return `${cx+r*v*Math.cos(p.angle)},${cy+r*v*Math.sin(p.angle)}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:'100%',maxWidth:300,display:'block',margin:'0 auto'}}>
      {[.2,.4,.6,.8,1].map(l=><polygon key={l} points={polyAt(l)} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>)}
      {pts.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p.ox} y2={p.oy} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      <polygon points={pts.map(p=>{const v=p.value/10;return `${cx+r*v*Math.cos(p.angle)},${cy+r*v*Math.sin(p.angle)}`;}).join(' ')}
        fill="rgba(201,168,76,0.12)" stroke="#c9a84c" strokeWidth="1.5" strokeLinejoin="round"/>
      {pts.map((p,i)=>{const v=p.value/10;return <circle key={i} cx={cx+r*v*Math.cos(p.angle)} cy={cy+r*v*Math.sin(p.angle)} r="3.5" fill="#c9a84c"/>;})}
      {pts.map((p,i)=><text key={i} x={cx+(r+18)*Math.cos(p.angle)} y={cy+(r+18)*Math.sin(p.angle)} textAnchor="middle" dominantBaseline="middle" className="rl">{p.label}</text>)}
    </svg>
  );
};

// ── Score Ring ────────────────────────────────────────────────────────────────
const ScoreRing = ({score,max=10,label="EZP"}) => {
  const pct=clamp(score,0,max)/max,circ=2*Math.PI*75,offset=circ*(1-pct),color=scoreColor(score);
  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="9"/>
      <circle cx="90" cy="90" r="75" fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={offset} transform="rotate(-90 90 90)"
        style={{transition:'stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)',filter:`drop-shadow(0 0 8px ${color}80)`}}/>
      <text x="90" y="84" textAnchor="middle" dominantBaseline="middle"
        style={{fontFamily:'Syne',fontSize:34,fontWeight:800,fill:color}}>{fmt(score)}</text>
      <text x="90" y="106" textAnchor="middle" dominantBaseline="middle"
        style={{fontFamily:'Space Mono',fontSize:7,fill:'#555b6a',letterSpacing:2,textTransform:'uppercase'}}>/{max} {label}</text>
    </svg>
  );
};

// ── AI Block ──────────────────────────────────────────────────────────────────
const AIBlock = ({text,streaming,label="AI Analysis"}) => (
  <div className="ai-block" style={{marginTop:'1rem'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:'var(--gold)',boxShadow:'0 0 6px var(--gold)',flexShrink:0}}></div>
      <span className="mono" style={{fontSize:'.6rem',color:'#fbbf24',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase'}}>{label}</span>
      {streaming&&<span className="mono spin" style={{fontSize:'.6rem',color:'#555b6a',marginLeft:4}}>⟳</span>}
    </div>
    <p className={`${streaming?'typing-cursor':''}`}
      style={{fontSize:'.85rem',lineHeight:1.7,color:'#d1d5db',whiteSpace:'pre-wrap'}}>
      {text||(streaming?'':<span style={{color:'#3f4451',fontStyle:'italic'}}>Analysis will appear here.</span>)}
    </p>
  </div>
);

// ── Slider Card ───────────────────────────────────────────────────────────────
const Slider = ({label,name,value,onChange,min=1,max=10,step=1,description,accent}) => {
  const pct=((value-min)/(max-min))*100,color=accent||scoreColor(value);
  return (
    <div className="mxcell">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span className="syne" style={{fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'#9ca3af'}}>{label}</span>
        <span className="mono" style={{fontSize:'1.2rem',fontWeight:700,color}}>{value>0?value:`${value}`}</span>
      </div>
      <input type="range" name={name} min={min} max={max} step={step} value={value} onChange={onChange}/>
      <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${pct}%`,background:color}}></div></div>
      {description&&<p style={{fontSize:'.7rem',color:'#4b5563',marginTop:6}}>{description}</p>}
    </div>
  );
};

// ── AI Button ─────────────────────────────────────────────────────────────────
const AIBtn = ({onClick,loading,label}) => (
  <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
    <button onClick={onClick} disabled={loading}
      style={{display:'flex',alignItems:'center',gap:6,padding:'.55rem 1.1rem',borderRadius:'.7rem',
        fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',
        background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',
        cursor:'pointer',fontFamily:'Syne',transition:'all .2s',opacity:loading?.7:1}}>
      <Icon name={loading?'loader':'cpu'} size={11} style={{display:'inline-flex',className:loading?'spin':''}}/>
      {loading?'Analyzing...':label||'AI Analysis'}
    </button>
  </div>
);

// ── Constants ─────────────────────────────────────────────────────────────────
const STEPS = [
  {id:'intake',  title:'Intake',    icon:'file-scan',    section:'Foundation'},
  {id:'market',  title:'Market',    icon:'trending-up',  section:'Foundation'},
  {id:'tech',    title:'Tech',      icon:'cpu',          section:'Dimensions'},
  {id:'fin',     title:'Financial', icon:'bar-chart-2',  section:'Dimensions'},
  {id:'risk',    title:'Risk',      icon:'shield-alert', section:'Dimensions'},
  {id:'esg',     title:'ESG',       icon:'leaf',         section:'Dimensions'},
  {id:'team',    title:'Team',      icon:'users',        section:'Dimensions'},
  {id:'engine',  title:'AI',        icon:'sparkles',     section:'Verdict'},
  {id:'verdict', title:'Verdict',   icon:'shield-check', section:'Verdict'},
];

// ── Proxy — your Cloudflare Worker ────────────────────────────────────────────
const PROXY_URL = "https://starlabs-api-proxy.aziza-11a.workers.dev/api/analyze";

// ── App ───────────────────────────────────────────────────────────────────────
const App = () => {
  const [locked,setLocked]       = useState(true);
  const [keyVal,setKeyVal]       = useState('');
  const [keyErr,setKeyErr]       = useState(false);
  const [step,setStep]           = useState(0);
  const [aiText,setAiText]       = useState('');
  const [streaming,setStreaming] = useState(false);
  const [sectionAI,setSectionAI] = useState({});
  const [streamSec,setStreamSec] = useState(null);
  const [done,setDone]           = useState(new Set());
  const [mobileMenu,setMobileMenu] = useState(false);
  const mainRef = useRef(null);

  const [form,setForm] = useState({
    techName:'',category:'DeepTech',sector:'',problem:'',solution:'',whyNow:'',
    unfairAdvantage:'',stage:'Concept',partnerName:'',assessorDate:'',
    marketSize:6,customerUrgency:6,marketTiming:6,competitiveMoat:5,
    revenueModel:'',tam:'',marketInsight:'',marketExpertAdj:0,
    trl:5,mrl:4,ipDefensibility:5,techScalability:6,integrationComplexity:5,
    techExpertAdj:0,techNotes:'',
    capitalIntensity:5,roiPotential:6,paybackPeriod:5,fundingStage:'Pre-Seed',
    burnRisk:4,revenueReadiness:5,financialNotes:'',
    regulatoryRisk:4,geopoliticalRisk:3,supplychainRisk:4,cybersecurityRisk:3,
    talentRisk:4,competitionRisk:5,riskNotes:'',
    environmentalImpact:5,socialImpact:5,governanceReadiness:6,regulatoryCompliance:6,
    sdgAlignment:4,esgNotes:'',
    teamExpertise:6,advisoryStrength:5,validationVelocity:5,scenarioResilience:5,
    partnershipNetwork:5,executionExpertAdj:0,expertNote:''
  });

  const hi = e => {
    const {name,value,type}=e.target;
    setForm(p=>({...p,[name]:type==='range'?parseFloat(value):value}));
  };

  // ── Scores ──────────────────────────────────────────────────────────────────
  const scores = useMemo(()=>{
    const tech = clamp((form.trl*.35)+(form.ipDefensibility*.3)+(form.techScalability*.2)+((10-form.integrationComplexity)*.15)+form.techExpertAdj,0,10);
    const market = clamp((form.marketSize*.3)+(form.customerUrgency*.25)+(form.marketTiming*.2)+(form.competitiveMoat*.25)+form.marketExpertAdj,0,10);
    const financial = clamp((form.roiPotential*.35)+(form.revenueReadiness*.25)+((10-form.capitalIntensity)*.2)+((10-form.burnRisk)*.2),0,10);
    const risk = clamp(10-((form.regulatoryRisk+form.geopoliticalRisk+form.supplychainRisk+form.cybersecurityRisk+form.talentRisk+form.competitionRisk)/6),0,10);
    const esg = clamp((form.environmentalImpact*.25)+(form.socialImpact*.2)+(form.governanceReadiness*.25)+(form.regulatoryCompliance*.2)+(form.sdgAlignment*.1),0,10);
    const team = clamp((form.teamExpertise*.35)+(form.advisoryStrength*.2)+(form.validationVelocity*.2)+(form.scenarioResilience*.15)+(form.partnershipNetwork*.1)+form.executionExpertAdj,0,10);
    const composite = clamp(tech*.22+market*.28+financial*.15+risk*.12+esg*.08+team*.15,0,10);
    const fatalFlaw =
      form.marketSize<=2?"TAM too small — terminal constraint.":
      form.teamExpertise<=2?"Leadership gap — execution risk critical.":
      form.capitalIntensity>=9?"Capital intensity unsustainable.":
      form.regulatoryRisk>=9?"Regulatory blocker — prohibitive risk.":null;
    const capped = fatalFlaw?Math.min(composite,5.2):composite;
    const verdict =
      capped>=8?{status:'SPINOUT READY',color:'#34d399',label:'High Investment Grade — Proceed to Spinout Gate'}:
      capped>=6.5?{status:'ACCELERATE',color:'#c9a84c',label:'Strong Pipeline — Fast-Track Incubation Recommended'}:
      capped>=4.5?{status:'INCUBATE',color:'#f59e0b',label:'Foundry Candidate — De-risk Before Capital Commitment'}:
      {status:'TERMINATE',color:'#f87171',label:fatalFlaw||'Risk profile exceeds terminal value threshold'};
    return {tech:fmt(tech),market:fmt(market),financial:fmt(financial),risk:fmt(risk),esg:fmt(esg),team:fmt(team),composite:fmt(capped),fatalFlaw,verdict};
  },[form]);

  const radarData = [
    {label:'Tech',value:parseFloat(scores.tech)},
    {label:'Market',value:parseFloat(scores.market)},
    {label:'Fin',value:parseFloat(scores.financial)},
    {label:'Risk',value:parseFloat(scores.risk)},
    {label:'ESG',value:parseFloat(scores.esg)},
    {label:'Team',value:parseFloat(scores.team)},
  ];

  // ── Proxy call ───────────────────────────────────────────────────────────────
  const SYS = `You are the Chief Diligence Officer at Star Labs, a deep-tech corporate venture studio in the Gulf and global emerging markets. Be blunt, precise, institutionally credible. No bullet points. No headers. No markdown. Plain prose paragraphs only.`;

  const callProxy = async (sysPrompt,userPrompt,onChunk) => {
    const res = await fetch(PROXY_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemPrompt:sysPrompt,userPrompt,maxTokens:900})
    });
    if(!res.ok){const t=await res.text();throw new Error(`Proxy ${res.status}: ${t.substring(0,200)}`);}
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.text) throw new Error("Empty response from proxy.");
    for(let i=0,w=data.text.split(' ');i<w.length;i++){
      onChunk((i===0?'':' ')+w[i]);
      await new Promise(r=>setTimeout(r,16));
    }
  };

  const analyzeSection = useCallback(async(key,prompt)=>{
    setStreamSec(key);
    setSectionAI(p=>({...p,[key]:''}));
    try{
      await callProxy(SYS,prompt,chunk=>setSectionAI(p=>({...p,[key]:(p[key]||'')+chunk})));
    }catch(err){
      setSectionAI(p=>({...p,[key]:`⚠ Error: ${err.message}`}));
    }finally{setStreamSec(null);}
  },[]);

  const runFull = useCallback(async()=>{
    if(!form.techName){alert('Enter Asset Identifier first (Step 1).');return;}
    setStreaming(true);setAiText('');
    const prompt=`STAR LABS — EMERGING ZONE PROTOCOL\nFull Institutional Diligence Report\n\nASSET: ${form.techName} | ${form.category} | ${form.sector||'N/A'} | Stage: ${form.stage}\nPROBLEM: ${form.problem||'N/A'}\nSOLUTION: ${form.solution||'N/A'}\nWHY NOW: ${form.whyNow||'N/A'}\nADVANTAGE: ${form.unfairAdvantage||'N/A'}\n\nSCORES:\nTech=${scores.tech}/10 | Market=${scores.market}/10 | Financial=${scores.financial}/10\nRisk=${scores.risk}/10 | ESG=${scores.esg}/10 | Team=${scores.team}/10\nComposite EZP=${scores.composite}/10 | Gate: ${scores.verdict.status}\n${scores.fatalFlaw?`FATAL FLAW: ${scores.fatalFlaw}`:''}\n\nWrite a rigorous 4-paragraph institutional diligence verdict for the Star Labs investment committee. Para 1: technology IP and scalability. Para 2: market and competitive positioning. Para 3: financial viability and risk profile. Para 4: team execution DNA, ESG alignment, and gate conditions. Plain prose only.`;
    try{
      await callProxy(SYS,prompt,chunk=>setAiText(p=>p+chunk));
    }catch(err){
      setAiText(`⚠ AI engine error: ${err.message}\n\nCheck that your Cloudflare Worker is deployed and secrets are set.`);
    }finally{setStreaming(false);}
  },[form,scores]);

  const markDone = ()=>setDone(p=>new Set([...p,step]));
  const goStep = i=>{markDone();setStep(i);setMobileMenu(false);if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};
  const next = ()=>{markDone();setStep(s=>Math.min(STEPS.length-1,s+1));if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};
  const prev = ()=>{setStep(s=>Math.max(0,s-1));if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};

  const sections = [...new Set(STEPS.map(s=>s.section))];
  const cur = STEPS[step];

  // ── Lock Screen ──────────────────────────────────────────────────────────────
  if(locked) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'1.5rem',position:'relative',zIndex:10}}>
      <div style={{width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:'2.5rem'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:'1.25rem'}}><Logo/></div>
          <h1 className="syne" style={{fontSize:'1.5rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.02em',color:'#fff'}}>EZP Terminal</h1>
          <p className="mono" style={{fontSize:'.6rem',letterSpacing:'.2em',color:'var(--gold)',marginTop:4}}>AUTHORIZATION REQUIRED</p>
          <p style={{fontSize:'.75rem',color:'#374151',marginTop:8}}>Emerging Zone Protocol · Institutional Grade · 2026</p>
        </div>
        <div className="card-gold" style={{padding:'2rem'}}>
          <input type="password" placeholder="ACCESS KEY"
            value={keyVal}
            onChange={e=>{setKeyVal(e.target.value);setKeyErr(false);}}
            onKeyDown={e=>{if(e.key==='Enter'){if(keyVal.toUpperCase()==='STAR2026')setLocked(false);else setKeyErr(true);}}}
            className="field mono"
            style={{textAlign:'center',fontSize:'1rem',letterSpacing:'.4em',marginBottom:'1rem',
              borderColor:keyErr?'rgba(248,113,113,.4)':undefined}}
          />
          {keyErr&&<p className="mono" style={{fontSize:'.65rem',color:'#f87171',textAlign:'center',marginBottom:'.75rem'}}>ACCESS DENIED — Invalid key</p>}
          <button
            onClick={()=>keyVal.toUpperCase()==='STAR2026'?setLocked(false):setKeyErr(true)}
            className="shimmer-btn syne"
            style={{width:'100%',padding:'1rem',borderRadius:'.9rem',fontWeight:900,fontSize:'.75rem',
              textTransform:'uppercase',letterSpacing:'.15em',border:'none',color:'#05060a',cursor:'pointer'}}>
            Verify Access
          </button>
        </div>
        <p className="mono" style={{textAlign:'center',fontSize:'.55rem',color:'#1f2937',marginTop:'1.5rem',letterSpacing:'.1em'}}>SL-EZP-2026 // CLASSIFIED</p>
      </div>
    </div>
  );

  // ── Main App ─────────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh',position:'relative',zIndex:10,display:'flex',flexDirection:'column'}}>

      {/* ── Header ── */}
      <header className="no-print" style={{
        position:'sticky',top:0,zIndex:50,
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'.75rem 1.25rem',
        background:'rgba(5,6,10,.94)',backdropFilter:'blur(20px)',
        borderBottom:'1px solid rgba(255,255,255,.05)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
          <Logo/>
          <div className="header-subtitle" style={{borderLeft:'1px solid rgba(255,255,255,.08)',paddingLeft:'1rem'}}>
            <div className="syne" style={{fontSize:'.8rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'#fff'}}>Emerging Zone Protocol</div>
            <div className="mono" style={{fontSize:'.55rem',color:'#374151'}}>Pro · v2.0 · 2026</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {form.techName&&(
            <span className="tag" style={{background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)'}}>
              {form.techName.length>12?form.techName.substring(0,12)+'…':form.techName}
            </span>
          )}
          {form.techName&&(
            <span className="tag" style={{background:'rgba(255,255,255,.04)',
              color:scoreColor(parseFloat(scores.composite)),
              border:`1px solid ${scoreColor(parseFloat(scores.composite))}40`}}>
              {scores.composite}
            </span>
          )}
          <button onClick={()=>window.print()} className="tag no-print"
            style={{background:'rgba(255,255,255,.04)',color:'#555b6a',border:'1px solid rgba(255,255,255,.07)',cursor:'pointer'}}>
            <Icon name="printer" size={10}/> PDF
          </button>
        </div>
      </header>

      {/* ── Body ── */}
      <div style={{display:'flex',flex:1,maxWidth:1280,margin:'0 auto',width:'100%',padding:'1.25rem 1rem',gap:'1.25rem'}}>

        {/* ── Sidebar ── */}
        <aside className="desktop-sidebar" style={{width:176,flexShrink:0}}>
          <div style={{position:'sticky',top:80}}>
            {sections.map(sec=>(
              <div key={sec}>
                <div className="nav-section-label">{sec}</div>
                {STEPS.filter(s=>s.section===sec).map(s=>{
                  const idx=STEPS.findIndex(x=>x.id===s.id);
                  return (
                    <button key={s.id} onClick={()=>goStep(idx)}
                      className={`nav-item ${step===idx?'active':''} ${done.has(idx)&&step!==idx?'done':''}`}>
                      <Icon name={s.icon} size={12}/>
                      {s.title}
                    </button>
                  );
                })}
              </div>
            ))}

            {/* Live score widget */}
            {form.techName&&(
              <div className="card" style={{marginTop:'1.25rem',padding:'1rem'}}>
                <p className="mono" style={{fontSize:'.55rem',color:'#374151',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Live Score</p>
                <div className="syne" style={{fontSize:'2rem',fontWeight:800,color:scores.verdict.color,lineHeight:1}}>{scores.composite}</div>
                <div className="pbar" style={{margin:'6px 0'}}><div className="pfill" style={{width:`${parseFloat(scores.composite)*10}%`,background:scores.verdict.color}}></div></div>
                <p className="mono" style={{fontSize:'.5rem',fontWeight:700,color:scores.verdict.color,marginBottom:8}}>{scores.verdict.status}</p>
                {[['T',scores.tech],['M',scores.market],['F',scores.financial],['R',scores.risk],['E',scores.esg],['X',scores.team]].map(([l,v])=>(
                  <div key={l} style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
                    <span className="mono" style={{fontSize:'.55rem',width:10,flexShrink:0,color:scoreColor(parseFloat(v))}}>{l}</span>
                    <div className="pbar" style={{flex:1}}><div className="pfill" style={{width:`${parseFloat(v)*10}%`,background:scoreColor(parseFloat(v))}}></div></div>
                    <span className="mono" style={{fontSize:'.55rem',color:'#374151',width:22,textAlign:'right'}}>{v}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </aside>

        {/* ── Main ── */}
        <main ref={mainRef} className="main-content" style={{flex:1,minWidth:0,paddingBottom:'2rem'}}>
          {/* Step header */}
          <div className="no-print" style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}}>
            <div style={{width:30,height:30,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',
              background:'var(--gold-dim)',border:'1px solid var(--gold-border)',flexShrink:0}}>
              <Icon name={cur.icon} size={13} style={{color:'var(--gold)'}}/>
            </div>
            <div style={{flex:1}}>
              <div className="syne" style={{fontSize:'.6rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#374151'}}>
                {cur.section} — Step {step+1}/{STEPS.length}
              </div>
            </div>
            {/* Progress dots */}
            <div style={{display:'flex',gap:3,alignItems:'center'}}>
              {STEPS.map((_,i)=>(
                <div key={i} className="step-dot" style={{
                  width:i===step?18:5,
                  background:i===step?'var(--gold)':done.has(i)?'rgba(201,168,76,.3)':'rgba(255,255,255,.07)'
                }}></div>
              ))}
            </div>
          </div>

          {/* ════ STEP 0: INTAKE ════ */}
          {step===0&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.5rem,4vw,2.25rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.02em'}}>Foundry Intake</h2>
                <p style={{fontSize:'.8rem',color:'#4b5563',marginTop:4}}>Establish venture geometry before capital allocation.</p>
              </div>
              <div className="card" style={{padding:'1.25rem',display:'flex',flexDirection:'column',gap:'1rem'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem'}}>
                  <div style={{flex:2,minWidth:0}}>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Asset Identifier *</label>
                    <input name="techName" value={form.techName} onChange={hi} className="field syne" style={{fontSize:'1.1rem',fontWeight:700}} placeholder="e.g. PROJECT HELIOS"/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Stage</label>
                    <select name="stage" value={form.stage} onChange={hi} className="field">
                      {['Concept','Prototype','MVP','Pilot','Scale','Expansion'].map(s=><option key={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Category</label>
                    <select name="category" value={form.category} onChange={hi} className="field">
                      {['DeepTech','FinTech','HealthTech','CleanTech','AgriTech','SpaceTech','AI/ML','Robotics','Biotech','Other'].map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Target Sector</label>
                    <input name="sector" value={form.sector} onChange={hi} className="field" placeholder="Energy, Healthcare, Defense..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Market Friction (Problem)</label>
                    <textarea name="problem" value={form.problem} onChange={hi} className="field" style={{height:110,resize:'none'}} placeholder="The critical problem — specific and quantifiable..."/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Proposed Resolution (Solution)</label>
                    <textarea name="solution" value={form.solution} onChange={hi} className="field" style={{height:110,resize:'none'}} placeholder="Proprietary mechanism and technical approach..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Why Now</label>
                    <textarea name="whyNow" value={form.whyNow} onChange={hi} className="field" style={{height:80,resize:'none'}} placeholder="Catalytic conditions — regulatory shifts, tech enablers..."/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Unfair Advantage</label>
                    <textarea name="unfairAdvantage" value={form.unfairAdvantage} onChange={hi} className="field" style={{height:80,resize:'none'}} placeholder="IP, data moats, relationships, network effects..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Lead Assessor</label>
                    <input name="partnerName" value={form.partnerName} onChange={hi} className="field" placeholder="Partner / Analyst name"/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Assessment Date</label>
                    <input name="assessorDate" type="date" value={form.assessorDate} onChange={hi} className="field"/>
                  </div>
                </div>
              </div>
              {form.problem&&form.solution&&(
                <AIBtn onClick={()=>analyzeSection('intake',`Assess this venture concept (max 150 words, plain prose):\nAsset: ${form.techName} | ${form.category} | ${form.sector}\nProblem: ${form.problem}\nSolution: ${form.solution}\nWhy Now: ${form.whyNow}\nAdvantage: ${form.unfairAdvantage}\nIs problem-solution fit compelling? Is the "why now" credible? Single biggest question mark?`)}
                  loading={streamSec==='intake'} label="Quick AI Read"/>
              )}
              {(sectionAI.intake||streamSec==='intake')&&<AIBlock text={sectionAI.intake} streaming={streamSec==='intake'} label="Concept Assessment"/>}
            </div>
          )}

          {/* ════ STEP 1: MARKET ════ */}
          {step===1&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.5rem,4vw,2.25rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.02em'}}>Market Vector</h2>
                <p style={{fontSize:'.8rem',color:'#4b5563',marginTop:4}}>TAM calibration — asset must demonstrate global scale potential.</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                <Slider label="TAM / SAM Size" name="marketSize" value={form.marketSize} onChange={hi} description="1 = Niche / 10 = Global dominant market"/>
                <Slider label="Customer Urgency" name="customerUrgency" value={form.customerUrgency} onChange={hi} description="1 = Nice-to-have / 10 = Existential must-solve"/>
                <Slider label="Market Timing" name="marketTiming" value={form.marketTiming} onChange={hi} description="1 = Too early / 5 = Emerging / 10 = Perfect window"/>
                <Slider label="Competitive Moat" name="competitiveMoat" value={form.competitiveMoat} onChange={hi} description="Differentiation depth vs existing players"/>
              </div>
              <div className="card" style={{padding:'1.25rem',display:'flex',flexDirection:'column',gap:'1rem'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Revenue Model</label>
                    <select name="revenueModel" value={form.revenueModel} onChange={hi} className="field">
                      <option value="">Select model...</option>
                      {['SaaS','Licensing','Marketplace','B2G','B2B Enterprise','B2C','Usage-based','Hardware + Services','Joint Venture'].map(m=><option key={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>TAM Estimate (USD)</label>
                    <input name="tam" value={form.tam} onChange={hi} className="field" placeholder="e.g. $4.2B by 2030"/>
                  </div>
                </div>
                <div>
                  <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Market Insight / 2040 Tailwinds</label>
                  <textarea name="marketInsight" value={form.marketInsight} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="Sovereign mandates, sector tailwinds, regulatory moats..."/>
                </div>
              </div>
              <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#f59e0b',textTransform:'uppercase',letterSpacing:'.08em'}}>Expert Regional Adjustment</span>
                  <span className="mono" style={{fontWeight:700,color:'#fbbf24'}}>{form.marketExpertAdj>0?'+':''}{form.marketExpertAdj}</span>
                </div>
                <input type="range" name="marketExpertAdj" min="-3" max="3" step=".5" value={form.marketExpertAdj} onChange={hi}/>
                <p style={{fontSize:'.68rem',color:'#4b5563',marginTop:6}}>GCC/MENA regional knowledge correction (±3).</p>
              </div>
              <AIBtn onClick={()=>analyzeSection('market',`Market analysis (max 150 words, plain prose):\nTAM Score: ${form.marketSize}/10 | Urgency: ${form.customerUrgency}/10 | Timing: ${form.marketTiming}/10 | Moat: ${form.competitiveMoat}/10\nRevenue Model: ${form.revenueModel} | TAM: ${form.tam}\nInsight: ${form.marketInsight}\nIs timing credible? Is moat defensible? Biggest market risk?`)}
                loading={streamSec==='market'} label="AI Market Read"/>
              {(sectionAI.market||streamSec==='market')&&<AIBlock text={sectionAI.market} streaming={streamSec==='market'} label="Market Assessment"/>}
            </div>
          )}

          {/* ════ STEP 2: TECHNOLOGY ════ */}
          {step===2&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.5rem,4vw,2.25rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.02em'}}>Technology Dimension</h2>
                <p style={{fontSize:'.8rem',color:'#4b5563',marginTop:4}}>Readiness, IP strength, scalability, and integration complexity.</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                <div className="card-gold" style={{padding:'1.25rem'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
                    <div>
                      <p className="mono" style={{fontSize:'.6rem',color:'#fbbf24',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>TRL</p>
                      <p style={{fontSize:'.68rem',color:'#4b5563',marginTop:2}}>Technology Readiness Level</p>
                    </div>
                    <span className="syne gold-text" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1}}>{form.trl}</span>
                  </div>
                  <input type="range" name="trl" min="1" max="9" value={form.trl} onChange={hi}/>
                  <div className="pbar" style={{marginTop:6,marginBottom:10}}><div className="pfill" style={{width:`${(form.trl/9)*100}%`}}></div></div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:4,textAlign:'center'}}>
                    {[['1–3','Research'],['4–6','Prototype'],['7–9','Deployed']].map(([r,l])=>(
                      <div key={r}><span className="mono" style={{fontSize:'.55rem',color:'#c9a84c',display:'block'}}>{r}</span><span style={{fontSize:'.6rem',color:'#374151'}}>{l}</span></div>
                    ))}
                  </div>
                </div>
                <div className="card" style={{padding:'1.25rem'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
                    <div>
                      <p className="mono" style={{fontSize:'.6rem',color:'#9ca3af',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>MRL</p>
                      <p style={{fontSize:'.68rem',color:'#4b5563',marginTop:2}}>Market Readiness Level</p>
                    </div>
                    <span className="syne" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1,color:'#fff'}}>{form.mrl}</span>
                  </div>
                  <input type="range" name="mrl" min="1" max="10" value={form.mrl} onChange={hi}/>
                  <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${form.mrl*10}%`,background:'#9ca3af'}}></div></div>
                  <p style={{fontSize:'.68rem',color:'#374151',marginTop:8}}>1 = No market engagement → 10 = Full GTM deployed</p>
                </div>
              </div>
              {/* TRL/MRL alignment indicator */}
              <div className="card" style={{padding:'1rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span className="mono" style={{fontSize:'.6rem',color:'#6b7280',textTransform:'uppercase'}}>TRL / MRL Alignment</span>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div className="pbar" style={{width:100}}><div className="pfill" style={{width:`${(1-Math.abs(form.trl-form.mrl)/9)*100}%`,background:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}></div></div>
                  <span className="mono" style={{fontSize:'.6rem',fontWeight:700,color:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}>
                    {Math.abs(form.trl-form.mrl)>3?'MISALIGNED':Math.abs(form.trl-form.mrl)>1?'GAP':'ALIGNED'}
                  </span>
                </div>
              </div>

                      <div key={k}>
                        <p className="mono" style={{fontSize:'.58rem',color:'#fbbf24',textTransform:'uppercase',fontWeight:700,marginBottom:3}}>{k} dimension</p>
                        <p style={{fontSize:'.72rem',color:'#6b7280',lineHeight:1.5}}>{v.substring(0,180)}{v.length>180?'…':''}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* AI verdict */}
              {aiText?(
                <AIBlock text={aiText} streaming={false} label="Full AI Diligence Verdict"/>
              ):(
                <div className="ai-block" style={{textAlign:'center',padding:'2rem'}}>
                  <div style={{display:'flex',justifyContent:'center',marginBottom:8}}><Icon name="sparkles" size={22} style={{color:'#374151'}}/></div>
                  <p style={{fontSize:'.8rem',color:'#4b5563',marginBottom:12}}>Run the AI Diligence Engine (Step 8) for the full institutional verdict.</p>
                  <button onClick={()=>goStep(7)} className="syne"
                    style={{padding:'.5rem 1.1rem',borderRadius:'.7rem',fontSize:'.65rem',fontWeight:700,
                      textTransform:'uppercase',letterSpacing:'.08em',background:'var(--gold-dim)',
                      color:'var(--gold)',border:'1px solid var(--gold-border)',cursor:'pointer'}}>
                    Go to AI Engine →
                  </button>
                </div>
              )}
              {/* Expert sign-off */}
              <div>
                <label className="mono" style={{fontSize:'.6rem',fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Expert Sign-off & Gate Conditions</label>
                <textarea name="expertNote" value={form.expertNote} onChange={hi} className="field" style={{height:96,resize:'none'}}
                  placeholder="Analyst recommendation, conditions precedent, next milestones, escalation path..."/>
              </div>
              {/* Footer */}
              <div style={{display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8,paddingTop:'1rem',borderTop:'1px solid rgba(255,255,255,.05)'}}>
                <div><p className="mono" style={{fontSize:'.58rem',color:'#1f2937'}}>SL-EZP-2026 // CONFIDENTIAL</p><p className="mono" style={{fontSize:'.58rem',color:'#1f2937'}}>6-Dimension Institutional Assessment Framework</p></div>
                <div style={{textAlign:'right'}}>{form.partnerName&&<p className="mono" style={{fontSize:'.58rem',color:'#374151'}}>{form.partnerName}</p>}<p className="mono" style={{fontSize:'.58rem',color:'#1f2937'}}>Star Labs Global Intelligence</p></div>
              </div>
            </div>
          )}

          {/* Navigation */}
          <div className="no-print" style={{marginTop:'2rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <button onClick={prev} disabled={step===0}
              style={{display:'flex',alignItems:'center',gap:6,fontSize:'.68rem',fontWeight:700,
                color:'#374151',textTransform:'uppercase',letterSpacing:'.08em',background:'none',
                border:'none',cursor:'pointer',fontFamily:'Syne',opacity:step===0?0:1,transition:'color .2s'}}
              onMouseOver={e=>e.currentTarget.style.color='#fff'}
              onMouseOut={e=>e.currentTarget.style.color='#374151'}>
              <Icon name="arrow-left" size={11}/> Back
            </button>
            {step<STEPS.length-1&&(
              <button onClick={next}
                style={{display:'flex',alignItems:'center',gap:6,padding:'.6rem 1.4rem',borderRadius:'.8rem',
                  fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',
                  background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',
                  cursor:'pointer',fontFamily:'Syne',transition:'all .2s'}}>
                Next <Icon name="arrow-right" size={11}/>
              </button>
            )}
          </div>
        </main>
      </div>

      {/* ── Footer ── */}
      <footer className="no-print" style={{borderTop:'1px solid rgba(255,255,255,.04)',padding:'1rem 1.5rem',
        display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <p className="mono" style={{fontSize:'.55rem',color:'#1f2937',textTransform:'uppercase',letterSpacing:'.1em'}}>Star Labs Global Intelligence // EZP Pro 2.0</p>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="mono" style={{fontSize:'.55rem',color:'#1f2937'}}>6 Dimensions · AI-Powered · Institutional Grade</span>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:5,height:5,borderRadius:'50%',background:'#34d399',boxShadow:'0 0 4px #34d399'}}></div>
            <span className="mono" style={{fontSize:'.55rem',color:'#1f2937'}}>Engine Online</span>
          </div>
        </div>
      </footer>

      {/* ── Mobile Bottom Nav ── */}
      <nav className="mobile-nav no-print">
        {STEPS.map((s,i)=>(
          <button key={s.id} className={`mob-btn ${step===i?'active':''}`} onClick={()=>goStep(i)}>
            <Icon name={s.icon} size={16} style={{color:step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.5)':'#374151'}}/>
            <span style={{color:step===i?'var(--gold)':done.has(i)?'rgba(201,168,76,.4)':'#374151'}}>{s.title}</span>
          </button>
        ))}
      </nav>

    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
