<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Alpha-2 Strategic Intelligence</title>
    <!-- Modern Tech Stack CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #080808;
            --surface: rgba(18, 20, 24, 0.85);
            --accent-gold: #c5a059;
            --accent-charcoal: #2a2f35;
            --text-champagne: #e5e1d8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep); 
            color: var(--text-champagne); 
            margin: 0; 
            overflow-x: hidden; 
        }

        /* Gold-Standard Glassmorphism */
        .glass-panel { 
            background: var(--surface); 
            backdrop-filter: blur(40px) saturate(180%); 
            border: 1px solid rgba(197, 160, 89, 0.1); 
            box-shadow: 0 30px 100px -20px rgba(0, 0, 0, 0.8);
        }

        .command-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(197, 160, 89, 0.1);
            color: var(--text-champagne);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.05);
            outline: none;
        }

        /* Expert Adjustment Slider styling */
        .expert-slider::-webkit-slider-thumb { 
            border: 4px solid #f59e0b !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5) !important;
        }

        input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(197, 160, 89, 0.05); height: 6px; border-radius: 10px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            margin-top: -8px; 
            background: var(--text-champagne); 
            height: 22px; 
            width: 22px; 
            border-radius: 50%; 
            border: 5px solid var(--accent-gold);
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.5);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gold-glow {
            position: fixed;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.03) 0%, transparent 70%);
            z-index: -1;
            filter: blur(120px);
            pointer-events: none;
        }

        .evidence-tag {
            background: rgba(197, 160, 89, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.15);
            color: var(--accent-gold);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-ui { animation: fadeIn 0.6s ease-out forwards; }

        .gold-gradient-text {
            background: linear-gradient(135deg, #c5a059 0%, #f1d592 50%, #c5a059 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ size = "w-40 h-40" }) => {
            const [imgError, setImgError] = useState(false);
            if (imgError) return <span className="font-black text-white italic tracking-tighter text-3xl">STAR LABS</span>;
            return <img src="logo.jpg" alt="Star Labs" className={`${size} object-contain block`} onError={() => setImgError(true)} />;
        };

        const ProtocolBanner = ({ text }) => (
            <div className="flex items-start gap-4 p-6 rounded-2xl bg-[#c5a05908] border border-[#c5a05920] w-fit max-w-4xl shadow-[0_0_30px_rgba(197,160,89,0.03)] mb-10">
                <Icon name="shield-check" className="text-[#c5a059] mt-0.5 shrink-0" size={16} />
                <p className="text-[11px] text-[#e5e1d890] uppercase tracking-[0.25em] leading-relaxed">
                    <span className="font-black text-[#c5a059] mr-2">EZP DIRECTIVE //</span> 
                    {text}
                </p>
            </div>
        );

        const EvidenceSlot = ({ label, onUpload, files = [] }) => (
            <div className="space-y-4 mt-8">
                <div className="flex justify-between items-center">
                    <label className="text-[11px] font-black uppercase text-slate-500 tracking-widest">{label}</label>
                    <span className="text-[9px] font-bold text-[#c5a059] uppercase tracking-widest">{files.length} Verified Attachments</span>
                </div>
                <div className="relative group">
                    <input 
                        type="file" multiple
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
                        onChange={(e) => onUpload(e.target.files)}
                    />
                    <div className="command-input rounded-2xl p-8 border-dashed border-2 border-[#c5a05910] group-hover:border-[#c5a05940] transition-all flex flex-col items-center gap-3">
                        <Icon name="upload-cloud" size={24} className="text-slate-600 group-hover:text-[#c5a059]" />
                        <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Upload Documentation / Evidence</p>
                    </div>
                </div>
                <div className="flex flex-wrap gap-2">
                    {files.map((f, i) => (
                        <div key={i} className="evidence-tag px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest flex items-center gap-2">
                            <Icon name="file-text" size={10} /> {f.name}
                        </div>
                    ))}
                </div>
            </div>
        );

        const ExpertAdjustment = ({ label, value, name, onChange, description }) => (
            <div className="mt-12 p-8 rounded-[2.5rem] bg-[#c5a05905] border border-[#c5a05915] shadow-inner">
                <div className="flex justify-between items-center mb-5">
                    <div className="flex items-center gap-4">
                        <div className="p-2 rounded-lg bg-[#c5a05910]"><Icon name="user-check" className="text-[#c5a059]" size={20} /></div>
                        <span className="text-[12px] font-black uppercase text-[#c5a059] tracking-[0.2em]">Expert Calibration: {label}</span>
                    </div>
                    <span className="text-2xl font-black text-[#c5a059]">{value > 0 ? `+${value}` : value}</span>
                </div>
                <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-8 leading-relaxed">{description}</p>
                <input 
                    type="range" min="-3" max="3" step="0.5" 
                    name={name} value={value} onChange={onChange}
                    className="expert-slider"
                />
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', whyNow: '',
                trl: 4, mrl: 3, marketSize: 6, customerUrgency: 6,
                teamExpertise: 7, ipDefensibility: 6, capitalIntensity: 4,
                scenarioResilience: 5, validationVelocity: 5,
                uvp: '', unfairAdvantage: '', revenueStreams: '', costStructure: '',
                marketExpertAdj: 0, techExpertAdj: 0, executionExpertAdj: 0,
                expertNote: '',
                intakeDocs: [], marketDocs: [], technicalDocs: [], velocityDocs: []
            });

            const steps = [
                { id: 'intake', title: 'Intake Audit', icon: 'binary' },
                { id: 'market', title: 'Market Vector', icon: 'zap' },
                { id: 'readiness', title: 'Readiness Matrix', icon: 'layers' },
                { id: 'radar', title: 'Scenario Radar', icon: 'radar' },
                { id: 'canvas', title: 'Lean Canvas', icon: 'layout-template' },
                { id: 'spinout', title: 'Spinout Velocity', icon: 'rocket' },
                { id: 'report', title: 'EZP Verdict', icon: 'shield-check' }
            ];

            const analysis = useMemo(() => {
                const techScore = (formData.trl * 0.5) + (formData.ipDefensibility * 0.5) + formData.techExpertAdj;
                const marketScore = (formData.mrl * 0.3) + (formData.customerUrgency * 0.3) + (formData.marketSize * 0.4) + formData.marketExpertAdj;
                const executionRisk = ((10 - formData.capitalIntensity) * 0.4) + (formData.scenarioResilience * 0.3) + (formData.validationVelocity * 0.3) + formData.executionExpertAdj;
                
                let score = ((techScore * 0.3) + (marketScore * 0.4) + (executionRisk * 0.3)).toFixed(1);
                
                let fatalFlaw = "";
                if (formData.marketSize <= 3) fatalFlaw = "TAM MISCALCULATION: Insufficient scale potential.";
                else if (formData.teamExpertise <= 3) fatalFlaw = "TEAM INCAPABILITY: Technical/Foundational gap.";
                else if (formData.capitalIntensity >= 9) fatalFlaw = "FUND MISALLOCATION: Extreme burn intensity.";
                
                if (fatalFlaw !== "") score = Math.min(parseFloat(score), 5.4).toFixed(1);

                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + ((10 - formData.capitalIntensity) * 0.3)).toFixed(1);

                let verdict = { status: 'INCUBATE', color: 'text-[#c5a059]', border: 'border-[#c5a05940]', glow: 'shadow-[#c5a05920]', advice: "Meets foundational R&D thresholds. Retain for internal EZP de-risking." };
                if (parseFloat(score) >= 8.2) verdict = { status: 'SPINOUT READY', color: 'text-emerald-400', border: 'border-emerald-500/30', glow: 'shadow-emerald-500/20', advice: "Alpha-grade verified. Authorize immediate standalone corporate formation." };
                else if (parseFloat(score) < 5.5) verdict = { status: 'TERMINATE', color: 'text-rose-500', border: 'border-rose-500/30', glow: 'shadow-rose-500/20', advice: fatalFlaw || "Execution risk exceeds projected terminal value." };

                return { score, spinoutIndex, ...verdict };
            }, [formData]);

            const handleFileUpload = (category, files) => {
                const newFiles = Array.from(files);
                setFormData(prev => ({ ...prev, [category]: [...prev[category], ...newFiles] }));
            };

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: (type === 'range' || name.includes('Adj')) ? parseFloat(value) : value }));
            };

            const unlock = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("AUTH_ERROR: SECURE ACCESS DENIED");
            };

            if (isLocked) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[#050505]">
                    <div className="max-w-md w-full glass-panel p-20 rounded-[4.5rem] text-center border-[#c5a05915]">
                        <div className="flex justify-center mb-10"><Logo size="w-64 h-64" /></div>
                        <h1 className="text-3xl font-black text-white tracking-tighter uppercase italic mb-2">EZP Terminal</h1>
                        <p className="text-[10px] font-bold text-slate-500 tracking-[0.5em] mb-14 uppercase italic">Classification: Founder Access</p>
                        <form onSubmit={unlock} className="space-y-6">
                            <input 
                                type="password" placeholder="PROTOCOL KEY" value={accessKey}
                                onChange={(e) => setAccessKey(e.target.value)}
                                className="w-full command-input rounded-2xl px-6 py-6 text-center text-[#c5a059] tracking-[1em] font-mono outline-none text-xl"
                            />
                            <button className="w-full py-6 bg-[#c5a059] hover:bg-[#d4af37] text-black font-extrabold uppercase tracking-widest rounded-2xl shadow-2xl transition-all active:scale-95">Decrypt Protocol</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto py-16 px-10">
                    <div class="gold-glow" style={{top: '-400px', right: '-400px'}}></div>
                    <div class="gold-glow" style={{bottom: '-400px', left: '-400px'}}></div>
                    
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between mb-24 gap-12 pb-12 border-b border-white/5">
                        <div className="flex items-center gap-12">
                            <div className="w-40 h-40 flex items-center justify-center"><Logo size="w-full h-full" /></div>
                            <div className="h-20 w-px bg-white/10 hidden lg:block"></div>
                            <div>
                                <h1 className="text-5xl font-black text-white italic tracking-tighter uppercase leading-none">Alpha-2 <span className="gold-gradient-text italic">EZP</span></h1>
                                <p className="text-slate-500 text-[10px] font-black tracking-[0.8em] uppercase mt-5 italic">Star Labs Deep-Tech Foundry Interface</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-10 no-print">
                            <div className="text-right">
                                <div className="flex items-center gap-3 justify-end">
                                    <div className="w-2.5 h-2.5 bg-[#c5a059] rounded-full animate-pulse shadow-[0_0_15px_#c5a059]"></div>
                                    <span className="text-[11px] font-black text-slate-400 uppercase tracking-widest">Protocol Live</span>
                                </div>
                                <p className="text-[11px] font-black text-[#c5a059] tracking-widest mt-2 uppercase italic">Verified Investor Access</p>
                            </div>
                            <button onClick={() => window.print()} className="px-10 py-5 bg-white/5 border border-white/10 rounded-2xl text-[12px] font-bold uppercase tracking-[0.2em] flex items-center gap-4 transition-all hover:bg-white/10 text-white">
                                <Icon name="download" size={18} /> Export Audit
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-20">
                        <aside className="lg:col-span-3 space-y-5 no-print">
                            {steps.map((s, i) => (
                                <button key={s.id} onClick={() => setStep(i)} className={`w-full flex items-center gap-8 px-10 py-8 rounded-[3rem] text-[12px] font-extrabold uppercase tracking-[0.2em] transition-all border ${step === i ? 'bg-[#c5a05910] border-[#c5a05940] text-[#c5a059] shadow-2xl translate-x-4' : 'bg-transparent border-transparent text-slate-600 hover:text-slate-300 hover:bg-white/5'}`}>
                                    <Icon name={s.icon} size={22} className={step === i ? "text-[#c5a059]" : "text-slate-800"} />
                                    {s.title}
                                </button>
                            ))}
                        </aside>

                        <main className="lg:col-span-9 glass-panel rounded-[6rem] p-16 md:p-28 min-h-[850px] animate-ui relative">
                            
                            {step === 0 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-5xl font-black text-white tracking-tighter uppercase italic mb-6">Intake Audit</h2>
                                        <ProtocolBanner text="Precise friction mapping is mandatory. Problem-Solution fit is the EZP Stage 1 priority for Star Labs founders." />
                                    </div>
                                    <div className="space-y-14">
                                        <div className="space-y-5">
                                            <label className="text-[12px] font-black uppercase text-slate-500 tracking-widest">Technology Identifier</label>
                                            <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full command-input rounded-3xl px-8 py-8 text-white text-2xl outline-none italic font-bold" placeholder="PROJECT CODE..." />
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-16">
                                            <div className="space-y-5">
                                                <label className="text-[12px] font-black uppercase text-slate-500 tracking-widest">Market Friction</label>
                                                <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full command-input rounded-[3rem] p-10 h-60 outline-none resize-none leading-relaxed text-lg" placeholder="Bleeding neck wound..."></textarea>
                                            </div>
                                            <div className="space-y-5">
                                                <label className="text-[12px] font-black uppercase text-slate-500 tracking-widest">Intervention</label>
                                                <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full command-input rounded-[3rem] p-10 h-60 outline-none resize-none leading-relaxed text-lg" placeholder="Technical mechanism..."></textarea>
                                            </div>
                                        </div>
                                        <EvidenceSlot label="Concept Validation Proof (Drafts, Pre-EZP docs)" files={formData.intakeDocs} onUpload={(f) => handleFileUpload('intakeDocs', f)} />
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-16">
                                    <div>
                                        <div className="flex items-center gap-8 mb-6"><Icon name="zap" className="text-[#c5a059]" size={40} /><h2 className="text-5xl font-black text-white tracking-tighter uppercase italic">Market Vector</h2></div>
                                        <ProtocolBanner text="Eliminates TAM miscalculation. Star Labs requires global scale potential to authorize seed-stage spinouts." />
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-12">
                                        <div className="space-y-10 bg-black/30 p-12 rounded-[4rem]">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black text-slate-500 uppercase tracking-widest">TAM Depth</span><span className="text-3xl font-black text-[#c5a059]">{formData.marketSize}</span></div>
                                            <input type="range" name="marketSize" min="1" max="10" value={formData.marketSize} onChange={handleInput} />
                                        </div>
                                        <div className="space-y-10 bg-black/30 p-12 rounded-[4rem]">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black text-slate-500 uppercase tracking-widest">Urgency</span><span className="text-3xl font-black text-[#c5a059]">{formData.customerUrgency}</span></div>
                                            <input type="range" name="customerUrgency" min="1" max="10" value={formData.customerUrgency} onChange={handleInput} />
                                        </div>
                                        <div className="space-y-10 bg-black/30 p-12 rounded-[4rem]">
                                            <div className="flex justify-between items-center"><span className="text-[11px] font-black text-slate-500 uppercase tracking-widest">Timing</span><span className="text-3xl font-black text-[#c5a059]">{formData.scenarioResilience}</span></div>
                                            <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                        </div>
                                    </div>
                                    <EvidenceSlot label="Market Study Reports & Opportunity Analysis" files={formData.marketDocs} onUpload={(f) => handleFileUpload('marketDocs', f)} />
                                    <ExpertAdjustment label="Regional Nuance" name="marketExpertAdj" value={formData.marketExpertAdj} onChange={handleInput} description="Override based on sovereign mandates, GCC subsidies, or regional partnership tailwinds." />
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-5xl font-black text-white tracking-tighter uppercase italic mb-6">Readiness Matrix</h2>
                                        <ProtocolBanner text="Identifies and prevents premature scaling—the primary cause of fund misallocation in early-stage deep tech." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-16">
                                        <div className="bg-black/30 p-16 rounded-[4.5rem] border border-white/5 space-y-14 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-[#c5a059] tracking-widest flex items-center gap-5"><Icon name="cpu" size={24}/> Tech Maturity</h3><span className="text-8xl font-black text-white italic">{formData.trl}</span></div>
                                            <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                        </div>
                                        <div className="bg-black/30 p-16 rounded-[4.5rem] border border-white/5 space-y-14 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-sm font-black uppercase text-[#e5e1d8] tracking-widest flex items-center gap-5"><Icon name="globe" size={24}/> Market Maturity</h3><span className="text-8xl font-black text-white italic">{formData.mrl}</span></div>
                                            <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                        </div>
                                    </div>
                                    <EvidenceSlot label="Technical Specs, Lab Logs & Whitepapers" files={formData.technicalDocs} onUpload={(f) => handleFileUpload('technicalDocs', f)} />
                                    <ExpertAdjustment label="Barrier Verification" name="techExpertAdj" value={formData.techExpertAdj} onChange={handleInput} description="Verification of defensible moat strength AI algorithms may underestimate." />
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-16 animate-ui">
                                    <div>
                                        <div className="flex items-center gap-8 mb-6"><Icon name="radar" className="text-[#c5a059]" size={40} /><h2 className="text-5xl font-extrabold text-white tracking-tighter uppercase italic">Scenario Radar</h2></div>
                                        <ProtocolBanner text="Quantifies environmental antifragility. Ensures the project thrives under macro economic and energy shocks." />
                                    </div>
                                    <div className="bg-[#c5a05905] p-24 rounded-[6rem] shadow-inner text-center space-y-12 border border-[#c5a05910]">
                                        <div className="space-y-4">
                                            <h3 className="text-[14px] font-black uppercase text-slate-500 tracking-[0.5em]">Antifragility Index</h3>
                                            <div className="text-[12rem] font-black gold-gradient-text leading-none italic tracking-tighter">{formData.scenarioResilience}</div>
                                        </div>
                                        <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                        <p className="text-[11px] text-slate-700 uppercase tracking-[0.4em] font-black italic">Resilience against macro volatility (1=Fragile, 10=Antifragile)</p>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-16">
                                    <div>
                                        <h2 className="text-5xl font-black text-white tracking-tighter uppercase italic mb-6">Lean High-Fi Canvas</h2>
                                        <ProtocolBanner text="Commercial architecture mapping. DeepTech maturity cannot save a fundamentally flawed monetization model." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-12">
                                        {[
                                            { k: 'uvp', l: 'Value Prop', d: 'The conversion message.' },
                                            { k: 'unfairAdvantage', l: 'Defensible Moat', d: 'IP Moat depth.' },
                                            { k: 'revenueStreams', l: 'Revenue Architecture', d: 'Monetization path.' },
                                            { k: 'costStructure', l: 'Resource Model', d: 'Burn drivers.' }
                                        ].map((item) => (
                                            <div key={item.k} className="space-y-5">
                                                <label className="text-[12px] font-black uppercase tracking-widest text-slate-500">{item.l}</label>
                                                <textarea name={item.k} value={formData[item.k]} onChange={handleInput} className="w-full command-input rounded-[2.5rem] p-10 h-40 outline-none text-base leading-relaxed" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-16">
                                    <div>
                                        <div className="flex items-center gap-8 mb-6"><Icon name="rocket" className="text-[#c5a059]" size={40} /><h2 className="text-5xl font-black text-white tracking-tighter uppercase italic">Spinout Velocity</h2></div>
                                        <ProtocolBanner text="Detects team capability gaps. High technical burn or weak founder-fit is fatal to standalone survival velocity." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-14">
                                        {[
                                            { k: 'teamExpertise', l: 'Founder Capability', c: 'gold' },
                                            { k: 'ipDefensibility', l: 'Proprietary Moat', c: 'charcoal' },
                                            { k: 'capitalIntensity', l: 'Burn Intensity', c: 'rose' },
                                            { k: 'validationVelocity', l: 'Feedback Speed', c: 'emerald' }
                                        ].map((m) => (
                                            <div key={m.k} className="p-14 bg-white/5 rounded-[4rem] border border-white/5 space-y-10 shadow-2xl">
                                                <div className="flex justify-between items-center"><span className="text-[12px] font-black uppercase tracking-widest text-slate-500">{m.l}</span><span className={`text-5xl font-black italic text-white`}>{formData[m.k]}</span></div>
                                                <input type="range" name={m.k} min="1" max="10" value={formData[m.k]} onChange={handleInput} />
                                            </div>
                                        ))}
                                    </div>
                                    <EvidenceSlot label="Interview Logs, Founder Dossiers & GTM Plan" files={formData.velocityDocs} onUpload={(f) => handleFileUpload('velocityDocs', f)} />
                                    <ExpertAdjustment label="Operational Sync" name="executionExpertAdj" value={formData.executionExpertAdj} onChange={handleInput} description="Calibration based on Foundry resource availability or team execution velocity." />
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-16">
                                    <ProtocolBanner text="Synthesized EZP Final Verdict. This verified audit trail proves rigorous de-risking for Star Labs Stakeholders." />
                                    <div className={`p-24 md:p-32 rounded-[7rem] border-2 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-2xl`}>
                                        <div className="absolute top-0 right-0 p-16 opacity-[0.05] scale-[4]"><Icon name={analysis.icon} size={300} /></div>
                                        <div className="relative z-10 grid md:grid-cols-2 gap-32 items-center">
                                            <div className="space-y-16">
                                                <h2 className="text-[14px] font-black uppercase text-slate-500 tracking-[1.5em]">EZP Decision</h2>
                                                <div className={`text-[14rem] font-black ${parseFloat(analysis.score) < 5.5 ? 'text-rose-600' : 'gold-gradient-text'} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                <div className="text-6xl font-black text-white uppercase tracking-tighter italic">{analysis.status}</div>
                                                <div className="border-t border-white/10 pt-16 font-medium leading-relaxed italic"><p className="text-slate-400 text-xl">"{analysis.advice}"</p></div>
                                            </div>
                                            <div className="space-y-16">
                                                <div className="bg-black/80 p-16 rounded-[5rem] border border-white/10 shadow-2xl">
                                                    <div className="flex justify-between text-[14px] font-black uppercase mb-8 tracking-[0.3em]"><span>Spinout Readiness</span><span className="text-[#c5a059] text-4xl font-black italic">{analysis.spinoutIndex}/10</span></div>
                                                    <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-[#c5a059] transition-all duration-[3500ms] ease-out shadow-[0_0_25px_#c5a059]" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                </div>
                                                <div className="space-y-6">
                                                    <span className="text-[12px] font-black uppercase text-slate-500 tracking-widest italic underline decoration-[#c5a059] underline-offset-8">Verified Proof Locker</span>
                                                    <div className="flex flex-wrap gap-3">
                                                        {[...formData.intakeDocs, ...formData.marketDocs, ...formData.technicalDocs, ...formData.velocityDocs].map((f, i) => (
                                                            <div key={i} className="evidence-tag px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-3">
                                                                <Icon name="check-circle" size={14} className="text-[#c5a059]" /> {f.name}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <textarea 
                                                    placeholder="Final Expert Recommendation Note..." 
                                                    name="expertNote" value={formData.expertNote} onChange={handleInput}
                                                    className="w-full bg-black/60 border border-[#c5a05920] rounded-[3.5rem] p-12 h-64 outline-none text-lg italic leading-relaxed text-[#c5a059]"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="mt-32 pt-16 border-t border-white/10 flex justify-between items-center no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[12px] font-black uppercase tracking-[0.6em] text-slate-600 hover:text-white transition-all disabled:opacity-0 active:scale-90">Gate-Back</button>
                                <div className="text-[11px] font-bold text-slate-800 tracking-[1.2em] uppercase hidden lg:block italic">Star Labs // EZP-Stable Terminal</div>
                                {step < steps.length - 1 && (
                                    <button onClick={() => setStep(step + 1)} className="px-20 py-8 bg-[#c5a05910] text-[#c5a059] border border-[#c5a05940] text-[13px] font-black uppercase tracking-[0.5em] rounded-[3rem] hover:bg-[#c5a059] hover:text-black transition-all shadow-2xl active:scale-95">Next Protocol Gate</button>
                                )}
                            </div>
                        </main>
                    </div>

                    <footer className="mt-48 border-t border-white/10 pt-24 grid md:grid-cols-3 gap-32 text-slate-600">
                        <div className="space-y-12 text-left">
                            <h4 className="text-[16px] font-black uppercase tracking-widest text-white border-b border-[#c5a05940] pb-6 w-fit">Vision Philosophy</h4>
                            <p className="text-[14px] leading-relaxed font-medium italic text-slate-500">Builders, Not Bankers. Optimizing capital for Oman Vision 2040 by aligning Deep-Tech R&D with high-moat standalone corporate entities.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-14">
                             <div className="flex gap-10">
                                <div className="w-5 h-5 bg-[#c5a059] rounded-full animate-ping shadow-[0_0_20px_#c5a059]"></div>
                                <div className="w-5 h-5 bg-slate-900 rounded-full"></div>
                                <div className="w-5 h-5 bg-slate-900 rounded-full"></div>
                            </div>
                            <span className="text-[12px] font-black uppercase tracking-[2em] text-slate-800 italic">SECURE // SL-EZP-2026</span>
                        </div>
                        <div className="text-right space-y-12 ml-auto">
                             <h4 className="text-[16px] font-black uppercase tracking-widest text-white border-b border-[#c5a05940] pb-6 w-fit ml-auto">Foundry Protocol</h4>
                             <p className="text-[14px] font-black text-[#c5a059] uppercase tracking-[0.8em] animate-pulse italic text-right">System Signature: Said Saif Udeen</p>
                             <p className="text-[12px] font-bold text-slate-800 uppercase tracking-widest mt-6">Star Labs Global Intelligence Hub</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
