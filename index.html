<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="description" content="Star Labs EZP Pro — Emerging Zone Protocol. AI-powered institutional tech assessment."/>
<meta property="og:title" content="Star Labs | EZP Pro"/>
<meta property="og:description" content="Emerging Zone Protocol — 6-Dimension AI Assessment Platform"/>
<meta name="theme-color" content="#05060a"/>
<title>Star Labs | EZP Pro — Emerging Zone Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#0a0b0e;--card:#111318;--card2:#161820;
  --gold:#c9a84c;--gold-b:#e8c76a;
  --gold-dim:rgba(201,168,76,0.13);--gold-border:rgba(201,168,76,0.28);
  /* Logo-matched text palette */
  --text:#e8e4d8;        /* Silver-cream matching logo lettering */
  --text-2:#b8b4a8;      /* Secondary text — clearly readable */
  --text-3:#7a7878;      /* Tertiary / hints — still legible */
  --muted:#4a4f5c;
  --red:#f87171;--green:#34d399;--blue:#60a5fa;--amber:#f59e0b;
  /* Typography scale — min 13px for legibility */
  --fs-xs:0.75rem;       /* 12px — absolute minimum, rare use */
  --fs-sm:0.8125rem;     /* 13px — labels, tags */
  --fs-base:0.875rem;    /* 14px — body, descriptions */
  --fs-md:0.9375rem;     /* 15px — prominent labels */
  --fs-lg:1rem;          /* 16px — section titles */
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.mono{font-family:'Space Mono',monospace;}
.syne{font-family:'Syne',sans-serif;}

/* Grain */
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9998;opacity:.5;}

/* Orbs */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,.07) 0%,transparent 70%);top:-180px;left:50%;transform:translateX(-50%);}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(96,165,250,.04) 0%,transparent 70%);bottom:0;right:-80px;}

/* Scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:99px;}

/* Cards */
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:1.1rem;}
.card-gold{background:var(--card);border:1px solid var(--gold-border);border-radius:1.1rem;}
.card-info{background:rgba(96,165,250,.04);border:1px solid rgba(96,165,250,.15);border-radius:1.1rem;}
.card-success{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.15);border-radius:1.1rem;}
.card-warn{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.2);border-radius:1.1rem;}

/* Nav sidebar */
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-radius:.55rem;
  font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;border:1px solid transparent;
  color:var(--muted);font-family:'Syne',sans-serif;position:relative;width:100%;background:none;}
.nav-item:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.03);}
.nav-item.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);}
.nav-item.done::after{content:'✓';position:absolute;right:.7rem;font-size:.55rem;color:var(--green);opacity:.8;}
.nav-section-label{font-size:.5rem;letter-spacing:.15em;color:rgba(232,228,216,.35);
  text-transform:uppercase;font-family:'Space Mono',monospace;padding:1.1rem .9rem .35rem;}

/* Mobile bottom nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(5,6,10,.97);border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(20px);padding:.5rem .75rem;padding-bottom:env(safe-area-inset-bottom,.5rem);}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;
  padding:.4rem .5rem;border-radius:.5rem;border:none;background:none;
  color:var(--muted);cursor:pointer;transition:all .15s;flex:1;font-family:'Space Mono',monospace;}
.mob-btn span{font-size:.58rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.mob-btn.active{color:var(--gold);}
.mob-btn.active svg{filter:drop-shadow(0 0 4px rgba(201,168,76,.6));}

@media(max-width:768px){
  .mobile-nav{display:flex;}
  .desktop-sidebar{display:none!important;}
  .main-content{padding-bottom:5rem!important;}
  .header-subtitle{display:none;}
}

/* Fields */
.field{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--text);
  border-radius:.7rem;padding:.8rem 1rem;width:100%;font-family:'Inter',sans-serif;
  font-size:var(--fs-base);transition:border-color .2s,box-shadow .2s;outline:none;}
.field:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(201,168,76,.07);}
.field::placeholder{color:#3a4050;}
select.field option{background:#0f1118;}

/* Sliders */
input[type="range"]{-webkit-appearance:none;width:100%;height:3px;
  background:rgba(255,255,255,.07);border-radius:99px;cursor:pointer;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
  width:15px;height:15px;border-radius:50%;background:var(--bg);
  border:2px solid var(--gold);box-shadow:0 0 8px rgba(201,168,76,.5);}
input[type="range"]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--bg);border:2px solid var(--gold);cursor:pointer;}

/* Gold text */
.gold-text{background:linear-gradient(135deg,#c9a84c,#f0c84a 45%,#c9a84c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Progress bars */
.pbar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));
  border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}

/* Tags */
.tag{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:99px;font-family:'Space Mono',monospace;
  display:inline-flex;align-items:center;gap:.25rem;}

/* AI block */
.ai-block{background:linear-gradient(135deg,rgba(201,168,76,.03),rgba(201,168,76,.07));
  border:1px solid var(--gold-border);border-radius:.9rem;padding:1.5rem;
  position:relative;overflow:hidden;}
.ai-block::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* Matrix cell (slider card) */
.mxcell{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:.75rem;padding:1rem;transition:all .2s;}
.mxcell:hover{border-color:var(--gold-border);background:rgba(201,168,76,.02);}

/* Heatmap cells */
.hmap0{background:rgba(248,113,113,.15);}
.hmap1{background:rgba(251,146,60,.12);}
.hmap2{background:rgba(250,204,21,.1);}
.hmap3{background:rgba(52,211,153,.1);}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .3s ease forwards;}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
.shimmer-btn{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-b) 25%,var(--gold) 50%,var(--gold-b) 75%,var(--gold) 100%);
  background-size:200% auto;animation:shimmer 3s linear infinite;}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.35);}50%{box-shadow:0 0 0 8px rgba(201,168,76,0);}}
.pulse-gold{animation:pulse-ring 2.5s infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.typing-cursor::after{content:'▋';animation:blink .9s infinite;color:var(--gold);}

/* Radar svg labels */
.rl{font-size:10px;fill:#9a9690;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}

/* Step dots */
.step-dot{height:3px;border-radius:99px;transition:all .3s;}

/* Print */
@media print{
  .no-print{display:none!important;}
  body{background:#fff;color:#000;}
  .card,.card-gold{border:1px solid #ddd!important;background:#fafafa!important;}
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div id="root"></div>

<script type="text/babel">
const {useState,useMemo,useEffect,useRef,useCallback} = React;

// ── Icon ─────────────────────────────────────────────────────────────────────
const Icon = ({name,size=16,style={}}) => {
  const ref = useRef(null);
  useEffect(()=>{ if(window.lucide&&ref.current) window.lucide.createIcons({rootNode:ref.current}); },[name]);
  return <span ref={ref} style={style}><i data-lucide={name} style={{width:size,height:size,display:'inline-flex',verticalAlign:'middle'}}></i></span>;
};

// ── Logo ─────────────────────────────────────────────────────────────────────
const Logo = ({size=36}) => {
  const [err,setErr] = useState(false);
  if(err) return <span style={{fontFamily:"'Syne',sans-serif",fontWeight:900,color:"#fff",letterSpacing:"-.04em",fontSize:size>50?"2rem":"1.25rem",lineHeight:1,textAlign:'center',display:'block'}}>STAR<br/><span style={{color:"var(--gold)"}}>LABS</span></span>;
  return <img src="logo.png" alt="Star Labs" style={{height:size,width:'auto',objectFit:'contain',display:'block'}} onError={()=>setErr(true)}/>;
};

// ── Helpers ───────────────────────────────────────────────────────────────────
const clamp = (v,mn=0,mx=10) => Math.min(mx,Math.max(mn,v));
const fmt = (v,d=1) => parseFloat(v).toFixed(d);
const scoreColor = v => v>=8?'#34d399':v>=6.5?'#c9a84c':v>=4.5?'#f59e0b':'#f87171';

// ── Radar ─────────────────────────────────────────────────────────────────────
const RadarChart = ({data,size=260}) => {
  const cx=size/2,cy=size/2,r=size*.34,n=data.length;
  const pts = data.map((d,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    return{...d,angle,ox:cx+r*Math.cos(angle),oy:cy+r*Math.sin(angle)};
  });
  const polyAt = scale => pts.map(p=>{
    const v = scale!==undefined?scale:(p.value/10);
    return `${cx+r*v*Math.cos(p.angle)},${cy+r*v*Math.sin(p.angle)}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:'100%',maxWidth:300,display:'block',margin:'0 auto'}}>
      {[.2,.4,.6,.8,1].map(l=><polygon key={l} points={polyAt(l)} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>)}
      {pts.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p.ox} y2={p.oy} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      <polygon points={pts.map(p=>{const v=p.value/10;return `${cx+r*v*Math.cos(p.angle)},${cy+r*v*Math.sin(p.angle)}`;}).join(' ')}
        fill="rgba(201,168,76,0.12)" stroke="#c9a84c" strokeWidth="1.5" strokeLinejoin="round"/>
      {pts.map((p,i)=>{const v=p.value/10;return <circle key={i} cx={cx+r*v*Math.cos(p.angle)} cy={cy+r*v*Math.sin(p.angle)} r="3.5" fill="#c9a84c"/>;})}
      {pts.map((p,i)=><text key={i} x={cx+(r+18)*Math.cos(p.angle)} y={cy+(r+18)*Math.sin(p.angle)} textAnchor="middle" dominantBaseline="middle" className="rl">{p.label}</text>)}
    </svg>
  );
};

// ── Score Ring ────────────────────────────────────────────────────────────────
const ScoreRing = ({score,max=10,label="EZP"}) => {
  const pct=clamp(score,0,max)/max,circ=2*Math.PI*75,offset=circ*(1-pct),color=scoreColor(score);
  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="9"/>
      <circle cx="90" cy="90" r="75" fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={offset} transform="rotate(-90 90 90)"
        style={{transition:'stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)',filter:`drop-shadow(0 0 8px ${color}80)`}}/>
      <text x="90" y="84" textAnchor="middle" dominantBaseline="middle"
        style={{fontFamily:'Syne',fontSize:36,fontWeight:800,fill:color}}>{fmt(score)}</text>
      <text x="90" y="106" textAnchor="middle" dominantBaseline="middle"
        style={{fontFamily:'Space Mono',fontSize:10,fill:'#9a9690',letterSpacing:2,textTransform:'uppercase'}}>/{max} {label}</text>
    </svg>
  );
};

// ── AI Block ──────────────────────────────────────────────────────────────────
const AIBlock = ({text,streaming,label="AI Analysis"}) => (
  <div className="ai-block" style={{marginTop:'1rem'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:'var(--gold)',boxShadow:'0 0 6px var(--gold)',flexShrink:0}}></div>
      <span className="mono" style={{fontSize:'var(--fs-sm)',color:'#d4aa56',fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase'}}>{label}</span>
      {streaming&&<span className="mono spin" style={{fontSize:'var(--fs-sm)',color:'#555b6a',marginLeft:4}}>⟳</span>}
    </div>
    <p className={`${streaming?'typing-cursor':''}`}
      style={{fontSize:'var(--fs-base)',lineHeight:1.75,color:'#ccc9bc',whiteSpace:'pre-wrap'}}>
      {text||(streaming?'':<span style={{color:'#5a5650',fontStyle:'italic'}}>Analysis will appear here.</span>)}
    </p>
  </div>
);

// ── Slider Card ───────────────────────────────────────────────────────────────
const Slider = ({label,name,value,onChange,min=1,max=10,step=1,description,accent}) => {
  const pct=((value-min)/(max-min))*100,color=accent||scoreColor(value);
  return (
    <div className="mxcell">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:'#a8a49a'}}>{label}</span>
        <span className="mono" style={{fontSize:'1.2rem',fontWeight:700,color}}>{value>0?value:`${value}`}</span>
      </div>
      <input type="range" name={name} min={min} max={max} step={step} value={value} onChange={onChange}/>
      <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${pct}%`,background:color}}></div></div>
      {description&&<p style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginTop:6}}>{description}</p>}
    </div>
  );
};

// ── AI Button ─────────────────────────────────────────────────────────────────
// ── Doc Upload Card ───────────────────────────────────────────────────────────
const DocUploadCard = ({doc,uploaded,onUpload,onRemove}) => {
  const inputRef = useRef(null);
  return (
    <div style={{
      background: uploaded ? 'rgba(52,211,153,0.04)' : 'rgba(255,255,255,0.02)',
      border: `1px solid ${uploaded ? 'rgba(52,211,153,0.2)' : 'rgba(255,255,255,0.07)'}`,
      borderRadius:'.8rem', padding:'1rem',
      transition:'all .2s'
    }}>
      <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
        {/* Icon */}
        <div style={{
          width:38,height:38,borderRadius:8,flexShrink:0,
          display:'flex',alignItems:'center',justifyContent:'center',
          background: uploaded ? 'rgba(52,211,153,0.1)' : 'var(--gold-dim)',
          border: `1px solid ${uploaded ? 'rgba(52,211,153,0.2)' : 'var(--gold-border)'}`
        }}>
          <Icon name={uploaded?'check-circle':doc.icon} size={16}
            style={{color: uploaded?'#34d399':'var(--gold)'}}/>
        </div>

        {/* Info */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3,flexWrap:'wrap'}}>
            <span className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text)'}}>{doc.label}</span>
            {false&&null}
            {uploaded&&(
              <span className="mono" style={{fontSize:'var(--fs-xs)',color:'#34d399',
                background:'rgba(52,211,153,0.1)',border:'1px solid rgba(52,211,153,0.2)',
                padding:'1px 6px',borderRadius:99}}>UPLOADED</span>
            )}
          </div>
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginBottom:4}}>{doc.hint}</p>
          <p className="mono" style={{fontSize:'var(--fs-xs)',color:'rgba(201,168,76,0.6)'}}>
            Validates: {doc.scoreLink}
          </p>
          {uploaded&&(
            <div style={{marginTop:6,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span style={{fontSize:'var(--fs-xs)',color:'#34d399'}}>
                📄 {uploaded.name}
              </span>
              <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>
                {uploaded.size} · {uploaded.uploaded}
              </span>
            </div>
          )}
        </div>

        {/* Action */}
        <div style={{flexShrink:0}}>
          {uploaded?(
            <button onClick={()=>onRemove(doc.id)}
              style={{padding:'5px 10px',borderRadius:6,fontSize:'var(--fs-xs)',
                fontWeight:700,background:'rgba(248,113,113,0.08)',
                color:'#f87171',border:'1px solid rgba(248,113,113,0.2)',
                cursor:'pointer',fontFamily:"'Space Mono',monospace"}}>
              Remove
            </button>
          ):(
            <>
              <input ref={inputRef} type="file" accept={doc.accept}
                style={{display:'none'}}
                onChange={e=>e.target.files[0]&&onUpload(doc.id,e.target.files[0])}/>
              <button onClick={()=>inputRef.current.click()}
                style={{padding:'5px 12px',borderRadius:6,fontSize:'var(--fs-xs)',
                  fontWeight:700,background:'var(--gold-dim)',
                  color:'var(--gold)',border:'1px solid var(--gold-border)',
                  cursor:'pointer',fontFamily:"'Syne',sans-serif",
                  textTransform:'uppercase',letterSpacing:'.06em'}}>
                Upload
              </button>
            </>
          )}
        </div>
      </div>

      {/* Accepted formats */}
      {!uploaded&&(
        <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginTop:8,paddingTop:8,
          borderTop:'1px solid rgba(255,255,255,0.04)'}}>
          Accepted: {doc.accept.replace(/\./g,'').replace(/,/g,' · ').toUpperCase()}
        </p>
      )}
    </div>
  );
};

const AIBtn = ({onClick,loading,label}) => (
  <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
    <button onClick={onClick} disabled={loading}
      style={{display:'flex',alignItems:'center',gap:6,padding:'.55rem 1.1rem',borderRadius:'.7rem',
        fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',
        background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)',
        cursor:'pointer',fontFamily:'Syne',transition:'all .2s',opacity:loading?.7:1}}>
      <Icon name={loading?'loader':'cpu'} size={11} style={{display:'inline-flex',className:loading?'spin':''}}/>
      {loading?'Analyzing...':label||'AI Analysis'}
    </button>
  </div>
);

// ── Document types ──────────────────────────────────────────────────────────
const DOC_TYPES = [
  // Core — required for institutional assessment
  {id:'pitchDeck',    label:'Pitch Deck',            icon:'presentation',  accept:'.pdf',         required:false,  scoreLink:'Overall narrative',    hint:'Full venture pitch — problem, solution, market, team, financials'},
  {id:'financialModel',label:'Financial Model',       icon:'bar-chart-2',   accept:'.xlsx,.xls,.pdf', required:false, scoreLink:'Viability scores',  hint:'Revenue projections, unit economics, burn rate, P&L'},
  {id:'ipSummary',    label:'IP / Patent Summary',   icon:'shield',        accept:'.pdf',         required:false,  scoreLink:'IP Defensibility',     hint:'Patent filings, trade secrets, IP ownership structure'},
  // Optional — high value
  {id:'teamCVs',      label:'Founder & Team CVs',    icon:'users',         accept:'.pdf',         required:false, scoreLink:'Team Expertise',       hint:'CVs or LinkedIn exports for key leadership'},
  {id:'loi',          label:'Letters of Intent / MOUs', icon:'file-text',  accept:'.pdf',         required:false, scoreLink:'Customer Urgency',     hint:'Signed LOIs, MOUs, or customer validation letters'},
  {id:'techWhitepaper',label:'Technical White Paper', icon:'cpu',          accept:'.pdf',         required:false, scoreLink:'TRL / Feasibility',    hint:'Technical architecture, R&D evidence, prototype specs'},
  {id:'esgReport',    label:'ESG / Impact Report',   icon:'leaf',          accept:'.pdf',         required:false, scoreLink:'ESG Gate Score',       hint:'Sustainability report, impact assessment, certifications'},
  {id:'marketResearch',label:'Market Research Report',icon:'trending-up',  accept:'.pdf',         required:false, scoreLink:'Desirability',         hint:'TAM/SAM/SOM analysis, competitive landscape, customer surveys'},
  {id:'legalDocs',    label:'Corporate Legal Docs',  icon:'scale',         accept:'.pdf',         required:false, scoreLink:'Governance Readiness', hint:'Articles of incorporation, cap table, shareholder agreements'},
];

// ── Constants ─────────────────────────────────────────────────────────────────
const STEPS = [
  {id:'intake',   title:'Intake',    icon:'file-scan',    section:'Foundation'},
  {id:'market',   title:'Market',    icon:'trending-up',  section:'Foundation'},
  {id:'tech',     title:'Tech',      icon:'cpu',          section:'Dimensions'},
  {id:'fin',      title:'Financial', icon:'bar-chart-2',  section:'Dimensions'},
  {id:'risk',     title:'Risk',      icon:'shield-alert', section:'Dimensions'},
  {id:'esg',      title:'ESG',       icon:'leaf',         section:'Dimensions'},
  {id:'team',     title:'Team',      icon:'users',        section:'Dimensions'},
  {id:'evidence', title:'Evidence',  icon:'paperclip',    section:'Evidence'},
  {id:'engine',   title:'AI',        icon:'sparkles',     section:'Verdict'},
  {id:'verdict',  title:'Verdict',   icon:'shield-check', section:'Verdict'},
];

// ── Proxy — your Cloudflare Worker ────────────────────────────────────────────
const PROXY_URL = "https://starlabs-api-proxy.aziza-11a.workers.dev/api/analyze";

// ── App ───────────────────────────────────────────────────────────────────────
const App = () => {
  const [locked,setLocked]       = useState(true);
  const [keyVal,setKeyVal]       = useState('');
  const [keyErr,setKeyErr]       = useState(false);
  const [step,setStep]           = useState(0);
  const [aiText,setAiText]       = useState('');
  const [streaming,setStreaming] = useState(false);
  const [sectionAI,setSectionAI] = useState({});
  const [streamSec,setStreamSec] = useState(null);
  const [done,setDone]           = useState(new Set());
  const [mobileMenu,setMobileMenu] = useState(false);
  const [docs,setDocs]             = useState({});   // {docId: {file,name,size,base64,extractedText}}
  const [docAnalysis,setDocAnalysis] = useState('');
  const [docStreaming,setDocStreaming] = useState(false);
  const mainRef = useRef(null);

  const [form,setForm] = useState({
    techName:'',category:'DeepTech',sector:'',problem:'',solution:'',whyNow:'',
    unfairAdvantage:'',stage:'Concept',partnerName:'',assessorDate:'',
    marketSize:6,customerUrgency:6,marketTiming:6,competitiveMoat:5,
    revenueModel:'',tam:'',marketInsight:'',marketExpertAdj:0,
    trl:5,mrl:4,ipDefensibility:5,techScalability:6,integrationComplexity:5,
    techExpertAdj:0,techNotes:'',
    capitalIntensity:5,roiPotential:6,paybackPeriod:5,fundingStage:'Pre-Seed',
    burnRisk:4,revenueReadiness:5,financialNotes:'',
    regulatoryRisk:4,geopoliticalRisk:3,supplychainRisk:4,cybersecurityRisk:3,
    talentRisk:4,competitionRisk:5,riskNotes:'',
    environmentalImpact:5,socialImpact:5,governanceReadiness:6,regulatoryCompliance:6,
    sdgAlignment:4,esgNotes:'',
    teamExpertise:6,advisoryStrength:5,validationVelocity:5,scenarioResilience:5,
    partnershipNetwork:5,executionExpertAdj:0,expertNote:''
  });

  const hi = e => {
    const {name,value,type}=e.target;
    setForm(p=>({...p,[name]:type==='range'?parseFloat(value):value}));
  };

  // ══════════════════════════════════════════════════════════════════════════════
  // STRESS-TEST ENGINE — LeanSpark-style Venture Validation Framework
  // Pillars: Desirability · Feasibility · Viability · Scalability · Risk-Confidence
  // ══════════════════════════════════════════════════════════════════════════════
  const scores = useMemo(()=>{

    // ── 1. DESIRABILITY (Market pull — does anyone urgently need this?)
    // LeanSpark rule: customer urgency is the #1 leading indicator of PMF.
    // Weight urgency heavily; timing is a multiplier not an additive.
    const desirability = clamp(
      (form.marketSize      * 0.25) +   // TAM ceiling
      (form.customerUrgency * 0.40) +   // ← LeanSpark: urgency dominates
      (form.marketTiming    * 0.20) +   // window of opportunity
      (form.competitiveMoat * 0.15),    // differentiation
      0, 10
    );

    // ── 2. FEASIBILITY (Technology — can it actually be built/deployed?)
    // LeanSpark: TRL alone is insufficient; market-readiness gap is the killer.
    const trlMrlGap    = Math.abs(form.trl - form.mrl);          // gap penalty
    const trlNorm      = form.trl / 9 * 10;                      // scale to /10
    const gapPenalty   = clamp(trlMrlGap * 0.4, 0, 2);          // max -2 pts
    const feasibility  = clamp(
      (trlNorm             * 0.30) +
      (form.ipDefensibility* 0.25) +
      (form.techScalability* 0.20) +
      ((10-form.integrationComplexity) * 0.15) +
      (form.mrl            * 0.10) -
      gapPenalty +
      form.techExpertAdj,
      0, 10
    );

    // ── 3. VIABILITY (Financial — does the business model generate returns?)
    // LeanSpark: penalise ventures that haven't modelled unit economics.
    const hasRevenueModel = form.revenueModel ? 0 : -0.5;        // blank = penalty
    const viability = clamp(
      (form.roiPotential      * 0.30) +
      (form.revenueReadiness  * 0.25) +
      ((10-form.capitalIntensity) * 0.20) +
      ((10-form.burnRisk)     * 0.15) +
      (form.paybackPeriod     * 0.10) +
      hasRevenueModel,
      0, 10
    );

    // ── 4. SCALABILITY (Team × Network — can they execute at scale?)
    // LeanSpark: execution DNA + partnership leverage = scale multiplier.
    const scalability = clamp(
      (form.teamExpertise      * 0.30) +
      (form.advisoryStrength   * 0.15) +
      (form.validationVelocity * 0.20) +   // ← LeanSpark: speed of learning
      (form.scenarioResilience * 0.20) +   // pivot capacity
      (form.partnershipNetwork * 0.15) +
      form.executionExpertAdj,
      0, 10
    );

    // ── 5. RISK-ADJUSTED CONFIDENCE (Inverse risk × ESG compliance gate)
    // LeanSpark: risk score reduces confidence interval, ESG is a binary gate.
    const avgRisk = (form.regulatoryRisk+form.geopoliticalRisk+form.supplychainRisk+
                     form.cybersecurityRisk+form.talentRisk+form.competitionRisk) / 6;
    const riskScore   = clamp(10 - avgRisk, 0, 10);
    const esgScore    = clamp(
      (form.environmentalImpact * 0.25) +
      (form.socialImpact        * 0.20) +
      (form.governanceReadiness * 0.25) +
      (form.regulatoryCompliance* 0.20) +
      (form.sdgAlignment        * 0.10),
      0, 10
    );
    // ESG gate: below 4.0 applies a confidence penalty (LeanSpark sovereign rule)
    const esgGatePenalty = esgScore < 4.0 ? -0.8 : 0;
    const confidence = clamp((riskScore * 0.65) + (esgScore * 0.35) + esgGatePenalty, 0, 10);

    // ── COMPOSITE EZP SCORE
    // Weighted: Desirability (market pull) dominates, then Feasibility, Scalability
    const rawComposite = clamp(
      desirability * 0.28 +   // market pull is the primary validator
      feasibility  * 0.22 +   // can it be built
      viability    * 0.18 +   // does the model work
      scalability  * 0.17 +   // can team execute
      confidence   * 0.15,    // risk-adjusted confidence
      0, 10
    );

    // ── ASSUMPTION CONFIDENCE LEVEL
    // LeanSpark: tracks how many dimensions have been stress-tested
    const filledDims = [
      form.problem, form.solution, form.whyNow, form.unfairAdvantage,
      form.revenueModel, form.tam, form.techNotes, form.financialNotes,
      form.riskNotes, form.esgNotes
    ].filter(v => v && v.trim().length > 10).length;
    // Evidence docs boost confidence — each required doc = +5%, optional = +2%
    // Note: docs state not in useMemo deps, but scores recalc on form change anyway
    const assumptionConfidence = Math.round((filledDims / 10) * 100);

    // ── KILL SWITCHES (LeanSpark: binary fatal flaws that cap at TERMINATE)
    const killSwitches = [];
    if(form.marketSize    <= 2) killSwitches.push({code:'K1', label:'TAM KILL', reason:'Market too small — no path to venture-scale returns.'});
    if(form.customerUrgency<=2) killSwitches.push({code:'K2', label:'URGENCY KILL', reason:'No evidence of customer urgency — solution looking for a problem.'});
    if(form.teamExpertise <= 2) killSwitches.push({code:'K3', label:'TEAM KILL', reason:'Leadership gap — execution risk is terminal.'});
    if(form.capitalIntensity>=9) killSwitches.push({code:'K4', label:'CAPITAL KILL', reason:'Capital intensity unsustainable — no viable path to profitability.'});
    if(form.regulatoryRisk>=9)  killSwitches.push({code:'K5', label:'REGULATORY KILL', reason:'Regulatory blocker — prohibitive compliance risk.'});
    if(form.trl<=2 && form.mrl>=7) killSwitches.push({code:'K6', label:'READINESS KILL', reason:'TRL/MRL gap critical — market-pushing unproven technology.'});
    if(esgScore < 3.0)           killSwitches.push({code:'K7', label:'ESG KILL', reason:'ESG posture below sovereign capital threshold — GCC gate failed.'});
    if(form.burnRisk>=9)         killSwitches.push({code:'K8', label:'BURN KILL', reason:'Burn rate unsustainable — runway crisis before first revenue.'});

    const hasKillSwitch = killSwitches.length > 0;
    const composite = hasKillSwitch ? Math.min(rawComposite, 4.5) : rawComposite;

    // ── RED FLAGS (warnings, not kills)
    const redFlags = [];
    if(form.marketTiming <= 3)  redFlags.push('Timing risk: market may not be ready yet.');
    if(form.competitiveMoat<=3) redFlags.push('Weak moat: differentiation insufficient for defensible position.');
    if(trlMrlGap >= 4)          redFlags.push(`TRL/MRL gap of ${trlMrlGap} — commercialisation lag risk.`);
    if(form.advisoryStrength<=3)redFlags.push('Thin advisory bench — domain credibility gap.');
    if(form.sdgAlignment<=3)    redFlags.push('Low SDG alignment — sovereign mandate risk in GCC.');
    if(form.validationVelocity<=3) redFlags.push('Slow validation velocity — pivoting capability inadequate.');
    if(!form.revenueModel)      redFlags.push('Revenue model undefined — unit economics unvalidated.');

    // ── STRENGTHS
    const strengths = [];
    if(form.customerUrgency>=8) strengths.push('Strong customer urgency — high pull signal.');
    if(form.ipDefensibility>=8) strengths.push('Strong IP moat — defensible technology position.');
    if(form.teamExpertise>=8)   strengths.push('Exceptional founder depth — execution confidence high.');
    if(form.competitiveMoat>=8) strengths.push('Deep competitive moat — market position well defended.');
    if(esgScore>=7.5)           strengths.push('Strong ESG posture — sovereign capital eligible.');
    if(form.roiPotential>=8)    strengths.push('High ROI potential — return profile attractive.');
    if(form.validationVelocity>=8) strengths.push('Fast validation velocity — lean execution confirmed.');

    // ── GATE VERDICT
    const verdict =
      composite >= 8.0 ? {status:'SPINOUT READY',  color:'#34d399', grade:'A', label:'High Investment Grade — Proceed to Spinout Gate'} :
      composite >= 6.5 ? {status:'ACCELERATE',      color:'#c9a84c', grade:'B', label:'Strong Pipeline — Fast-Track Incubation Recommended'} :
      composite >= 4.5 ? {status:'INCUBATE',         color:'#f59e0b', grade:'C', label:'Foundry Candidate — De-risk Before Capital Commitment'} :
      composite >= 3.0 ? {status:'PIVOT REQUIRED',  color:'#f97316', grade:'D', label:'Core assumptions failing — Mandatory pivot or redesign'} :
                         {status:'TERMINATE',        color:'#f87171', grade:'F', label:'Kill switches triggered — Do not deploy capital'};

    return {
      // Pillar scores
      desirability:fmt(desirability), feasibility:fmt(feasibility),
      viability:fmt(viability), scalability:fmt(scalability), confidence:fmt(confidence),
      // Legacy dimension labels (used in radar + sidebar)
      tech:fmt(feasibility), market:fmt(desirability), financial:fmt(viability),
      risk:fmt(riskScore), esg:fmt(esgScore), team:fmt(scalability),
      // Composite
      composite:fmt(composite), rawComposite:fmt(rawComposite),
      // Diagnostics
      killSwitches, redFlags, strengths,
      assumptionConfidence, trlMrlGap, esgScore:fmt(esgScore),
      hasKillSwitch, verdict,
      fatalFlaw: hasKillSwitch ? killSwitches[0].reason : null
    };
  },[form]);

  const radarData = [
    {label:'Desirability', value:parseFloat(scores.desirability)},
    {label:'Feasibility',  value:parseFloat(scores.feasibility)},
    {label:'Viability',    value:parseFloat(scores.viability)},
    {label:'Scalability',  value:parseFloat(scores.scalability)},
    {label:'Confidence',   value:parseFloat(scores.confidence)},
    {label:'ESG',          value:parseFloat(scores.esg)},
  ];

  // ── Proxy call ───────────────────────────────────────────────────────────────
  const SYS = `You are the Chief Diligence Officer at Star Labs, a deep-tech corporate venture studio in the Gulf and global emerging markets. Be blunt, precise, institutionally credible. No bullet points. No headers. No markdown. Plain prose paragraphs only.`;

  const callProxy = async (sysPrompt,userPrompt,onChunk) => {
    const res = await fetch(PROXY_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemPrompt:sysPrompt,userPrompt,maxTokens:900})
    });
    if(!res.ok){const t=await res.text();throw new Error(`Proxy ${res.status}: ${t.substring(0,200)}`);}
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.text) throw new Error("Empty response from proxy.");
    for(let i=0,w=data.text.split(' ');i<w.length;i++){
      onChunk((i===0?'':' ')+w[i]);
      await new Promise(r=>setTimeout(r,16));
    }
  };

  // ── Document helpers ────────────────────────────────────────────────────────
  const readFileAsBase64 = (file) => new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  const handleDocUpload = useCallback(async(docId, file)=>{
    if(!file) return;
    const base64 = await readFileAsBase64(file);
    setDocs(p=>({...p,[docId]:{
      file, name:file.name,
      size:(file.size/1024/1024).toFixed(2)+'MB',
      base64, type:file.type,
      uploaded: new Date().toLocaleTimeString()
    }}));
  },[]);

  const removeDoc = useCallback((docId)=>{
    setDocs(p=>{const n={...p};delete n[docId];return n;});
  },[]);

  const analyzeDocuments = useCallback(async()=>{
    const uploaded = Object.entries(docs).filter(([_,d])=>d&&d.base64);
    if(!uploaded.length){alert('Upload at least one document first.');return;}
    setDocStreaming(true); setDocAnalysis('');

    // Build detailed evidence manifest with score cross-check context
    const uploadedList = uploaded.map(([id,d])=>{
      const docType = DOC_TYPES.find(dt=>dt.id===id);
      return `• ${docType?.label||id}: "${d.name}" (${d.size}) — validates: ${docType?.scoreLink||'general'}`;
    }).join('
');

    const missingList = DOC_TYPES.filter(dt=>!docs[dt.id])
      .map(dt=>`• ${dt.label} — would validate: ${dt.scoreLink}`)
      .join('
');

    // Full score context for cross-checking — every self-assessed score
    const scoreAuditContext = `
SELF-ASSESSED SCORES (assessor-provided, to be audited against evidence):

MARKET & DESIRABILITY:
- Market Size / TAM: ${form.marketSize}/10
- Customer Urgency: ${form.customerUrgency}/10  [LOI/MOU doc would evidence this]
- Market Timing: ${form.marketTiming}/10
- Competitive Moat: ${form.competitiveMoat}/10
- Revenue Model: ${form.revenueModel||'UNDEFINED'}
- TAM Estimate: ${form.tam||'Not provided'}

TECHNOLOGY & FEASIBILITY:
- TRL: ${form.trl}/9  [Technical whitepaper would evidence this]
- MRL: ${form.mrl}/10
- IP Defensibility: ${form.ipDefensibility}/10  [Patent/IP doc would evidence this]
- Tech Scalability: ${form.techScalability}/10
- Integration Complexity: ${form.integrationComplexity}/10

FINANCIAL VIABILITY:
- ROI Potential: ${form.roiPotential}/10  [Financial model would evidence this]
- Revenue Readiness: ${form.revenueReadiness}/10  [LOI/financial model would evidence this]
- Capital Intensity: ${form.capitalIntensity}/10
- Burn Risk: ${form.burnRisk}/10  [Financial model would evidence this]
- Payback Period: ${form.paybackPeriod}/10
- Funding Stage: ${form.fundingStage}

RISK:
- Regulatory Risk: ${form.regulatoryRisk}/10  [Legal docs would evidence compliance]
- Geopolitical Risk: ${form.geopoliticalRisk}/10
- Supply Chain Risk: ${form.supplychainRisk}/10
- Cybersecurity Risk: ${form.cybersecurityRisk}/10
- Talent Risk: ${form.talentRisk}/10  [Team CVs would evidence this]
- Competition Risk: ${form.competitionRisk}/10  [Market research would evidence this]

ESG:
- Environmental Impact: ${form.environmentalImpact}/10  [ESG report would evidence this]
- Social Impact: ${form.socialImpact}/10
- Governance Readiness: ${form.governanceReadiness}/10  [Legal/corporate docs would evidence this]
- Regulatory Compliance: ${form.regulatoryCompliance}/10  [Legal docs would evidence this]
- SDG Alignment: ${form.sdgAlignment}/10

TEAM & SCALABILITY:
- Founder Domain Depth: ${form.teamExpertise}/10  [Team CVs would evidence this]
- Advisory Strength: ${form.advisoryStrength}/10
- Validation Velocity: ${form.validationVelocity}/10
- Scenario Resilience: ${form.scenarioResilience}/10
- Partnership Network: ${form.partnershipNetwork}/10  [LOIs/MOUs would evidence this]

COMPUTED PILLAR SCORES:
- Desirability: ${scores.desirability}/10
- Feasibility: ${scores.feasibility}/10
- Viability: ${scores.viability}/10
- Scalability: ${scores.scalability}/10
- Risk Confidence: ${scores.confidence}/10
- Composite EZP: ${scores.composite}/10
- Gate Verdict: ${scores.verdict.status} (Grade ${scores.verdict.grade})`;

    const prompt = `STAR LABS — AI SCORE AUDIT
Asset: ${form.techName||'N/A'} | ${form.category} | Stage: ${form.stage}

=== DOCUMENTS UPLOADED (${uploaded.length} of ${DOC_TYPES.length}) ===
${uploadedList}

=== DOCUMENTS NOT UPLOADED ===
${missingList||'All documents uploaded'}

${scoreAuditContext}

=== YOUR TASK: SCORE AUDIT ===
You are auditing the self-assessed scores against the evidence documents uploaded. 
Cross-reference each uploaded document name and type against the specific scores it should validate.

Write a rigorous 5-paragraph score audit:

Para 1 — EVIDENCE COMPLETENESS: Which documents were uploaded and what scores they can validate. Which are missing and what that means for score confidence. Be specific about which scores now have evidence backing vs which remain self-assessed only.

Para 2 — SCORE INTEGRITY CHECK: For each uploaded document, cross-check the filename and document type against the claimed score. Flag any suspicious mismatches. Examples of red flags to catch: a file called "draft_patent.pdf" or "provisional_application" paired with IP Defensibility 8+/10; a "projected_revenue.xlsx" (not signed contracts) paired with Revenue Readiness 8+/10; generic "team_overview.pdf" paired with Team Expertise 9/10; no LOI/MOU uploaded but Customer Urgency scored 8+/10. Be ruthless — if the document name suggests early-stage evidence but the score claims maturity, say so explicitly.

Para 3 — ADJUSTED SCORE RECOMMENDATIONS: For each score that appears inconsistent with the evidence (or lacks evidence entirely for a high score), state what the adjusted score should be and why. Format as: "[Score name]: Claimed ${'{score}'}/10 → Suggested X/10 — Reason: ..."

Para 4 — MISSING EVIDENCE RISK: What do the missing documents tell us? What risks or assumptions remain unvalidated? Which missing document represents the highest risk to the investment thesis?

Para 5 — EVIDENCE ACTION PLAN: Precise list of what the venture team must provide before capital deployment, ranked by importance. State the specific document, what it must contain, and which score it will validate or invalidate.

Be blunt, precise, institutionally credible. Plain prose paragraphs only for paras 1,2,4. Para 3 may use the score format shown. Para 5 may use short numbered lines. No other markdown or bullets.`;

    try{
      await callProxy(SYS, prompt, chunk=>setDocAnalysis(p=>p+chunk));
    }catch(err){
      setDocAnalysis(`⚠ Error: ${err.message}`);
    }finally{setDocStreaming(false);}
  },[docs,form,scores]);

  const analyzeSection = useCallback(async(key,prompt)=>{
    setStreamSec(key);
    setSectionAI(p=>({...p,[key]:''}));
    try{
      await callProxy(SYS,prompt,chunk=>setSectionAI(p=>({...p,[key]:(p[key]||'')+chunk})));
    }catch(err){
      setSectionAI(p=>({...p,[key]:`⚠ Error: ${err.message}`}));
    }finally{setStreamSec(null);}
  },[]);

  const runFull = useCallback(async()=>{
    if(!form.techName){alert('Enter Asset Identifier first (Step 1).');return;}
    setStreaming(true);setAiText('');
    const prompt=`STAR LABS — EMERGING ZONE PROTOCOL
Full Institutional Diligence Report — LeanSpark Stress-Test Framework

=== ASSET PROFILE ===
Name: ${form.techName} | Category: ${form.category} | Sector: ${form.sector||'N/A'} | Stage: ${form.stage}
Problem: ${form.problem||'N/A'}
Solution: ${form.solution||'N/A'}
Why Now: ${form.whyNow||'N/A'}
Unfair Advantage: ${form.unfairAdvantage||'N/A'}
Revenue Model: ${form.revenueModel||'UNDEFINED'}

=== STRESS-TEST PILLAR SCORES (/10) ===
Desirability (Market Pull): ${scores.desirability}
Feasibility (Technology):   ${scores.feasibility}
Viability (Financial Model):${scores.viability}
Scalability (Team/Exec):    ${scores.scalability}
Risk-Adj Confidence:        ${scores.confidence}
ESG Gate Score:             ${scores.esg}
Composite EZP Score:        ${scores.composite}/10
Gate Decision:              ${scores.verdict.status} (Grade ${scores.verdict.grade})

=== EVIDENCE DOCUMENTS ===
${Object.keys(docs).length===0
  ? 'NO DOCUMENTS UPLOADED — all scores are self-assessed only, treat with lower confidence'
  : 'UPLOADED ('+Object.keys(docs).length+'/'+DOC_TYPES.length+'): '+Object.entries(docs).filter(([_,d])=>d).map(([id,d])=>DOC_TYPES.find(dt=>dt.id===id)?.label+': "'+d.name+'"').join('; ')}
NOT UPLOADED: ${DOC_TYPES.filter(dt=>!docs[dt.id]).map(dt=>dt.label).join(', ')||'None — full evidence package'}
${docAnalysis?'PRIOR SCORE AUDIT FINDING: '+docAnalysis.substring(0,400)+'...':'NO PRIOR SCORE AUDIT — documents not yet cross-checked'}

=== ASSUMPTION CONFIDENCE ===
${scores.assumptionConfidence}% of critical assumptions documented (${scores.assumptionConfidence<50?'LOW — high uncertainty':'HIGH — well evidenced'})

=== KILL SWITCHES TRIGGERED ===
${scores.killSwitches.length===0?'NONE — No binary kill conditions detected':scores.killSwitches.map(k=>k.code+': '+k.label+' — '+k.reason).join('\n')}

=== RED FLAGS ===
${scores.redFlags.length===0?'None':scores.redFlags.join('\n')}

=== CONFIRMED STRENGTHS ===
${scores.strengths.length===0?'None identified at current score levels':scores.strengths.join('\n')}

Write a rigorous 5-paragraph institutional diligence verdict for the Star Labs investment committee.
Para 1: Desirability assessment — is the problem real, urgent, and large enough?
Para 2: Feasibility and IP — can this technology reach deployment readiness?
Para 3: Financial viability — does the model generate risk-adjusted returns?
Para 4: Scalability and team execution DNA — can this team win?
Para 5: Verdict — cite specific kill switches or strengths, state gate conditions precisely, and recommend next 90-day actions.
Plain prose only. No bullet points. No markdown. Be blunt and institutionally precise.`;
    try{
      await callProxy(SYS,prompt,chunk=>setAiText(p=>p+chunk));
    }catch(err){
      setAiText(`⚠ AI engine error: ${err.message}\n\nCheck that your Cloudflare Worker is deployed and secrets are set.`);
    }finally{setStreaming(false);}
  },[form,scores]);

  const markDone = ()=>setDone(p=>new Set([...p,step]));
  const goStep = i=>{markDone();setStep(i);setMobileMenu(false);if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};
  const next = ()=>{markDone();setStep(s=>Math.min(STEPS.length-1,s+1));if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};
  const prev = ()=>{setStep(s=>Math.max(0,s-1));if(mainRef.current)mainRef.current.scrollTo({top:0,behavior:'smooth'});};

  const sections = [...new Set(STEPS.map(s=>s.section))];
  const cur = STEPS[step];

  // ── Lock Screen ──────────────────────────────────────────────────────────────
  if(locked) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'1.5rem',position:'relative',zIndex:10}}>
      <div style={{width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:'2.5rem'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:'1.75rem'}}><Logo size={112}/></div>
          <h1 className="syne" style={{fontSize:'2.1rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--text)',marginBottom:8}}>EZP Terminal</h1>
          <p className="mono" style={{fontSize:'var(--fs-xs)',letterSpacing:'.28em',color:'var(--gold)',marginBottom:10,opacity:.9}}>AUTHORIZATION REQUIRED</p>
          <div style={{width:36,height:1,background:'var(--gold-border)',margin:'0 auto 10px'}}></div>
          <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',letterSpacing:'.04em'}}>Emerging Zone Protocol · Institutional Grade · 2026</p>
        </div>
        <div className="card-gold" style={{padding:'2rem'}}>
          <input type="password" placeholder="ACCESS KEY"
            value={keyVal}
            onChange={e=>{setKeyVal(e.target.value);setKeyErr(false);}}
            onKeyDown={e=>{if(e.key==='Enter'){if(keyVal.toUpperCase()==='STAR2026')setLocked(false);else setKeyErr(true);}}}
            className="field mono"
            style={{textAlign:'center',fontSize:'1.1rem',letterSpacing:'.5em',marginBottom:'1rem',padding:'1rem',
              borderColor:keyErr?'rgba(248,113,113,.5)':undefined}}
          />
          {keyErr&&<p className="mono" style={{fontSize:'var(--fs-sm)',color:'#f87171',textAlign:'center',marginBottom:'.75rem'}}>ACCESS DENIED — Invalid key</p>}
          <button
            onClick={()=>keyVal.toUpperCase()==='STAR2026'?setLocked(false):setKeyErr(true)}
            className="shimmer-btn syne"
            style={{width:'100%',padding:'1rem',borderRadius:'.9rem',fontWeight:900,fontSize:'var(--fs-base)',
              textTransform:'uppercase',letterSpacing:'.15em',border:'none',color:'#05060a',cursor:'pointer'}}>
            Verify Access
          </button>
        </div>
        <p className="mono" style={{textAlign:'center',fontSize:'var(--fs-xs)',color:'var(--text-3)',marginTop:'1.5rem',opacity:.7,letterSpacing:'.1em'}}>SL-EZP-2026 // CLASSIFIED</p>
      </div>
    </div>
  );

  // ── Main App ─────────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh',position:'relative',zIndex:10,display:'flex',flexDirection:'column'}}>

      {/* ── Header ── */}
      <header className="no-print" style={{
        position:'sticky',top:0,zIndex:50,
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'.75rem 1.25rem',
        background:'rgba(5,6,10,.94)',backdropFilter:'blur(20px)',
        borderBottom:'1px solid rgba(255,255,255,.05)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
          <Logo/>
          <div className="header-subtitle" style={{borderLeft:'1px solid rgba(255,255,255,.08)',paddingLeft:'1rem'}}>
            <div className="syne" style={{fontSize:'var(--fs-md)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em',color:'var(--text)'}}>Emerging Zone Protocol</div>
            <div className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)'}}>Pro · v2.0 · 2026</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {form.techName&&(
            <span className="tag" style={{background:'var(--gold-dim)',color:'var(--gold)',border:'1px solid var(--gold-border)'}}>
              {form.techName.length>12?form.techName.substring(0,12)+'…':form.techName}
            </span>
          )}
          {form.techName&&(
            <span className="tag" style={{background:'rgba(255,255,255,.04)',
              color:scoreColor(parseFloat(scores.composite)),
              border:`1px solid ${scoreColor(parseFloat(scores.composite))}40`}}>
              {scores.composite}
            </span>
          )}
          <button onClick={()=>window.print()} className="tag no-print"
            style={{background:'rgba(255,255,255,.04)',color:'#555b6a',border:'1px solid rgba(255,255,255,.07)',cursor:'pointer'}}>
            <Icon name="printer" size={10}/> PDF
          </button>
        </div>
      </header>

      {/* ── Body ── */}
      <div style={{display:'flex',flex:1,maxWidth:1280,margin:'0 auto',width:'100%',padding:'1.25rem 1rem',gap:'1.25rem'}}>

        {/* ── Sidebar ── */}
        <aside className="desktop-sidebar" style={{width:176,flexShrink:0}}>
          <div style={{position:'sticky',top:80}}>
            {sections.map(sec=>(
              <div key={sec}>
                <div className="nav-section-label">{sec}</div>
                {STEPS.filter(s=>s.section===sec).map(s=>{
                  const idx=STEPS.findIndex(x=>x.id===s.id);
                  return (
                    <button key={s.id} onClick={()=>goStep(idx)}
                      className={`nav-item ${step===idx?'active':''} ${done.has(idx)&&step!==idx?'done':''}`}>
                      <Icon name={s.icon} size={12}/>
                      {s.title}
                    </button>
                  );
                })}
              </div>
            ))}

            {/* Live score widget */}
            {form.techName&&(
              <div className="card" style={{marginTop:'1.25rem',padding:'1rem'}}>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-2)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Live Score</p>
                <div className="syne" style={{fontSize:'2rem',fontWeight:800,color:scores.verdict.color,lineHeight:1}}>{scores.composite}</div>
                <div className="pbar" style={{margin:'6px 0'}}><div className="pfill" style={{width:`${parseFloat(scores.composite)*10}%`,background:scores.verdict.color}}></div></div>
                <p className="mono" style={{fontSize:'var(--fs-xs)',fontWeight:700,color:scores.verdict.color,marginBottom:4}}>{scores.verdict.status}</p>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',marginBottom:4}}>Grade {scores.verdict.grade} · {scores.assumptionConfidence}% confidence</p>
                <p className="mono" style={{fontSize:'var(--fs-xs)',color:Object.keys(docs).length>=3?'#34d399':'var(--gold)',marginBottom:8}}>
                  {Object.keys(docs).length===0?'No docs — low evidence':'Evidence: '+Object.keys(docs).length+'/'+DOC_TYPES.length}
                </p>
                {scores.killSwitches.length>0&&(
                  <div style={{background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.2)',borderRadius:6,padding:'4px 7px',marginBottom:8}}>
                    <p className="mono" style={{fontSize:'var(--fs-xs)',color:'#f87171',fontWeight:700}}>{scores.killSwitches.length} KILL SWITCH{scores.killSwitches.length>1?'ES':''} ACTIVE</p>
                  </div>
                )}
                {[['D',scores.desirability],['F',scores.feasibility],['V',scores.viability],['S',scores.scalability],['C',scores.confidence]].map(([l,v])=>(
                  <div key={l} style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
                    <span className="mono" style={{fontSize:'var(--fs-xs)',width:10,flexShrink:0,color:scoreColor(parseFloat(v))}}>{l}</span>
                    <div className="pbar" style={{flex:1}}><div className="pfill" style={{width:`${parseFloat(v)*10}%`,background:scoreColor(parseFloat(v))}}></div></div>
                    <span className="mono" style={{fontSize:'var(--fs-xs)',color:'var(--text-3)',width:22,textAlign:'right'}}>{v}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </aside>

        {/* ── Main ── */}
        <main ref={mainRef} className="main-content" style={{flex:1,minWidth:0,paddingBottom:'2rem'}}>
          {/* Step header */}
          <div className="no-print" style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}}>
            <div style={{width:30,height:30,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',
              background:'var(--gold-dim)',border:'1px solid var(--gold-border)',flexShrink:0}}>
              <Icon name={cur.icon} size={13} style={{color:'var(--gold)'}}/>
            </div>
            <div style={{flex:1}}>
              <div className="syne" style={{fontSize:'var(--fs-sm)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text-3)'}}>
                {cur.section} — Step {step+1}/{STEPS.length}
              </div>
            </div>
            {/* Progress dots */}
            <div style={{display:'flex',gap:3,alignItems:'center'}}>
              {STEPS.map((_,i)=>(
                <div key={i} className="step-dot" style={{
                  width:i===step?18:5,
                  background:i===step?'var(--gold)':done.has(i)?'rgba(201,168,76,.3)':'rgba(255,255,255,.07)'
                }}></div>
              ))}
            </div>
          </div>

          {/* ════ STEP 0: INTAKE ════ */}
          {step===0&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em',color:'var(--text)'}}>Foundry Intake</h2>
                <p style={{fontSize:'.8rem',color:'var(--text-3)',marginTop:4}}>Establish venture geometry before capital allocation.</p>
              </div>
              <div className="card-info" style={{padding:'.85rem',display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:'.9rem',flexShrink:0}}>🔬</span>
                <div>
                  <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#60a5fa',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>LeanSpark Stress-Test Active</p>
                  <p style={{fontSize:'var(--fs-base)',color:'#8a8680',lineHeight:1.5}}>This assessment runs 8 binary Kill Switches, tracks Assumption Confidence across 5 pillars (Desirability · Feasibility · Viability · Scalability · Risk-Confidence), and auto-flags Red Flags and Strengths in real-time. Fill in all text fields to maximise your confidence score.</p>
                </div>
              </div>
              <div className="card" style={{padding:'1.25rem',display:'flex',flexDirection:'column',gap:'1rem'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem'}}>
                  <div style={{flex:2,minWidth:0}}>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Asset Identifier *</label>
                    <input name="techName" value={form.techName} onChange={hi} className="field syne" style={{fontSize:'1.1rem',fontWeight:700}} placeholder="e.g. PROJECT HELIOS"/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Stage</label>
                    <select name="stage" value={form.stage} onChange={hi} className="field">
                      {['Concept','Prototype','MVP','Pilot','Scale','Expansion'].map(s=><option key={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Category</label>
                    <select name="category" value={form.category} onChange={hi} className="field">
                      {['DeepTech','FinTech','HealthTech','CleanTech','AgriTech','SpaceTech','AI/ML','Robotics','Biotech','Other'].map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Target Sector</label>
                    <input name="sector" value={form.sector} onChange={hi} className="field" placeholder="Energy, Healthcare, Defense..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Market Friction (Problem)</label>
                    <textarea name="problem" value={form.problem} onChange={hi} className="field" style={{height:110,resize:'none'}} placeholder="The critical problem — specific and quantifiable..."/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Proposed Resolution (Solution)</label>
                    <textarea name="solution" value={form.solution} onChange={hi} className="field" style={{height:110,resize:'none'}} placeholder="Proprietary mechanism and technical approach..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Why Now</label>
                    <textarea name="whyNow" value={form.whyNow} onChange={hi} className="field" style={{height:80,resize:'none'}} placeholder="Catalytic conditions — regulatory shifts, tech enablers..."/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Unfair Advantage</label>
                    <textarea name="unfairAdvantage" value={form.unfairAdvantage} onChange={hi} className="field" style={{height:80,resize:'none'}} placeholder="IP, data moats, relationships, network effects..."/>
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Lead Assessor</label>
                    <input name="partnerName" value={form.partnerName} onChange={hi} className="field" placeholder="Partner / Analyst name"/>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Assessment Date</label>
                    <input name="assessorDate" type="date" value={form.assessorDate} onChange={hi} className="field"/>
                  </div>
                </div>
              </div>
              {form.problem&&form.solution&&(
                <AIBtn onClick={()=>analyzeSection('intake',`Assess this venture concept (max 150 words, plain prose):\nAsset: ${form.techName} | ${form.category} | ${form.sector}\nProblem: ${form.problem}\nSolution: ${form.solution}\nWhy Now: ${form.whyNow}\nAdvantage: ${form.unfairAdvantage}\nIs problem-solution fit compelling? Is the "why now" credible? Single biggest question mark?`)}
                  loading={streamSec==='intake'} label="Quick AI Read"/>
              )}
              {(sectionAI.intake||streamSec==='intake')&&<AIBlock text={sectionAI.intake} streaming={streamSec==='intake'} label="Concept Assessment"/>}
            </div>
          )}

          {/* ════ STEP 1: MARKET ════ */}
          {step===1&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em',color:'var(--text)'}}>Market Vector</h2>
                <p style={{fontSize:'.8rem',color:'var(--text-3)',marginTop:4}}>TAM calibration — asset must demonstrate global scale potential.</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                <Slider label="TAM / SAM Size" name="marketSize" value={form.marketSize} onChange={hi} description="1 = Niche / 10 = Global dominant market"/>
                <Slider label="Customer Urgency" name="customerUrgency" value={form.customerUrgency} onChange={hi} description="1 = Nice-to-have / 10 = Existential must-solve"/>
                <Slider label="Market Timing" name="marketTiming" value={form.marketTiming} onChange={hi} description="1 = Too early / 5 = Emerging / 10 = Perfect window"/>
                <Slider label="Competitive Moat" name="competitiveMoat" value={form.competitiveMoat} onChange={hi} description="Differentiation depth vs existing players"/>
              </div>
              <div className="card" style={{padding:'1.25rem',display:'flex',flexDirection:'column',gap:'1rem'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem'}}>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Revenue Model</label>
                    <select name="revenueModel" value={form.revenueModel} onChange={hi} className="field">
                      <option value="">Select model...</option>
                      {['SaaS','Licensing','Marketplace','B2G','B2B Enterprise','B2C','Usage-based','Hardware + Services','Joint Venture'].map(m=><option key={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>TAM Estimate (USD)</label>
                    <input name="tam" value={form.tam} onChange={hi} className="field" placeholder="e.g. $4.2B by 2030"/>
                  </div>
                </div>
                <div>
                  <label className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#8a8680',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6}}>Market Insight / 2040 Tailwinds</label>
                  <textarea name="marketInsight" value={form.marketInsight} onChange={hi} className="field" style={{height:72,resize:'none'}} placeholder="Sovereign mandates, sector tailwinds, regulatory moats..."/>
                </div>
              </div>
              <div className="mxcell" style={{border:'1px solid rgba(245,158,11,.25)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'#f59e0b',textTransform:'uppercase',letterSpacing:'.08em'}}>Expert Regional Adjustment</span>
                  <span className="mono" style={{fontWeight:700,color:'var(--gold-b)'}}>{form.marketExpertAdj>0?'+':''}{form.marketExpertAdj}</span>
                </div>
                <input type="range" name="marketExpertAdj" min="-3" max="3" step=".5" value={form.marketExpertAdj} onChange={hi}/>
                <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:6}}>GCC/MENA regional knowledge correction (±3).</p>
              </div>
              <AIBtn onClick={()=>analyzeSection('market',`Market analysis (max 150 words, plain prose):\nTAM Score: ${form.marketSize}/10 | Urgency: ${form.customerUrgency}/10 | Timing: ${form.marketTiming}/10 | Moat: ${form.competitiveMoat}/10\nRevenue Model: ${form.revenueModel} | TAM: ${form.tam}\nInsight: ${form.marketInsight}\nIs timing credible? Is moat defensible? Biggest market risk?`)}
                loading={streamSec==='market'} label="AI Market Read"/>
              {(sectionAI.market||streamSec==='market')&&<AIBlock text={sectionAI.market} streaming={streamSec==='market'} label="Market Assessment"/>}
            </div>
          )}

          {/* ════ STEP 2: TECHNOLOGY ════ */}
          {step===2&&(
            <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
              <div>
                <h2 className="syne" style={{fontSize:'clamp(1.6rem,4vw,2.4rem)',fontWeight:800,textTransform:'uppercase',letterSpacing:'-.01em',color:'var(--text)'}}>Technology Dimension</h2>
                <p style={{fontSize:'.8rem',color:'var(--text-3)',marginTop:4}}>Readiness, IP strength, scalability, and integration complexity.</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                <div className="card-gold" style={{padding:'1.25rem'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
                    <div>
                      <p className="mono" style={{fontSize:'var(--fs-sm)',color:'var(--gold-b)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>TRL</p>
                      <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:2}}>Technology Readiness Level</p>
                    </div>
                    <span className="syne gold-text" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1}}>{form.trl}</span>
                  </div>
                  <input type="range" name="trl" min="1" max="9" value={form.trl} onChange={hi}/>
                  <div className="pbar" style={{marginTop:6,marginBottom:10}}><div className="pfill" style={{width:`${(form.trl/9)*100}%`}}></div></div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:4,textAlign:'center'}}>
                    {[['1–3','Research'],['4–6','Prototype'],['7–9','Deployed']].map(([r,l])=>(
                      <div key={r}><span className="mono" style={{fontSize:'var(--fs-xs)',color:'#c9a84c',display:'block'}}>{r}</span><span style={{fontSize:'var(--fs-sm)',color:'var(--text-3)'}}>{l}</span></div>
                    ))}
                  </div>
                </div>
                <div className="card" style={{padding:'1.25rem'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
                    <div>
                      <p className="mono" style={{fontSize:'var(--fs-sm)',color:'#9a9690',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>MRL</p>
                      <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:2}}>Market Readiness Level</p>
                    </div>
                    <span className="syne" style={{fontSize:'2.8rem',fontWeight:800,lineHeight:1,color:'#fff'}}>{form.mrl}</span>
                  </div>
                  <input type="range" name="mrl" min="1" max="10" value={form.mrl} onChange={hi}/>
                  <div className="pbar" style={{marginTop:6}}><div className="pfill" style={{width:`${form.mrl*10}%`,background:'#9ca3af'}}></div></div>
                  <p style={{fontSize:'var(--fs-sm)',color:'var(--text-3)',marginTop:8}}>1 = No market engagement → 10 = Full GTM deployed</p>
                </div>
              </div>
              {/* TRL/MRL alignment indicator */}
              <div className="card" style={{padding:'1rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span className="mono" style={{fontSize:'var(--fs-sm)',color:'#8a8680',textTransform:'uppercase'}}>TRL / MRL Alignment</span>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div className="pbar" style={{width:100}}><div className="pfill" style={{width:`${(1-Math.abs(form.trl-form.mrl)/9)*100}%`,background:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}></div></div>
                  <span className="mono" style={{fontSize:'var(--fs-sm)',fontWeight:700,color:Math.abs(form.trl-form.mrl)>3?'#f87171':'#c9a84c'}}>
                    {Math.abs(form.trl-form.mrl)>3?'MISALIGNED':Math.abs(form.trl-form.mrl)>1?'GAP':'ALIGNED'}
                  </span>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                <Slider label="IP Defensibility" name="ipDefensibility" value={form.ipDefensibility} onChange={hi} description="Patents, trade secrets, network effects, data moats"/>
                <Slider label="Tech Scalability" name="techScalability" value={form.techScalability} onChange={hi} description="Architecture's ability to scale globally"/>
                <Slider label="Integration Complexity" name="integrationComplexity" value={form.integrationComplexity} onChange={hi} description="Lower = faster adoption (high = more complex)" accent="#f59e0b"/>

              <AIBtn onClick={()=>analyzeSection('financial',`Financial viability (max 150 words, plain prose):\nROI: ${form.roiPotential}/10 | Revenue Readiness: ${form.revenueReadiness}/10 | Capital Intensity: ${form.capitalIntensity}/10 | Burn Risk: ${form.burnRisk}/10 | Payback: ${form.paybackPeriod}/10 | Stage: ${form.fundingStage}\nNotes: ${form.financialNotes}\nSpinout financial viability and critical capital risk?`)}

          {/* ════ STEP 4: RISK ════ */}

                  {label:'Supply Chain Risk',name:'supplychainRisk',v:form.supplychainRisk,desc:'Concentration and fragility of input supply'},
                  {label:'Cybersecurity Risk',name:'cybersecurityRisk',v:form.cybersecurityRisk,desc:'Attack surface and data sovereignty exposure'},
                  {label:'Talent Risk',name:'talentRisk',v:form.talentRisk,desc:'Dependency on rare expertise or key persons'},
                  {label:'Competition Risk',name:'competitionRisk',v:form.competitionRisk,desc:'Incumbent disruption or fast-follower threat'},

              <div className="card" style={{padding:'1.1rem'}}>

                    const tier=v>=8?0:v>=6?1:v>=3?2:3;
                    const col=v>=8?'#f87171':v>=6?'#f59e0b':v>=3?'#c9a84c':'#34d399';
                    return(
                      <div key={label} className={`hmap${tier}`} style={{borderRadius:8,padding:'.6rem',textAlign:'center'}}>

              {(sectionAI.risk||streamSec==='risk')&&<AIBlock text={sectionAI.risk} streaming={streamSec==='risk'} label="Risk Assessment"/>}

              {(sectionAI.esg||streamSec==='esg')&&<AIBlock text={sectionAI.esg} streaming={streamSec==='esg'} label="ESG Assessment"/>}

                  <p style={{fontSize:'var(--fs-xs)',color:'var(--muted)',marginTop:10}}>
