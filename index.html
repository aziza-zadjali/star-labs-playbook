<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Labs | Venture Readiness Protocol</title>
    <!-- Modern Tech Stack CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #050608;
            --surface: rgba(22, 26, 32, 0.95);
            --accent-gold: #d4af37;
            --accent-charcoal: #2a2f35;
            --text-champagne: #fdfcf8;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-deep); 
            color: var(--text-champagne); 
            margin: 0; 
            overflow-x: hidden; 
        }

        /* Institutional Gold Glassmorphism - High Visibility */
        .glass-panel { 
            background: var(--surface); 
            backdrop-filter: blur(40px); 
            border: 2px solid rgba(212, 175, 55, 0.25); 
            box-shadow: 0 40px 120px -20px rgba(0, 0, 0, 0.9);
        }

        .command-input {
            background: rgba(10, 12, 16, 0.8);
            border: 1.5px solid rgba(212, 175, 55, 0.2);
            color: var(--text-champagne);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-input:focus {
            border-color: var(--accent-gold);
            background: rgba(15, 18, 24, 1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            outline: none;
        }

        /* Gold Range Sliders */
        input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; width: 100%; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.1); height: 8px; border-radius: 12px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            margin-top: -7px; 
            background: #ffffff; 
            height: 24px; 
            width: 24px; 
            border-radius: 50%; 
            border: 5px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .expert-slider::-webkit-slider-thumb { 
            border: 5px solid #f59e0b !important;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6) !important;
        }

        .gold-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .evidence-tag {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent-gold);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #d4af37 0%, #f9ebaf 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-content { animation: slideIn 0.5s ease-out forwards; }

        @media print { .no-print { display: none; } body { background: white; color: black; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex' }}></i>;
        };

        const Logo = ({ size = "w-40 h-40" }) => {
            const [imgError, setImgError] = useState(false);
            if (imgError) return <span className="font-black text-white italic tracking-tighter text-4xl">STAR LABS</span>;
            return <img src="logo.png" alt="Star Labs" className={`${size} object-contain block`} onError={() => setImgError(true)} />;
        };

        const DirectiveBanner = ({ text }) => (
            <div className="flex items-start gap-4 p-6 rounded-3xl bg-[#d4af370a] border-2 border-[#d4af3740] w-full shadow-[0_0_40px_rgba(212,175,55,0.05)] mb-12">
                <Icon name="shield-alert" className="text-[#d4af37] mt-1 shrink-0" size={20} />
                <p className="text-[13px] text-white font-medium uppercase tracking-[0.1em] leading-relaxed">
                    <span className="font-black text-[#d4af37] mr-3">VRP DIRECTIVE //</span> 
                    {text}
                </p>
            </div>
        );

        const EvidenceSlot = ({ label, onUpload, files = [] }) => (
            <div className="space-y-4 mt-12 bg-black/20 p-8 rounded-[2.5rem] border border-white/5">
                <div className="flex justify-between items-center border-b border-white/5 pb-4">
                    <label className="text-[12px] font-black uppercase text-slate-400 tracking-widest">{label}</label>
                    <span className="text-[10px] font-bold text-[#d4af37] uppercase tracking-widest bg-[#d4af3710] px-3 py-1 rounded-full">{files.length} Attachments</span>
                </div>
                <div className="relative group">
                    <input 
                        type="file" multiple
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
                        onChange={(e) => onUpload(e.target.files)}
                    />
                    <div className="command-input rounded-3xl p-10 border-dashed border-2 border-[#d4af3720] group-hover:border-[#d4af3760] transition-all flex flex-col items-center gap-4">
                        <Icon name="upload" size={32} className="text-slate-500 group-hover:text-[#d4af37]" />
                        <p className="text-[11px] text-slate-400 font-bold uppercase tracking-widest">Upload Diligence Files</p>
                    </div>
                </div>
                <div className="flex flex-wrap gap-3">
                    {files.map((f, i) => (
                        <div key={i} className="evidence-tag px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center gap-3">
                            <Icon name="file-check" size={12} /> {f.name}
                        </div>
                    ))}
                </div>
            </div>
        );

        const ExpertCalibration = ({ label, value, name, onChange, description }) => (
            <div className="mt-14 p-10 rounded-[3rem] bg-[#d4af3708] border-2 border-[#d4af3720] shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                    <div className="flex items-center gap-5">
                        <div className="p-3 rounded-2xl bg-[#d4af3715]"><Icon name="user-plus" className="text-[#d4af37]" size={24} /></div>
                        <div>
                            <span className="block text-[14px] font-black uppercase text-[#d4af37] tracking-[0.2em]">Expert Adjustment: {label}</span>
                            <span className="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Reviewer Correction Protocol</span>
                        </div>
                    </div>
                    <span className="text-4xl font-black text-[#d4af37] italic">{value > 0 ? `+${value}` : value}</span>
                </div>
                <p className="text-[12px] text-slate-300 font-medium mb-10 leading-relaxed max-w-2xl">{description}</p>
                <input 
                    type="range" min="-3" max="3" step="0.5" 
                    name={name} value={value} onChange={onChange}
                    className="expert-slider"
                />
                <div className="flex justify-between text-[10px] font-black text-slate-600 uppercase mt-4">
                    <span>Conservative Override</span>
                    <span>Aggressive Override</span>
                </div>
            </div>
        );

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [accessKey, setAccessKey] = useState("");
            const [step, setStep] = useState(0);
            
            const [formData, setFormData] = useState({
                techName: '', problem: '', solution: '', whyNow: '',
                trl: 4, mrl: 3, marketSize: 6, customerUrgency: 6,
                teamExpertise: 7, ipDefensibility: 6, capitalIntensity: 4,
                scenarioResilience: 5, validationVelocity: 5,
                uvp: '', unfairAdvantage: '', revenueStreams: '', costStructure: '',
                marketExpertAdj: 0, techExpertAdj: 0, executionExpertAdj: 0,
                expertNote: '',
                intakeDocs: [], marketDocs: [], technicalDocs: [], velocityDocs: []
            });

            const steps = [
                { id: 'intake', title: 'Intake Audit', icon: 'binary' },
                { id: 'market', title: 'Market Vector', icon: 'zap' },
                { id: 'readiness', title: 'Readiness Matrix', icon: 'layers' },
                { id: 'radar', title: 'Scenario Radar', icon: 'radar' },
                { id: 'canvas', title: 'Revenue Design', icon: 'layout-template' },
                { id: 'spinout', title: 'Venture Velocity', icon: 'rocket' },
                { id: 'report', title: 'Final Verdict', icon: 'shield-check' }
            ];

            const analysis = useMemo(() => {
                const techScore = (formData.trl * 0.5) + (formData.ipDefensibility * 0.5) + formData.techExpertAdj;
                const marketScore = (formData.mrl * 0.3) + (formData.customerUrgency * 0.3) + (formData.marketSize * 0.4) + formData.marketExpertAdj;
                const executionRisk = ((10 - formData.capitalIntensity) * 0.4) + (formData.scenarioResilience * 0.3) + (formData.validationVelocity * 0.3) + formData.executionExpertAdj;
                
                let score = ((techScore * 0.3) + (marketScore * 0.4) + (executionRisk * 0.3)).toFixed(1);
                
                let fatalFlaw = "";
                if (formData.marketSize <= 3) fatalFlaw = "MARKET SIZE MISCALCULATION: TAM is too restricted.";
                else if (formData.teamExpertise <= 3) fatalFlaw = "TEAM INCAPABILITY: Domain gap identified.";
                else if (formData.capitalIntensity >= 9) fatalFlaw = "FUND MISALLOCATION: Extreme capital burn model.";
                
                if (fatalFlaw !== "") score = Math.min(parseFloat(score), 5.4).toFixed(1);

                const spinoutIndex = ((formData.teamExpertise * 0.4) + (formData.mrl * 0.3) + ((10 - formData.capitalIntensity) * 0.3)).toFixed(1);

                let verdict = { status: 'INCUBATE', color: 'text-[#d4af37]', border: 'border-[#d4af3760]', glow: 'shadow-[#d4af3720]', advice: "Meets foundry R&D thresholds. Retain for de-risking within Star Labs Foundry." };
                if (parseFloat(score) >= 8.2) verdict = { status: 'SPINOUT READY', color: 'text-emerald-400', border: 'border-emerald-500/50', glow: 'shadow-emerald-500/20', advice: "High Investment Grade. Authorize immediate standalone corporate formation." };
                else if (parseFloat(score) < 5.5) verdict = { status: 'TERMINATE', color: 'text-rose-500', border: 'border-rose-500/50', glow: 'shadow-rose-500/20', advice: fatalFlaw || "Execution risk exceeds projected terminal value. Terminate gate." };

                return { score, spinoutIndex, ...verdict };
            }, [formData]);

            const handleFileUpload = (category, files) => {
                const newFiles = Array.from(files);
                setFormData(prev => ({ ...prev, [category]: [...prev[category], ...newFiles] }));
            };

            const handleInput = (e) => {
                const { name, value, type } = e.target;
                setFormData(prev => ({ ...prev, [name]: (type === 'range' || name.includes('Adj')) ? parseFloat(value) : value }));
            };

            const unlock = (e) => {
                e.preventDefault();
                if (accessKey.toUpperCase() === "STAR2026") setIsLocked(false);
                else alert("AUTH_ERROR: SECURITY VIOLATION");
            };

            if (isLocked) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[#030406]">
                    <div className="max-w-md w-full glass-panel p-20 rounded-[5rem] text-center">
                        <div className="flex justify-center mb-10"><Logo size="w-72 h-72" /></div>
                        <h1 className="text-3xl font-black text-white tracking-tighter uppercase italic mb-2">VRP Terminal</h1>
                        <p className="text-[11px] font-bold text-[#d4af37] tracking-[0.6em] mb-16 uppercase italic">Foundry Intelligence Hub</p>
                        <form onSubmit={unlock} className="space-y-8">
                            <input 
                                type="password" placeholder="DILIGENCE KEY" value={accessKey}
                                onChange={(e) => setAccessKey(e.target.value)}
                                className="w-full command-input rounded-3xl px-8 py-8 text-center text-[#d4af37] tracking-[1.2em] font-mono outline-none text-2xl shadow-inner"
                            />
                            <button className="w-full py-8 bg-[#d4af37] hover:bg-[#f1d592] text-black font-extrabold uppercase tracking-widest rounded-3xl shadow-[0_0_40px_rgba(212,175,55,0.4)] transition-all active:scale-95">Authorize Diligence</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto py-20 px-12">
                    <div class="gold-glow" style={{top: '-400px', right: '-400px'}}></div>
                    <div class="gold-glow" style={{bottom: '-400px', left: '-400px'}}></div>
                    
                    <header className="flex flex-col lg:flex-row lg:items-center justify-between mb-28 gap-14 pb-16 border-b border-white/10">
                        <div className="flex items-center gap-14">
                            <div className="w-48 h-48 flex items-center justify-center"><Logo size="w-full h-full" /></div>
                            <div className="h-24 w-px bg-white/20 hidden lg:block"></div>
                            <div>
                                <h1 className="text-6xl font-black text-white italic tracking-tighter uppercase leading-none">VRP <span className="gold-gradient-text italic">Protocol</span></h1>
                                <p className="text-slate-400 text-[12px] font-black tracking-[1em] uppercase mt-6 italic">Strategic De-Risking Framework // Star Labs</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-10 no-print">
                            <div className="text-right">
                                <div className="flex items-center gap-3 justify-end">
                                    <div className="w-3 h-3 bg-[#d4af37] rounded-full animate-pulse shadow-[0_0_20px_#d4af37]"></div>
                                    <span className="text-[12px] font-black text-white uppercase tracking-widest">Audit Mode Active</span>
                                </div>
                                <p className="text-[12px] font-black text-[#d4af37] tracking-widest mt-3 uppercase italic">Institutional Access Verified</p>
                            </div>
                            <button onClick={() => window.print()} className="px-12 py-6 bg-white/10 border-2 border-white/10 rounded-3xl text-[14px] font-black uppercase tracking-[0.2em] flex items-center gap-5 transition-all hover:bg-white/20 text-white">
                                <Icon name="file-text" size={20} /> Export Audit
                            </button>
                        </div>
                    </header>

                    <div className="grid lg:grid-cols-12 gap-24">
                        <aside className="lg:col-span-3 space-y-6 no-print">
                            {steps.map((s, i) => (
                                <button key={s.id} onClick={() => setStep(i)} className={`w-full flex items-center gap-8 px-12 py-9 rounded-[3.5rem] text-[13px] font-extrabold uppercase tracking-[0.25em] transition-all border-2 ${step === i ? 'bg-[#d4af3715] border-[#d4af3780] text-[#d4af37] shadow-[0_0_40px_rgba(212,175,55,0.15)] translate-x-5' : 'bg-transparent border-transparent text-slate-500 hover:text-slate-300 hover:bg-white/5'}`}>
                                    <Icon name={s.icon} size={24} className={step === i ? "text-[#d4af37]" : "text-slate-800"} />
                                    {s.title}
                                </button>
                            ))}
                        </aside>

                        <main className="lg:col-span-9 glass-panel rounded-[7rem] p-16 md:p-32 min-h-[900px] animate-content relative">
                            
                            {step === 0 && (
                                <div className="space-y-20">
                                    <div>
                                        <h2 className="text-6xl font-black text-white tracking-tighter uppercase italic mb-8">Intake Audit</h2>
                                        <DirectiveBanner text="VRP Phase 1: Validating core friction alignment. Problem-Solution mapping is the prerequisite for all downstream foundry investment." />
                                    </div>
                                    <div className="space-y-16">
                                        <div className="space-y-6">
                                            <label className="text-[13px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-3"><Icon name="fingerprint" size={16}/> Technology Designation</label>
                                            <p className="text-[11px] text-slate-500 uppercase font-bold italic">The unique foundry code for this emerging tech asset.</p>
                                            <input type="text" name="techName" value={formData.techName} onChange={handleInput} className="w-full command-input rounded-3xl px-10 py-10 text-white text-3xl outline-none italic font-bold" placeholder="PROJECT IDENTIFIER..." />
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-20">
                                            <div className="space-y-6">
                                                <label className="text-[13px] font-black uppercase text-slate-400 tracking-widest">Target Friction</label>
                                                <p className="text-[11px] text-slate-500 uppercase font-bold italic">Critical pain point defined by EZP protocols.</p>
                                                <textarea name="problem" value={formData.problem} onChange={handleInput} className="w-full command-input rounded-[3.5rem] p-12 h-64 outline-none resize-none leading-relaxed text-xl" placeholder="Describe the pain..."></textarea>
                                            </div>
                                            <div className="space-y-6">
                                                <label className="text-[13px] font-black uppercase text-slate-400 tracking-widest">Proposed Intervention</label>
                                                <p className="text-[11px] text-slate-500 uppercase font-bold italic">Proprietary R&D resolution mechanism.</p>
                                                <textarea name="solution" value={formData.solution} onChange={handleInput} className="w-full command-input rounded-[3.5rem] p-12 h-64 outline-none resize-none leading-relaxed text-xl" placeholder="Technical mechanism..."></textarea>
                                            </div>
                                        </div>
                                        <EvidenceSlot label="Pre-Diligence Briefs & Validation Proofs" files={formData.intakeDocs} onUpload={(f) => handleFileUpload('intakeDocs', f)} />
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="space-y-20">
                                    <div>
                                        <div className="flex items-center gap-10 mb-8"><Icon name="zap" className="text-[#d4af37]" size={48} /><h2 className="text-6xl font-black text-white tracking-tighter uppercase italic">Market Vector</h2></div>
                                        <DirectiveBanner text="VRP Phase 2: Detecting TAM miscalculation. Asset must demonstrate 100x scalability potential for GCC and Global markets." />
                                    </div>
                                    <div className="grid md:grid-cols-3 gap-14">
                                        {[
                                            { k: 'marketSize', l: 'TAM Depth', d: '1=Restricted, 10=Global' },
                                            { k: 'customerUrgency', l: 'Urgency', d: '1=Optional, 10=Existential' },
                                            { k: 'scenarioResilience', l: 'Timing', d: '1=Early, 10=Optimal' }
                                        ].map(m => (
                                            <div key={m.k} className="space-y-12 bg-black/40 p-14 rounded-[4.5rem] border-2 border-white/5 shadow-2xl">
                                                <div className="flex justify-between items-center"><span className="text-[12px] font-black text-slate-400 uppercase tracking-widest">{m.l}</span><span className="text-5xl font-black text-[#d4af37] italic">{formData[m.k]}</span></div>
                                                <input type="range" name={m.k} min="1" max="10" value={formData[m.k]} onChange={handleInput} />
                                                <p className="text-[11px] text-slate-600 uppercase font-black text-center">{m.d}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <EvidenceSlot label="Market Opportunity Analysis & TAM Verification Docs" files={formData.marketDocs} onUpload={(f) => handleFileUpload('marketDocs', f)} />
                                    <ExpertCalibration label="Macro Environment" name="marketExpertAdj" value={formData.marketExpertAdj} onChange={handleInput} description="Override based on sovereign mandates, GCC subsidies, or Vision 2040 partnership tailwinds." />
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-20">
                                    <div>
                                        <h2 className="text-6xl font-black text-white tracking-tighter uppercase italic mb-8">Investment Matrix</h2>
                                        <DirectiveBanner text="VRP Phase 3: Structural readiness check. Eliminating premature scaling by aligning Technical Maturity with Market Appetite." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-20">
                                        <div className="bg-black/40 p-20 rounded-[5rem] border-2 border-white/5 space-y-16 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-lg font-black uppercase text-[#d4af37] tracking-widest flex items-center gap-6"><Icon name="cpu" size={28}/> Tech Readiness</h3><span className="text-9xl font-black text-white italic leading-none">{formData.trl}</span></div>
                                            <p className="text-[12px] text-slate-500 uppercase tracking-widest font-bold">1=Theory, 10=Deployment Ready</p>
                                            <input type="range" name="trl" min="1" max="10" value={formData.trl} onChange={handleInput} />
                                        </div>
                                        <div className="bg-black/40 p-20 rounded-[5rem] border-2 border-white/5 space-y-16 shadow-2xl">
                                            <div className="flex justify-between items-center"><h3 className="text-lg font-black uppercase text-white tracking-widest flex items-center gap-6"><Icon name="globe" size={28}/> Market Readiness</h3><span className="text-9xl font-black text-white italic leading-none">{formData.mrl}</span></div>
                                            <p className="text-[12px] text-slate-500 uppercase tracking-widest font-bold">1=Awareness, 10=Scaled Traction</p>
                                            <input type="range" name="mrl" min="1" max="10" value={formData.mrl} onChange={handleInput} />
                                        </div>
                                    </div>
                                    <EvidenceSlot label="Technical Whitepapers, Lab Results & Field Trials" files={formData.technicalDocs} onUpload={(f) => handleFileUpload('technicalDocs', f)} />
                                    <ExpertCalibration label="Moat Verification" name="techExpertAdj" value={formData.techExpertAdj} onChange={handleInput} description="Expert verification of proprietary IP barriers that automated algorithms may underestimate." />
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-20">
                                    <div>
                                        <div className="flex items-center gap-10 mb-8"><Icon name="radar" className="text-[#d4af37]" size={48} /><h2 className="text-6xl font-black text-white tracking-tighter uppercase italic">Scenario Radar</h2></div>
                                        <DirectiveBanner text="Testing environmental antifragility. Proving asset resilience against GCC energy shifts and global macro economic shocks." />
                                    </div>
                                    <div className="bg-[#d4af3708] p-28 rounded-[6rem] shadow-2xl text-center space-y-16 border-2 border-[#d4af3720]">
                                        <div className="space-y-6">
                                            <h3 className="text-[16px] font-black uppercase text-slate-500 tracking-[0.6em]">Venture Antifragility Index</h3>
                                            <div className="text-[16rem] font-black gold-gradient-text leading-none italic tracking-tighter py-4">{formData.scenarioResilience}</div>
                                        </div>
                                        <input type="range" name="scenarioResilience" min="1" max="10" value={formData.scenarioResilience} onChange={handleInput} />
                                        <p className="text-[13px] text-slate-600 uppercase tracking-[0.5em] font-black italic">Resilience Score (1=Fragile, 10=Antifragile)</p>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-20">
                                    <div>
                                        <h2 className="text-6xl font-black text-white tracking-tighter uppercase italic mb-8">Revenue Design</h2>
                                        <DirectiveBanner text="Foundry commercial architecture. Establishing monetizeable pathways before authorized capital deployment." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-16">
                                        {[
                                            { k: 'uvp', l: 'Institutional Value Prop', d: 'The conversion thesis.' },
                                            { k: 'unfairAdvantage', l: 'Structural Moat', d: 'IP and Network barriers.' },
                                            { k: 'revenueStreams', l: 'Monetization Engine', d: 'B2G and Enterprise paths.' },
                                            { k: 'costStructure', l: 'Burn Intensity', d: 'R&D resource model.' }
                                        ].map(item => (
                                            <div key={item.k} className="space-y-6">
                                                <label className="text-[14px] font-black uppercase tracking-widest text-slate-500">{item.l}</label>
                                                <p className="text-[11px] text-slate-700 uppercase font-black italic mb-2">{item.d}</p>
                                                <textarea name={item.k} value={formData[item.k]} onChange={handleInput} className="w-full command-input rounded-[3.5rem] p-12 h-48 outline-none text-lg leading-relaxed shadow-inner" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-20">
                                    <div>
                                        <div className="flex items-center gap-10 mb-8"><Icon name="rocket" className="text-[#d4af37]" size={48} /><h2 className="text-6xl font-black text-white tracking-tighter uppercase italic">Venture Velocity</h2></div>
                                        <DirectiveBanner text="VRP Phase 4: Validating Execution DNA. Weak founder-problem fit is the secondary cause of terminal failure." />
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-16">
                                        {[
                                            { k: 'teamExpertise', l: 'Founder Depth', c: 'gold', d: 'Assigned domain leads.' },
                                            { k: 'ipDefensibility', l: 'Patent Moat', c: 'white', d: 'Asset defensibility.' },
                                            { k: 'capitalIntensity', l: 'Burn Rate', c: 'white', d: '10=Extreme Resource Burn.' },
                                            { k: 'validationVelocity', l: 'Foundry Speed', c: 'white', d: 'Build-Measure-Learn rate.' }
                                        ].map(m => (
                                            <div key={m.k} className="p-16 bg-black/40 rounded-[5rem] border-2 border-white/5 space-y-12 shadow-2xl">
                                                <div className="flex justify-between items-center"><span className="text-[14px] font-black uppercase tracking-widest text-slate-500">{m.l}</span><span className={`text-7xl font-black italic ${m.k === 'teamExpertise' ? 'text-[#d4af37]' : 'text-white'}`}>{formData[m.k]}</span></div>
                                                <p className="text-[12px] text-slate-500 uppercase tracking-widest italic">{m.d}</p>
                                                <input type="range" name={m.k} min="1" max="10" value={formData[m.k]} onChange={handleInput} style={{ accentColor: m.k === 'teamExpertise' ? '#d4af37' : '#fff' }} />
                                            </div>
                                        ))}
                                    </div>
                                    <EvidenceSlot label="Interview Logs, Founder Dossiers & GTM Plan" files={formData.velocityDocs} onUpload={(f) => handleFileUpload('velocityDocs', f)} />
                                    <ExpertCalibration label="Execution Alignment" name="executionExpertAdj" value={formData.executionExpertAdj} onChange={handleInput} description="Foundry-side calibration of team velocity or resource availability." />
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-20">
                                    <DirectiveBanner text="VRP Stage 4 Diligence Synthesis. Verified audit trail for Star Labs Foundry Stakeholders." />
                                    <div className={`p-24 md:p-32 rounded-[8rem] border-4 ${analysis.border} ${analysis.bg} relative overflow-hidden shadow-[0_0_180px_rgba(0,0,0,0.6)]`}>
                                        <div className="absolute top-0 right-0 p-16 opacity-[0.05] scale-[5]"><Icon name={analysis.icon} size={300} /></div>
                                        <div className="relative z-10 grid md:grid-cols-2 gap-32 items-center">
                                            <div className="space-y-20">
                                                <h2 className="text-[16px] font-black uppercase text-slate-500 tracking-[1.8em]">VRP Verdict</h2>
                                                <div className={`text-[18rem] font-black ${parseFloat(analysis.score) < 5.5 ? 'text-rose-600' : 'gold-gradient-text'} italic tracking-tighter leading-none`}>{analysis.score}</div>
                                                <div className="text-7xl font-black text-white uppercase tracking-tighter italic">{analysis.status}</div>
                                                <div className="border-t-2 border-white/10 pt-20 font-medium leading-relaxed italic"><p className="text-slate-400 text-3xl">"{analysis.advice}"</p></div>
                                            </div>
                                            <div className="space-y-20">
                                                <div className="bg-black/90 p-20 rounded-[6rem] border-2 border-white/10 shadow-3xl">
                                                    <div className="flex justify-between text-[16px] font-black uppercase mb-10 tracking-[0.4em]"><span>Readiness Quotient</span><span className="text-[#d4af37] text-6xl font-black italic">{analysis.spinoutIndex}/10</span></div>
                                                    <div className="w-full h-4 bg-slate-900 rounded-full overflow-hidden shadow-inner"><div className="h-full bg-[#d4af37] transition-all duration-[4000ms] ease-out shadow-[0_0_40px_#d4af37]" style={{ width: `${analysis.spinoutIndex * 10}%` }}></div></div>
                                                </div>
                                                <div className="space-y-10">
                                                    <span className="block text-[14px] font-black uppercase text-slate-500 tracking-widest italic underline decoration-[#d4af37] underline-offset-[12px]">Verified Diligence Locker</span>
                                                    <div className="flex flex-wrap gap-4">
                                                        {[...formData.intakeDocs, ...formData.marketDocs, ...formData.technicalDocs, ...formData.velocityDocs].map((f, i) => (
                                                            <div key={i} className="evidence-tag px-6 py-3 rounded-2xl text-[11px] font-black uppercase tracking-widest flex items-center gap-4">
                                                                <Icon name="check" size={16} className="text-[#d4af37]" /> {f.name}
                                                            </div>
                                                        ))}
                                                        {[...formData.intakeDocs, ...formData.marketDocs, ...formData.technicalDocs, ...formData.velocityDocs].length === 0 && <p className="text-slate-700 uppercase italic font-black text-[12px] tracking-widest">NO EVIDENCE ATTACHED</p>}
                                                    </div>
                                                </div>
                                                <textarea 
                                                    placeholder="Final Expert Diligence sign-off..." 
                                                    name="expertNote" value={formData.expertNote} onChange={handleInput}
                                                    className="w-full bg-black/80 border-2 border-[#d4af3730] rounded-[4rem] p-16 h-80 outline-none text-xl italic leading-relaxed text-[#d4af37] shadow-inner"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="mt-40 pt-20 border-t-2 border-white/10 flex justify-between items-center no-print">
                                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="text-[14px] font-black uppercase tracking-[0.8em] text-slate-600 hover:text-white transition-all disabled:opacity-0 active:scale-90 flex items-center gap-4">
                                    <Icon name="arrow-left" size={16}/> Gate-Back
                                </button>
                                <div className="text-[12px] font-bold text-slate-800 tracking-[1.5em] uppercase hidden lg:block italic">Star Labs Foundry Protocol // SL-VRP-2026</div>
                                {step < steps.length - 1 && (
                                    <button onClick={() => setStep(step + 1)} className="px-24 py-10 bg-[#d4af3710] text-[#d4af37] border-2 border-[#d4af3760] text-[15px] font-black uppercase tracking-[0.6em] rounded-[4rem] hover:bg-[#d4af37] hover:text-black transition-all shadow-[0_0_60px_rgba(212,175,55,0.2)] active:scale-95 flex items-center gap-6">
                                        Advance Gate <Icon name="arrow-right" size={20}/>
                                    </button>
                                )}
                            </div>
                        </main>
                    </div>

                    <footer className="mt-64 border-t-2 border-white/10 pt-32 grid md:grid-cols-3 gap-40 text-slate-600">
                        <div className="space-y-16 text-left">
                            <h4 className="text-[20px] font-black uppercase tracking-widest text-white border-b-2 border-[#d4af3760] pb-8 w-fit italic">Vision Strategy</h4>
                            <p className="text-[16px] leading-relaxed font-medium italic text-slate-500">Builders, Not Bankers. Optimizing capital for Oman Vision 2040 by transforming emerging R&D into high-moat standalone corporate ecosystems.</p>
                        </div>
                        <div className="flex flex-col items-center justify-center gap-16">
                             <div className="flex gap-14">
                                <div className="w-6 h-6 bg-[#d4af37] rounded-full animate-ping shadow-[0_0_30px_#d4af37]"></div>
                                <div className="w-6 h-6 bg-slate-900 rounded-full"></div>
                                <div className="w-6 h-6 bg-slate-900 rounded-full"></div>
                            </div>
                            <span className="text-[14px] font-black uppercase tracking-[3em] text-slate-800 italic">SL-VRP-2026</span>
                        </div>
                        <div className="text-right space-y-16 ml-auto">
                             <h4 className="text-[20px] font-black uppercase tracking-widest text-white border-b-2 border-[#d4af3760] pb-8 w-fit ml-auto italic">Intelligence Protocol</h4>
                             <p className="text-[16px] font-black text-[#d4af37] uppercase tracking-[1em] animate-pulse italic text-right">Verified: Said Saif Udeen</p>
                             <p className="text-[14px] font-bold text-slate-800 uppercase tracking-widest mt-10">Star Labs Foundry Decision Engine</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
